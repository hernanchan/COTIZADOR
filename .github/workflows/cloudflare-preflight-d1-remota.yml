name: Saber - inspección D1 remota sin escrituras
on:
  push:
    branches: [polaroids/express-pdf-unico-20261023]
    paths:
      - .github/workflows/cloudflare-preflight-d1-remota.yml
      - integraciones/cloudflare-ensayo/preflight-d1-remota-lectura.mjs
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  check:
    if: github.ref == 'refs/heads/polaroids/express-pdf-unico-20261023'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    environment:
      name: saber-cloudflare-pruebas
      deployment: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Leer metadatos D1 y comprobar bloqueo comercial
        env:
          SABER_CF_ACCOUNT_ID: ${{ secrets.SABER_CF_ACCOUNT_ID }}
          SABER_CF_EDITOR_TOKEN: ${{ secrets.SABER_CF_EDITOR_TOKEN }}
        run: node integraciones/cloudflare-ensayo/preflight-d1-remota-lectura.mjs
      - name: Registrar auditoría remota
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          STATUS: ${{ job.status }}
        run: |
          if [ "$STATUS" = success ]; then state=success; description="Preflight D1 remoto GET sin escrituras"; else state=failure; description="Revisar preflight D1 remoto"; fi
          jq -n --arg state "$state" --arg context 'saber-cloudflare/d1-readonly' --arg description "$description" --arg target_url "https://github.com/$GH_REPO/actions/runs/$GITHUB_RUN_ID" '{state:$state,context:$context,description:$description,target_url:$target_url}' >/tmp/saber-d1-readonly.json
          gh api -X POST "repos/$GH_REPO/statuses/$GH_SHA" --input /tmp/saber-d1-readonly.json

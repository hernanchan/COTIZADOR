name: Saber - verificar diagnósticos apagados
on:
  push:
    branches: [polaroids/express-pdf-unico-20261023]
    paths:
      - .github/workflows/cloudflare-verificar-diagnosticos-off.yml
      - integraciones/cloudflare-ensayo/verificar-diagnosticos-apagados.mjs
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  check:
    if: github.ref == 'refs/heads/polaroids/express-pdf-unico-20261023'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    environment:
      name: saber-cloudflare-pruebas
      deployment: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar OFF de ambos diagnósticos sin modificar Cloudflare
        env:
          SABER_CF_ACCOUNT_ID: ${{ secrets.SABER_CF_ACCOUNT_ID }}
          SABER_CF_EDITOR_TOKEN: ${{ secrets.SABER_CF_EDITOR_TOKEN }}
        run: node integraciones/cloudflare-ensayo/verificar-diagnosticos-apagados.mjs
      - name: Registrar resultado
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          STATUS: ${{ job.status }}
        run: |
          if [ "$STATUS" = success ]; then state=success; description="Ambos diagnósticos privados están OFF"; else state=failure; description="No se confirmó apagado de ambos diagnósticos"; fi
          jq -n --arg state "$state" --arg context 'saber-cloudflare/probes-off' --arg description "$description" --arg target_url "https://github.com/$GH_REPO/actions/runs/$GITHUB_RUN_ID" '{state:$state,context:$context,description:$description,target_url:$target_url}' >/tmp/saber-probes-off.json
          gh api -X POST "repos/$GH_REPO/statuses/$GH_SHA" --input /tmp/saber-probes-off.json

name: Saber - verificar promoción Documentos (GET)
on:
  push:
    branches:
      - polaroids/express-pdf-unico-20261023
    paths:
      - '.github/workflows/cloudflare-verificar-promocion-documentos.yml'
      - 'integraciones/cloudflare-ensayo/verificar-promocion-documentos.mjs'
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  check:
    if: github.ref == 'refs/heads/polaroids/express-pdf-unico-20261023'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    environment:
      name: saber-cloudflare-pruebas
      deployment: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Auditar despliegue y bindings de prueba sin cambiar Cloudflare
        env:
          SABER_CF_ACCOUNT_ID: ${{ secrets.SABER_CF_ACCOUNT_ID }}
          SABER_CF_EDITOR_TOKEN: ${{ secrets.SABER_CF_EDITOR_TOKEN }}
        run: node integraciones/cloudflare-ensayo/verificar-promocion-documentos.mjs
      - name: Publicar resultado en commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          STATUS: ${{ job.status }}
        run: |
          if [ "$STATUS" = success ]; then state=success; description="Documentos activo al 100%, vinculaciones verificadas"; else state=failure; description="No se pudo certificar la promoción de Documentos"; fi
          jq -n --arg state "$state" --arg context 'saber-cloudflare/docs-promoted' --arg description "$description" --arg target_url "https://github.com/$GH_REPO/actions/runs/$GITHUB_RUN_ID" '{state:$state,context:$context,description:$description,target_url:$target_url}' > /tmp/saber-promotion-check.json
          gh api -X POST "repos/$GH_REPO/statuses/$GH_SHA" --input /tmp/saber-promotion-check.json

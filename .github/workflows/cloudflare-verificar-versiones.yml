name: Saber - revisar versiones sin desplegar
on:
  push:
    branches:
      - polaroids/express-pdf-unico-20261023
    paths:
      - '.github/workflows/cloudflare-verificar-versiones.yml'
      - 'integraciones/cloudflare-ensayo/verificar-versiones-inactivas.mjs'
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  revision:
    if: github.ref == 'refs/heads/polaroids/express-pdf-unico-20261023'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    environment:
      name: saber-cloudflare-pruebas
      deployment: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Revisar versiones nuevas y despliegues actuales por GET
        env:
          SABER_CF_ACCOUNT_ID: ${{ secrets.SABER_CF_ACCOUNT_ID }}
          SABER_CF_EDITOR_TOKEN: ${{ secrets.SABER_CF_EDITOR_TOKEN }}
        run: node integraciones/cloudflare-ensayo/verificar-versiones-inactivas.mjs
      - name: Publicar resultado de control
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          STATUS: ${{ job.status }}
        run: |
          if [ "$STATUS" = success ]; then state=success; description="Versiones preparadas y no desplegadas; binding inspeccionado"; else state=failure; description="No se confirmó despliegue actual o vinculaciones"; fi
          jq -n --arg state "$state" --arg context "saber-cloudflare/staged-version-audit" --arg description "$description" --arg target_url "https://github.com/$GH_REPO/actions/runs/$GITHUB_RUN_ID" '{state:$state,context:$context,description:$description,target_url:$target_url}' >/tmp/saber-stage-audit.json
          gh api -X POST "repos/$GH_REPO/statuses/$GH_SHA" --input /tmp/saber-stage-audit.json

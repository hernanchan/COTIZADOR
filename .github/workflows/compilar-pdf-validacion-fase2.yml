# CI sólo de la rama de pruebas. Compila y prueba; NO despliega Workers, Apps Script ni web pública.
name: Compilar PDF y presupuesto (rama de pruebas)
on:
  push:
    branches:
      - cotizador/migracion-carga-archivos-20261018
    paths:
      - '.github/workflows/compilar-pdf-validacion-fase2.yml'
      - 'integraciones/autocotizador/recepcion/**'
      - 'integraciones/autocotizador/pruebas/**'
      - 'tests/autocotizador-*.test.mjs'
      - 'precios-web.json'
      - '!integraciones/autocotizador/recepcion/dist/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias del validador (sin despliegue)
        working-directory: integraciones/autocotizador/recepcion
        run: npm install --no-audit --no-fund
      - name: Probar PDF de 1, 3 y 11 páginas, fraude y corrupción
        working-directory: integraciones/autocotizador/recepcion
        run: npm test
      - name: Verificar umbrales de precio y recibos multifichero (sin despliegue)
        run: node --test tests/autocotizador-escalas-multifichero.test.mjs tests/autocotizador-lote-verificado.test.mjs tests/autocotizador-pantalla-lote.test.mjs tests/autocotizador-pantalla-conjunta.test.mjs tests/autocotizador-destino-final.test.mjs tests/autocotizador-regla-comercial-ploteos.test.mjs
      - name: Compilar Worker standalone
        working-directory: integraciones/autocotizador/recepcion
        run: npm run build:pilot
      - name: Compilar Worker de presupuesto sin pagos
        working-directory: integraciones/autocotizador/recepcion
        run: npm run build:quote
      - name: Compilar formulario unificado PDF fase 4
        working-directory: integraciones/autocotizador/recepcion
        run: npm run build:unificado
      - name: Probar PDF real de seis páginas, subida HMAC y cotización unificada
        working-directory: integraciones/autocotizador/recepcion
        run: npm run test:unificado
      - name: Verificar sintaxis de módulos piloto multifichero
        run: |
          node --check integraciones/autocotizador/recepcion/pantalla-lote-pdf.mjs
          node --check integraciones/autocotizador/pruebas/cotizacion-multifichero-piloto.mjs
          node --check integraciones/autocotizador/recepcion/worker-fase4-cotizador-unificado.mjs
      - name: Verificar sintaxis del artefacto
        run: |
          node --check integraciones/autocotizador/recepcion/dist/saber-documentos-validacion-fase2.mjs
          node --check integraciones/autocotizador/recepcion/dist/saber-documentos-presupuesto-fase3.mjs
          node --check integraciones/autocotizador/recepcion/dist/saber-documentos-cotizador-fase4.mjs
      - name: Guardar archivo compilado SOLO en rama de pruebas
        if: github.ref == 'refs/heads/cotizador/migracion-carga-archivos-20261018'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add integraciones/autocotizador/recepcion/dist/saber-documentos-validacion-fase2.mjs
          git add integraciones/autocotizador/recepcion/dist/saber-documentos-presupuesto-fase3.mjs
          git add integraciones/autocotizador/recepcion/dist/saber-documentos-cotizador-fase4.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'Compilar validacion y presupuesto PDF en rama de pruebas [skip ci]'
            git push origin HEAD:refs/heads/cotizador/migracion-carga-archivos-20261018
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: saber-documentos-validacion-fase2-NO-PUBLICADO
          path: |
            integraciones/autocotizador/recepcion/dist/saber-documentos-validacion-fase2.mjs
            integraciones/autocotizador/recepcion/dist/saber-documentos-presupuesto-fase3.mjs
            integraciones/autocotizador/recepcion/dist/saber-documentos-cotizador-fase4.mjs
          if-no-files-found: error
          retention-days: 1

name: Fase 1 - activar version aislada con rollback
on:
  push:
    branches: [fase1/impresiones-ploteos-20261027]
    paths: [.github/workflows/fase1-activar-version-privada.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: saber-documentos-pruebas-activate
  cancel-in-progress: false
jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: saber-cloudflare-pruebas
      deployment: false
    steps:
      - name: Activar solo Worker de prueba y volver atras ante fallo de verificacion
        env:
          ACCOUNT: ${{ secrets.SABER_CF_ACCOUNT_ID }}
          TOKEN: ${{ secrets.SABER_CF_DEPLOY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ACCOUNT" && test -n "$TOKEN"
          root="https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/workers/scripts/saber-documentos-pruebas"
          old="29d8ee1f-111d-4b3f-bec6-f7ae3a53c1b2"
          target="18779e7c-05f9-4f33-9fa0-dd2955942492"
          deployed=0
          cleanup() { rm -f /tmp/f1-before.json /tmp/f1-after.json /tmp/f1-request.json /tmp/f1-response.json /tmp/f1-rollback.json; }
          rollback() {
            code=$?
            if [ "$code" -ne 0 ] && [ "$deployed" -eq 1 ]; then
              echo "DEPLOY_VERIFICATION_FAILED_ATTEMPT_ROLLBACK"
              jq -n --arg id "$old" '{strategy:"percentage",versions:[{version_id:$id,percentage:100}],annotations:{"workers/message":"Automatic rollback after failed private stage verification"}}' >/tmp/f1-rollback.json
              curl -fsS --max-time 35 -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/f1-rollback.json "$root/deployments" >/dev/null || echo "ROLLBACK_NEEDS_MANUAL_ATTENTION"
            fi
            cleanup
          }
          trap rollback EXIT
          curl -fsS --max-time 20 -H "Authorization: Bearer $TOKEN" "$root/deployments" >/tmp/f1-before.json
          jq -e --arg old "$old" '.success==true and (.result.deployments[0].versions|length==1 and .[0].percentage==100 and .[0].version_id==$old)' /tmp/f1-before.json >/dev/null
          curl -fsS --max-time 20 -H "Authorization: Bearer $TOKEN" "$root/versions/$target" | jq -e --arg id "$target" '.success==true and .result.id==$id' >/dev/null
          jq -n --arg id "$target" '{strategy:"percentage",versions:[{version_id:$id,percentage:100}],annotations:{"workers/message":"Libreria Saber: prueba privada Fase 1, sin pagos"}}' >/tmp/f1-request.json
          # If the request times out, confirm actual active version before deciding rollback.
          if ! curl -fsS --max-time 35 -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/f1-request.json "$root/deployments" >/tmp/f1-response.json; then
            deployed=1
            echo "DEPLOY_RESPONSE_UNCERTAIN"
            exit 1
          fi
          deployed=1
          jq -e --arg id "$target" '.success==true and (.result.versions|length==1 and .[0].percentage==100 and .[0].version_id==$id)' /tmp/f1-response.json >/dev/null
          curl -fsS --max-time 20 -H "Authorization: Bearer $TOKEN" "$root/deployments" >/tmp/f1-after.json
          jq -e --arg id "$target" '.success==true and (.result.deployments[0].versions|length==1 and .[0].percentage==100 and .[0].version_id==$id)' /tmp/f1-after.json >/dev/null
          deployed=0
          echo "PRIVATE_TEST_WORKER_DEPLOYED_VERSION=$target"
          echo "ROLLBACK_AVAILABLE_VERSION=$old"
          echo "NO_PRODUCTION_DOMAIN_NO_PAYMENTS"

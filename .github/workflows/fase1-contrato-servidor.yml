name: Fase 1 - validar contrato servidor sin desplegar
on:
  push:
    branches:
      - fase1/impresiones-ploteos-20261027
    paths:
      - 'tests/fase1-contrato-servidor.test.mjs'
      - 'tests/fase1-ploteo-recibo-verificado.test.mjs'
      - 'tests/fase1-ploteo-central-manifiesto.test.mjs'
      - 'tests/fase1-pedido-mixto-realpdf.test.mjs'
      - 'tests/fase1-gas-cupo-diagnostico.test.mjs'
      - 'tests/fase1-receptor-gas-integracion.test.mjs'
      - 'tests/fase1-auth-sesion-privada.test.mjs'
      - 'tests/fase1-envio-unico-interfaz.test.mjs'
      - 'integraciones/autocotizador/recepcion/DocumentosReceiver_LOTE_AMPLIADO_PRUEBAS_20261024.gs'
      - 'integraciones/autocotizador/recepcion/preparar-manifiesto-v2-documental.mjs'
      - 'integraciones/autocotizador/recepcion/registrar-manifiesto-v2-central.mjs'
      - 'integraciones/autocotizador/recepcion/cotizar-ploteo-recibo-verificado.mjs'
      - 'integraciones/autocotizador/recepcion/worker-fase4-cotizador-unificado.mjs'
      - 'tests/fase1-puente-clasificacion.test.mjs'
      - 'integraciones/autocotizador/recepcion/carga-unica-cliente.mjs'
      - 'integraciones/autocotizador/recepcion/carga-unica-pdf-regresion.test.mjs'
      - 'integraciones/autocotizador/recepcion/pantalla-cotizador-v2-prueba-privada.mjs'
      - 'tests/fase1-frontera-recepcion.test.mjs'
      - '.github/workflows/fase1-contrato-servidor.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias locales
        working-directory: integraciones/autocotizador/recepcion
        run: npm install --no-audit --no-fund
      - name: Probar limite entre cotizacion y recepcion
        run: node --test tests/fase1-frontera-recepcion.test.mjs tests/fase1-contrato-servidor.test.mjs tests/fase1-puente-clasificacion.test.mjs tests/fase1-ploteo-recibo-verificado.test.mjs tests/fase1-ploteo-central-manifiesto.test.mjs tests/fase1-pedido-mixto-realpdf.test.mjs tests/fase1-gas-cupo-diagnostico.test.mjs tests/fase1-receptor-gas-integracion.test.mjs tests/fase1-auth-sesion-privada.test.mjs tests/fase1-envio-unico-interfaz.test.mjs
      - name: Compilar y verificar el Worker aislado
        working-directory: integraciones/autocotizador/recepcion
        run: |
          npm run build:unificado
          node --check dist/saber-documentos-cotizador-fase4.mjs
      - name: Regresion previa del servidor
        run: node --test tests/autocotizador-pedido-verificado.test.mjs tests/autocotizador-puente-central.test.mjs tests/autocotizador-regla-comercial-ploteos.test.mjs
      - name: Confirmacion de aislamiento
        run: echo 'NO DEPLOY; NO PAYMENTS; NO COMMERCIAL WEBSITE'

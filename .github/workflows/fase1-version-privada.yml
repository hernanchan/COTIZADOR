name: Fase 1 - preparar version privada Cloudflare sin desplegar (diagnostico recepcion)
on:
  push:
    branches:
      - fase1/impresiones-ploteos-20261027
    paths:
      - .github/workflows/fase1-version-privada.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: saber-fase1-version-privada
  cancel-in-progress: false
jobs:
  stage-only:
    if: github.ref == 'refs/heads/fase1/impresiones-ploteos-20261027'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: saber-cloudflare-pruebas
      deployment: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compilar y probar sin instalar en ningun Worker
        working-directory: integraciones/autocotizador/recepcion
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --test ../../../tests/fase1-pedido-mixto-realpdf.test.mjs ../../../tests/fase1-ploteo-central-manifiesto.test.mjs ../../../tests/fase1-ploteo-recibo-verificado.test.mjs
          npm run build:unificado
          node --check dist/saber-documentos-cotizador-fase4.mjs
          grep -Fq '/api/ensayo-cotizar-ploteo-verificado' dist/saber-documentos-cotizador-fase4.mjs
          grep -Fq 'PRIVATE_TEST_ONLY' dist/saber-documentos-cotizador-fase4.mjs
          echo 'FASE1_PRIVATE_VERSION_PRECHECK_OK'
      - name: Cargar SOLO una version no desplegada con bindings heredados
        shell: bash
        env:
          ACCOUNT: ${{ secrets.SABER_CF_ACCOUNT_ID }}
          TOKEN: ${{ secrets.SABER_CF_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$ACCOUNT" && test -n "$TOKEN"
          worker=saber-documentos-pruebas
          root="https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/workers/scripts/$worker"
          trap 'rm -f /tmp/fase1-bindings.json /tmp/fase1-metadata.json /tmp/fase1-upload.json' EXIT
          curl -fsS --max-time 25 \
            -H "Authorization: Bearer $TOKEN" "$root/settings" -o /tmp/fase1-bindings.json
          jq -e '.success == true and (.result.bindings|type=="array")' /tmp/fase1-bindings.json >/dev/null
          for binding in SABER_CENTRAL DOCS_CENTRAL_ADMIN_KEY DOCS_SCRIPT_URL DOCS_RELAY_KEY CENTRAL_BRIDGE_KEY; do
            jq -e --arg name "$binding" '.result.bindings | any(.name==$name)' /tmp/fase1-bindings.json >/dev/null
          done
          jq -n --arg commit "$GITHUB_SHA" --slurpfile settings /tmp/fase1-bindings.json \
            '{main_module:"index.mjs",annotations:{"workers/message":"Fase1 privada cargada SIN desplegar","workers/commit_sha":$commit},bindings:[$settings[0].result.bindings[]|{name,type:"inherit"}]}' >/tmp/fase1-metadata.json
          curl --silent --show-error --max-time 75 \
            -H "Authorization: Bearer $TOKEN" \
            -F "metadata=@/tmp/fase1-metadata.json;type=application/json" \
            -F "index.mjs=@integraciones/autocotizador/recepcion/dist/saber-documentos-cotizador-fase4.mjs;filename=index.mjs;type=application/javascript+module" \
            "$root/versions?bindings_inherit=strict" -o /tmp/fase1-upload.json
          if ! jq -e '.success==true and (.result.id|type=="string")' /tmp/fase1-upload.json >/dev/null; then
            jq -c '{success,errors:[.errors[]?|{code,message}]}' /tmp/fase1-upload.json
            exit 1
          fi
          jq -r '.result.id | "FASE1_VERSION_CARGADA_SIN_DESPLEGAR " + .' /tmp/fase1-upload.json
          echo "NO_DEPLOY_NO_ROUTE_NO_DOMAIN_NO_PAYMENTS"

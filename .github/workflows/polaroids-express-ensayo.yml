# Rama aislada: sólo validación de Polaroids Express, sin despliegues.
name: Polaroids Express · PDF privado (ensayo)
on:
  push:
    branches:
      - polaroids/express-pdf-unico-20261023
    paths:
      - '.github/workflows/polaroids-express-ensayo.yml'
      - 'integraciones/polaroids/express/**'
      - 'integraciones/autocotizador/recepcion/enviar-central-firmada.mjs'
      - 'integraciones/autocotizador/recepcion/worker-fase4-cotizador-unificado.mjs'
      - 'tests/autocotizador-central-binding.test.mjs'
      - 'integraciones/autocotizador/recepcion/preparar-mixto-central.mjs'
      - 'integraciones/autocotizador/recepcion/preparar-documentos-central.mjs'
      - 'tests/autocotizador-documentos-central.test.mjs'
      - 'integraciones/autocotizador/recepcion/fase4-ficha-central-lote-privada.mjs'
      - 'tests/autocotizador-mixto-central.test.mjs'
      - 'tests/autocotizador-ficha-lote-gas.test.mjs'
      - 'integraciones/autocotizador/recepcion/DocumentosReceiver_LOTE_AMPLIADO_PRUEBAS_20261024.gs'
      - 'tests/autocotizador-gas-lote-ampliado.test.mjs'
      - 'integraciones/autocotizador/pruebas/cotizacion-multifichero-piloto.mjs'
      - 'integraciones/autocotizador/recepcion/leer-pdf-fase4-privado.mjs'
      - 'integraciones/autocotizador/recepcion/fase4-ficha-central-lote-privada.mjs'
      - 'integraciones/autocotizador/recepcion/componer-pdf-documentos-privado.mjs'
      - 'integraciones/autocotizador/recepcion/componer-desde-recibo-verificado.mjs'
      - 'integraciones/autocotizador/recepcion/guardar-pdf-compuesto-privado.mjs'
      - 'integraciones/autocotizador/recepcion/registrar-pdf-compuesto-central.mjs'
      - 'integraciones/autocotizador/recepcion/ficha-produccion-central.mjs'
      - 'tests/autocotizador-componer-desde-recibo.test.mjs'
      - 'tests/autocotizador-componer-pdf-documentos.test.mjs'
      - 'tests/autocotizador-lote-ampliado.test.mjs'
      - 'integraciones/autocotizador/recepcion/pantalla-lote-pdf-ampliado.mjs'
      - 'tests/autocotizador-lote-ampliado-pantalla.test.mjs'
      - 'functions/api/polaroids-express.js'
      - 'tests/polaroids-express-*.test.mjs'
      - 'tests/central-polaroids-express.test.mjs'
      - 'tests/central-bridge-d1.test.mjs'
      - 'cotizador-web-v2.html'
      - 'cotizador-v2-ensayo-archivos.mjs'
      - 'tests/cotizador-v2-archivo-optin.test.mjs'
      - 'tests/cotizador-v2-referencias-carrito.test.mjs'
      - 'tests/cotizador-v2-vinculo-servidor.test.mjs'
      - 'tests/cotizador-v2-subida-vinculo.test.mjs'
      - 'integraciones/autocotizador/recepcion/subir-vincular-pdf-v2-privado.mjs'
      - 'integraciones/autocotizador/recepcion/pantalla-cotizador-v2-prueba-privada.mjs'
      - 'integraciones/autocotizador/recepcion/package.json'
      - 'integraciones/autocotizador/recepcion/v2-origen-privado.test.mjs'
      - 'integraciones/autocotizador/recepcion/verificar-vinculo-cotizador-v2.mjs'
      - 'vidriera/cotizar.html'
      - 'tests/central-polaroids-descarga.test.mjs'
      - 'integraciones/mercadopago/pruebas/worker.js'
      - 'integraciones/mercadopago/pruebas/schema.sql'
      - 'vidriera/polaroids/**'
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  express:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependencia PDF en entorno aislado (no desplegar)
        working-directory: integraciones/autocotizador/recepcion
        run: npm install --no-audit --no-fund
      - name: Instalar motor Express de Cloudflare Pages (sin despliegue)
        working-directory: integraciones/polaroids/express
        run: npm install --no-audit --no-fund
      - name: Compilar el Worker Express sin publicarlo
        working-directory: integraciones/polaroids/express
        run: npm run build:worker
      - name: Probar PDF Express con 6, 12, 19 y 24 fotografías
        env:
          EXPRESS_EXPORT_PDF: '1'
        run: node --experimental-vm-modules --test tests/polaroids-express-motor.test.mjs tests/polaroids-express-guardado.test.mjs tests/polaroids-express-tandas.test.mjs tests/polaroids-express-worker.test.mjs tests/polaroids-express-cliente.test.mjs tests/polaroids-express-recuperacion.test.mjs
      - name: Probar tamaño y reintento con 24 fotografías JPEG grandes
        run: node --test tests/polaroids-express-carga-limite.test.mjs
      - name: Conservar PDF de prueba para inspección visual (sin fotos reales)
        uses: actions/upload-artifact@v4
        with:
          name: express-pdf-guillotina-motor-real
          path: artifacts/polaroids-express/*.pdf
          if-no-files-found: error
          retention-days: 7
      # Incluye compra mixta documentos, Express y catálogo sin checkout.
      - name: Verificar paridad cotizador V2 y lector PDF opt-in
        run: node --test tests/cotizador-v2-archivo-optin.test.mjs tests/cotizador-v2-referencias-carrito.test.mjs tests/cotizador-v2-vinculo-servidor.test.mjs tests/cotizador-v2-subida-vinculo.test.mjs
      - name: Probar Central D1 con PDF Express y controles de acceso
        run: node --experimental-sqlite --test tests/central-polaroids-express.test.mjs tests/central-polaroids-descarga.test.mjs tests/central-bridge-d1.test.mjs
      - name: Regresión de carrito y pasarela de pagos existente
        run: node tests/mercadopago-carrito.test.mjs
      - name: Validar editor/recepción anterior permanece apagada
        run: |
          node tests/polaroids-preparacion.test.mjs
          node tests/polaroids-carrito.test.mjs
      - name: Circuito integrado PDF → GAS simulado → binding → D1 real local
        run: node --experimental-sqlite --test tests/polaroids-express-circuito-integrado.test.mjs
      - name: Validar ruta aislada para preparación comercial sin cobro
        run: node --test tests/polaroids-express-pedido-ruta.test.mjs
      - name: Probar pedido comercial Express con firma y cobros bloqueados
        run: node --test tests/polaroids-express-preparar-pedido.test.mjs
      - name: Verificar contrato del receptor GAS sin acceder a Drive
        run: node --test tests/polaroids-express-gas-contrato.test.mjs
      - name: Compilar Worker documental unificado con vínculo privado (sin desplegar)
        working-directory: integraciones/autocotizador/recepcion
        run: npm run build:unificado
      - name: Verificar portal V2 same-origin y autenticación privada real del Worker
        run: node --test integraciones/autocotizador/recepcion/v2-origen-privado.test.mjs
      - name: Revisar UI ampliada, rutas privadas y JS del navegador
        run: node --test tests/autocotizador-lote-ampliado-pantalla.test.mjs
      - name: Verificar cotizador ampliado 30 archivos y no romper piloto viejo
        run: node --test tests/autocotizador-lote-ampliado.test.mjs tests/autocotizador-lote-verificado.test.mjs
      # Incluye subida privada de PDF compuesto, verificación SHA de Drive simulado y reintentos.
      - name: Ensayar Apps Script ampliado con 30 PDF, cuotas y Range sin Google real
        run: node --test tests/autocotizador-gas-lote-ampliado.test.mjs
      - name: Verificar recepción HMAC con factura del servidor y composición PDF aislada
        run: node --test tests/autocotizador-componer-desde-recibo.test.mjs
      - name: Probar composición vectorial privada de PDF documental A4 A3 y dúplex
        run: node --test tests/autocotizador-componer-pdf-documentos.test.mjs
      - name: Verificar lote de PDFs privados GAS antes de calcular y registrar D1
        run: node --test tests/autocotizador-ficha-lote-gas.test.mjs
      - name: Verificar pedido de documentos y tienda sin Polaroids y sin cobro
        run: node --test tests/autocotizador-documentos-central.test.mjs
      - name: Probar adaptador del carrito mixto Documentos más Polaroids
        run: node --test tests/autocotizador-mixto-central.test.mjs
      - name: Probar comunicación privada Documentos a Central D1
        run: node --test tests/autocotizador-central-binding.test.mjs
      - name: Validar superficie privada Express y conexión interna
        run: node --test tests/polaroids-express-aislamiento.test.mjs tests/polaroids-express-bridge-check.test.mjs
      - name: Sintaxis de motor y editor
        run: |
          node --check integraciones/polaroids/express/motor-pdf.mjs
          node --check integraciones/polaroids/express/guardar-pdf-privado.mjs
          node --check integraciones/polaroids/express/preparar-tandas.mjs
          node --check vidriera/polaroids/express-cliente.mjs
          node --check vidriera/polaroids/express-recuperacion.mjs
          node --check functions/api/polaroids-express.js
          node --check integraciones/polaroids/express/worker-order.mjs
          node --check integraciones/polaroids/express/functions/api/polaroids-order.js
          node --check integraciones/autocotizador/recepcion/preparar-mixto-central.mjs
      - name: Registrar el resultado de pruebas para consulta automática
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          case "$JOB_STATUS" in
            success) result=success;;
            failure) result=failure;;
            *) result=error;;
          esac
          jq -n --arg state "$result" \
            --arg context 'polaroids-express/ci' \
            --arg description "Pruebas de Express: $JOB_STATUS (sin despliegue)" \
            --arg target_url "https://github.com/$GH_REPO/actions/runs/$GH_RUN_ID" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}' > /tmp/express-ci-status.json
          curl --fail --silent --show-error --retry 2 -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/express-ci-status.json \
            "https://api.github.com/repos/$GH_REPO/statuses/$GH_SHA"

name: R2 Central - activar SOLO Worker PRIVADO de pruebas con rollback
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths: [.github/workflows/r2-central-promover-privado-20261109.yml]
permissions:
  contents: read
  statuses: write
concurrency:
  group: saber-central-private-deploy
  cancel-in-progress: false
jobs:
  promover-central:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: saber-cloudflare-pruebas
      deployment: false
    steps:
      - name: Promover Central de pruebas y revertir ante diferencias o fallos
        shell: bash
        env:
          ACCOUNT: ${{ secrets.SABER_CF_ACCOUNT_ID }}
          TOKEN: ${{ secrets.SABER_CF_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$ACCOUNT" && test -n "$TOKEN"
          root="https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/workers/scripts/saber-pagos-pruebas"
          base="https://saber-pagos-pruebas.libreriasaber.workers.dev"
          old='2de166a1-34c6-401d-be32-7f8ccbf21477'
          candidate='087d5a84-731d-49bb-a7b3-4b2fb3ddf39e'
          auth="Authorization: Bearer $TOKEN"
          dir=$(mktemp -d)
          touched=0
          cleanup(){
            rc=$?
            trap - EXIT
            if [ "$rc" -ne 0 ] && [ "$touched" = 1 ]; then
              echo 'CENTRAL_PRIVATE_DEPLOY_FAILED_TRY_ROLLBACK'
              jq -n --arg id "$old" '{strategy:"percentage",versions:[{percentage:100,version_id:$id}],annotations:{"workers/message":"Rollback automatico Saber Central R2 ensayo"}}' > "$dir/rollback.json"
              if curl -fsS --max-time 55 -H "$auth" -H 'Content-Type: application/json' --data-binary "@$dir/rollback.json" "$root/deployments" > "$dir/rollback-response.json" && jq -e '.success==true' "$dir/rollback-response.json" >/dev/null; then
                curl -fsS --max-time 25 -H "$auth" "$root/deployments" > "$dir/rollback-check.json" || true
                restored=$(jq -r '.result.deployments[0].versions[]?|select(.percentage==100)|.version_id' "$dir/rollback-check.json" 2>/dev/null | head -n 1 || true)
                if [ "$restored" = "$old" ]; then echo 'CENTRAL_ROLLBACK_CONFIRMED'; else echo 'CENTRAL_ROLLBACK_REQUIRES_VERIFICACION'; fi
              else
                echo 'CENTRAL_ROLLBACK_NOT_CONFIRMED_ATTENTION_REQUIRED'
              fi
            fi
            rm -rf "$dir"
            exit "$rc"
          }
          trap cleanup EXIT
          for id in "$old" "$candidate"; do
            curl -fsS --max-time 25 -H "$auth" "$root/versions/$id" > "$dir/$id.json"
            jq -e --arg v "$id" '.success==true and .result.id==$v and (.result.resources.bindings|type=="array")' "$dir/$id.json" >/dev/null
            jq -S '[.result.resources.bindings[]|if .type=="secret_text" then {name,type} else . end]|sort_by(.name)' "$dir/$id.json" > "$dir/$id-bindings"
            jq -S '.result.resources.script_runtime|{compatibility_date,compatibility_flags,usage_model,limits,placement}' "$dir/$id.json" > "$dir/$id-runtime"
          done
          cmp -s "$dir/$old-bindings" "$dir/$candidate-bindings" || { echo 'CENTRAL_BINDINGS_CHANGED_NO_DEPLOY'; exit 1; }
          cmp -s "$dir/$old-runtime" "$dir/$candidate-runtime" || { echo 'CENTRAL_RUNTIME_CHANGED_NO_DEPLOY'; exit 1; }
          curl -fsS --max-time 25 -H "$auth" "$root/deployments" > "$dir/before.json"
          observed=$(jq -er '.result.deployments[0].versions | if length==1 and .[0].percentage==100 then .[0].version_id else empty end' "$dir/before.json")
          test "$observed" = "$old" || { echo 'CENTRAL_ACTIVE_VERSION_CHANGED_NO_DEPLOY'; exit 1; }
          curl -fsS --max-time 25 "$base/health" > "$dir/health-before.json"
          jq -e '.ok==true and .databaseReady==true and .paymentsEnabled==false' "$dir/health-before.json" >/dev/null
          for route in '/admin/api/orders' '/admin/api/transfers/pending'; do
            status=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "$base$route")
            test "$status" = 401 || { echo 'CENTRAL_PRIVATE_ACCESS_CHANGED_NO_DEPLOY'; exit 1; }
          done
          echo 'CENTRAL_PRIVATE_PREFLIGHT_OK_REAL_PAYMENTS_OFF'
          jq -n --arg id "$candidate" '{strategy:"percentage",versions:[{percentage:100,version_id:$id}],annotations:{"workers/message":"Saber Central R2 en Worker PRIVADO de pruebas; mismos bindings, pagos reales desactivados"}}' > "$dir/promote.json"
          touched=1
          curl -fsS --max-time 65 -H "$auth" -H 'Content-Type: application/json' --data-binary "@$dir/promote.json" "$root/deployments" > "$dir/promote-response.json"
          jq -e '.success==true' "$dir/promote-response.json" >/dev/null
          ready=0
          for attempt in 1 2 3 4 5 6 7 8; do
            curl -fsS --max-time 25 -H "$auth" "$root/deployments" > "$dir/after.json"
            actual=$(jq -r '.result.deployments[0].versions[]?|select(.percentage==100)|.version_id' "$dir/after.json" | head -n 1)
            if [ "$actual" = "$candidate" ]; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1 || { echo 'CENTRAL_PROMOTION_NOT_CONFIRMED'; exit 1; }
          healthy=0
          for attempt in 1 2 3 4 5 6 7 8; do
            status1=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "$base/admin/api/orders" || true)
            status2=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "$base/admin/api/transfers/pending" || true)
            curl -fsS --max-time 20 "$base/health" > "$dir/health-after.json" || true
            if [ "$status1" = 401 ] && [ "$status2" = 401 ] &&
                jq -e '.ok==true and .databaseReady==true and .paymentsEnabled==false' "$dir/health-after.json" >/dev/null 2>&1; then healthy=1; break; fi
            sleep 2
          done
          test "$healthy" = 1 || { echo 'CENTRAL_POSTDEPLOY_SAFETY_FAILED'; exit 1; }
          echo "CENTRAL_PRIVADA_ACTIVA_R2_BUNDLE=$candidate"
          echo "CENTRAL_ROLLBACK_BASE=$old"
          echo 'CENTRAL_HEALTH_OK_DB_READY_ADMIN_401_REAL_PAYMENTS_OFF'
          echo 'ONLY_PRIVATE_SANDBOX_NO_PUBLIC_WEB'
      - name: Registrar resultado de Central privada en GitHub
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RESULT: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ "$CI_RESULT" = success ]; then state=success; else state=failure; fi
          jq -n --arg state "$state" \
            --arg context 'saber/r2-central-privada-activa' \
            --arg description "Central Worker privado y seguridad tras despliegue: $CI_RESULT" \
            --arg target_url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}' > /tmp/central-private-promote-status.json
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" --input /tmp/central-private-promote-status.json >/dev/null
          echo "CENTRAL_PRIVATE_RESULT=$CI_RESULT"

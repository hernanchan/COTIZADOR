name: Diagnóstico puntual - checkout R2 503 (solo lectura)
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths: [.github/workflows/r2-checkout-503-diagnostico-20261109.yml]
permissions:
  contents: read
jobs:
  checkout-binding-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: saber-cloudflare-pruebas
      deployment: false
    steps:
      - name: Revisar compuertas exactas de pago sandbox sin mostrar secretos
        shell: bash
        env:
          ACCOUNT: ${{ secrets.SABER_CF_ACCOUNT_ID }}
          TOKEN: ${{ secrets.SABER_CF_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$ACCOUNT" && test -n "$TOKEN"
          tmp=$(mktemp)
          trap 'rm -f "$tmp"' EXIT
          curl -fsS --max-time 25 -H "Authorization: Bearer $TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/workers/scripts/saber-pagos-pruebas/settings" > "$tmp"
          jq -e '.success==true' "$tmp" >/dev/null
          for key in DB MP_TEST_ACCESS_TOKEN DEMO_ADMIN_KEY MP_TEST_SELLER_ID TEST_WEBHOOK_URL MP_WEBHOOK_SECRET CENTRAL_BRIDGE_ENABLED CENTRAL_BRIDGE_KEY CENTRAL_R2_PREPAY_CHECKOUT_ENABLED CENTRAL_R2_PREPAY_DRAFT_ENABLED CENTRAL_R2_STAGING_ENABLED DOCS_SANDBOX_CHECKOUT_ENABLED; do
            jq -r --arg n "$key" '
              (.result.bindings|map(select(.name==$n))|first) as $x |
              if $x==null then "MISSING="+$n
              elif ($x.type=="plain_text") then $n+"="+(if $x.text=="PRIVATE_TEST_ONLY" then "TEST_ONLY" else "PRESENT_OTHER" end)
              else $n+"=PRESENT_TYPE_"+$x.type end' "$tmp"
          done
          for w in saber-documentos-pruebas saber-pagos-pruebas; do
            curl -fsS --max-time 25 -H "Authorization: Bearer $TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/workers/scripts/$w/deployments" > "$tmp"
            jq -r --arg w "$w" '"ACTIVE_VERSION "+$w+"="+([.result.deployments[0].versions[]?|select(.percentage==100)|.version_id]|first)' "$tmp"
          done
          echo 'CHECKOUT_ENV_READONLY_NO_CLOUDFLARE_CHANGES'

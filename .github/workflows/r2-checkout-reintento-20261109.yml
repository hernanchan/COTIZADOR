name: Saber R2 - reconsultar checkout existente después de propagar Worker
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths: [.github/workflows/r2-checkout-reintento-20261109.yml]
permissions:
  contents: read
jobs:
  estado-real:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    environment:
      name: saber-cloudflare-pruebas
      deployment: false
    steps:
      - name: Misma orden, sin R2 ni nuevos pagos
        shell: bash
        env:
          PASS: ${{ secrets.SABER_V2_OPERATOR_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$PASS"
          root='https://saber-documentos-pruebas.libreriasaber.workers.dev'
          central='https://saber-pagos-pruebas.libreriasaber.workers.dev'
          tmp=$(mktemp)
          trap 'rm -f "$tmp"' EXIT
          curl -fsS --max-time 20 "$central/health" > "$tmp"
          jq -e '.databaseReady==true and .paymentsEnabled==false' "$tmp" >/dev/null
          payload='{"action":"start","webOrderId":"WEB-ENSAYO-255BFE122477AC6C7666EB6D342707FE","commercialOrderId":"66f10bd2-77ce-46ef-930c-49dc3d22d23e"}'
          code=$(curl -sS --max-time 65 -u "operador:$PASS" -H "Origin: $root" \
             -H 'Content-Type: application/json' -o "$tmp" -w '%{http_code}' \
             -X POST --data "$payload" "$root/prueba-v2/api/ensayo-r2-prepago-checkout")
          echo "R2_SAME_ORDER_CHECKOUT_HTTP=$code"
          jq -c '{ok,error,reasonCode,estado,amountArs,checkoutUrlPresent:(.checkoutUrl!=null),uploadAuthorized}' "$tmp"
          if [ "$code" = 200 ];then
            jq -e '.ok==true and .amountArs==4400 and .uploadAuthorized==false' "$tmp" >/dev/null
            echo 'R2_SANDBOX_CHECKOUT_OK_NO_PAYMENT_NO_UPLOAD'
          else
            jq -e '.ok==false' "$tmp" >/dev/null
            echo 'R2_SANDBOX_CHECKOUT_STILL_BLOCKED_NO_R2'
          fi

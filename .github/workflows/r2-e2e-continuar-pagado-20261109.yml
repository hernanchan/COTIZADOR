name: Saber E2E - continuar orden R2 SOLO tras pago MP sandbox verificado
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths: [docs/R2-E2E-PAGADO-CONTINUAR-20261109.trigger]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: saber-r2-postpay-order-255BFE122477AC6C7666EB6D342707FE
  cancel-in-progress: false
jobs:
  r2-desde-orden-existente:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment:
      name: saber-cloudflare-pruebas
      deployment: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar que NO se crea otro pedido ni checkout, y compilar script
        shell: bash
        run: |
          set -euo pipefail
          node --check integraciones/autocotizador/recepcion/ensayo-e2e-r2-pagado-20261109.mjs
          if grep -Eq 'ensayo-r2-prepago\x27|action:\x27start\x27' integraciones/autocotizador/recepcion/ensayo-e2e-r2-pagado-20261109.mjs;then
            echo 'BLOCKER_SCRIPT_TRIES_CREATE_NEW_ORDER_OR_CHECKOUT';exit 1;
          fi
          echo 'POSTPAY_ONLY_SCRIPT_READY_NO_NEW_CHECKOUT'
      - name: Mercado Pago D1 verificado -> R2 real -> SHA -> Central -> descarga de operador
        shell: bash
        env:
          SABER_V2_OPERATOR_PASSWORD: ${{ secrets.SABER_V2_OPERATOR_PASSWORD }}
        run: |
          set -euo pipefail
          node integraciones/autocotizador/recepcion/ensayo-e2e-r2-pagado-20261109.mjs
          echo 'NO_PRODUCTION_RELEASE_PENDING_TECHNICAL_PREPRESS_REVIEW'

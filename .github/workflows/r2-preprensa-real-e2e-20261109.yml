name: Saber R2 - preprensa del PDF original REAL sin cobro ni subida
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths: [.github/workflows/r2-preprensa-real-e2e-20261109.yml]
permissions:
  contents: read
concurrency:
  group: saber-r2-real-prepress-original-255BFE122477AC6C7666EB6D342707FE
  cancel-in-progress: false
jobs:
  preprensa:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    environment:
      name: saber-cloudflare-pruebas
      deployment: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar motor de lectura local y regresiones de 41 MiB
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund pdf-lib@1.17.1 esbuild@0.25.12
          node --check integraciones/autocotizador/recepcion/e2e-preprensa-original-r2-real-20261109.mjs
          node --test tests/r2-preprensa-archivo-local.test.mjs tests/r2-referencia-personal.test.mjs
          echo 'PDF_PREPRESS_LOCAL_TESTS_OK'
      - name: 'Sólo pago verificado y original R2 ya guardado: 60 MiB y medidas A1'
        shell: bash
        env:
          SABER_V2_OPERATOR_PASSWORD: ${{ secrets.SABER_V2_OPERATOR_PASSWORD }}
        run: |
          set -euo pipefail
          node integraciones/autocotizador/recepcion/e2e-preprensa-original-r2-real-20261109.mjs
      - name: Registrar límites no comerciales
        shell: bash
        run: |
          echo 'ORIGINAL_R2_REAL_SHA_AND_PDF_GEOMETRY_VERIFIED'
          echo 'NO_PRODUCTION_APPROVAL_NO_ZIP_RELEASE_NO_PRICE_RECALCULATED'
          echo 'NO_REAL_PAYMENT_NO_NEW_PAYMENT_NO_NEW_R2_UPLOAD_NO_MAIN_CHANGE'

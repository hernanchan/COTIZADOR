name: Saber - comprobar orden 026 en Nuevos sin cambios
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths: [.github/workflows/saber-026-central-nuevos-readonly-20261110.yml]
permissions: {contents: read, statuses: write}
jobs:
  nuevos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: {name: saber-cloudflare-pruebas, deployment: false}
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Central autenticada, pedido mixto sin duplicados y preprensa aprobada
        env:
          DEMO_ADMIN_KEY: ${{ secrets.DEMO_ADMIN_KEY }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const url='https://saber-pagos-pruebas.libreriasaber.workers.dev';
          const id='e552cf32-356d-40e3-9736-6fbb8fef5dca';
          const web='WEB-ENSAYO-2EFC2C991012D0829CB9427C7461757B';
          const token=process.env.DEMO_ADMIN_KEY;
          assert.ok(token?.length>0,'CENTRAL_ADMIN_SECRET_MISSING');
          async function get(path){
            const r=await fetch(url+path,{headers:{Authorization:'Bearer '+token},
             signal:AbortSignal.timeout(45000)});
            const data=await r.json().catch(()=>({}));
            assert.equal(r.status,200,'CENTRAL_GET_'+r.status+'_'+String(data.error||path));
            return data;
          }
          const h=await fetch(url+'/health').then(r=>r.json());
          assert.equal(h.ok,true);assert.equal(h.databaseReady,true);assert.equal(h.paymentsEnabled,false);
          const board=await get('/admin/api/orders');
          assert.ok(Array.isArray(board.orders));
          const found=board.orders.filter(o=>o.id===id);
          assert.equal(found.length,1,'PILOT_026_DUPLICATED_OR_MISSING');
          const card=found[0];
          assert.equal(card.amount_ars,4500);
          assert.equal(card.status,'paid');
          assert.equal(card.work_number,26);
          assert.equal(card.web_order_id,web);
          assert.equal(card.file_count,2);
          assert.equal(card.production_state,'pendiente','NOT_IN_NEW_LANE');
          assert.equal(card.universal_pdf_pending,false,'PREPRESS_ALREADY_APPROVED');
          assert.equal(card.universal_pdf_approved,true);
          assert.equal(card.universal_pdf_pending_count,0,'ORIGINALS_NOT_ALL_RECEIVED');
          assert.equal(board.universalReviewUnavailable,false);
          console.log('PILOT_026_CENTRAL_NEW_LANE_ONE_ROW');
          console.log('PILOT_026_PAYMENT_AND_TWO_RECEIVED_PREPRESS_APPROVED');
          console.log('PILOT_026_OPERATOR_START_REQUIRED_NO_AUTOMATIC_PRODUCTION');
          const detail=await get('/admin/api/order?id='+id);
          assert.equal(detail.order.id,id);
          assert.equal(detail.order.status,'paid');
          assert.equal(detail.order.amount_ars,4500);
          console.log('PILOT_026_CENTRAL_DETAIL_ACCESS_OK');
          console.log('CENTRAL_READONLY_NO_STATUS_CHANGE_NO_COBROS_NO_DELETE');
          NODE
      - name: Registrar evidencia
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          if [ "$RESULT" = success ];then state=success;else state=failure;fi
          jq -n --arg state "$state" --arg context 'saber/qa-026-central-new-lane' \
           --arg description "Order 026 in Nuevos once: $RESULT" \
           --arg target_url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
           '{state:$state,context:$context,description:$description,target_url:$target_url}' >/tmp/status.json
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" --input /tmp/status.json >/dev/null

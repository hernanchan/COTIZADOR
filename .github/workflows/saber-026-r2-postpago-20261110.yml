name: Saber - subir R2 A1 60MiB orden 026 POSTPAGO sandbox
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths: [.github/workflows/saber-026-r2-postpago-20261110.yml]
permissions: {contents: read, statuses: write}
concurrency: {group: saber-026-r2-postpay-once, cancel-in-progress: false}
jobs:
  r2:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: {name: saber-cloudflare-pruebas, deployment: false}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: MP TEST pagado, R2 60MiB en partes, SHA y Central sin duplicados
        env:
          SABER_V2_OPERATOR_PASSWORD: ${{ secrets.SABER_V2_OPERATOR_PASSWORD }}
        run: |
          set -euo pipefail
          node --check integraciones/autocotizador/recepcion/piloto-026-subir-r2-postpago-20261110.mjs
          node integraciones/autocotizador/recepcion/piloto-026-subir-r2-postpago-20261110.mjs
      - name: Registrar evidencia
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          if [ "$RESULT" = success ];then state=success;else state=failure;fi
          jq -n --arg state "$state" --arg context 'saber/qa-026-r2-paid-original' \
           --arg description "R2 60MiB original after payment 026: $RESULT" \
           --arg target_url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
           '{state:$state,context:$context,description:$description,target_url:$target_url}' >/tmp/status.json
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" --input /tmp/status.json >/dev/null

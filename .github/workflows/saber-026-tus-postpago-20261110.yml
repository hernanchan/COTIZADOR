name: Saber - subir TUS A4 orden 026 POSTPAGO sandbox y D1
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths: [.github/workflows/saber-026-tus-postpago-20261110.yml]
permissions: {contents: read, statuses: write}
concurrency: {group: saber-026-tus-postpay-once, cancel-in-progress: false}
jobs:
  tus:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    environment: {name: saber-cloudflare-pruebas, deployment: false}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Solo MP TEST conciliado, TUS firmado, SHA y recibo D1
        env:
          SABER_V2_OPERATOR_PASSWORD: ${{ secrets.SABER_V2_OPERATOR_PASSWORD }}
        run: |
          set -euo pipefail
          node --check integraciones/autocotizador/recepcion/piloto-026-subir-tus-postpago-20261110.mjs
          node integraciones/autocotizador/recepcion/piloto-026-subir-tus-postpago-20261110.mjs
      - name: Registrar resultado de A4 original sin cobros
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          if [ "$RESULT" = success ];then state=success;else state=failure;fi
          jq -n --arg state "$state" --arg context 'saber/qa-026-tus-paid-original' \
           --arg description "TUS original 026 after paid: $RESULT" \
           --arg target_url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
           '{state:$state,context:$context,description:$description,target_url:$target_url}' >/tmp/status.json
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" --input /tmp/status.json >/dev/null

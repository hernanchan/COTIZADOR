name: Saber - anular operativamente ensayo 013 sin borrar auditoria
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths: [.github/workflows/saber-anular-orden013-ensayo-20261113.yml]
permissions: {contents: read}
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: {name: saber-cloudflare-pruebas, deployment: false}
    env:
      ACCOUNT: ${{ secrets.SABER_CF_ACCOUNT_ID }}
      D1TOKEN: ${{ secrets.SABER_CF_D1_WRITE_TOKEN }}
    steps:
      - name: Preflight exacto y exclusion reversible de cola; no tocar cobros
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          const base='https://api.cloudflare.com/client/v4/accounts/'+process.env.ACCOUNT;
          async function api(path,body=null){
           const r=await fetch(base+path,{method:body?'POST':'GET',
            headers:{Authorization:'Bearer '+process.env.D1TOKEN,
             ...(body?{'Content-Type':'application/json'}:{})},
            ...(body?{body:JSON.stringify(body)}:{}),signal:AbortSignal.timeout(30000)});
           const j=await r.json().catch(()=>null);
           if(!r.ok||j?.success!==true)throw Error('D1_HTTP_'+r.status+'_'+String(j?.errors?.[0]?.message||'').slice(0,110));
           return j.result;
          }
          const dbs=await api('/d1/database');
          const db=dbs.find(x=>x.name==='saber-pagos-produccion');
          if(!db?.uuid)throw Error('DB_NOT_FOUND');
          async function q(sql){
           const a=await api('/d1/database/'+db.uuid+'/query',{sql});
           if(a?.[0]?.success!==true)throw Error('D1_QUERY_FAILED');
           return a[0];
          }
          const sql=[
           'SELECT n.number AS number, o.id AS orderId,o.status AS status,o.created_at AS created,',
           'o.amount_ars AS amount,',
           'CASE WHEN o.payment_id IS NULL AND o.preference_id IS NULL THEN 1 ELSE 0 END AS bank,',
           "CASE WHEN EXISTS(SELECT 1 FROM payment_reviews r WHERE r.order_id=o.id AND r.state='verified') THEN 1 ELSE 0 END AS reviewed,",
           "CASE WHEN EXISTS(SELECT 1 FROM central_live_bank_accreditations b WHERE b.order_id=o.id AND b.amount_ars=o.amount_ars) THEN 1 ELSE 0 END AS bankAudit,",
           'COUNT(*) AS files,',
           "SUM(CASE WHEN f.received=1 THEN 1 ELSE 0 END) AS received,",
           "SUM(CASE WHEN f.transport='r2' THEN 1 ELSE 0 END) AS r2,",
           "SUM(CASE WHEN s.receipt_id IS NOT NULL THEN 1 ELSE 0 END) AS staged,",
           "CASE WHEN e.order_id IS NOT NULL THEN 1 ELSE 0 END AS excluded",
           'FROM central_work_order_numbers n JOIN orders o ON o.id=n.commercial_order_id',
           'JOIN central_r2_universal_order_links l ON l.commercial_order_id=o.id',
           'JOIN central_r2_universal_files f ON f.web_order_id=l.web_order_id',
           'LEFT JOIN central_r2_large_pending s ON s.web_order_id=f.web_order_id AND s.file_id=f.file_id',
           'LEFT JOIN central_live_test_exclusions e ON e.order_id=o.id',
           'WHERE n.number=13',
           'GROUP BY n.number,o.id,o.status,o.created_at,o.amount_ars,o.payment_id,o.preference_id,e.order_id'
          ].join(' ');
          const rows=(await q(sql)).results||[];
          if(rows.length!==1)throw Error('ENSAYO_013_AMBIGUO');
          const o=rows[0];
          if(o.excluded===1){console.log('SABER_013_ALREADY_EXCLUDED');process.exit(0)}
          if(o.number!==13||!/^2026-11-13/.test(o.created)||o.amount!==7590||
             o.status!=='paid'||o.bank!==1||o.reviewed!==1||o.bankAudit!==1||
             o.files!==2||o.received!==0||o.staged!==0||o.r2!==1||
             !/^[a-f0-9-]{36}$/i.test(o.orderId))
           throw Error('ENSAYO_013_CAMBIO_ESTADO_NO_ANULAR');
          const insert=[
           'INSERT OR IGNORE INTO central_live_test_exclusions(order_id,work_number,reason)',
           "SELECT o.id,13,'ensayo_transferencia_r2_anulado'",
           'FROM orders o JOIN central_work_order_numbers n ON n.commercial_order_id=o.id',
           "WHERE n.number=13 AND o.id='"+o.orderId+"' AND o.status='paid'",
           'AND NOT EXISTS(SELECT 1 FROM central_live_test_exclusions e WHERE e.order_id=o.id)'
          ].join(' ');
          const made=await q(insert);
          if(made.meta?.changes!==1)throw Error('ENSAYO_013_EXCLUSION_NO_INSERTADA');
          const check=(await q("SELECT count(*) AS n FROM central_live_test_exclusions WHERE order_id='"+
           o.orderId+"' AND work_number=13 AND reason='ensayo_transferencia_r2_anulado'")).results;
          if(check?.[0]?.n!==1)throw Error('ENSAYO_013_EXCLUSION_NO_VERIFICADA');
          console.log('SABER_013_ANULADA='+JSON.stringify({
           orden:13,excluidoDeCola:true,originalesRecibidos:0,
           pagoBancarioYAuditoriaIntactos:true,archivosFisicosNoTocados:true,
           noReciclarNumero:true
          }));
          EOF

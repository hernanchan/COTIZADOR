name: Saber - desplegar Central LIVE privada sin publicar cotizador
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths: [.github/workflows/saber-central-live-deploy-20261112.yml]
permissions: {contents: read}
concurrency: {group: saber-central-live-deploy-20261112, cancel-in-progress: false}
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: {name: saber-cloudflare-pruebas, deployment: false}
    env:
      ACCOUNT: ${{ secrets.SABER_CF_ACCOUNT_ID }}
      TOKEN: ${{ secrets.SABER_CF_DEPLOY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Compilar bundles comprobados y tests obligatorios
        shell: bash
        run: |
          set -euo pipefail
          node --test integraciones/mercadopago/pruebas/central-recepcion-live.test.mjs integraciones/mercadopago/pruebas/central-entrega-purga-live.test.mjs integraciones/autocotizador/recepcion/purga-archivo-live-documentos.test.mjs integraciones/mercadopago/pruebas/central-live-bridge.test.mjs integraciones/mercadopago/pruebas/central-prevision-personal-live.test.mjs integraciones/mercadopago/pruebas/central-agenda-personal-live.test.mjs integraciones/mercadopago/pruebas/plazo-produccion-informativo.test.mjs integraciones/autocotizador/recepcion/plazo-produccion-cliente.test.mjs integraciones/autocotizador/recepcion/pagina-central-personal-live.test.mjs integraciones/mercadopago/pruebas/transferencias-live-central.test.mjs integraciones/autocotizador/recepcion/transferencia-live-comprador.test.mjs integraciones/autocotizador/recepcion/pagina-cotizar-live.test.mjs integraciones/autocotizador/recepcion/transferencias-personal-live.test.mjs integraciones/mercadopago/pruebas/central-mp-live-rescate.test.mjs integraciones/mercadopago/pruebas/seguimiento-live-estado-central.test.mjs integraciones/mercadopago/pruebas/mercadopago-live-central.test.mjs integraciones/autocotizador/recepcion/pagina-retorno-live.test.mjs integraciones/autocotizador/recepcion/flujo-presupuesto-live-cliente.test.mjs integraciones/autocotizador/recepcion/circuito-comercial-completo-live.test.mjs integraciones/autocotizador/recepcion/custodia-local-originales-live.test.mjs integraciones/autocotizador/recepcion/pagina-continuar-pago-live.test.mjs integraciones/autocotizador/recepcion/rescate-personal-mp-live.test.mjs
          npm install --no-save --no-audit --no-fund esbuild@0.25.12
          ./node_modules/.bin/esbuild integraciones/mercadopago/pruebas/worker.js --bundle --platform=browser --format=esm --target=es2022 --outfile=/tmp/saber-central-live.mjs
          (cd integraciones/autocotizador/recepcion && npm install --no-audit --no-fund && npm run build:unificado)
          cp integraciones/autocotizador/recepcion/dist/saber-documentos-cotizador-fase4.mjs /tmp/saber-documentos-live.mjs
          node --check /tmp/saber-central-live.mjs
          node --check /tmp/saber-documentos-live.mjs
          grep -Fq '/personal/central' /tmp/saber-documentos-live.mjs || { echo 'SABER_DEPLOY_MARKER_01_MISSING'; exit 1; }
          grep -Fq '/personal/api/live-status' /tmp/saber-documentos-live.mjs || { echo 'SABER_DEPLOY_MARKER_02_MISSING'; exit 1; }
          grep -Fq '/personal/api/live-forecast' /tmp/saber-documentos-live.mjs || { echo 'SABER_DEPLOY_MARKER_03_MISSING'; exit 1; }
          grep -Fq '/personal/api/live-calendar' /tmp/saber-documentos-live.mjs || { echo 'SABER_DEPLOY_MARKER_04_MISSING'; exit 1; }
          grep -Fq 'SABER_TRANSFER_CONFIRMACION_CLIENTE_V1' /tmp/saber-documentos-live.mjs || { echo 'SABER_DEPLOY_MARKER_05_MISSING'; exit 1; }
          grep -Fq 'actualizarAvisosTransferencia' /tmp/saber-documentos-live.mjs || { echo 'SABER_DEPLOY_MARKER_06_MISSING'; exit 1; }
          grep -Fq 'transfer-notify' /tmp/saber-central-live.mjs || { echo 'SABER_DEPLOY_MARKER_07_MISSING'; exit 1; }
          grep -Fq 'central_live_transfer_customer_notices' /tmp/saber-central-live.mjs || { echo 'SABER_DEPLOY_MARKER_08_MISSING'; exit 1; }
          grep -Fq 'Transferencias avisadas por clientes' /tmp/saber-documentos-live.mjs || { echo 'SABER_DEPLOY_MARKER_09_MISSING'; exit 1; }
          grep -Fq 'central_live_purge_files' /tmp/saber-central-live.mjs
          grep -Fq 'reintentarEntregasLive' /tmp/saber-central-live.mjs
          grep -Fq '/internal/live/purge-file' /tmp/saber-documentos-live.mjs
          grep -Fq 'DOCS_LIVE_TUS_SERVICE_KEY' /tmp/saber-documentos-live.mjs
          grep -Fq 'central_live_order_archives' /tmp/saber-central-live.mjs
          grep -Fq 'stagedR2FileIds' /tmp/saber-central-live.mjs
          grep -Fq 'transferNewList' /tmp/saber-documentos-live.mjs
          grep -Fq 'stageDialog' /tmp/saber-documentos-live.mjs
          grep -Fq 'saber-live-numero-v1' /tmp/saber-documentos-live.mjs
          grep -Fq 'etaDate' /tmp/saber-documentos-live.mjs
          grep -Fq 'Descargar ZIP + instrucciones' /tmp/saber-documentos-live.mjs || { echo 'SABER_DEPLOY_MARKER_10_MISSING'; exit 1; }
          grep -Fq 'openOrderEta' /tmp/saber-documentos-live.mjs || { echo 'SABER_DEPLOY_MARKER_11_MISSING'; exit 1; }
          grep -Fq 'actualizarSeguimiento' /tmp/saber-documentos-live.mjs || { echo 'SABER_DEPLOY_MARKER_12_MISSING'; exit 1; }
          grep -Fq 'saber-live-originales-privados-v1' /tmp/saber-documentos-live.mjs || { echo 'SABER_DEPLOY_MARKER_13_MISSING'; exit 1; }
          grep -Fq 'enviarAutomaticamente' /tmp/saber-documentos-live.mjs || { echo 'SABER_DEPLOY_MARKER_14_MISSING'; exit 1; }
          grep -Fq 'SABER_POSTPAGO_SIN_SEGUNDA_SELECCION_V1' /tmp/saber-documentos-live.mjs || { echo 'SABER_DEPLOY_MARKER_15_MISSING'; exit 1; }
          grep -Fq 'leerOriginalesLive' /tmp/saber-documentos-live.mjs || { echo 'SABER_DEPLOY_MARKER_16_MISSING'; exit 1; }
          grep -Fq '/personal/api/live-reconcile' /tmp/saber-documentos-live.mjs || { echo 'SABER_DEPLOY_MARKER_17_MISSING'; exit 1; }
          grep -Fq 'staff-calendar' /tmp/saber-central-live.mjs || { echo 'SABER_DEPLOY_MARKER_18_MISSING'; exit 1; }
          grep -Fq 'staff-reconcile' /tmp/saber-central-live.mjs || { echo 'SABER_DEPLOY_MARKER_19_MISSING'; exit 1; }
          grep -Fq 'SABER_MP_LIVE_CRON_ACREDITADOS' /tmp/saber-central-live.mjs || { echo 'SABER_DEPLOY_MARKER_20_MISSING'; exit 1; }
          grep -Fq 'v1/payments/search' /tmp/saber-central-live.mjs || { echo 'SABER_DEPLOY_MARKER_21_MISSING'; exit 1; }
          grep -Fq 'auto_return' /tmp/saber-central-live.mjs || { echo 'SABER_DEPLOY_MARKER_22_MISSING'; exit 1; }
          grep -Fq 'leerSeguimientoLiveCentral' /tmp/saber-central-live.mjs || { echo 'SABER_DEPLOY_MARKER_23_MISSING'; exit 1; }
          grep -Fq 'central_mp_live_auto_health' /tmp/saber-central-live.mjs || { echo 'SABER_DEPLOY_MARKER_24_MISSING'; exit 1; }
          grep -Fq 'FALLO_NO_IDENTIFICADO' /tmp/saber-central-live.mjs || { echo 'SABER_DEPLOY_MARKER_25_MISSING'; exit 1; }
          grep -Fq 'RESCATE_VENDEDOR_ID_DIFERENTE' /tmp/saber-central-live.mjs || { echo 'SABER_DEPLOY_MARKER_26_MISSING'; exit 1; }
          grep -Fq 'RESCATE_VENDEDOR_JSON_INVALIDO' /tmp/saber-central-live.mjs || { echo 'SABER_DEPLOY_MARKER_27_MISSING'; exit 1; }
          grep -Fq 'REDACTADO' /tmp/saber-central-live.mjs || { echo 'SABER_DEPLOY_MARKER_28_MISSING'; exit 1; }
          grep -Fq 'api.mercadolibre.com/users/me' /tmp/saber-central-live.mjs || { echo 'SABER_DEPLOY_MARKER_29_MISSING'; exit 1; }
          grep -Fq 'SABER_MP_LIVE_CRON_AISLADO' /tmp/saber-central-live.mjs || { echo 'SABER_DEPLOY_MARKER_30_MISSING'; exit 1; }
          grep -Fq 'SABER_MP_LIVE_STAFF_AUTO_ACREDITADOS' /tmp/saber-central-live.mjs || { echo 'SABER_DEPLOY_MARKER_31_MISSING'; exit 1; }
          grep -Fq 'setTimeout' /tmp/saber-documentos-live.mjs || { echo 'SABER_DEPLOY_MARKER_32_MISSING'; exit 1; }
          ! grep -Fq 'Verificar cobros Mercado Pago' /tmp/saber-documentos-live.mjs
          grep -Fq 'staff-forecast' /tmp/saber-central-live.mjs || { echo 'SABER_DEPLOY_MARKER_33_MISSING'; exit 1; }
          echo SABER_STAFF_LIVE_2_BUNDLES_READY
      - name: Stage y promover ambos Workers con bindings heredados y rollback de código
        shell: bash
        run: |
          set -euo pipefail
          : "${ACCOUNT:?}" "${TOKEN:?}"
          root="https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/workers/scripts"
          temp=$(mktemp -d)
          get(){
            curl -fsS --retry 2 --connect-timeout 10 --max-time 35 -H "Authorization: Bearer $TOKEN" "$1"
          }
          for worker in saber-pagos-produccion saber-documentos-produccion;do
            echo "SABER_DEPLOY_READING_SETTINGS_$worker"
            get "$root/$worker/settings" > "$temp/$worker.before.json"
            get "$root/$worker/deployments" > "$temp/$worker.deployed-before.json"
            jq -er '.result.deployments[0].versions | if length==1 and .[0].percentage==100 then .[0].version_id else empty end' "$temp/$worker.deployed-before.json" > "$temp/$worker.old"
            jq -e '.success==true and (.result.bindings|any(.name=="SABER_ENTORNO" and .text=="produccion") and any(.name=="CENTRAL_DB_ENV" and .text=="produccion") and any(.name=="CENTRAL_BRIDGE_KEY" and .type=="secret_text"))' "$temp/$worker.before.json" >/dev/null
            jq -r '.result.bindings[].name' "$temp/$worker.before.json" | sort > "$temp/$worker.names"
            jq '{main_module:"index.mjs",bindings:[.result.bindings[]|{name,type:"inherit"}]}' "$temp/$worker.before.json" > "$temp/$worker.metadata.json"
          done
          jq -e '.result.bindings | any(.name=="SABER_R2_GRANDES_LIVE" and .type=="r2_bucket" and .bucket_name=="saber-documentos-produccion-privado") and any(.name=="SABER_CENTRAL" and .type=="service" and .service=="saber-pagos-produccion") and any(.name=="DOCS_LIVE_STAFF_SECRET" and .type=="secret_text") and any(.name=="DOCS_LIVE_STAFF_GATE" and .text=="GO_COMERCIAL_CONFIRMADO")' "$temp/saber-documentos-produccion.before.json" >/dev/null
          jq -e '.result.bindings | any(.name=="MP_LIVE_ACCESS_TOKEN" and .type=="secret_text") and any(.name=="CENTRAL_LIVE_R2_INSPECTION_GATE" and .text=="GO_COMERCIAL_CONFIRMADO")' "$temp/saber-pagos-produccion.before.json" >/dev/null
          for worker in saber-pagos-produccion saber-documentos-produccion;do
            src=/tmp/saber-central-live.mjs
            test "$worker" = saber-documentos-produccion && src=/tmp/saber-documentos-live.mjs
            status=$(curl -sS --retry 2 --max-time 120 -w '%{http_code}' -o "$temp/$worker.stage.json" \
              -H "Authorization: Bearer $TOKEN" \
              -F "metadata=@$temp/$worker.metadata.json;type=application/json" \
              -F "index.mjs=@$src;filename=index.mjs;type=application/javascript+module" \
              "$root/$worker/versions?bindings_inherit=strict")
            if [ "$status" != 200 ] || ! jq -e '.success==true and (.result.id|type=="string")' "$temp/$worker.stage.json" >/dev/null;then
              echo "SABER_STAFF_STAGE_FAILED_$worker HTTP $status"
              jq -c '{errors:[.errors[]?|{code,message}]}' "$temp/$worker.stage.json"
              exit 1
            fi
            id=$(jq -r '.result.id' "$temp/$worker.stage.json")
            printf '%s' "$id" > "$temp/$worker.candidate"
            get "$root/$worker/versions/$id" > "$temp/$worker.version.json"
            jq -e '.success==true' "$temp/$worker.version.json" >/dev/null
            jq -r '.result.resources.bindings[].name' "$temp/$worker.version.json" | sort > "$temp/$worker.stage.names"
            diff "$temp/$worker.names" "$temp/$worker.stage.names"
            echo "SABER_STAFF_STAGE_BINDINGS_INTACT_$worker"
          done
          changed=""
          rollback(){
            code=$?
            trap - ERR
            for worker in $changed;do
              old=$(cat "$temp/$worker.old")
              echo "SABER_STAFF_ROLLBACK_$worker"
              jq -nc --arg old "$old" '{strategy:"percentage",versions:[{version_id:$old,percentage:100}],annotations:{"workers/message":"Rollback privado Central LIVE: verificacion fallida"}}' |
                curl -fsS --max-time 45 -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data-binary @- "$root/$worker/deployments" >/dev/null ||
                echo "SABER_STAFF_ROLLBACK_NOT_CONFIRMED_$worker"
            done
            exit "$code"
          }
          trap rollback ERR
          for worker in saber-pagos-produccion saber-documentos-produccion;do
            id=$(cat "$temp/$worker.candidate")
            jq -nc --arg id "$id" '{strategy:"percentage",versions:[{version_id:$id,percentage:100}],annotations:{"workers/message":"Central privada TUS/R2 y estados sin alterar web publica"}}' |
              curl -fsS --max-time 45 -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data-binary @- "$root/$worker/deployments" > "$temp/$worker.promote.json"
            jq -e '.success==true' "$temp/$worker.promote.json" >/dev/null
            changed="$worker $changed"
          done
          for worker in saber-pagos-produccion saber-documentos-produccion;do
            get "$root/$worker/settings" > "$temp/$worker.after.json"
            jq -cS '.result.bindings|sort_by(.name)' "$temp/$worker.before.json" > "$temp/$worker.before.bindings"
            jq -cS '.result.bindings|sort_by(.name)' "$temp/$worker.after.json" > "$temp/$worker.after.bindings"
            diff "$temp/$worker.before.bindings" "$temp/$worker.after.bindings"
            id=$(cat "$temp/$worker.candidate")
            get "$root/$worker/deployments" > "$temp/$worker.after-deploy.json"
            test "$(jq -er '.result.deployments[0].versions|if length==1 and .[0].percentage==100 then .[0].version_id else empty end' "$temp/$worker.after-deploy.json")" = "$id"
            echo "SABER_STAFF_LIVE_100_PERCENT_BINDINGS_PRESERVED_$worker"
          done
          status=""
          for attempt in 1 2 3 4 5 6 7 8;do
            status=$(curl -sS --max-time 14 -D "$temp/central.headers" -o /dev/null -w '%{http_code}' 'https://pedidos.libreriasaber.com.ar/personal/central')
            test "$status" = 401 && grep -qi '^www-authenticate:' "$temp/central.headers" && break
            sleep 2
          done
          test "$status" = 401
          for path in '/personal/api/live-board' '/personal/api/live-status' '/personal/api/live-forecast' '/personal/api/live-calendar' '/personal/api/live-reconcile' '/personal/paquete' '/personal/transferencias';do
            result=$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' "https://pedidos.libreriasaber.com.ar$path")
            test "$result" = 401 || { echo "SABER_STAFF_PROTECTION_FAILED_$path $result";false; }
          done
          curl -fsS --retry 2 -A 'Mozilla/5.0 (compatible; LibreriaSaberQA/1.0)' --max-time 20 \
            'https://libreriasaber.com.ar/portal-comercial.json?staffqa=1' > "$temp/portal.json"
          jq -e '.enabled==false and .release=="NO_GO" and .buyerUrl==null' "$temp/portal.json" >/dev/null
          echo SABER_STAFF_SITE_ANTERIOR_NO_GO_CONFIRMED
          echo SABER_STAFF_CENTRAL_LIVE_PROTECTED_READY_NO_NEW_ORDERS_NO_CHARGES
          trap - ERR

      - name: Activar sincronización automática de cobros LIVE cada minuto
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ACCOUNT" && test -n "$TOKEN"
          root="https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/workers/scripts/saber-pagos-produccion"
          curl -fsS --max-time 30 -H "Authorization: Bearer $TOKEN" "$root" > /tmp/saber-live-code-check.js
          grep -Fq 'SABER_MP_LIVE_CRON_ACREDITADOS' /tmp/saber-live-code-check.js || { echo 'SABER_DEPLOY_MARKER_34_MISSING'; exit 1; }
          grep -Fq 'central_mp_live_auto_health' /tmp/saber-live-code-check.js || { echo 'SABER_DEPLOY_MARKER_35_MISSING'; exit 1; }
          curl -fsS --max-time 30 -H "Authorization: Bearer $TOKEN" "$root/schedules" > /tmp/saber-live-before-schedules.json
          jq -e '.success==true and (.result.schedules | type=="array") and
            (.result.schedules | length==0 or (length==1 and .[0].cron=="* * * * *"))' /tmp/saber-live-before-schedules.json >/dev/null
          curl -fsS --max-time 35 -X PUT -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary '[{"cron":"* * * * *"}]' \
            "$root/schedules" > /tmp/saber-live-activate-schedules.json
          jq -e '.success==true and (.result.schedules|length==1 and .[0].cron=="* * * * *")' \
            /tmp/saber-live-activate-schedules.json >/dev/null
          curl -fsS --max-time 30 -H "Authorization: Bearer $TOKEN" "$root/schedules" > /tmp/saber-live-verified-schedules.json
          jq -e '.success==true and (.result.schedules|length==1 and .[0].cron=="* * * * *")' \
            /tmp/saber-live-verified-schedules.json >/dev/null
          echo SABER_PAGO_LIVE_AUTO_CADA_MINUTO_HABILITADO

# Último código de entrega LIVE; flags de borrado OFF hasta activación controlada.

# Entregados informa borrado confirmado/pendiente sin revelar Storage.


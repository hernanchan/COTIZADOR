name: Saber - diagnostico rapido Central productiva sin cambios
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths: [.github/workflows/saber-central-operativa-gates-20261112.yml]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    environment: {name: saber-cloudflare-pruebas, deployment: false}
    env:
      ACCOUNT: ${{ secrets.SABER_CF_ACCOUNT_ID }}
      TOKEN: ${{ secrets.SABER_CF_DEPLOY_TOKEN }}
      D1_TOKEN: ${{ secrets.SABER_CF_D1_WRITE_TOKEN }}
    steps:
      - name: Diagnostico de gate del tablero y tablas de estado sin escrituras
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const root='https://api.cloudflare.com/client/v4/accounts/'+process.env.ACCOUNT;
          async function fetchCF(path,token){let r=await fetch(root+path,{headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(15000)});const data=await r.json();if(!r.ok||data.success!==true)throw Error('READ_FAILED_'+r.status);return data.result}
          const central=await fetchCF('/workers/scripts/saber-pagos-produccion/settings',process.env.TOKEN);
          const docs=await fetchCF('/workers/scripts/saber-documentos-produccion/settings',process.env.TOKEN);
          for(const [label,settings,names] of [
           ['CENTRAL',central,['CENTRAL_LIVE_BOARD_GATE','CENTRAL_LIVE_R2_INSPECTION_GATE','CENTRAL_LIVE_BRIDGE_ENABLED','MP_LIVE_GATE']],
           ['DOCS',docs,['DOCS_LIVE_STAFF_GATE','DOCS_LIVE_PACKAGE_GATE','DOCS_MP_LIVE_GATE']]]){
            const bs=settings.bindings||[];for(const name of names){const v=bs.find(x=>x.name===name);console.log('SABER_OPERATIVE_'+label+'_'+name+'='+(v?.type==='plain_text'?v.text:v?'PRESENT':'MISSING'))}
          }
          const dbs=await fetchCF('/d1/database',process.env.D1_TOKEN);
          const prod=dbs.find(x=>x.name==='saber-pagos-produccion');if(!prod?.uuid)throw Error('NO_PROD_D1');
          const response=await fetch(root+'/d1/database/'+prod.uuid+'/query',{method:'POST',headers:{Authorization:'Bearer '+process.env.D1_TOKEN,'Content-Type':'application/json'},body:JSON.stringify({sql:"SELECT name FROM sqlite_master WHERE type='table' AND (name LIKE '%production%' OR name LIKE '%status%' OR name LIKE '%work_order%') ORDER BY name"}),signal:AbortSignal.timeout(15000)});
          const result=await response.json();if(!response.ok||result.success!==true)throw Error('D1_READ_FAILED');
          console.log('SABER_OPERATIVE_PROD_D1_STATE_TABLES='+JSON.stringify(result.result?.[0]?.results?.map(x=>x.name)||[]));
          console.log('SABER_OPERATIVE_DIAG_ONLY_NO_WRITES');
          NODE

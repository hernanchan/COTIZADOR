name: Saber - QA Central personal LIVE antes de desplegar
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths: [.github/workflows/saber-central-operativa-qa-20261112.yml]
permissions: {contents: read}
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Contratos HMAC, lista solo pagados, estados y sintaxis
        run: |
          set -euo pipefail
          (cd integraciones/autocotizador/recepcion && npm install --no-audit --no-fund)
          node --check integraciones/mercadopago/pruebas/central-recepcion-live.mjs
          node --check integraciones/mercadopago/pruebas/central-estado-personal-live.mjs
          node --check integraciones/mercadopago/pruebas/central-live-bridge.mjs
          node --check integraciones/autocotizador/recepcion/estado-personal-live-documentos.mjs
          node --check integraciones/autocotizador/recepcion/pagina-central-personal-live.mjs
          node --check integraciones/autocotizador/recepcion/worker-fase4-cotizador-unificado.mjs
          node --test \
            integraciones/mercadopago/pruebas/central-recepcion-live.test.mjs \
            integraciones/mercadopago/pruebas/central-live-bridge.test.mjs \
            integraciones/mercadopago/pruebas/central-live-hmac-e2e.test.mjs \
            integraciones/autocotizador/recepcion/paquete-live-operador.test.mjs \
            integraciones/autocotizador/recepcion/pagina-cotizar-live.test.mjs \
            integraciones/autocotizador/recepcion/pagina-retorno-live.test.mjs \
            integraciones/autocotizador/recepcion/r2-inspeccion-personal-live.test.mjs \
            integraciones/mercadopago/pruebas/r2-live-inspection-finalize.test.mjs \
            integraciones/autocotizador/recepcion/recepcion-r2-live-cliente.test.mjs \
            integraciones/autocotizador/recepcion/recepcion-tus-live-cliente.test.mjs \
            integraciones/autocotizador/recepcion/zip-universal-stream.test.mjs \
            integraciones/autocotizador/recepcion/pagina-central-personal-live.test.mjs \
            integraciones/mercadopago/pruebas/r2-universal-live-stage-central.test.mjs \
            tests/r2-panel-staff-live-browser.test.mjs \
            integraciones/mercadopago/pruebas/transferencias-live-central.test.mjs \
            integraciones/autocotizador/recepcion/transferencias-personal-live.test.mjs
          echo SABER_CENTRAL_PERSONAL_HMAC_AND_BOTH_TRANSPORTS_QA_OK
      - name: Compilar Central y Documentos completos sin desplegar
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund esbuild@0.25.12
          ./node_modules/.bin/esbuild integraciones/mercadopago/pruebas/worker.js --bundle --platform=browser --format=esm --target=es2022 --outfile=/tmp/saber-pagos-produccion-central.mjs
          node --check /tmp/saber-pagos-produccion-central.mjs
          (cd integraciones/autocotizador/recepcion && npm install --no-audit --no-fund && npm run build:unificado)
          node --check integraciones/autocotizador/recepcion/dist/saber-documentos-cotizador-fase4.mjs
          grep -Fq '/personal/central' integraciones/autocotizador/recepcion/dist/saber-documentos-cotizador-fase4.mjs
          grep -Fq '/personal/api/live-status' integraciones/autocotizador/recepcion/dist/saber-documentos-cotizador-fase4.mjs
          echo SABER_CENTRAL_PERSONAL_TWO_WORKERS_BUILD_OK_NO_CLOUDFLARE_CHANGES

# Revalidacion de sintaxis de rutas central privadas.

# 13/11: QA corregir PDF original mixto -> salida A4, alias visible, aviso no cerrar, inspección sin 112 líneas. No deploy.

# 13/11: regresión exclusión auditada de ensayo 011 para cola LIVE, sin deploy.

# 13/11 QA etapa cierre: porcentaje TUS/R2 real, reintento sin repago, ZIP con instrucciones como condición obligatoria.

# 13/11: UI unificada MP y transferencia, ZIP directo tras hash R2, sin inspección obligatoria previa.
# 13/11: revalidar test VM de pantalla ZIP unificada luego de ajustar la expresión regular.
# 13/11: cierre QA navegador luego de quitar la inspección previa de R2 y simplificar ZIP.
# 13/11: validar sintaxis del bundle ZIP y rutas comerciales tras simplificar pantalla de personal.
# Orden 013: error real de acreditacion bancaria, unicidad de movimiento y polling sin perder campos.

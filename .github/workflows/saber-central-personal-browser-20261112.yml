name: Saber - Central personal Chrome movil y pruebas de estados
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths: [.github/workflows/saber-central-personal-browser-20261112.yml]
permissions: {contents: read}
jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Revisar reglas de autorización, auditoría y entrega bloqueada sin purga
        run: |
          set -euo pipefail
          node --check integraciones/mercadopago/pruebas/central-estado-personal-live.test.mjs
          node --test integraciones/mercadopago/pruebas/central-estado-personal-live.test.mjs
      - name: Chrome real móvil y escritorio con datos simulados, sin API producción
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund playwright@1.56.0
          node integraciones/publicacion/qa-central-personal-live-20261112.mjs

name: Saber Central - confirmar R2 en Nuevos en Worker privado desplegado
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths: [.github/workflows/saber-central-r2-nuevos-smoke-20261109.yml]
permissions:
  contents: read
  statuses: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    environment:
      name: saber-cloudflare-pruebas
      deployment: false
    steps:
      - name: Comprobar HTML real, controles de acceso y pagos OFF sin modificar datos
        shell: bash
        run: |
          set -euo pipefail
          base='https://saber-pagos-pruebas.libreriasaber.workers.dev'
          f=$(mktemp)
          trap 'rm -f "$f"' EXIT
          status=$(curl -sS --max-time 25 -o "$f" -w '%{http_code}' "$base/admin")
          test "$status" = 200
          grep -Fq 'function inlineR2Review(order)' "$f"
          grep -Fq 'Nuevo ploteo R2' "$f"
          grep -Fq 'Revisar preprensa' "$f"
          grep -Fq 'Aprobar preprensa' "$f"
          grep -Fq 'r2_prepress_pending' "$f"
          grep -Fq 'No se puede aprobar todavía: falta el PDF íntegro' "$f"
          echo 'LIVE_CENTRAL_R2_IN_NEW_AND_REVIEW_INLINE_PRESENT'
          code=$(curl -sS --max-time 25 -o /dev/null -w '%{http_code}' "$base/admin/api/orders")
          test "$code" = 401
          code=$(curl -sS --max-time 25 -X POST -H 'Content-Type: application/json' \
            --data '{}' -o /dev/null -w '%{http_code}' "$base/admin/api/central/r2-prepress-approve")
          test "$code" = 401
          health=$(curl -fsS --max-time 25 "$base/health")
          echo "$health" | jq -e '.ok==true and .databaseReady==true and .paymentsEnabled==false' >/dev/null
          echo 'LIVE_CENTRAL_PRIVATE_SECURITY_GUARDS_PAYMENT_OFF'

      - name: Verificar UNA sola entrada en Nuevos tras aprobación D1, sin cambios
        env:
          DEMO_ADMIN_KEY: ${{ secrets.DEMO_ADMIN_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEMO_ADMIN_KEY"
          tmp=$(mktemp)
          trap 'rm -f "$tmp"' EXIT
          code=$(curl -sS --max-time 30 -H "Authorization: Bearer $DEMO_ADMIN_KEY" \
            -o "$tmp" -w '%{http_code}' \
            'https://saber-pagos-pruebas.libreriasaber.workers.dev/admin/api/orders')
          test "$code" = 200 || { echo "CENTRAL_ADMIN_ORDERS_HTTP_$code"; exit 1; }
          jq -e '.orders | type=="array"' "$tmp" >/dev/null
          jq -e --arg id '89608817-95b1-41bc-ac88-579da519d32c' \
            '[.orders[]|select(.id==$id)] | length==1' "$tmp" >/dev/null || \
              { echo 'R2_SANDBOX_ORDER_MISSING_OR_DUPLICATE_IN_BOARD'; exit 1; }
          jq -e --arg id '89608817-95b1-41bc-ac88-579da519d32c' \
            '[.orders[]|select(.id==$id)] | .[0] |
             .amount_ars==4400 and .production_state=="pendiente" and
             (.r2_receipt_id|type=="string") and
             (.work_number!=null) and .web_order_id=="WEB-ENSAYO-72E9F66A8BC34CC9B25D70EF49C1A8D3"' "$tmp" >/dev/null || \
              { echo 'R2_SANDBOX_ORDER_NOT_READY_IN_NEW_LANE';exit 1; }
          echo 'R2_SANDBOX_ONE_ORDER_IN_NUEVOS_WITH_APPROVED_PREPRESS_AND_NUMBER'
          echo 'NO_ORDER_CREATION_NO_D1_WRITE_NO_R2_UPLOAD_NO_PAYMENT'
      - name: Registrar comprobación de Nuevos en GitHub
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RESULT" = success ]; then state=success; else state=failure; fi
          jq -n --arg state "$state" --arg context 'saber/r2-unico-en-nuevos' \
            --arg description "Comprobacion contra Central privada: $RESULT" \
            --arg target_url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}' > /tmp/saber-r2-nuevos-status.json
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" --input /tmp/saber-r2-nuevos-status.json >/dev/null
# cierre 2026-11-10: revalidar sin modificar comercio ni producción

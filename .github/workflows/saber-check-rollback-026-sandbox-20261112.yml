name: Saber - verificar rollback y bindings Central sandbox sin escrituras
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths: [.github/workflows/saber-check-rollback-026-sandbox-20261112.yml]
permissions: {contents: read}
jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: {name: saber-cloudflare-pruebas, deployment: false}
    env:
      ACCOUNT: ${{ secrets.SABER_CF_ACCOUNT_ID }}
      TOKEN: ${{ secrets.SABER_CF_DEPLOY_TOKEN }}
    steps:
      - name: Comprobar seguridad y bindings originales sin cambiar Worker
        shell: bash
        run: |
          set -euo pipefail
          root="https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/workers/scripts/saber-pagos-pruebas"
          curl -fsS --max-time 20 -H "Authorization: Bearer $TOKEN" "$root/settings" > /tmp/current.json
          jq -c '.result.bindings as $b|{
           service:($b|any(.name=="SABER_DOCUMENTOS" and .type=="service" and .service=="saber-documentos-pruebas")),
           service_environment:($b|map(select(.name=="SABER_DOCUMENTOS"))|.[0].environment//null),
           r2:($b|any(.name=="SABER_R2_GRANDES" and .type=="r2_bucket" and .bucket_name=="saber-documentos-grandes-ensayo-20261106")),
           db:($b|any(.name=="DB" and .type=="d1")),
           admin_secret:($b|any(.name=="DEMO_ADMIN_KEY" and .type=="secret_text")),
           payment_secret:($b|any(.name=="MP_TEST_ACCESS_TOKEN" and .type=="secret_text")),
           total_bindings:($b|length)}' /tmp/current.json
          curl -fsS --max-time 20 -H "Authorization: Bearer $TOKEN" "$root/deployments" > /tmp/deploy.json
          jq -c '.result.deployments[0]|{versions:.versions}' /tmp/deploy.json
          curl -fsS --max-time 20 https://saber-pagos-pruebas.libreriasaber.workers.dev/health |jq -c '{ok,databaseReady,paymentsEnabled}'
          echo SABER_026_ROLLBACK_READONLY_NO_CHARGES

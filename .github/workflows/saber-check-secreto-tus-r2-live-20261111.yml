name: Saber - comprobar secreto Supabase y R2 sin exponer claves
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths: [.github/workflows/saber-check-secreto-tus-r2-live-20261111.yml]
permissions: {contents: read, statuses: write}
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: {name: saber-cloudflare-pruebas, deployment: false}
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verificar secreto de Supabase privado sin leer valor
        env:
          ACCOUNT: ${{ secrets.SABER_CF_ACCOUNT_ID }}
          TOKEN: ${{ secrets.SABER_CF_DEPLOY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const account=process.env.ACCOUNT,token=process.env.TOKEN;
          assert.match(account||'',/^[a-f0-9]{32}$/i);assert.ok(token?.length>15);
          const path='https://api.cloudflare.com/client/v4/accounts/'+account+
           '/workers/scripts/saber-documentos-produccion';
          const req=async suffix=>{
           const res=await fetch(path+suffix,{headers:{Authorization:'Bearer '+token},
             signal:AbortSignal.timeout(30000)});
           const o=await res.json();
           assert.equal(o?.success,true,'CLOUDFLARE_READ_DENIED_'+res.status);
           return o.result;
          };
          const s=await req('/settings');
          const b=s.bindings||[];
          function has(name,type,txt){
           return b.some(x=>x.name===name&&x.type===type&&(txt===undefined||x.text===txt));
          }
          assert.ok(has('SABER_ENTORNO','plain_text','preparacion'));
          assert.ok(has('DOCS_MP_LIVE_GATE','plain_text','NO_GO'));
          assert.ok(has('DOCS_LIVE_TUS_SERVICE_KEY','secret_text'),
            'OWNER_SUPABASE_SERVICE_KEY_NOT_SAVED_AS_SECRET');
          assert.ok(has('DOCS_LIVE_TUS_RECEIPT_KEY','secret_text'));
          assert.ok(has('DOCS_LIVE_SESSION_KEY','secret_text'));
          assert.ok(has('DOCS_LIVE_TUS_BUCKET','plain_text','saber-tus-produccion'));
          assert.ok(has('SABER_R2_GRANDES_LIVE','r2_bucket'));
          assert.ok(has('DOCS_LIVE_R2_RECEIPT_KEY','secret_text'));
          const sub=await req('/subdomain');
          assert.equal(sub.enabled,false);assert.equal(sub.previews_enabled,false);
          const turnstileKey=b.find(x=>x.name==='DOCS_LIVE_TURNSTILE_SITE_KEY');
          const turnstileSecret=b.find(x=>x.name==='DOCS_LIVE_TURNSTILE_SECRET');
          console.log('SABER_TUS_LIVE_SERVICE_KEY_STORED_AS_SECRET=true');
          console.log('SABER_TUS_LIVE_PRIVATE_BUCKET_CONFIGURATION=true');
          console.log('SABER_R2_LIVE_BUCKET_LINKED=true');
          console.log('SABER_TURNSTILE_SITE_KEY_PRESENT='+Boolean(turnstileKey));
          console.log('SABER_TURNSTILE_SECRET_PRESENT='+Boolean(turnstileSecret));
          console.log('SABER_PAYMENTS_GATE_CLOSED=true');
          console.log('SABER_NO_SECRETS_PRINTED_NO_CONFIG_CHANGES');
          NODE
      - name: Registrar resultado
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        shell: bash
        run: |
          if [ "$RESULT" = success ];then state=success;else state=failure;fi
          jq -n --arg state "$state" --arg context 'saber/secret-tus-live-confirmed' \
           --arg description "Supabase TUS secret and R2 NO_GO verified: $RESULT" \
           --arg target_url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
           '{state:$state,context:$context,description:$description,target_url:$target_url}' >/tmp/secret-verify.json
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" --input /tmp/secret-verify.json >/dev/null

name: Saber - verificar secreto operador LIVE sin exponerlo
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths: [.github/workflows/saber-check-staff-secret-live-20261111.yml]
permissions: {contents: read, statuses: write}
jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: {name: saber-cloudflare-pruebas, deployment: false}
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Inspeccionar SOLO existencia, tipo y gates LIVE
        shell: bash
        env:
          ACCOUNT: ${{ secrets.SABER_CF_ACCOUNT_ID }}
          TOKEN: ${{ secrets.SABER_CF_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          assert.match(process.env.ACCOUNT||'',/^[a-f0-9]{32}$/i);
          const root='https://api.cloudflare.com/client/v4/accounts/'+process.env.ACCOUNT+'/workers/scripts/';
          async function settings(worker){
            const r=await fetch(root+worker+'/settings',{headers:{Authorization:'Bearer '+process.env.TOKEN},
             signal:AbortSignal.timeout(20000)});
            const x=await r.json().catch(()=>null);
            assert.ok(r.ok&&x?.success,'CF_READ_FAILED_'+worker);return x.result.bindings;
          }
          const d=await settings('saber-documentos-produccion');
          const c=await settings('saber-pagos-produccion');
          const w=await settings('saber-webhook-produccion');
          const has=(b,n,t,v)=>b.some(x=>x.name===n&&x.type===t&&(v===undefined||x.text===v));
          const staff=has(d,'DOCS_LIVE_STAFF_SECRET','secret_text');
          console.log('STAFF_LIVE_SECRET_PRESENT='+staff);
          console.log('STAFF_LIVE_GATE_CLOSED='+has(d,'DOCS_LIVE_STAFF_GATE','plain_text','NO_GO'));
          console.log('PACKAGE_LIVE_GATE_CLOSED='+has(d,'DOCS_LIVE_PACKAGE_GATE','plain_text','NO_GO'));
          console.log('PACKAGE_CENTRAL_GATE_CLOSED='+has(c,'CENTRAL_LIVE_PACKAGE_GATE','plain_text','NO_GO'));
          console.log('ORDER_LIVE_GATE_CLOSED='+has(d,'DOCS_LIVE_ORDER_GATE','plain_text','NO_GO'));
          console.log('MP_WEBHOOK_CLOSED='+has(w,'WEBHOOK_EDGE_GATE','plain_text','NO_GO'));
          console.log('REAL_ORDERS_OR_CHARGES_PRODUCED=false');
          assert.ok(has(d,'DOCS_LIVE_STAFF_GATE','plain_text','NO_GO'));
          assert.ok(has(d,'DOCS_LIVE_PACKAGE_GATE','plain_text','NO_GO'));
          assert.ok(has(c,'CENTRAL_LIVE_PACKAGE_GATE','plain_text','NO_GO'));
          assert.ok(has(d,'DOCS_LIVE_ORDER_GATE','plain_text','NO_GO'));
          assert.ok(has(w,'WEBHOOK_EDGE_GATE','plain_text','NO_GO'));
          assert.ok(staff,'STAFF_LIVE_SECRET_NOT_FOUND');
          NODE
      - name: Registrar resultado
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          if [ "$RESULT" = success ];then state=success;else state=failure;fi
          jq -n --arg state "$state" --arg context 'saber/live-staff-secret-ready' \
            --arg description "Worker operator secret present as secret: $RESULT" \
            --arg target_url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}' >/tmp/secret-status.json
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" --input /tmp/secret-status.json >/dev/null

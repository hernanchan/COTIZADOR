name: Saber cierre comercial - catálogo vivo y carrito de prueba sólo lectura
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths: [.github/workflows/saber-cierre-comercial-lectura-privada-20261109.yml]
permissions:
  contents: read
jobs:
  storefront:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar tienda real en Worker, sin pedidos ni pago
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const origin='https://saber-documentos-pruebas.libreriasaber.workers.dev';
          const central='https://saber-pagos-pruebas.libreriasaber.workers.dev';
          async function get(path){
           const r=await fetch(origin+path,{redirect:'manual',signal:AbortSignal.timeout(22000)});
           return {status:r.status,headers:r.headers,body:await r.text()};
          }
          const health=await fetch(central+'/health',{signal:AbortSignal.timeout(18000)}).then(r=>r.json());
          if(health.ok!==true||health.databaseReady!==true||health.paymentsEnabled!==false)
           throw Error('BLOCKER_CENTRAL_PAYMENTS_OR_DB');
          console.log('CENTRAL_DB_READY_REAL_PAYMENTS_OFF');
          const [home,offers,catalog,price,privateDocs]=await Promise.all([
           get('/prueba-v2/diseno-sin-clave'),
           get('/prueba-v2/diseno-sin-clave/ofertas.html'),
           get('/prueba-v2/diseno-sin-clave/catalogo.json'),
           get('/prueba-v2/diseno-sin-clave/ofertas.html?categoria=Escolar'),
           get('/prueba-v2/')
          ]);
          if(home.status!==200||offers.status!==200||price.status!==200)
           throw Error('BLOCKER_PREVIEW_HOME_OFFERS');
          if(privateDocs.status!==401)throw Error('BLOCKER_PRIVATE_DOCUMENTS_GUARD_'+privateDocs.status);
          for(const x of [home,offers,price]){
           if(!/noindex/i.test(x.headers.get('x-robots-tag')||''))
            throw Error('BLOCKER_PREVIEW_INDEXABLE');
           if(!x.body.includes('data-demo-drawer')||!x.body.includes('Agregar al carrito')||
              !x.body.includes('Preparar pedido para WhatsApp')||
              !x.body.includes('diseno-sin-clave/catalogo.json')||
              !x.body.includes('https://wa.me/5493513110130'))
             throw Error('BLOCKER_CART_OR_WHATSAPP_MISSING');
           if(x.body.includes('href="https://wa.me/'))
             throw Error('BLOCKER_UNVALIDATED_WHATSAPP_LINK');
          }
          console.log('PREVIEW_HTML_200_CART_PRESENT_NO_DIRECT_MESSAGE_DOCS_401');
          if(catalog.status!==200)throw Error('BLOCKER_CSV_GOOGLE_FETCH_HTTP_'+catalog.status);
          const data=JSON.parse(catalog.body);
          if(data.ok!==true||!Array.isArray(data.products)||data.products.length<1||
             data.products.length>500||data.ordersEnabled!==false||
             data.paymentsEnabled!==false||data.source!=='Google Sheets publicado')
            throw Error('BLOCKER_LIVE_SHEETS_CATALOG');
          let offersFound=0;
          for(const p of data.products){
           if(!/^[a-z0-9_-]{1,48}$/i.test(p.code)||
              !Number.isSafeInteger(p.finalPrice)||p.finalPrice<1||
              !Number.isSafeInteger(p.price)||p.price<1||
              p.finalPrice>p.price)
             throw Error('BLOCKER_INVALID_LIVE_PRODUCT');
           if(p.offer!==null){
            if(!Number.isSafeInteger(p.offer)||p.offer>=p.price||
               p.finalPrice!==p.offer)throw Error('BLOCKER_FALSE_OFFER');
            offersFound++;
           }
          }
          console.log('CATALOG_LIVE_SHEETS_PRODUCTS='+data.products.length+' VALID_DISCOUNTS='+offersFound);
          const photo=data.products.find(p=>p.photo)?.photo;
          if(photo){
           const u=new URL(photo);
           if(u.protocol!=='https:'||u.hostname!=='drive.google.com'||
              u.pathname!=='/thumbnail')throw Error('BLOCKER_IMAGE_UNTRUSTED');
           const response=await fetch(photo,{redirect:'follow',signal:AbortSignal.timeout(30000)});
           console.log('FIRST_PUBLIC_PRODUCT_IMAGE_STATUS='+response.status+
            ' MIME='+String(response.headers.get('content-type')||'').split(';')[0]);
           if(!response.ok||!/^image\//i.test(response.headers.get('content-type')||''))
            throw Error('BLOCKER_CATALOG_IMAGE_UNAVAILABLE');
           await response.body?.cancel();
          }else console.log('BLOCKER_NO_PRODUCT_PHOTOS_IN_LIVE_CATALOG');
          console.log('COMMERCE_READ_ONLY_PASS_NO_ORDER_NO_PAYMENT_NO_R2_OPERATIONS');
          NODE

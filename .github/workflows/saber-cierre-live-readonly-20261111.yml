name: Saber - única comprobación de lanzamiento TUS LIVE, precios y dominio (lectura)
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths: [.github/workflows/saber-cierre-live-readonly-20261111.yml]
permissions: {contents: read}
jobs:
  cierre:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    environment: {name: saber-cloudflare-pruebas, deployment: false}
    steps:
      - name: Comprobar solo producción D1 y rutas de compra, sin crear pedido ni cobro
        env:
          CF_ACCOUNT: ${{ secrets.SABER_CF_ACCOUNT_ID }}
          CF_DEPLOY_TOKEN: ${{ secrets.SABER_CF_DEPLOY_TOKEN }}
          CF_D1_TOKEN: ${{ secrets.SABER_CF_D1_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const account=process.env.CF_ACCOUNT;
          assert.match(account||'',/^[a-f0-9]{32}$/);
          const root='https://api.cloudflare.com/client/v4/accounts/'+account;
          async function cf(path,token,opts={}){
            const r=await fetch(root+path,{...opts,headers:{
             Authorization:'Bearer '+token,...opts.headers},
             signal:AbortSignal.timeout(22000)});
            const j=await r.json().catch(()=>null);
            assert.ok(r.ok&&j?.success===true,'CF_READ_HTTP_'+r.status+'_'+path.split('/').at(-1));
            return j.result;
          }
          const databases=await cf('/d1/database',process.env.CF_D1_TOKEN);
          const live=databases.find(d=>d.name==='saber-pagos-produccion');
          const lab=databases.find(d=>d.name==='saber-pagos-pruebas');
          assert.ok(live&&lab&&live.uuid!==lab.uuid,'D1_PRODUCCION_SEPARADA');
          async function sql(q){
           const d=await cf('/d1/database/'+live.uuid+'/query',process.env.CF_D1_TOKEN,{
            method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({sql:q})});
           assert.equal(d?.[0]?.success,true);return d[0].results||[];
          }
          const prices=(await sql("SELECT revision,approved_revision,length(approved_json) AS bytes FROM central_pricing_admin_head WHERE id=1"))[0];
          console.log('LIVE_PRICING='+JSON.stringify({approvedRevision:prices?.approved_revision||0,snapshotBytes:prices?.bytes||0}));
          assert.ok(prices?.approved_revision>0&&prices.bytes>1000,'PRICE_NOT_APPROVED');
          const orders=await sql("SELECT status,COUNT(*) AS n FROM orders GROUP BY status");
          console.log('LIVE_D1_ORDERS='+JSON.stringify(orders));
          const gateFields={
            'saber-documentos-produccion':['SABER_ENTORNO','DOCS_MP_LIVE_GATE','DOCS_LIVE_UI_GATE',
             'DOCS_LIVE_SESSION_GATE','DOCS_LIVE_RECEPCION_GATE','DOCS_LIVE_PRICING_GATE',
             'DOCS_LIVE_ORDER_GATE','DOCS_LIVE_TUS_GATE','DOCS_LIVE_R2_GATE'],
            'saber-pagos-produccion':['SABER_ENTORNO','MP_LIVE_GATE','CENTRAL_LIVE_ORDER_GATE',
             'CENTRAL_LIVE_TUS_GATE','CENTRAL_LIVE_POSTPAY_GATE','CENTRAL_LIVE_R2_GATE']
          };
          for(const [worker,names] of Object.entries(gateFields)){
           const s=await cf('/workers/scripts/'+worker+'/settings',process.env.CF_DEPLOY_TOKEN);
           const fields=Object.fromEntries(names.map(n=>{
            const b=s.bindings?.find(x=>x.name===n);
            return [n,b?.type==='plain_text'?b.text:'MISSING'];
           }));
           const required=names.filter(n=>!n.endsWith('R2_GATE')&&n!=='SABER_ENTORNO');
           console.log('LIVE_WORKER_'+worker+'='+JSON.stringify({
            gatesGO:required.every(n=>fields[n]==='GO_COMERCIAL_CONFIRMADO'),
            r2:fields[names.at(-1)],hostProd:fields.SABER_ENTORNO==='produccion',
            storageKeysPresent:worker.startsWith('saber-documentos')?
             ['DOCS_LIVE_TUS_PROJECT_URL','DOCS_LIVE_TUS_BUCKET','DOCS_LIVE_TUS_SERVICE_KEY',
              'DOCS_LIVE_TUS_RECEIPT_KEY'].every(n=>s.bindings.some(b=>b.name===n)):
              ['MP_LIVE_ACCESS_TOKEN','MP_LIVE_WEBHOOK_SECRET'].every(n=>s.bindings.some(b=>b.name===n))
           }));
           assert.equal(fields.SABER_ENTORNO,'produccion');
           assert.equal(required.every(n=>fields[n]==='GO_COMERCIAL_CONFIRMADO'),true,'CRITICAL_GATE_NOT_GO_'+worker);
          }
          async function probe(url){
           try{
            const r=await fetch(url,{redirect:'manual',signal:AbortSignal.timeout(17000)});
            const html=(await r.text()).slice(0,170000);
            return {status:r.status,url:r.url,
              v3:html.includes('Cotizá tu impresión.'),
              login:html.includes('Verificá el acceso para continuar.'),
              title:(html.match(/<title>([^<]+)/)||[])[1]||'',
              protection:r.headers.get('x-robots-tag')||''};
           }catch(e){return {status:0,networkError:String(e?.cause?.code||e?.message).slice(0,80)}}
          }
          const homepage=await probe('https://libreriasaber.com.ar/');
          const checkout=await probe('https://pedidos.libreriasaber.com.ar/cotizar');
          const staff=await probe('https://pagos.libreriasaber.com.ar/admin/api/orders');
          const noAuthAssets=await probe('https://pedidos.libreriasaber.com.ar/cotizar/archivos');
          console.log('LIVE_DOMAIN_HOME='+JSON.stringify(homepage));
          console.log('LIVE_DOMAIN_BUYER='+JSON.stringify(checkout));
          console.log('LIVE_DOMAIN_CENTRAL_UNAUTH='+JSON.stringify(staff));
          console.log('LIVE_DOMAIN_PRIVATE_ASSET_UNAUTH='+JSON.stringify(noAuthAssets));
          if(homepage.status!==200||!homepage.v3)
           throw Error('BLOCKER_PUBLIC_V3_NOT_AT_DOMAIN');
          if(checkout.status!==200||!checkout.login)
           throw Error('BLOCKER_LIVE_BUYER_UNAVAILABLE');
          if(![401,403,404].includes(staff.status))
           throw Error('BLOCKER_STAFF_PRIVATE_ACCESS');
          if(![401,403,404,503].includes(noAuthAssets.status))
           throw Error('BLOCKER_BUYER_ASSET_EXPOSED');
          console.log('SABER_MINIMAL_LIVE_TUS_GATE_READY_READONLY_NO_PAYMENTS_NO_ORDERS');
          NODE

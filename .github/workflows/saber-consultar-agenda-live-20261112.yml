name: Saber - Leer agenda histórica Central LIVE sin modificar datos
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths: [.github/workflows/saber-consultar-agenda-live-20261112.yml]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    environment: {name: saber-cloudflare-pruebas, deployment: false}
    env:
      ACCOUNT: ${{ secrets.SABER_CF_ACCOUNT_ID }}
      D1_TOKEN: ${{ secrets.SABER_CF_D1_WRITE_TOKEN }}
    steps:
      - name: Consultar solamente el calendario existente
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const root='https://api.cloudflare.com/client/v4/accounts/'+process.env.ACCOUNT+'/d1/database';
          const headers={Authorization:'Bearer '+process.env.D1_TOKEN,'Content-Type':'application/json'};
          async function get(url,opt={}){const response=await fetch(url,{...opt,headers,signal:AbortSignal.timeout(15000)});const obj=await response.json();if(!response.ok||obj.success!==true)throw Error('READ_FAILED_'+response.status);return obj.result}
          const inventory=await get(root),target=inventory.find(x=>x.name==='saber-pagos-produccion');
          if(!target)throw Error('NO_PRODUCTION_D1');
          async function sql(query){const result=await get(root+'/'+target.uuid+'/query',{method:'POST',body:JSON.stringify({sql:query})});if(!result?.[0]?.success)throw Error('QUERY_FAILED');return result[0].results||[]}
          const tables=await sql("SELECT name FROM sqlite_master WHERE type='table' AND name IN ('central_eta_calendar','central_eta_calendar_events')");
          console.log('SABER_EXISTING_CALENDAR_TABLES='+JSON.stringify(tables.map(x=>x.name)));
          if(tables.some(t=>t.name==='central_eta_calendar')){
            const rows=await sql("SELECT weekly_json,closed_json,revision,operator,updated_at FROM central_eta_calendar WHERE id=1");
            console.log('SABER_EXISTING_CALENDAR_SNAPSHOT='+JSON.stringify(rows));
          } else console.log('SABER_EXISTING_CALENDAR_UNCONFIGURED');
          console.log('SABER_READ_ONLY_NO_ORDERS_NO_PAYMENTS');
          NODE

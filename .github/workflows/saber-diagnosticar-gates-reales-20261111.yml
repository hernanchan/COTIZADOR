name: Saber - diagnosticar gates efectivos LIVE sin modificar
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths: [.github/workflows/saber-diagnosticar-gates-reales-20261111.yml]
permissions: {contents: read, statuses: write}
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: {name: saber-cloudflare-pruebas, deployment: false}
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Leer variables comerciales y despliegues sin secretos
        env:
          ACCOUNT: ${{ secrets.SABER_CF_ACCOUNT_ID }}
          TOKEN: ${{ secrets.SABER_CF_DEPLOY_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const account=process.env.ACCOUNT,token=process.env.TOKEN;
          assert.match(account||'',/^[a-f0-9]{32}$/i);assert.ok(token?.length>15);
          const root='https://api.cloudflare.com/client/v4/accounts/'+account+'/workers/scripts';
          async function req(path){
           const r=await fetch(root+path,{headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(25000)});
           const obj=await r.json().catch(()=>null);
           if(!obj?.success)return null;return obj.result;
          }
          for(const name of ['saber-pagos-produccion','saber-documentos-produccion','saber-webhook-produccion']){
            const s=await req('/'+name+'/settings');assert.ok(s?.bindings);
            const allowed=s.bindings.filter(x=>x.type==='plain_text'&&
             (x.name==='SABER_ENTORNO'||x.name==='MP_LIVE_GATE'||
              x.name==='DOCS_MP_LIVE_GATE'||x.name==='WEBHOOK_EDGE_GATE'||
              x.name==='CENTRAL_LIVE_BRIDGE_ENABLED'||x.name==='CENTRAL_LIVE_PRICING_GATE'||
              x.name==='DOCS_LIVE_UI_GATE'||x.name==='DOCS_LIVE_SESSION_GATE'||
              x.name==='DOCS_LIVE_PRICING_GATE'||x.name==='DOCS_LIVE_ORDER_GATE'||
              x.name==='CENTRAL_LIVE_ORDER_GATE'))
             .map(x=>({name:x.name,text:x.text}));
            console.log('GATE_WORKER='+name+' '+JSON.stringify(allowed));
            console.log('GATE_R2_BOUND='+name+' '+s.bindings.some(x=>x.name==='SABER_R2_GRANDES_LIVE'&&x.type==='r2_bucket'));
            if(name==='saber-documentos-produccion') console.log('GATE_LIVE_STAFF_SECRET_EXISTS='+s.bindings.some(x=>x.name==='DOCS_LIVE_STAFF_SECRET'&&x.type==='secret_text'));
            if(name==='saber-pagos-produccion') console.log('GATE_CENTRAL_LIVE_PACKAGE='+JSON.stringify(s.bindings.filter(x=>x.name==='CENTRAL_LIVE_PACKAGE_GATE').map(x=>x.text)));
            const d=await req('/'+name+'/deployments');
            console.log('GATE_ACTIVE_DEPLOYMENT='+name+' '+JSON.stringify(
             (d?.deployments||[]).slice(0,2).map(x=>({id:x.id,versions:x.versions?.map(v=>({id:v.version_id,percentage:v.percentage}))}))));
          }
          const page=await fetch('https://pedidos.libreriasaber.com.ar/cotizar',{redirect:'manual',signal:AbortSignal.timeout(16000)});
          console.log('GATE_BUYER_GET_HTTP='+page.status);
          console.log('GATE_DIAGNOSTIC_READONLY_NO_CHARGES');
          NODE

name: Saber - identificar modulos Worker LIVE sin modificar
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths: ['.github/workflows/saber-diagnosticar-paquete-worker-20261113.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: {name: saber-cloudflare-pruebas, deployment: false}
    env:
      ACCOUNT: ${{ secrets.SABER_CF_ACCOUNT_ID }}
      TOKEN: ${{ secrets.SABER_CF_DEPLOY_TOKEN }}
    steps:
      - name: Leer tipo de contenido y lista de módulos (sin exponer código)
        run: |
          set -euo pipefail
          curl -fsS --max-time 45 -D /tmp/worker-headers \
            -H "Authorization: Bearer $TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/workers/scripts/saber-documentos-produccion" \
            -o /tmp/worker-body
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const h=fs.readFileSync('/tmp/worker-headers','utf8');
          const s=fs.readFileSync('/tmp/worker-body','utf8');
          const LF=String.fromCharCode(10),CR=String.fromCharCode(13);
          console.log('HTTP_CONTENT_TYPE',h.split(LF).find(x=>x.toLowerCase().startsWith('content-type:'))?.trim());
          const first=s.split(LF)[0].trim();
          console.log('BOUNDARY_LENGTH',first.length,'BODY_BYTES',s.length);
          const chunks=s.split(first);
          console.log('NUMBER_PARTS',chunks.length-2);
          chunks.slice(1,10).forEach((part,i)=>{
            const sep=part.indexOf(CR+LF+CR+LF);
            const head=sep>=0?part.slice(0,sep):part.slice(0,200);
            console.log('PART_HEADER',i,JSON.stringify(head.slice(0,260)));
          });
          const oldA=String.raw`<header><strong>Librer\xEDa Saber</strong></header>`;
          const oldB=String.raw`<header><strong>Librer\xEDa Saber \xB7 Impresiones y ploteos</strong></header>`;
          const newA='href="https://libreriasaber.com.ar/" style="display:inline-flex;align-items:center;min-height:44px';
          for(const [name,value] of [['OLD_GATE',oldA],['OLD_BUYER',oldB],['NEW_ANCHOR',newA]]){
            console.log('SABER_LIVE_UI',name,s.split(value).length-1);
          }
          const response=await fetch('https://pedidos.libreriasaber.com.ar/cotizar?audit_regreso=1',{redirect:'manual'});
          const html=await response.text();
          console.log('SABER_PUBLIC_UI_HTTP',response.status,'RETURN_BUTTON',html.includes('← Volver a la tienda'),'LINK',html.includes('href="https://libreriasaber.com.ar/"'));
          NODE

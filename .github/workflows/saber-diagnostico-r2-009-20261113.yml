name: Saber - diagnostico lectura R2 orden 009
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths: [.github/workflows/saber-diagnostico-r2-009-20261113.yml]
permissions: {contents: write}
jobs:
  read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    environment: {name: saber-cloudflare-pruebas, deployment: false}
    env:
      ACCOUNT: ${{ secrets.SABER_CF_ACCOUNT_ID }}
      D1TOKEN: ${{ secrets.SABER_CF_D1_WRITE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Consultar estado privado D1 sin revelar cliente ni ID de orden
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import {mkdir,writeFile} from 'node:fs/promises';
          const out={checkedAt:new Date().toISOString(),workNumber:9,readOnly:true};
          const url='https://api.cloudflare.com/client/v4/accounts/'+process.env.ACCOUNT;
          const call=async(path,opts={})=>{
           const r=await fetch(url+path,{...opts,headers:{
            Authorization:'Bearer '+process.env.D1TOKEN,...opts.headers
           },signal:AbortSignal.timeout(20000)});
           const j=await r.json().catch(()=>null);
           if(!r.ok||j?.success!==true)throw Error('CF_HTTP_'+r.status);
           return j.result;
          };
          try{
           const dbs=await call('/d1/database');
           const db=dbs.find(x=>x.name==='saber-pagos-produccion');
           if(!db?.uuid)throw Error('PRODUCTION_D1_MISSING');
           const sql=[
            'SELECT n.number AS work_number,o.status AS payment_state,',
            'f.ordinal AS file_position,f.transport,f.received AS received,',
            'CASE WHEN p.receipt_id IS NOT NULL THEN 1 ELSE 0 END AS stage_exists,',
            'p.status AS stage_status,q.state AS reservation_state,',
            'CASE WHEN i.receipt_id IS NOT NULL THEN 1 ELSE 0 END AS inspection_exists',
            'FROM central_work_order_numbers n JOIN orders o ON o.id=n.commercial_order_id',
            'JOIN central_r2_universal_order_links l ON l.commercial_order_id=o.id',
            'JOIN central_r2_universal_files f ON f.web_order_id=l.web_order_id',
            'LEFT JOIN central_r2_large_pending p ON p.web_order_id=f.web_order_id',
            'AND p.file_id=f.file_id AND p.sha256=f.sha256 AND p.bytes=f.bytes',
            'LEFT JOIN central_r2_large_reservations q ON q.web_order_id=f.web_order_id',
            'AND q.file_id=f.file_id AND q.sha256=f.sha256 AND q.bytes=f.bytes',
            'LEFT JOIN central_r2_live_inspections i ON i.web_order_id=f.web_order_id',
            'AND i.file_id=f.file_id',
            'WHERE n.number=9 ORDER BY f.ordinal'
           ].join(' ');
           const q=await call('/d1/database/'+db.uuid+'/query',{
            method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sql})
           });
           if(!q?.[0]?.success)throw Error('D1_QUERY_REJECTED');
           out.files=q[0].results||[];
           out.found=out.files.length>0;
          }catch(e){out.error=String(e.message||e).slice(0,65)}
          await mkdir('docs',{recursive:true});
          await writeFile('docs/ESTADO-R2-ORDEN-009.json',JSON.stringify(out,null,2)+'\n');
          console.log('SABER_R2_009='+JSON.stringify(out));
          EOF
      - name: Guardar estado sin datos personales ni identificadores internos
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/ESTADO-R2-ORDEN-009.json || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ESTADO-R2-ORDEN-009.json
          if git diff --cached --quiet;then exit 0;fi
          git commit -m "ops: estado R2 anonimo de orden 009, lectura D1"
          for attempt in 1 2 3 4;do
            git fetch origin integracion/tus-pedido-privado-20261101
            git rebase origin/integracion/tus-pedido-privado-20261101
            git push origin HEAD:integracion/tus-pedido-privado-20261101 && exit 0
            sleep 2
          done
          exit 1

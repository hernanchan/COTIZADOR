name: Saber - diagnostico solo lectura orden 011 inspeccion R2
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths: [.github/workflows/saber-diagnostico-r2-011-20261113.yml]
permissions: {contents: read}
jobs:
  diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: {name: saber-cloudflare-pruebas, deployment: false}
    env:
      ACCOUNT: ${{ secrets.SABER_CF_ACCOUNT_ID }}
      D1TOKEN: ${{ secrets.SABER_CF_D1_WRITE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verificar condiciones D1 en orden 011 sin datos del comprador ni escrituras
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          const base='https://api.cloudflare.com/client/v4/accounts/'+process.env.ACCOUNT;
          async function cloudflare(path,body){
            const r=await fetch(base+path,{method:body?'POST':'GET',
              headers:{Authorization:'Bearer '+process.env.D1TOKEN,
                ...(body?{'Content-Type':'application/json'}:{})},
              ...(body?{body:JSON.stringify(body)}:{}),
              signal:AbortSignal.timeout(30000)});
            const j=await r.json().catch(()=>null);
            if(!r.ok||j?.success!==true)throw Error('CLOUDFLARE_HTTP_'+r.status);
            return j.result;
          }
          const dbs=await cloudflare('/d1/database');
          const db=dbs.find(x=>x.name==='saber-pagos-produccion');
          if(!db?.uuid)throw Error('D1_PRODUCCION_NO_ENCONTRADA');
          const sql=[
            'SELECT n.number AS orden, f.ordinal AS archivo, f.transport AS transporte,',
            'o.status AS estado_pago,',
            'CASE WHEN o.paid_at IS NOT NULL THEN 1 ELSE 0 END AS fecha_pago,',
            'CASE WHEN o.amount_ars=o.deposit_ars THEN 1 ELSE 0 END AS pago_total,',
            "CASE WHEN EXISTS(SELECT 1 FROM payment_reviews pr WHERE pr.order_id=o.id AND pr.state='verified') THEN 1 ELSE 0 END AS revision_verificada,",
            'CASE WHEN o.payment_id IS NOT NULL AND o.preference_id IS NOT NULL THEN 1 ELSE 0 END AS mp_identificado,',
            "CASE WHEN o.payment_id IS NULL AND o.preference_id IS NULL AND EXISTS (SELECT 1 FROM central_live_bank_accreditations b WHERE b.order_id=o.id AND b.amount_ars=o.amount_ars AND length(b.bank_reference)>=6 AND length(b.operator)>=2) THEN 1 ELSE 0 END AS transferencia_auditada,",
            'f.received AS recibido,',
            'CASE WHEN p.receipt_id IS NOT NULL THEN 1 ELSE 0 END AS r2_en_stage,',
            'p.status AS estado_stage, q.state AS estado_reserva,',
            'CASE WHEN i.receipt_id IS NOT NULL THEN 1 ELSE 0 END AS inspeccion_guardada',
            'FROM central_work_order_numbers n',
            'JOIN orders o ON o.id=n.commercial_order_id',
            'JOIN central_r2_universal_order_links l ON l.commercial_order_id=o.id',
            'JOIN central_r2_universal_files f ON f.web_order_id=l.web_order_id',
            'LEFT JOIN central_r2_large_pending p ON p.web_order_id=f.web_order_id AND p.file_id=f.file_id',
            'LEFT JOIN central_r2_large_reservations q ON q.web_order_id=f.web_order_id AND q.file_id=f.file_id',
            'LEFT JOIN central_r2_live_inspections i ON i.web_order_id=f.web_order_id AND i.file_id=f.file_id',
            'WHERE n.number=11 ORDER BY f.ordinal'
          ].join(' ');
          const data=await cloudflare('/d1/database/'+db.uuid+'/query',{sql});
          if(data?.[0]?.success!==true)throw Error('D1_SOLO_LECTURA_FALLO');
          const rows=data[0].results||[];
          console.log('SABER_R2_011_SOLO_ESTADOS='+JSON.stringify({found:rows.length>0,rows}));
          const structure=await cloudflare('/d1/database/'+db.uuid+'/query',{
            sql:"SELECT name,type FROM pragma_table_info('central_r2_live_inspections') ORDER BY cid"
          });
          console.log('SABER_R2_011_TABLA_INSPECCION_COLUMNAS='+JSON.stringify(
            (structure?.[0]?.results||[]).map(x=>x.name)));
          const quote=await cloudflare('/d1/database/'+db.uuid+'/query',{
            sql:[
              'SELECT n.number AS orden,',
              "json_array_length(json_extract(f.work_json,'$.configuracion.paginas')) AS paginas,",
              "json_extract(f.work_json,'$.configuracion.paginas[0].anchoCm') AS ancho_primera,",
              "json_extract(f.work_json,'$.configuracion.paginas[0].altoCm') AS alto_primera,",
              "(SELECT count(*) FROM json_each(json_extract(f.work_json,'$.configuracion.paginas')) p WHERE",
              "abs(CAST(json_extract(p.value,'$.anchoCm') AS REAL)-21.0)>0.1 OR",
              "abs(CAST(json_extract(p.value,'$.altoCm') AS REAL)-29.7)>0.1) AS paginas_fuera_tolerancia,",
              "CASE WHEN EXISTS (SELECT 1 FROM central_r2_universal_order_links l JOIN orders o ON o.id=l.commercial_order_id",
              "JOIN payment_reviews r ON r.order_id=o.id WHERE l.web_order_id=f.web_order_id",
              "AND o.status='paid' AND o.paid_at IS NOT NULL",
              "AND o.amount_ars=o.deposit_ars AND r.state='verified'",
              "AND o.payment_id IS NULL AND o.preference_id IS NULL",
              "AND EXISTS (SELECT 1 FROM central_live_bank_accreditations b WHERE b.order_id=o.id",
              "AND b.amount_ars=o.amount_ars AND length(b.bank_reference)>=6",
              "AND length(b.operator)>=2)) THEN 1 ELSE 0 END AS pago_sql_compatible,",
              "CASE WHEN EXISTS (SELECT 1 FROM central_r2_large_pending p",
              "JOIN central_r2_large_reservations q ON q.object_key=p.object_key",
              "WHERE p.web_order_id=f.web_order_id AND p.file_id=f.file_id",
              "AND p.sha256=f.sha256 AND p.bytes=f.bytes",
              "AND p.status='awaiting_pdf_analysis'",
              "AND q.state='reserved' AND q.web_order_id=p.web_order_id",
              "AND q.file_id=p.file_id AND q.sha256=p.sha256 AND q.bytes=p.bytes)",
              "THEN 1 ELSE 0 END AS reserva_sql_compatible",
              'FROM central_work_order_numbers n JOIN orders o ON o.id=n.commercial_order_id',
              'JOIN central_r2_universal_order_links l ON l.commercial_order_id=o.id',
              'JOIN central_r2_universal_files f ON f.web_order_id=l.web_order_id',
              'WHERE n.number=11'
            ].join(' ')
          });
          if(quote?.[0]?.success!==true)throw Error('D1_CONDICIONES_011_FALLO');
          console.log('SABER_R2_011_CONDICIONES='+JSON.stringify(quote[0].results||[]));
          const dimensions=await cloudflare('/d1/database/'+db.uuid+'/query',{
            sql:[
             'SELECT CAST(p.key AS INTEGER)+1 AS pagina,',
             "json_extract(p.value,'$.anchoCm') AS anchoCm,",
             "json_extract(p.value,'$.altoCm') AS altoCm",
             'FROM central_work_order_numbers n',
             'JOIN central_r2_universal_order_links l ON l.commercial_order_id=n.commercial_order_id',
             'JOIN central_r2_universal_files f ON f.web_order_id=l.web_order_id,',
             "json_each(json_extract(f.work_json,'$.configuracion.paginas')) p",
             'WHERE n.number=11 AND',
             "(abs(CAST(json_extract(p.value,'$.anchoCm') AS REAL)-21.0)>0.1 OR",
             "abs(CAST(json_extract(p.value,'$.altoCm') AS REAL)-29.7)>0.1)",
             'ORDER BY CAST(p.key AS INTEGER)'
            ].join(' ')
          });
          if(dimensions?.[0]?.success!==true)throw Error('D1_GEOMETRIA_FALLO');
          console.log('SABER_R2_011_PAGINAS_DISTINTAS='+JSON.stringify(dimensions[0].results||[]));
          EOF

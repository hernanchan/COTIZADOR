name: Saber - diagnostico beta versiones Cloudflare sin desplegar
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths: [.github/workflows/saber-diagnostico-stage-beta-versiones-20261113.yml]
permissions: {contents: read}
jobs:
  beta-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    environment: {name: saber-cloudflare-pruebas, deployment: false}
    env:
      ACCOUNT: ${{ secrets.SABER_CF_ACCOUNT_ID }}
      TOKEN: ${{ secrets.SABER_CF_DEPLOY_TOKEN }}
    steps:
      - name: Stage API beta desde versión activa - no hay despliegue
        shell: bash
        run: |
          set -euo pipefail
          root="https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/workers"
          script="$root/scripts/saber-pagos-produccion"
          beta="$root/workers/saber-pagos-produccion/versions"
          temp=$(mktemp -d)
          curl -fsS --max-time 30 -H "Authorization: Bearer $TOKEN" "$script/settings" > "$temp/settings.json"
          curl -fsS --max-time 30 -H "Authorization: Bearer $TOKEN" "$script/deployments" > "$temp/deployments.json"
          old=$(jq -er '.result.deployments[0].versions | if length==1 and .[0].percentage==100 then .[0].version_id else empty end' "$temp/deployments.json")
          printf '%s' 'export default {async fetch(){return new Response("NO DESPLEGADO",{status:503})}};' > "$temp/index.mjs"
          jq -nc --arg old "$old" --rawfile code "$temp/index.mjs" \
            --slurpfile settings "$temp/settings.json" \
            '{main_module:"index.mjs",bindings:[$settings[0].result.bindings[]|{name,type:"inherit",version_id:$old}],modules:[{name:"index.mjs",content_type:"application/javascript+module",content_base64:($code|@base64)}]}' > "$temp/body.json"
          status=$(curl -sS --max-time 110 -w '%{http_code}' -o "$temp/result.json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" --data-binary @"$temp/body.json" \
            "$beta?deploy=false")
          if [ "$status" = 200 ] && jq -e '.success==true and (.result.id|type=="string")' "$temp/result.json" >/dev/null;then
            candidate=$(jq -r '.result.id' "$temp/result.json")
            curl -fsS --max-time 30 -H "Authorization: Bearer $TOKEN" "$beta/$candidate" > "$temp/staged.json"
            jq -e '.success==true' "$temp/staged.json" >/dev/null
            jq -r '(.result.bindings//.result.resources.bindings)[].name' "$temp/staged.json" | sort > "$temp/staged.names"
            jq -r '.result.bindings[].name' "$temp/settings.json" | sort > "$temp/current.names"
            diff "$temp/current.names" "$temp/staged.names"
            verdict="BETA_STAGE_OK_BINDINGS_PRESERVED"
          else
            verdict="BETA_STAGE_FAILED"
          fi
          current=$(curl -fsS --max-time 30 -H "Authorization: Bearer $TOKEN" "$script/deployments" |
            jq -er '.result.deployments[0].versions[0].version_id')
          test "$current" = "$old" || { echo DEPLOYMENT_CHANGED_UNEXPECTED; exit 1; }
          echo "SABER_BETA_DIAG=$verdict HTTP=$status ACTIVE_UNCHANGED=true"
          if [ "$verdict" = BETA_STAGE_FAILED ];then
            jq -c '{errors:[.errors[]?|{code,message}]}' "$temp/result.json"
          fi
          # No POST to deployments. Does not affect the served site.

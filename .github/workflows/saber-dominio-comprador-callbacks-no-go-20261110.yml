name: Saber - preparar dominio comprador y callbacks LIVE siempre NO_GO
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths:
      - .github/workflows/saber-dominio-comprador-callbacks-no-go-20261110.yml
      - integraciones/publicacion/preparar-subdominio-y-callbacks-no-go-20261110.mjs
permissions: {contents: read, statuses: write}
concurrency: {group: saber-provision-buyer-domain-no-go, cancel-in-progress: false}
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    environment: {name: saber-cloudflare-pruebas, deployment: false}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Montar dominio y callbacks MP aislados, sin activar producción
        shell: bash
        env:
          SABER_CF_ACCOUNT_ID: ${{ secrets.SABER_CF_ACCOUNT_ID }}
          SABER_CF_DEPLOY_TOKEN: ${{ secrets.SABER_CF_DEPLOY_TOKEN }}
          SABER_CF_EDITOR_TOKEN: ${{ secrets.SABER_CF_EDITOR_TOKEN }}
        run: |
          set -euo pipefail
          node --check integraciones/publicacion/preparar-subdominio-y-callbacks-no-go-20261110.mjs
          node integraciones/publicacion/preparar-subdominio-y-callbacks-no-go-20261110.mjs
      - name: Smoke HTTPS comprador sin autorización de cobro
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3;do
            code=$(curl --silent --show-error --max-time 14 -o /dev/null -w '%{http_code}' https://pedidos.libreriasaber.com.ar/cotizar || true)
            if [ "$code" = 404 ] || [ "$code" = 503 ];then
              echo "BUYER_DOMAIN_COTIZAR_CLOSED_HTTP_$code"
              exit 0
            fi
            sleep 4
          done
          echo "BUYER_DOMAIN_DNS_OR_TLS_PROPAGATING_HTTP_$code"
          # El provisionamiento puede estar correcto sin certificado todavía: no habilitar cobros.
          exit 0
      - name: Registrar resultado protegido
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          if [ "$RESULT" = success ];then state=success;else state=failure;fi
          jq -n --arg state "$state" --arg context 'saber/production-buyer-domain-no-go' \
           --arg description "Buyer domain plus LIVE URLs gated NO_GO: $RESULT" \
           --arg target_url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
           '{state:$state,context:$context,description:$description,target_url:$target_url}' >/tmp/status.json
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" --input /tmp/status.json >/dev/null

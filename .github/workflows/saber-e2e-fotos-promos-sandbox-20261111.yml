name: Saber E2E - pedido real Sandbox de Fotos con promoción y Central D1
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths: [.github/workflows/saber-e2e-fotos-promos-sandbox-20261111.yml]
permissions: {contents: read, statuses: write}
concurrency: {group: saber-e2e-fotos-d1-una-sola-orden, cancel-in-progress: false}
jobs:
  foto-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: {name: saber-cloudflare-pruebas, deployment: false}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Cotizar Fotos Luster, registrar orden, verificar Central y generar checkout MP TEST
        shell: bash
        env:
          PASSWORD: ${{ secrets.SABER_V2_OPERATOR_PASSWORD }}
          ADMIN: ${{ secrets.DEMO_ADMIN_KEY }}
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund pdf-lib@1.17.1
          node --input-type=module <<'NODE'
          import {PDFDocument,rgb} from 'pdf-lib';
          import {createHash,randomBytes} from 'node:crypto';
          import assert from 'node:assert/strict';
          const base='https://saber-documentos-pruebas.libreriasaber.workers.dev';
          const central='https://saber-pagos-pruebas.libreriasaber.workers.dev';
          const pw=process.env.PASSWORD,admin=process.env.ADMIN;
          assert.ok(pw?.length>=10&&admin?.length>=10,'Sandbox no configurado');
          const auth='Basic '+Buffer.from('operador:'+pw).toString('base64');
          const headers={Authorization:auth,Origin:base,'Content-Type':'application/json'};
          const get=async(path)=>{const r=await fetch(base+path,{headers:{Authorization:auth},signal:AbortSignal.timeout(30000)});return {http:r.status,data:await r.json().catch(()=>null)}};
          const post=async(path,data)=>{
           const r=await fetch(base+path,{method:'POST',headers,body:JSON.stringify(data),
            redirect:'manual',signal:AbortSignal.timeout(45000)});
           return {http:r.status,data:await r.json().catch(()=>({}))};
          };
          const health=await fetch(central+'/health',{signal:AbortSignal.timeout(25000)}).then(x=>x.json());
          assert.equal(health.ok,true);assert.equal(health.databaseReady,true);
          assert.equal(health.paymentsEnabled,false,'Se prohíben cobros reales');
          console.log('E2E_CENTRAL_SANDBOX_PAGOS_REALES_OFF');
          const doc=await PDFDocument.create();
          for(let i=0;i<2;i++){
           const page=doc.addPage([283.46,425.2]);
           page.drawRectangle({x:10,y:10,width:260,height:400,color:rgb(i===0?.2:.7,.4,.75)});
          }
          const bytes=Buffer.from(await doc.save());
          const filename='ENSAYO-FOTOS-PROMO-SABER.pdf';
          const sha=createHash('sha256').update(bytes).digest('hex');
          const config={nombre:filename,paginas:[
           {numero:1,anchoCm:10,altoCm:15,modo:'sin-clasificar'},
           {numero:2,anchoCm:10,altoCm:15,modo:'sin-clasificar'}
          ],paginasSeleccionadas:'',seleccion:'a4',servicio:'fotos',
           productoFoto:'luster_10x15',copias:1,modo:'color',caras:'simple',
           paginasPorHoja:1,papelPoster:'obra80',anillado:'ninguno',
           grupoAnillado:'',materialColor:'',corteVariante:'gt3',
           corteMetros:1,productoGrafica:''};
          const q=await post('/api/ensayo-carga-unica',{archivos:[config]});
          console.log('E2E_FOTOS_COTIZACION_HTTP='+q.http+' TOTAL='+q.data?.total+
           ' DESCUENTO='+(q.data?.promocion?.descuento??0));
          assert.equal(q.http,200,'No cotizó: '+String(q.data?.error||''));
          assert.equal(q.data?.estado,'PRELIMINAR');
          assert.equal(q.data?.promocion?.aplicada,true);
          assert.equal(q.data?.total,1000,'El precio real de dos Luster debe ser $1000');
          assert.equal(q.data?.promocion?.descuento,600);
          const webOrderId='WEB-ENSAYO-'+randomBytes(16).toString('hex').toUpperCase();
          const manifest={fileId:'foto_ensayo_1',nombre:filename,bytes:bytes.length,sha256:sha};
          assert.ok(bytes.length>100&&bytes.length<40*1048576);
          const draft=await post('/prueba-v2/api/ensayo-r2-borrador-universal',{
           webOrderId,archivos:[config],manifiestos:[manifest]});
          console.log('E2E_FOTOS_BORRADOR_HTTP='+draft.http+' ERROR='+(draft.data.error||'OK'));
          assert.ok([200,201].includes(draft.http)&&draft.data.ok===true,
           'No se registró borrador privado '+JSON.stringify(draft.data));
          assert.equal(draft.data.totalArs,q.data.total);
          assert.equal(draft.data.fileCount,1);
          assert.equal(draft.data.paymentAuthorized,false);
          assert.equal(draft.data.filesUploaded,false);
          const order=await post('/prueba-v2/api/ensayo-r2-orden-universal',{
           webOrderId,draftId:draft.data.draftId,quoteHash:draft.data.quoteHash,
           telefono:'3510000000',nombre:'ENSAYO TECNICO SABER FOTOS',direccion:''});
          console.log('E2E_FOTOS_ORDEN_HTTP='+order.http+' ERROR='+(order.data.error||'OK'));
          assert.ok([200,201].includes(order.http)&&order.data.ok===true,
           'No se registró orden '+JSON.stringify(order.data));
          assert.equal(order.data.totalArs,q.data.total);
          assert.match(order.data.numeroOrden,/^\d{3,}$/);
          assert.equal(order.data.uploadAuthorized,false);
          assert.equal(order.data.paymentAuthorized,false);
          const id=order.data.commercialOrderId;
          const check=await fetch(central+'/admin/api/order?id='+encodeURIComponent(id),{
           headers:{Authorization:'Bearer '+admin},signal:AbortSignal.timeout(30000)});
          const inside=await check.json().catch(()=>({}));
          assert.equal(check.status,200,'Central no devolvió orden '+check.status);
          assert.equal(inside.order?.amount_ars,q.data.total);
          assert.equal(inside.order?.status,'awaiting_payment');
          console.log('E2E_CENTRAL_D1_ORDEN='+order.data.numeroOrden+
           ' TOTAL='+inside.order.amount_ars+' ESTADO='+inside.order.status);
          const mp=await post('/prueba-v2/api/ensayo-r2-checkout-universal',{
           action:'start',webOrderId,commercialOrderId:id});
          console.log('E2E_MP_SANDBOX_HTTP='+mp.http+' ERROR='+(mp.data.error||'OK'));
          assert.equal(mp.http,200,'Falta checkout Sandbox');
          assert.equal(mp.data.ok,true);
          assert.equal(mp.data.amountArs,q.data.total);
          assert.equal(mp.data.estado,'pendiente');
          assert.equal(mp.data.uploadAuthorized,false);
          assert.match(mp.data.checkoutUrl||'',/^https:\/\//);
          const st=await post('/prueba-v2/api/ensayo-r2-checkout-universal',{
           action:'status',webOrderId,commercialOrderId:id});
          assert.equal(st.http,200);assert.equal(st.data.amountArs,q.data.total);
          assert.equal(st.data.estado,'pendiente');
          assert.equal(st.data.uploadAuthorized,false);
          console.log('E2E_FOTOS_DESCUENTO_ORDEN_CENTRAL_MP_SANDBOX_PENDING_OK');
          console.log('NO_PAGO_APROBADO_NO_ARCHIVOS_SUBIDOS_NO_PRODUCCION_NO_PUBLICACION');
          NODE
      - name: Publicar resultado en GitHub
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          if [ "$RESULT" = success ];then state=success;description="Orden foto promocional en D1 y preferencia MP Sandbox pendiente; importes idénticos";else state=failure;description="Bloqueo detectado en orden foto/promoción Sandbox D1";fi
          jq -n --arg state "$state" --arg context 'saber/e2e-fotos-promo-sandbox' --arg description "$description" --arg target_url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '{state:$state,context:$context,description:$description,target_url:$target_url}' > /tmp/fotos-e2e-status.json
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" --input /tmp/fotos-e2e-status.json >/dev/null

name: Saber - cierre GO LIVE productivo, preflight REAL sin writes
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths:
      - .github/workflows/saber-go-live-estado-real-20261110.yml
      - integraciones/publicacion/chequear-go-live-estado-real-20261110.mjs
permissions: {contents: read, statuses: write}
concurrency: {group: saber-final-go-live-preflight, cancel-in-progress: false}
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: {name: saber-cloudflare-pruebas, deployment: false}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Comprobar dominio, Pages, D1, Workers, MP y TUS/R2 LIVE sin cobros
        env:
          SABER_CF_ACCOUNT_ID: ${{ secrets.SABER_CF_ACCOUNT_ID }}
          SABER_CF_DEPLOY_TOKEN: ${{ secrets.SABER_CF_DEPLOY_TOKEN }}
          SABER_CF_EDITOR_TOKEN: ${{ secrets.SABER_CF_EDITOR_TOKEN }}
          SABER_CF_D1_WRITE_TOKEN: ${{ secrets.SABER_CF_D1_WRITE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node --check integraciones/publicacion/chequear-go-live-estado-real-20261110.mjs
          node integraciones/publicacion/chequear-go-live-estado-real-20261110.mjs
      - name: Registrar evidencia, sin afirmar que existe un pago comercial
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          if [ "$RESULT" = success ];then state=success;else state=failure;fi
          jq -n --arg state "$state" --arg context 'saber/real-go-live-preflight' \
           --arg description "Go-live readiness read-only: $RESULT" \
           --arg target_url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
           '{state:$state,context:$context,description:$description,target_url:$target_url}' >/tmp/status.json
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" --input /tmp/status.json >/dev/null

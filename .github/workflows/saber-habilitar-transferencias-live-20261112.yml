name: Saber LIVE - activar transferencias bancarias verificadas TUS y R2
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths: [.github/workflows/saber-habilitar-transferencias-live-20261112.yml]
permissions: {contents: read}
concurrency: {group: saber-transfer-live-activation, cancel-in-progress: false}
jobs:
  activar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: {name: saber-cloudflare-pruebas, deployment: false}
    env:
      CF_ACCOUNT: ${{ secrets.SABER_CF_ACCOUNT_ID }}
      CF_DEPLOY: ${{ secrets.SABER_CF_DEPLOY_TOKEN }}
      CF_DB: ${{ secrets.SABER_CF_D1_WRITE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Contratos contra pago por comprobante falso, duplicados y transferencias R2
        shell: bash
        run: |
          set -euo pipefail
          node --check integraciones/publicacion/habilitar-transferencias-live-20261112.mjs
          node --test \
            integraciones/mercadopago/pruebas/transferencias-live-central.test.mjs \
            integraciones/autocotizador/recepcion/transferencia-live-comprador.test.mjs \
            integraciones/mercadopago/pruebas/mercadopago-live-central.test.mjs \
            integraciones/mercadopago/pruebas/r2-live-canary-order.test.mjs
      - name: Preflight D1 y actualizar Central antes de Comprador, rollback si falla
        shell: bash
        run: |
          set -euo pipefail
          node integraciones/publicacion/habilitar-transferencias-live-20261112.mjs
          echo SABER_TRANSFER_LIVE_ENABLE_COMPLETE_NO_CHARGE

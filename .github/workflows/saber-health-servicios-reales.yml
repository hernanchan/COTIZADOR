name: Saber - salud servicios reales sin cobros
on:
  push:
    branches: [polaroids/express-pdf-unico-20261023]
    paths:
      - .github/workflows/saber-health-servicios-reales.yml
      - integraciones/cloudflare-ensayo/comprobar-servicios-reales-get.mjs
      - integraciones/cloudflare-ensayo/auditar-compuertas-ensayo-get.mjs
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  health:
    runs-on: ubuntu-latest
    environment:
      name: saber-cloudflare-pruebas
      deployment: false
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Diagnosticar Central y Documentos mediante GET sin escrituras
        run: node integraciones/cloudflare-ensayo/comprobar-servicios-reales-get.mjs
      - name: Auditar GET compuertas sin cambiar estado
        env:
          SABER_CF_ACCOUNT_ID: ${{ secrets.SABER_CF_ACCOUNT_ID }}
          SABER_CF_EDITOR_TOKEN: ${{ secrets.SABER_CF_EDITOR_TOKEN }}
        run: node integraciones/cloudflare-ensayo/auditar-compuertas-ensayo-get.mjs
      - name: Comprobar que se vinculó el secreto temporal
        env:
          TEMP_TOKEN: ${{ secrets.SABER_CF_DEPLOY_TOKEN }}
        run: |
          if [ -z "$TEMP_TOKEN" ]; then
            echo "TEMP_SECRET_NOT_AVAILABLE"
            exit 1
          fi
          echo "TEMP_SECRET_PRESENT"
      - name: Verificar token temporal con Cloudflare sin escrituras
        env:
          TEMP_TOKEN: ${{ secrets.SABER_CF_DEPLOY_TOKEN }}
        run: |
          http=$(curl --silent --output /tmp/saber-token-verify.json --write-out '%{http_code}' --max-time 15 --header "Authorization: Bearer $TEMP_TOKEN" --header 'Accept: application/json' 'https://api.cloudflare.com/client/v4/user/tokens/verify')
          if [ "$http" != "200" ] || ! jq -e '.success == true and .result.status == "active"' /tmp/saber-token-verify.json >/dev/null; then
            echo "CLOUDFLARE_TOKEN_VERIFY_FAILED_HTTP_$http"
            exit 1
          fi
          rm -f /tmp/saber-token-verify.json
          echo "CLOUDFLARE_TEMP_TOKEN_ACTIVE"
      - name: Comprobar permisos de lectura del token en Workers aislados
        env:
          TEMP_TOKEN: ${{ secrets.SABER_CF_DEPLOY_TOKEN }}
          ACCOUNT: ${{ secrets.SABER_CF_ACCOUNT_ID }}
        run: |
          for worker in saber-documentos-pruebas saber-pagos-pruebas; do
            http=$(curl --silent --output /tmp/saber-worker-settings.json --write-out '%{http_code}' --max-time 15 --header "Authorization: Bearer $TEMP_TOKEN" --header 'Accept: application/json' "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/workers/scripts/$worker/settings")
            if [ "$http" != "200" ] || ! jq -e '.success == true and (.result.bindings | type == "array")' /tmp/saber-worker-settings.json >/dev/null; then
              echo "WORKER_SETTINGS_ACCESS_FAILED_$worker HTTP_$http"
              exit 1
            fi
            echo "WORKER_SETTINGS_READABLE_$worker"
          done
          rm -f /tmp/saber-worker-settings.json
      - name: Confirmar activacion privada desde Cloudflare sin escrituras
        env:
          ACCOUNT: ${{ secrets.SABER_CF_ACCOUNT_ID }}
          TOKEN: ${{ secrets.SABER_CF_DEPLOY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          root="https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/workers/scripts"
          for worker in saber-pagos-pruebas saber-documentos-pruebas; do
            curl -fsS --max-time 20 -H "Authorization: Bearer $TOKEN" "$root/$worker/settings" -o /tmp/flags-read.json
            if [ "$worker" = saber-pagos-pruebas ]; then
              flags='["CENTRAL_PREPARE_ENABLED"]'
            else
              flags='["DOCS_V2_RECEIPT_LINK_ENABLED","DOCS_EXTENDED_RECEIVER_ENABLED","DOCS_CENTRAL_SYNC_ENABLED","DOCS_ORDER_PREPARE_ENABLED"]'
            fi
            echo "$flags" | jq -c . >/tmp/expected-flags.json
            jq -e --slurpfile expected /tmp/expected-flags.json '
              .success==true and ([.result.bindings[]|select(.type=="plain_text" and .text=="PRIVATE_TEST_ONLY")|.name] as $enabled | all($expected[0][]; . as $name | $enabled|index($name)!=null))' /tmp/flags-read.json >/dev/null
            echo "PRIVATELY_CONFIGURED_REMOTE $worker"
          done
          echo "NO_WRITES_NO_PAYMENTS"
      - name: Prueba negativa de seguridad V2 real sin datos ni escrituras
        shell: bash
        run: |
          set -euo pipefail
          origin=https://saber-documentos-pruebas.libreriasaber.workers.dev
          code=$(curl --silent --show-error --max-time 12 --output /tmp/saber-private-response --write-out '%{http_code}' "$origin/prueba-v2/")
          if [ "$code" != 503 ] && [ "$code" != 401 ]; then echo "PRIVATE_PORTAL_UNEXPECTED_STATUS_$code"; exit 1; fi
          echo "PRIVATE_PORTAL_CLOSED_TO_ANONYMOUS_HTTP_$code"
          code=$(curl --silent --show-error --max-time 12 --output /tmp/saber-noauth-response --write-out '%{http_code}' -X POST -H "Origin: $origin" -H 'Content-Type: application/json' -d '{}' "$origin/api/ensayo-preparar-documentos-v2-lote")
          if [ "$code" != 401 ] && [ "$code" != 403 ] && [ "$code" != 503 ]; then echo "V2_PREPARE_UNEXPECTED_STATUS_$code"; exit 1; fi
          echo "V2_PREPARE_REJECTS_ANONYMOUS_HTTP_$code"
          rm -f /tmp/saber-private-response /tmp/saber-noauth-response
          echo "NEGATIVE_SECURITY_TEST_NO_VALID_ORDER_NO_PAYMENT"
      - name: Registrar resultado comprobación real
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          STATUS: ${{ job.status }}
        run: |
          if [ "$STATUS" = success ]; then state=success; description="Central real GET saludable y sin cobros"; else state=failure; description="Revisar GET real de Workers"; fi
          jq -n --arg state "$state" --arg context 'saber-live/health-get' --arg description "$description" --arg target_url "https://github.com/$GH_REPO/actions/runs/$GITHUB_RUN_ID" '{state:$state,context:$context,description:$description,target_url:$target_url}' >/tmp/saber-live-health.json
          gh api -X POST "repos/$GH_REPO/statuses/$GH_SHA" --input /tmp/saber-live-health.json

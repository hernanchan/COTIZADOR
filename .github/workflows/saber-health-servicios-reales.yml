name: Saber - salud servicios reales sin cobros
on:
  push:
    branches: [polaroids/express-pdf-unico-20261023]
    paths:
      - .github/workflows/saber-health-servicios-reales.yml
      - integraciones/cloudflare-ensayo/comprobar-servicios-reales-get.mjs
      - integraciones/cloudflare-ensayo/auditar-compuertas-ensayo-get.mjs
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  health:
    runs-on: ubuntu-latest
    environment:
      name: saber-cloudflare-pruebas
      deployment: false
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Diagnosticar Central y Documentos mediante GET sin escrituras
        run: node integraciones/cloudflare-ensayo/comprobar-servicios-reales-get.mjs
      - name: Auditar GET compuertas sin cambiar estado
        env:
          SABER_CF_ACCOUNT_ID: ${{ secrets.SABER_CF_ACCOUNT_ID }}
          SABER_CF_EDITOR_TOKEN: ${{ secrets.SABER_CF_EDITOR_TOKEN }}
        run: node integraciones/cloudflare-ensayo/auditar-compuertas-ensayo-get.mjs
      - name: Comprobar que se vinculó el secreto temporal
        env:
          TEMP_TOKEN: ${{ secrets.SABER_CF_DEPLOY_TOKEN }}
        run: |
          if [ -z "$TEMP_TOKEN" ]; then
            echo "TEMP_SECRET_NOT_AVAILABLE"
            exit 1
          fi
          echo "TEMP_SECRET_PRESENT"
      - name: Verificar token temporal con Cloudflare sin escrituras
        env:
          TEMP_TOKEN: ${{ secrets.SABER_CF_DEPLOY_TOKEN }}
        run: |
          http=$(curl --silent --output /tmp/saber-token-verify.json --write-out '%{http_code}' --max-time 15 --header "Authorization: Bearer $TEMP_TOKEN" --header 'Accept: application/json' 'https://api.cloudflare.com/client/v4/user/tokens/verify')
          if [ "$http" != "200" ] || ! jq -e '.success == true and .result.status == "active"' /tmp/saber-token-verify.json >/dev/null; then
            echo "CLOUDFLARE_TOKEN_VERIFY_FAILED_HTTP_$http"
            exit 1
          fi
          rm -f /tmp/saber-token-verify.json
          echo "CLOUDFLARE_TEMP_TOKEN_ACTIVE"
      - name: Registrar resultado comprobación real
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          STATUS: ${{ job.status }}
        run: |
          if [ "$STATUS" = success ]; then state=success; description="Central real GET saludable y sin cobros"; else state=failure; description="Revisar GET real de Workers"; fi
          jq -n --arg state "$state" --arg context 'saber-live/health-get' --arg description "$description" --arg target_url "https://github.com/$GH_REPO/actions/runs/$GITHUB_RUN_ID" '{state:$state,context:$context,description:$description,target_url:$target_url}' >/tmp/saber-live-health.json
          gh api -X POST "repos/$GH_REPO/statuses/$GH_SHA" --input /tmp/saber-live-health.json

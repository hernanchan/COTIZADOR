name: Saber - solo lectura recientes 012 a 016
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths: [.github/workflows/saber-inspeccion-pedidos-recientes-20261113.yml]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: {name: saber-cloudflare-pruebas, deployment: false}
    env:
      ACCOUNT: ${{ secrets.SABER_CF_ACCOUNT_ID }}
      D1TOKEN: ${{ secrets.SABER_CF_D1_WRITE_TOKEN }}
    steps:
      - name: Leer únicamente estados y recepción sin datos de clientes
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          const root='https://api.cloudflare.com/client/v4/accounts/'+process.env.ACCOUNT;
          async function cf(path,body){
           const r=await fetch(root+path,{method:body?'POST':'GET',
             headers:{Authorization:'Bearer '+process.env.D1TOKEN,
              ...(body?{'Content-Type':'application/json'}:{})},
             ...(body?{body:JSON.stringify(body)}:{}),
             signal:AbortSignal.timeout(30000)});
           const j=await r.json();
           if(!r.ok||j?.success!==true)throw Error('CF_'+r.status);
           return j.result;
          }
          const dbs=await cf('/d1/database');
          const db=dbs.find(d=>d.name==='saber-pagos-produccion');
          if(!db?.uuid)throw Error('DB_MISSING');
          async function query(sql){
           const a=await cf('/d1/database/'+db.uuid+'/query',{sql});
           if(a?.[0]?.success!==true)throw Error('D1_QUERY');
           return a[0].results||[];
          }
          const sql=[
           'SELECT n.number AS orden, o.status AS pago, o.created_at AS fecha,',
           'o.amount_ars AS importe,',
           'CASE WHEN o.payment_id IS NULL AND o.preference_id IS NULL THEN 1 ELSE 0 END AS sin_mp,',
           'CASE WHEN b.order_id IS NOT NULL THEN 1 ELSE 0 END AS banco_registrado,',
           'CASE WHEN r.order_id IS NOT NULL THEN 1 ELSE 0 END AS revision,',
           'COUNT(DISTINCT f.file_id) AS pdf,',
           "SUM(CASE WHEN f.received=1 THEN 1 ELSE 0 END) AS recibidos,",
           "SUM(CASE WHEN f.transport='r2' THEN 1 ELSE 0 END) AS r2,",
           "SUM(CASE WHEN s.receipt_id IS NOT NULL THEN 1 ELSE 0 END) AS staged,",
           "CASE WHEN e.order_id IS NOT NULL THEN 1 ELSE 0 END AS excluido,",
           "CASE WHEN a.order_id IS NOT NULL THEN 1 ELSE 0 END AS archivado",
           'FROM central_work_order_numbers n JOIN orders o ON o.id=n.commercial_order_id',
           'JOIN central_r2_universal_order_links l ON l.commercial_order_id=o.id',
           'JOIN central_r2_universal_files f ON f.web_order_id=l.web_order_id',
           'LEFT JOIN central_r2_large_pending s ON s.web_order_id=f.web_order_id AND s.file_id=f.file_id',
           'LEFT JOIN central_live_bank_accreditations b ON b.order_id=o.id',
           'LEFT JOIN payment_reviews r ON r.order_id=o.id',
           'LEFT JOIN central_live_test_exclusions e ON e.order_id=o.id',
           'LEFT JOIN central_live_order_archives a ON a.order_id=o.id',
           'WHERE n.number BETWEEN 12 AND 16',
           'GROUP BY n.number, o.status, o.created_at, o.amount_ars, o.payment_id, o.preference_id,',
           'b.order_id, r.order_id, e.order_id, a.order_id ORDER BY n.number'
          ].join(' ');
          console.log('SABER_RECENT_ORDERS='+JSON.stringify(await query(sql)));
          EOF

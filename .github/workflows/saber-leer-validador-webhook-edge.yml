name: Saber - leer validador de webhook edge, solo lectura
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths: [.github/workflows/saber-leer-validador-webhook-edge.yml]
permissions: {contents: write}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    environment: {name: saber-cloudflare-pruebas, deployment: false}
    env:
      ACCOUNT: ${{ secrets.SABER_CF_ACCOUNT_ID }}
      TOKEN: ${{ secrets.SABER_CF_DEPLOY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Leer codigo de enrutamiento sin registrar ni cobrar pagos
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import {mkdir,writeFile} from 'node:fs/promises';
          const endpoint='https://api.cloudflare.com/client/v4/accounts/'+process.env.ACCOUNT+'/workers/scripts/saber-webhook-produccion';
          const r=await fetch(endpoint,{headers:{Authorization:'Bearer '+process.env.TOKEN}});
          if(!r.ok)throw Error('WORKER_READ_ONLY_FAILED');
          const src=await r.text();
          const start=src.indexOf('async function manejarWebhookPublico');
          const end=src.indexOf('export {',start);
          if(start<0)throw Error('FUNCTION_NOT_FOUND');
          const relevant=src.slice(start,end>start?end:start+2100);
          await mkdir('docs',{recursive:true});
          await writeFile('docs/INCIDENCIA-MP-WEBHOOK-VALIDADOR.txt',relevant);
          console.log('SABER_WEBHOOK_EDGE_VALIDATOR_READONLY');
          EOF
      - name: Guardar solo implementacion del validador sin configuraciones
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/INCIDENCIA-MP-WEBHOOK-VALIDADOR.txt || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/INCIDENCIA-MP-WEBHOOK-VALIDADOR.txt
          if ! git diff --cached --quiet;then
            git commit -m "ops: copia privada de reglas webhook edge para diagnostico"
            git push origin HEAD:integracion/tus-pedido-privado-20261101
          fi

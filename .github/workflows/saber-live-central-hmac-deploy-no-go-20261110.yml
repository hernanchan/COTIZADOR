name: Saber - actualizar HMAC Central LIVE aislada NO_GO con rollback
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths: [.github/workflows/saber-live-central-hmac-deploy-no-go-20261110.yml]
permissions:
  contents: read
  statuses: write
concurrency:
  group: saber-live-worker-central-sin-publicar
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: saber-cloudflare-pruebas
      deployment: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar contrato HMAC LIVE y compilación sin llamadas a MP
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --no-save esbuild@0.25.12 wrangler@4.55.0
          node --test integraciones/mercadopago/pruebas/central-live-bridge.test.mjs
          node --test integraciones/mercadopago/pruebas/central-live-hmac-e2e.test.mjs
          node --test integraciones/mercadopago/pruebas/mercadopago-live-central.test.mjs
          ./node_modules/.bin/esbuild integraciones/mercadopago/pruebas/worker.js \
            --bundle --platform=browser --format=esm --target=es2022 \
            --outfile=/tmp/saber-pagos-live-hmac-qa.mjs
          node --check /tmp/saber-pagos-live-hmac-qa.mjs
          grep -Fq 'CENTRAL_LIVE_BRIDGE_ENABLED' /tmp/saber-pagos-live-hmac-qa.mjs
          echo 'LIVE_CENTRAL_HMAC_CODE_TESTED_OFFLINE'
      - name: Desplegar código en Worker NO PUBLICO con rollback de versión
        shell: bash
        env:
          TOKEN: ${{ secrets.SABER_CF_DEPLOY_TOKEN }}
          ACCOUNT: ${{ secrets.SABER_CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.SABER_CF_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.SABER_CF_ACCOUNT_ID }}
          D1_TOKEN: ${{ secrets.SABER_CF_D1_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$TOKEN" && test -n "$ACCOUNT" && test -n "$D1_TOKEN"
          umask 077
          tmp=$(mktemp -d)
          root="https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/workers/scripts/saber-pagos-produccion"
          auth="Authorization: Bearer $TOKEN"
          touched=0
          previous=''
          cleanup(){
            rc=$?
            trap - EXIT
            if [ "$rc" -ne 0 ] && [ "$touched" = 1 ] && [ -n "$previous" ];then
              echo 'LIVE_CENTRAL_UPDATE_FAILED_ROLLBACK_ATTEMPT'
              jq -n --arg id "$previous" '{strategy:"percentage",versions:[{percentage:100,version_id:$id}],annotations:{"workers/message":"Rollback Central LIVE cerrada"}}' > "$tmp/rollback.json"
              if curl -fsS --max-time 55 -H "$auth" -H 'Content-Type: application/json' \
                --data-binary "@$tmp/rollback.json" "$root/deployments" > "$tmp/rollback-answer.json" && \
                jq -e '.success==true' "$tmp/rollback-answer.json" >/dev/null;then
                echo 'LIVE_CENTRAL_UPDATE_ROLLBACK_REQUESTED'
              else echo 'LIVE_CENTRAL_UPDATE_ROLLBACK_NOT_CONFIRMED';fi
            fi
            rm -rf "$tmp"
            exit "$rc"
          }
          trap cleanup EXIT
          curl -fsS --max-time 30 -H "$auth" "$root/settings" > "$tmp/before.json"
          jq -e '.success==true and
            (.result.bindings|any(.name=="MP_LIVE_GATE" and .type=="plain_text" and .text=="NO_GO")) and
            (.result.bindings|any(.name=="SABER_ENTORNO" and .type=="plain_text" and .text=="preparacion")) and
            (.result.bindings|any(.name=="CENTRAL_BRIDGE_KEY" and .type=="secret_text"))' \
            "$tmp/before.json" >/dev/null
          curl -fsS --max-time 30 -H "$auth" "$root/subdomain" > "$tmp/oldsub.json"
          jq -e '.success==true and .result.enabled==false and .result.previews_enabled==false' "$tmp/oldsub.json" >/dev/null
          curl -fsS --max-time 30 -H "$auth" "$root/deployments" > "$tmp/olddeploy.json"
          previous=$(jq -er '.result.deployments[0].versions|if length==1 and .[0].percentage==100 then .[0].version_id else empty end' "$tmp/olddeploy.json")
          d1root="https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/d1/database"
          curl -fsS --max-time 30 -H "Authorization: Bearer $D1_TOKEN" "$d1root" > "$tmp/db.json"
          prod=$(jq -r '[.result[]|select(.name=="saber-pagos-produccion")]|if length==1 then .[0].uuid else empty end' "$tmp/db.json")
          sandbox=$(jq -r '[.result[]|select(.name=="saber-pagos-pruebas")]|if length==1 then .[0].uuid else empty end' "$tmp/db.json")
          test -n "$prod" && test -n "$sandbox" && test "$prod" != "$sandbox"
          jq -e --arg id "$prod" '.result.bindings|any(.name=="DB" and .type=="d1" and ((.id//.database_id)==$id))' "$tmp/before.json" >/dev/null
          conf=integraciones/mercadopago/produccion/wrangler.toml
          sed "s/__D1_PRODUCCION_UUID__/$prod/g" \
            integraciones/mercadopago/produccion/wrangler.toml.template > "$conf"
          grep -Fq 'keep_vars = true' "$conf"
          grep -Fxq 'workers_dev = false' "$conf"
          grep -Fxq 'preview_urls = false' "$conf"
          grep -Fxq 'MP_LIVE_GATE = "NO_GO"' "$conf"
          ! grep -Fq "$sandbox" "$conf"
          echo 'LIVE_CENTRAL_BASELINE_PRIVATE_AND_DB_SEPARATE'
          touched=1
          CI=true ./node_modules/.bin/wrangler deploy --config "$conf" > "$tmp/deploy.log" 2>&1 ||
             { tail -n 20 "$tmp/deploy.log";exit 1; }
          echo 'LIVE_CENTRAL_HMAC_CODE_DEPLOYED_PRIVATE'
          curl -fsS --max-time 30 -H "$auth" "$root/settings" > "$tmp/after.json"
          jq -e --arg id "$prod" '.success==true and
            (.result.bindings|any(.name=="DB" and .type=="d1" and ((.id//.database_id)==$id))) and
            (.result.bindings|any(.name=="CENTRAL_BRIDGE_KEY" and .type=="secret_text")) and
            (.result.bindings|any(.name=="MP_LIVE_GATE" and .type=="plain_text" and .text=="NO_GO")) and
            (.result.bindings|any(.name=="SABER_ENTORNO" and .type=="plain_text" and .text=="preparacion"))' "$tmp/after.json" >/dev/null
          curl -fsS --max-time 30 -H "$auth" "$root/subdomain" > "$tmp/newsub.json"
          jq -e '.success==true and .result.enabled==false and .result.previews_enabled==false' "$tmp/newsub.json" >/dev/null
          curl -fsS --max-time 30 -H "$auth" "$root/deployments" > "$tmp/afterdeploy.json"
          latest=$(jq -er '.result.deployments[0].versions|if length==1 and .[0].percentage==100 then .[0].version_id else empty end' "$tmp/afterdeploy.json")
          test "$latest" != "$previous"
          echo "LIVE_CENTRAL_HMAC_DEPLOY_VERSION=$latest"
          echo "LIVE_CENTRAL_PREVIOUS_VERSION=$previous"
          echo 'LIVE_CENTRAL_HMAC_BINDING_PRESERVED_GATE_NO_GO'
          echo 'LIVE_CENTRAL_NO_PUBLIC_DOMAIN_NO_MP_PAYMENTS'
      - name: Registrar verificación
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          if [ "$RESULT" = success ];then state=success;else state=failure;fi
          jq -n --arg state "$state" --arg context 'saber/live-central-hmac-private' \
            --arg description "Central LIVE privada HMAC, rollback: $RESULT" \
            --arg target_url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}' > /tmp/status.json
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" --input /tmp/status.json >/dev/null

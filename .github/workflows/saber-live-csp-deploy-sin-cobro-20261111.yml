name: Saber - corregir CSP comprador LIVE manteniendo pagos cerrados
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths: [.github/workflows/saber-live-csp-deploy-sin-cobro-20261111.yml]
permissions: {contents: read, statuses: write}
concurrency: {group: saber-docs-live-csp-safe-deploy, cancel-in-progress: false}
jobs:
  safe:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment: {name: saber-cloudflare-pruebas, deployment: false}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Ejecutar tests afectados de comprador, recepción, webhook y ZIP
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          node --test \
            integraciones/autocotizador/recepcion/pagina-cotizar-live.test.mjs \
            integraciones/autocotizador/recepcion/pagina-retorno-live.test.mjs \
            integraciones/autocotizador/recepcion/flujo-presupuesto-live-cliente.test.mjs \
            integraciones/autocotizador/recepcion/checkout-live-cliente.test.mjs \
            integraciones/autocotizador/recepcion/ordenes-universales-live-documentos.test.mjs \
            integraciones/autocotizador/recepcion/mp-live-comprador.test.mjs \
            integraciones/autocotizador/recepcion/sesion-comprador-live.test.mjs \
            integraciones/autocotizador/recepcion/recepcion-tus-live-cliente.test.mjs \
            integraciones/autocotizador/recepcion/tus-live-recepcion-documentos.test.mjs \
            integraciones/autocotizador/recepcion/recepcion-r2-live-cliente.test.mjs \
            integraciones/autocotizador/recepcion/paquete-live-operador.test.mjs \
            integraciones/mercadopago/pruebas/mercadopago-live-central.test.mjs \
            integraciones/mercadopago/pruebas/tus-live-pospago-aislado.test.mjs \
            integraciones/mercadopago/produccion/webhook-edge.test.mjs \
            tests/central-live-recepcion-panel.test.mjs \
            tests/zip-universal-stream.test.mjs
          echo SABER_PILOT_LIVE_UNIT_TESTS_OK
      - name: Compilar frontend y Worker de comprador antes de desplegar
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-fund --no-audit esbuild@0.25.12 wrangler@4.55.0
          cd integraciones/autocotizador/recepcion
          npm install --no-fund --no-audit
          npm run build:unificado
          grep -q "SABER_SMART_UNIVERSAL_PDF" ./carga-unica-cliente.txt
          cd ../../..
          echo SABER_LIVE_BUYER_BUILD_OK
      - name: Comprobar que las puertas de cobro/orden siguen cerradas
        shell: bash
        env:
          ACCOUNT: ${{ secrets.SABER_CF_ACCOUNT_ID }}
          TOKEN: ${{ secrets.SABER_CF_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          root="https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/workers/scripts/saber-documentos-produccion"
          mkdir -p /tmp/saber-csp-live
          curl --fail --silent --show-error --max-time 25 -H "Authorization: Bearer $TOKEN" "$root/settings" >/tmp/saber-csp-live/before.json
          jq -e '.success==true and
            (.result.bindings|any(.name=="SABER_ENTORNO" and .type=="plain_text" and .text=="produccion")) and
            (.result.bindings|any(.name=="DOCS_MP_LIVE_GATE" and .type=="plain_text" and .text=="GO_COMERCIAL_CONFIRMADO")) and
            (.result.bindings|any(.name=="DOCS_LIVE_ORDER_GATE" and .type=="plain_text" and .text=="NO_GO")) and
            (.result.bindings|any(.name=="DOCS_LIVE_RECEPCION_GATE" and .type=="plain_text" and .text=="NO_GO")) and
            (.result.bindings|any(.name=="DOCS_LIVE_TUS_GATE" and .type=="plain_text" and .text=="NO_GO")) and
            (.result.bindings|any(.name=="DOCS_LIVE_R2_GATE" and .type=="plain_text" and .text=="NO_GO")) and
            (.result.bindings|any(.name=="DOCS_LIVE_STAFF_GATE" and .type=="plain_text" and .text=="GO_COMERCIAL_CONFIRMADO")) and
            (.result.bindings|any(.name=="DOCS_LIVE_STAFF_SECRET" and .type=="secret_text")) and
            (.result.bindings|any(.name=="SABER_R2_GRANDES_LIVE" and .type=="r2_bucket" and .bucket_name=="saber-documentos-produccion-privado"))' /tmp/saber-csp-live/before.json >/dev/null
          jq -r '.result.bindings[].name' /tmp/saber-csp-live/before.json | sort > /tmp/saber-csp-live/bindings-before
          curl --fail --silent --show-error --max-time 25 -H "Authorization: Bearer $TOKEN" "$root/deployments" >/tmp/saber-csp-live/deployments-before.json
          jq -e '.success==true and (.result.deployments|length)>0' /tmp/saber-csp-live/deployments-before.json >/dev/null
          echo SABER_LIVE_CSP_PREDEPLOY_OK
      - name: Desplegar solamente código documental corregido sin cambiar variables ni pagos
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.SABER_CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.SABER_CF_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          cfg=integraciones/autocotizador/produccion/wrangler.toml
          cp integraciones/autocotizador/produccion/wrangler.toml.template "$cfg"
          sed -i 's/^keep_vars = false$/keep_vars = true/' "$cfg"
          sed -i 's/SABER_ENTORNO = "preparacion"/SABER_ENTORNO = "produccion"/' "$cfg"
          sed -i 's/DOCS_MP_LIVE_GATE = "NO_GO"/DOCS_MP_LIVE_GATE = "GO_COMERCIAL_CONFIRMADO"/' "$cfg"
          printf '\n[[r2_buckets]]\nbinding = "SABER_R2_GRANDES_LIVE"\nbucket_name = "saber-documentos-produccion-privado"\n' >> "$cfg"
          grep -Fxq 'keep_vars = true' "$cfg"
          grep -Fxq 'SABER_ENTORNO = "produccion"' "$cfg"
          grep -Fxq 'DOCS_MP_LIVE_GATE = "GO_COMERCIAL_CONFIRMADO"' "$cfg"
          grep -Fxq 'workers_dev = false' "$cfg"
          grep -Fxq 'preview_urls = false' "$cfg"
          ! grep -Eq '^routes?[[:space:]]*=' "$cfg"
          CI=true npx wrangler deploy --config "$cfg" >/tmp/saber-csp-live/deploy.log 2>&1 ||
            { tail -n 30 /tmp/saber-csp-live/deploy.log; exit 1; }
          echo SABER_LIVE_CSP_DOCS_ONLY_DEPLOYED
      - name: Verificar invariantes de producción y acceso público cerrado sin contraseña
        shell: bash
        env:
          ACCOUNT: ${{ secrets.SABER_CF_ACCOUNT_ID }}
          TOKEN: ${{ secrets.SABER_CF_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          root="https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/workers/scripts/saber-documentos-produccion"
          curl --fail --silent --show-error --max-time 25 -H "Authorization: Bearer $TOKEN" "$root/settings" >/tmp/saber-csp-live/after.json
          jq -r '.result.bindings[].name' /tmp/saber-csp-live/after.json | sort >/tmp/saber-csp-live/bindings-after
          comm -23 /tmp/saber-csp-live/bindings-before /tmp/saber-csp-live/bindings-after >/tmp/saber-csp-live/missing
          test ! -s /tmp/saber-csp-live/missing || { echo SABER_LIVE_BINDINGS_LOST; cat /tmp/saber-csp-live/missing; exit 1; }
          jq -e '.success==true and
            (.result.bindings|any(.name=="SABER_ENTORNO" and .type=="plain_text" and .text=="produccion")) and
            (.result.bindings|any(.name=="DOCS_MP_LIVE_GATE" and .type=="plain_text" and .text=="GO_COMERCIAL_CONFIRMADO")) and
            (.result.bindings|any(.name=="DOCS_LIVE_UI_GATE" and .type=="plain_text" and .text=="GO_COMERCIAL_CONFIRMADO")) and
            (.result.bindings|any(.name=="DOCS_LIVE_ORDER_GATE" and .type=="plain_text" and .text=="NO_GO")) and
            (.result.bindings|any(.name=="DOCS_LIVE_RECEPCION_GATE" and .type=="plain_text" and .text=="NO_GO")) and
            (.result.bindings|any(.name=="DOCS_LIVE_TUS_GATE" and .type=="plain_text" and .text=="NO_GO")) and
            (.result.bindings|any(.name=="DOCS_LIVE_R2_GATE" and .type=="plain_text" and .text=="NO_GO")) and
            (.result.bindings|any(.name=="DOCS_LIVE_STAFF_SECRET" and .type=="secret_text")) and
            (.result.bindings|any(.name=="SABER_R2_GRANDES_LIVE" and .type=="r2_bucket" and .bucket_name=="saber-documentos-produccion-privado"))' /tmp/saber-csp-live/after.json >/dev/null
          for pair in 'cotizar 200' 'personal/paquete 401';do
            set -- $pair
            code=$(curl -sS --max-time 18 -o /dev/null -w '%{http_code}' "https://pedidos.libreriasaber.com.ar/$1")
            test "$code" = "$2" || { echo "LIVE_ROUTE_INVALID_$1 HTTP_$code"; exit 1; }
          done
          code=$(curl -sS --max-time 18 -o /dev/null -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' -H 'Origin: https://pedidos.libreriasaber.com.ar' \
            --data '{}' 'https://pedidos.libreriasaber.com.ar/api/pedido/live/orden')
          test "$code" = 503 || test "$code" = 401
          echo SABER_LIVE_CSP_DEPLOY_OK_ORDERS_OFF_PRIVATE_STAFF
      - name: Publicar estado auditable
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          if [ "$RESULT" = success ];then state=success;else state=failure;fi
          jq -n --arg state "$state" --arg context 'saber/live-quote-csp-corrected' \
           --arg description "Buyer quote CSP nonce + payment still gated: $RESULT" \
           --arg target_url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
           '{state:$state,context:$context,description:$description,target_url:$target_url}' >/tmp/saber-live-status.json
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" --input /tmp/saber-live-status.json >/dev/null

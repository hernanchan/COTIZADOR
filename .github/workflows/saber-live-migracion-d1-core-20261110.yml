name: Saber - migrar D1 PRODUCCION solo tablas sin pagos
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths: [.github/workflows/saber-live-migracion-d1-core-20261110.yml]
permissions:
  contents: read
  statuses: write
concurrency:
  group: saber-migrar-d1-produccion-sin-datos
  cancel-in-progress: false
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: saber-cloudflare-pruebas
      deployment: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compilar y ensayar esquema en SQLite local, no Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          node --check integraciones/publicacion/aplicar-d1-produccion-core.mjs
          python3 - <<'PY'
          import sqlite3,pathlib
          s=pathlib.Path('integraciones/publicacion/d1-produccion-core-v1.sql').read_text()
          db=sqlite3.connect(':memory:')
          db.execute('PRAGMA foreign_keys=ON')
          db.executescript(s)
          required={'orders','order_items','payment_reviews','central_work_order_numbers',
             'central_order_contacts','central_r2_universal_drafts','central_r2_universal_files',
             'central_r2_universal_order_links','central_document_manifests',
             'live_checkout_locks','live_checkout_attempts'}
          found={r[0] for r in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          assert required <= found,required-found
          db.executescript(s)
          assert db.execute('PRAGMA foreign_key_check').fetchall()==[]
          assert db.execute('SELECT count(*) FROM orders').fetchone()[0]==0
          print('LIVE_D1_OFFLINE_SCHEMA_REENTRANT_FOREIGN_KEYS_OK')
          PY
      - name: Crear SOLO tablas en D1 de produccion, no pedidos ni cobros
        shell: bash
        env:
          SABER_CF_ACCOUNT_ID: ${{ secrets.SABER_CF_ACCOUNT_ID }}
          SABER_CF_D1_WRITE_TOKEN: ${{ secrets.SABER_CF_D1_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          node integraciones/publicacion/aplicar-d1-produccion-core.mjs
      - name: Registrar resultado
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        shell: bash
        run: |
          if [ "$RESULT" = success ];then state=success;else state=failure;fi
          jq -n --arg state "$state" --arg context "saber/d1-produccion-schema-core" \
             --arg description "Schema D1 LIVE aislado sin datos: $RESULT" \
             --arg target_url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
             '{state:$state,context:$context,description:$description,target_url:$target_url}' > /tmp/d1corestatus.json
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" --input /tmp/d1corestatus.json >/dev/null

name: Saber - migrar D1 recibos TUS LIVE sin pagos
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths: [.github/workflows/saber-live-migrar-tus-recibos-20261110.yml]
permissions:
  contents: read
  statuses: write
concurrency:
  group: saber-live-tus-receipts-schema-only
  cancel-in-progress: false
jobs:
  tus-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    environment:
      name: saber-cloudflare-pruebas
      deployment: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar DDL independiente sin datos
        shell: bash
        run: |
          set -euo pipefail
          node --check integraciones/publicacion/aplicar-d1-produccion-tus-recibos.mjs
          grep -Fq 'ON DELETE RESTRICT' integraciones/publicacion/d1-produccion-tus-recibos-v1.sql
          python3 - <<'PY'
          import sqlite3,pathlib
          ddl=pathlib.Path('integraciones/publicacion/d1-produccion-tus-recibos-v1.sql').read_text()
          db=sqlite3.connect(':memory:')
          db.execute('PRAGMA foreign_keys=ON')
          db.execute('CREATE TABLE central_r2_universal_files(web_order_id TEXT,file_id TEXT,PRIMARY KEY(web_order_id,file_id))')
          db.executescript(ddl)
          db.executescript(ddl)
          rows=db.execute('SELECT COUNT(*) FROM central_r2_universal_tus_receipts').fetchone()[0]
          assert rows==0
          fk=db.execute('PRAGMA foreign_key_list(central_r2_universal_tus_receipts)').fetchall()
          assert any(r[2]=='central_r2_universal_files' for r in fk)
          print('LIVE_TUS_RECEIPTS_DDL_OFFLINE_IDEMPOTENT_ZERO_DATA')
          PY
      - name: Aplicar exclusivamente esquema recibos TUS a D1 productiva
        shell: bash
        env:
          SABER_CF_ACCOUNT_ID: ${{ secrets.SABER_CF_ACCOUNT_ID }}
          SABER_CF_D1_WRITE_TOKEN: ${{ secrets.SABER_CF_D1_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          node integraciones/publicacion/aplicar-d1-produccion-tus-recibos.mjs
      - name: Registrar control sin habilitar recepción
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          if [ "$RESULT" = success ];then state=success;else state=failure;fi
          jq -n --arg state "$state" --arg context "saber/live-tus-receipts-d1" \
           --arg description "TUS recibos schema sin datos/no-go: $RESULT" \
           --arg target_url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
           '{state:$state,context:$context,description:$description,target_url:$target_url}' >/tmp/tus-receipts-status.json
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
           --input /tmp/tus-receipts-status.json >/dev/null

name: Saber - vigilancia postpublicación de tienda, MP, R2 y pedidos
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101, main]
    paths: [.github/workflows/saber-monitor-postpublicacion-20261112.yml]
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: saber-production-monitor, cancel-in-progress: false}
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment: {name: saber-cloudflare-pruebas, deployment: false}
    env:
      CF_ACCOUNT: ${{ secrets.SABER_CF_ACCOUNT_ID }}
      CF_DEPLOY: ${{ secrets.SABER_CF_DEPLOY_TOKEN }}
      CF_DB: ${{ secrets.SABER_CF_D1_WRITE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Comprobar sitio público, seguridad de cliente, MP, R2 y D1 solo lectura
        shell: bash
        run: |
          set -euo pipefail
          node --check integraciones/publicacion/monitor-postpublicacion-20261112.mjs
          node integraciones/publicacion/monitor-postpublicacion-20261112.mjs
# Redirección canónica 308 de Pages se sigue sólo dentro del dominio oficial.
# Gate de transferencia y TUS agregado al control de R2/MP.

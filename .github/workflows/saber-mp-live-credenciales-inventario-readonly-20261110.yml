name: Saber - inventario credenciales MP LIVE solo presencia y NO_GO
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths: [.github/workflows/saber-mp-live-credenciales-inventario-readonly-20261110.yml]
permissions:
  contents: read
  statuses: write
jobs:
  inventario:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: saber-cloudflare-pruebas
      deployment: false
    steps:
      - name: Verificar presencia de secretos MP LIVE sin leer sus valores y comprobar bloqueo
        shell: bash
        env:
          ACCOUNT: ${{ secrets.SABER_CF_ACCOUNT_ID }}
          TOKEN: ${{ secrets.SABER_CF_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$ACCOUNT" && test -n "$TOKEN"
          dir=$(mktemp -d);trap 'rm -rf "$dir"' EXIT
          root="https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/workers/scripts"
          auth="Authorization: Bearer $TOKEN"
          curl -fsS --max-time 25 -H "$auth"             "$root/saber-pagos-produccion/settings" > "$dir/central.json"
          jq -e '.success==true and (.result.bindings|type=="array")' "$dir/central.json" >/dev/null
          for key in MP_LIVE_ACCESS_TOKEN MP_LIVE_SELLER_ID MP_LIVE_WEBHOOK_SECRET MP_LIVE_WEBHOOK_URL MP_LIVE_RETURN_URL CENTRAL_LIVE_BRIDGE_ENABLED;do
            if jq -e --arg key "$key" '.result.bindings|any(.name==$key)' "$dir/central.json" >/dev/null;then
              echo "LIVE_CONFIGURATION_${key}=PRESENT"
            else
              echo "LIVE_CONFIGURATION_${key}=MISSING"
            fi
          done
          jq -e '.result.bindings|any(.name=="CENTRAL_BRIDGE_KEY" and .type=="secret_text")' "$dir/central.json" >/dev/null
          jq -e '.result.bindings|any(.name=="MP_LIVE_GATE" and .type=="plain_text" and .text=="NO_GO")' "$dir/central.json" >/dev/null
          jq -e '.result.bindings|any(.name=="SABER_ENTORNO" and .type=="plain_text" and .text=="preparacion")' "$dir/central.json" >/dev/null
          echo 'LIVE_CENTRAL_BRIDGE_KEY_PRESERVED_GATES_CLOSED'
          curl -fsS --max-time 25 -H "$auth"             "$root/saber-webhook-produccion/settings" > "$dir/edge.json"
          jq -e '.success==true and
            (.result.bindings|any(.name=="WEBHOOK_EDGE_GATE" and .type=="plain_text" and .text=="NO_GO")) and
            (.result.bindings|all(.type!="d1" and .type!="secret_text"))'             "$dir/edge.json" >/dev/null
          echo 'LIVE_WEBHOOK_GATE_CLOSED_NO_MP_SECRETS'
          for endpoint in "https://pagos.libreriasaber.com.ar/admin"             "https://pagos.libreriasaber.com.ar/webhooks/mercadopago-live?type=payment&data.id=123456";do
            code=$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' "$endpoint" || true)
            echo "LIVE_DOMAIN_${endpoint##*/}_HTTP=$code"
          done
          echo 'LIVE_INVENTORY_READ_ONLY_NO_SECRETS_CONTENT_NO_MP_API_CALLS_NO_PAYMENTS'
      - name: Registrar resultado
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        shell: bash
        run: |
          if [ "$RESULT" = success ];then state=success;else state=failure;fi
          jq -n --arg state "$state" --arg context 'saber/mp-live-credentials-readonly'             --arg description "MP LIVE inventario sin secretos ni cambios: $RESULT"             --arg target_url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"             '{state:$state,context:$context,description:$description,target_url:$target_url}' >/tmp/status.json
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" --input /tmp/status.json >/dev/null

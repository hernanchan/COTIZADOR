name: Saber - desplegar solo correccion de preferencia MP LIVE 20261112
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths:
      - .github/workflows/saber-mp-live-preferencia-fix-deploy-20261112.yml
permissions: {contents: read}
concurrency: {group: saber-mp-live-preferencia-fix, cancel-in-progress: false}
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: {name: saber-cloudflare-pruebas, deployment: false}
    env:
      ACCOUNT: ${{ secrets.SABER_CF_ACCOUNT_ID }}
      DEPLOY: ${{ secrets.SABER_CF_DEPLOY_TOKEN }}
      D1_TOKEN: ${{ secrets.SABER_CF_D1_WRITE_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.SABER_CF_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.SABER_CF_DEPLOY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Tests y comprobacion exacta de la correccion (sin pagos)
        shell: bash
        run: |
          set -euo pipefail
          node --check integraciones/mercadopago/pruebas/mercadopago-live-central.mjs
          grep -Fq 'expires:true,expiration_date_from:new Date(now()).toISOString()' integraciones/mercadopago/pruebas/mercadopago-live-central.mjs
          node --test integraciones/mercadopago/pruebas/mercadopago-live-central.test.mjs integraciones/mercadopago/pruebas/central-live-bridge.test.mjs
          npm install --no-save --no-audit --no-fund wrangler@4.55.0
          echo SABER_MP_LIVE_FIX_TESTS_OK_NO_CHARGE
      - name: Resguardar version, D1 y todos los bindings productivos
        shell: bash
        run: |
          set -euo pipefail
          : "${ACCOUNT:?}" "${DEPLOY:?}" "${D1_TOKEN:?}"
          root="https://api.cloudflare.com/client/v4/accounts/$ACCOUNT"
          mkdir -p /tmp/saber-mp-only
          tmp=/tmp/saber-mp-only
          curl -fsS --retry 2 --max-time 35 -H "Authorization: Bearer $DEPLOY" "$root/workers/scripts/saber-pagos-produccion/settings" > "$tmp/settings-before.json"
          jq -e '.success==true and (.result.bindings|any(.name=="SABER_ENTORNO" and .text=="produccion")) and (.result.bindings|any(.name=="CENTRAL_DB_ENV" and .text=="produccion")) and (.result.bindings|any(.name=="MP_LIVE_GATE" and .text=="GO_COMERCIAL_CONFIRMADO")) and (.result.bindings|any(.name=="MP_LIVE_ACCESS_TOKEN" and .type=="secret_text")) and (.result.bindings|any(.name=="SABER_CENTRAL" )|not)' "$tmp/settings-before.json" >/dev/null
          jq -cS '.result.bindings|sort_by(.name)' "$tmp/settings-before.json" > "$tmp/bindings-before.json"
          curl -fsS --retry 2 --max-time 35 -H "Authorization: Bearer $DEPLOY" "$root/workers/scripts/saber-pagos-produccion/deployments" > "$tmp/deploy-before.json"
          jq -er '.result.deployments[0].versions|if length==1 and .[0].percentage==100 then .[0].version_id else empty end' "$tmp/deploy-before.json" > "$tmp/rollback-version"
          curl -fsS --retry 2 --max-time 35 -H "Authorization: Bearer $D1_TOKEN" "$root/d1/database" > "$tmp/dbs.json"
          id=$(jq -r '[.result[]|select(.name=="saber-pagos-produccion")]|if length==1 then .[0].uuid else empty end' "$tmp/dbs.json")
          test -n "$id"
          jq -e --arg id "$id" '.result.bindings|any(.name=="DB" and .type=="d1" and ((.id//.database_id)==$id))' "$tmp/settings-before.json" >/dev/null
          sed "s/__D1_PRODUCCION_UUID__/$id/g" integraciones/mercadopago/produccion/wrangler.toml.template > integraciones/mercadopago/produccion/wrangler.toml
          sed -i 's/SABER_ENTORNO = "preparacion"/SABER_ENTORNO = "produccion"/' integraciones/mercadopago/produccion/wrangler.toml
          sed -i 's/MP_LIVE_GATE = "NO_GO"/MP_LIVE_GATE = "GO_COMERCIAL_CONFIRMADO"/' integraciones/mercadopago/produccion/wrangler.toml
          grep -Fq 'keep_vars = true' integraciones/mercadopago/produccion/wrangler.toml
          grep -Fxq 'workers_dev = false' integraciones/mercadopago/produccion/wrangler.toml
          grep -Fxq 'preview_urls = false' integraciones/mercadopago/produccion/wrangler.toml
          echo SABER_MP_LIVE_PREDEPLOY_BACKUP_OK
      - name: Desplegar exclusivamente Central y restaurar version anterior ante fallo
        shell: bash
        run: |
          set -euo pipefail
          tmp=/tmp/saber-mp-only
          root="https://api.cloudflare.com/client/v4/accounts/$ACCOUNT"
          old=$(cat "$tmp/rollback-version")
          rollback(){
            code=$?
            trap - ERR
            echo SABER_MP_LIVE_DEPLOY_FAILED_ATTEMPTING_ROLLBACK
            jq -nc --arg old "$old" '{strategy:"percentage",versions:[{version_id:$old,percentage:100}],annotations:{"workers/message":"Rollback automatico de preferencia MP LIVE"}}' |
              curl -fsS --max-time 35 -X POST -H "Authorization: Bearer $DEPLOY" -H "Content-Type: application/json" --data-binary @- "$root/workers/scripts/saber-pagos-produccion/deployments" >/dev/null ||
              echo SABER_MP_LIVE_ROLLBACK_NOT_CONFIRMED
            exit "$code"
          }
          CI=true npx wrangler deploy --config integraciones/mercadopago/produccion/wrangler.toml > "$tmp/wrangler.log" 2>&1 ||
            { tail -n 22 "$tmp/wrangler.log";exit 1; }
          trap rollback ERR
          curl -fsS --retry 2 --max-time 35 -H "Authorization: Bearer $DEPLOY" "$root/workers/scripts/saber-pagos-produccion/settings" > "$tmp/settings-after.json"
          jq -cS '.result.bindings|sort_by(.name)' "$tmp/settings-after.json" > "$tmp/bindings-after.json"
          diff "$tmp/bindings-before.json" "$tmp/bindings-after.json"
          curl -fsS --retry 2 --max-time 35 -H "Authorization: Bearer $DEPLOY" "$root/workers/scripts/saber-pagos-produccion/deployments" > "$tmp/deploy-after.json"
          jq -e '.result.deployments[0].versions|length==1 and .[0].percentage==100' "$tmp/deploy-after.json" >/dev/null
          status=$(curl -sS --max-time 16 -o /dev/null -w '%{http_code}' "https://pedidos.libreriasaber.com.ar/cotizar")
          test "$status" = 200
          # El endpoint interno no debe ser accesible sin HMAC desde Internet.
          status=$(curl -sS --max-time 16 -o /dev/null -w '%{http_code}' "https://pagos.libreriasaber.com.ar/internal/central/live/checkout")
          test "$status" != 200
          echo SABER_MP_LIVE_PREFERENCE_FIX_DEPLOYED_ONLY_CENTRAL_BINDINGS_PRESERVED_NO_CHARGES
          trap - ERR
          
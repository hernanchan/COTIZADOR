name: Saber - instalar webhook secret MP LIVE sin activar pagos
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths: [.github/workflows/saber-mp-live-webhook-secret-no-go-20261110.yml]
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
concurrency:
  group: saber-mp-live-webhook-secret
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    environment:
      name: saber-cloudflare-pruebas
      deployment: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar instalador y contrato webhook LIVE sin tocar producción
        shell: bash
        run: |
          set -euo pipefail
          node --check integraciones/mercadopago/produccion/instalar-webhook-live-cerrado.mjs
          node --test integraciones/mercadopago/produccion/webhook-edge.test.mjs
          node --test integraciones/mercadopago/pruebas/mercadopago-live-central.test.mjs
          grep -Fxq 'WEBHOOK_EDGE_GATE = "NO_GO"' integraciones/mercadopago/produccion/wrangler-webhook-edge.toml
          grep -Fxq 'MP_LIVE_GATE = "NO_GO"' integraciones/mercadopago/produccion/wrangler.toml.template
          echo 'WEBHOOK_LIVE_INSTALLER_STATIC_CHECKS_OK'
      - name: Comprobar disponibilidad del secreto suministrado por titular sin mostrarlo
        id: ready
        shell: bash
        env:
          WEBHOOK_SECRET: ${{ secrets.SABER_MP_LIVE_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$WEBHOOK_SECRET" ];then
            echo 'available=no' >> "$GITHUB_OUTPUT"
            echo 'WEBHOOK_LIVE_OWNER_SECRET_MISSING_NO_CHANGES'
            exit 1
          fi
          echo 'available=yes' >> "$GITHUB_OUTPUT"
          echo 'WEBHOOK_LIVE_OWNER_SECRET_PRESENT_NO_VALUE_PRINTED'
      - name: Instalar secreto solo en Central aislada de producción
        if: steps.ready.outputs.available == 'yes'
        env:
          SABER_CF_ACCOUNT_ID: ${{ secrets.SABER_CF_ACCOUNT_ID }}
          SABER_CF_DEPLOY_TOKEN: ${{ secrets.SABER_CF_DEPLOY_TOKEN }}
          SABER_MP_LIVE_WEBHOOK_SECRET: ${{ secrets.SABER_MP_LIVE_WEBHOOK_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          node integraciones/mercadopago/produccion/instalar-webhook-live-cerrado.mjs
      - name: Verificar HTTPS público y bloqueo (sin enviar un webhook ni pagar)
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          host='https://pagos.libreriasaber.com.ar'
          status=$(curl --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' "$host/admin")
          test "$status" = 404
          status=$(curl --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' "$host/webhooks/mercadopago-live?type=payment&data.id=123456")
          test "$status" = 503
          echo 'WEBHOOK_LIVE_DOMAIN_HTTPS_404_ADMIN_503_GATE_VERIFIED'
      - name: Registrar estado sin secretos
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          if [ "$RESULT" = success ];then state=success;else state=failure;fi
          jq -n --arg state "$state" --arg context 'saber/mp-live-webhook-secret' \
            --arg description "Clave Webhook MP LIVE en Worker NO_GO: $RESULT" \
            --arg target_url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}' > /tmp/webhook-secret-status.json
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" --input /tmp/webhook-secret-status.json >/dev/null

name: Saber - excluir ensayo 011 de la cola con auditoría intacta
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths: [.github/workflows/saber-orden011-descartar-ensayo-20261113.yml]
permissions: {contents: read}
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: {name: saber-cloudflare-pruebas, deployment: false}
    env:
      ACCOUNT: ${{ secrets.SABER_CF_ACCOUNT_ID }}
      D1TOKEN: ${{ secrets.SABER_CF_D1_WRITE_TOKEN }}
      R2TOKEN: ${{ secrets.SABER_CF_DEPLOY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Excluir solo orden 011 de la cola sin alterar estado de pago ni R2
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          const root='https://api.cloudflare.com/client/v4/accounts/'+process.env.ACCOUNT;
          async function call(path,token,sql){
            const r=await fetch(root+path,{
             method:sql?'POST':'GET',headers:{
              Authorization:'Bearer '+token,
              ...(sql?{'Content-Type':'application/json'}:{})},
             ...(sql?{body:JSON.stringify({sql})}:{}),
             signal:AbortSignal.timeout(25000)
            });
            const j=await r.json().catch(()=>null);
            if(!r.ok||j?.success!==true)throw Error('CF_'+r.status+' '+String(j?.errors?.[0]?.message||'SIN_DETALLE').slice(0,140));
            return j.result;
          }
          const dbs=await call('/d1/database',process.env.D1TOKEN);
          const db=dbs.find(x=>x.name==='saber-pagos-produccion');
          if(!db?.uuid)throw Error('D1_NOT_FOUND');
          const table=await call('/d1/database/'+db.uuid+'/query',process.env.D1TOKEN,
           "SELECT name FROM sqlite_master WHERE type='table' AND name='central_live_order_archives'");
          const archives=(table?.[0]?.results||[]).length>0;
          const arch=archives?await call('/d1/database/'+db.uuid+'/query',process.env.D1TOKEN,
           "SELECT name FROM pragma_table_info('central_live_order_archives') ORDER BY cid"):null;
          const sql=[
           "SELECT n.number AS numero,o.status AS estado,o.created_at AS creado,o.id AS orderId,", 
           "CASE WHEN o.payment_id IS NULL AND o.preference_id IS NULL THEN 1 ELSE 0 END AS sinMP,", 
           "CASE WHEN EXISTS(SELECT 1 FROM payment_reviews v WHERE v.order_id=o.id AND v.state='verified') THEN 1 ELSE 0 END AS verified,", 
           "CASE WHEN EXISTS(SELECT 1 FROM central_live_bank_accreditations b WHERE b.order_id=o.id AND b.amount_ars=o.amount_ars AND length(b.bank_reference)>=6 AND length(b.operator)>=2) THEN 1 ELSE 0 END AS banco,", 
           "f.file_id AS fileId,f.web_order_id AS webOrderId,f.transport AS transporte,",
           "f.bytes AS bytes,f.sha256 AS sha256,f.received AS recibido,",
           "p.object_key AS objectKey,p.etag AS etag,p.status AS stage,",
           "q.state AS reserva,",
           archives?"CASE WHEN a.order_id IS NOT NULL THEN 1 ELSE 0 END AS archived":"0 AS archived",
           "FROM central_work_order_numbers n JOIN orders o ON o.id=n.commercial_order_id",
           "JOIN central_r2_universal_order_links l ON l.commercial_order_id=o.id",
           "JOIN central_r2_universal_files f ON f.web_order_id=l.web_order_id",
           "LEFT JOIN central_r2_large_pending p ON p.web_order_id=f.web_order_id AND p.file_id=f.file_id",
           "LEFT JOIN central_r2_large_reservations q ON q.object_key=p.object_key",
           archives?"LEFT JOIN central_live_order_archives a ON a.order_id=o.id":"",
           "WHERE n.number=11"
          ].join(' ');
          const d=await call('/d1/database/'+db.uuid+'/query',process.env.D1TOKEN,sql);
          const rows=d?.[0]?.results||[];
          if(rows.length!==1)throw Error('ORDER_011_NOT_SINGLE');
          const f=rows[0];
          if(f.numero!==11||f.transporte!=='r2'||f.bytes!==44868597||
             f.estado!=='paid'||f.sinMP!==1||f.verified!==1||f.banco!==1||f.recibido!==0||f.stage!=='awaiting_pdf_analysis'||
             f.reserva!=='reserved'||!f.objectKey?.startsWith('r2-v1/'+f.webOrderId+'/'))
            throw Error('ORDER_011_MISMATCH');
          // El token disponible no tiene permiso para borrar objetos R2.
          // Registrar exclusión operativa con motivo correcto, conservando pagos y bytes.
          const ddl=[
           'CREATE TABLE IF NOT EXISTS central_live_test_exclusions (',
           'order_id TEXT PRIMARY KEY REFERENCES orders(id) ON DELETE RESTRICT,',
           'work_number INTEGER NOT NULL UNIQUE,',
           "reason TEXT NOT NULL CHECK(reason='ensayo_transferencia_r2_anulado'),",
           "created_at TEXT NOT NULL DEFAULT(datetime('now')))"
          ].join(' ');
          const create=await call('/d1/database/'+db.uuid+'/query',process.env.D1TOKEN,ddl);
          if(create?.[0]?.success!==true)throw Error('D1_NO_PUDO_CREAR_EXCLUSION');
          const safeOrder=f.orderId;
          if(!/^[a-f0-9-]{36}$/i.test(safeOrder)||!f.webOrderId?.startsWith('WEB-ENSAYO-'))
           throw Error('EXCLUSION_IDENTIDAD_INVALIDA');
          const statement=[
           'INSERT OR IGNORE INTO central_live_test_exclusions(order_id,work_number,reason)',
           "SELECT o.id,11,'ensayo_transferencia_r2_anulado'",
           'FROM orders o JOIN central_work_order_numbers n ON n.commercial_order_id=o.id',
           "WHERE o.id='"+safeOrder+"' AND n.number=11 AND o.status='paid'"
          ].join(' ');
          const inserted=await call('/d1/database/'+db.uuid+'/query',process.env.D1TOKEN,statement);
          if(inserted?.[0]?.success!==true)throw Error('D1_EXCLUSION_NO_INSERTADA');
          const verified=await call('/d1/database/'+db.uuid+'/query',process.env.D1TOKEN,
           "SELECT count(*) AS total FROM central_live_test_exclusions WHERE work_number=11 AND order_id='"+safeOrder+"' AND reason='ensayo_transferencia_r2_anulado'");
          if(verified?.[0]?.results?.[0]?.total!==1)throw Error('D1_EXCLUSION_NO_VERIFICADA');
          console.log('SABER_011_DESCARTE='+JSON.stringify({orden:11,
           excluidaDeCola:true,pagoAuditadoConservado:true,
           r2OriginalAunAlmacenado:true,requierePurgaR2ConPermisos:true}));
          EOF

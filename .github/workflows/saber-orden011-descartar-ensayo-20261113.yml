name: Saber - preflight seguro descarte orden 011 sin escrituras
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths: [.github/workflows/saber-orden011-descartar-ensayo-20261113.yml]
permissions: {contents: read}
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: {name: saber-cloudflare-pruebas, deployment: false}
    env:
      ACCOUNT: ${{ secrets.SABER_CF_ACCOUNT_ID }}
      D1TOKEN: ${{ secrets.SABER_CF_D1_WRITE_TOKEN }}
      R2TOKEN: ${{ secrets.SABER_CF_DEPLOY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Solo lectura metadatos D1 R2 de orden 011
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          const root='https://api.cloudflare.com/client/v4/accounts/'+process.env.ACCOUNT;
          async function call(path,token,sql){
            const r=await fetch(root+path,{
             method:sql?'POST':'GET',headers:{
              Authorization:'Bearer '+token,
              ...(sql?{'Content-Type':'application/json'}:{})},
             ...(sql?{body:JSON.stringify({sql})}:{}),
             signal:AbortSignal.timeout(25000)
            });
            const j=await r.json().catch(()=>null);
            if(!r.ok||j?.success!==true)throw Error('CF_'+r.status);
            return j.result;
          }
          const dbs=await call('/d1/database',process.env.D1TOKEN);
          const db=dbs.find(x=>x.name==='saber-pagos-produccion');
          if(!db?.uuid)throw Error('D1_NOT_FOUND');
          const table=await call('/d1/database/'+db.uuid+'/query',process.env.D1TOKEN,
           "SELECT name FROM sqlite_master WHERE type='table' AND name='central_live_order_archives'");
          const archives=(table?.[0]?.results||[]).length>0;
          const arch=archives?await call('/d1/database/'+db.uuid+'/query',process.env.D1TOKEN,
           "SELECT name FROM pragma_table_info('central_live_order_archives') ORDER BY cid"):null;
          const sql=[
           "SELECT n.number AS numero,o.status AS estado,o.created_at AS creado,",
           "f.file_id AS fileId,f.web_order_id AS webOrderId,f.transport AS transporte,",
           "f.bytes AS bytes,f.sha256 AS sha256,f.received AS recibido,",
           "p.object_key AS objectKey,p.etag AS etag,p.status AS stage,",
           "q.state AS reserva,",
           archives?"CASE WHEN a.order_id IS NOT NULL THEN 1 ELSE 0 END AS archived":"0 AS archived",
           "FROM central_work_order_numbers n JOIN orders o ON o.id=n.commercial_order_id",
           "JOIN central_r2_universal_order_links l ON l.commercial_order_id=o.id",
           "JOIN central_r2_universal_files f ON f.web_order_id=l.web_order_id",
           "LEFT JOIN central_r2_large_pending p ON p.web_order_id=f.web_order_id AND p.file_id=f.file_id",
           "LEFT JOIN central_r2_large_reservations q ON q.object_key=p.object_key",
           archives?"LEFT JOIN central_live_order_archives a ON a.order_id=o.id":"",
           "WHERE n.number=11"
          ].join(' ');
          const d=await call('/d1/database/'+db.uuid+'/query',process.env.D1TOKEN,sql);
          const rows=d?.[0]?.results||[];
          if(rows.length!==1)throw Error('ORDER_011_NOT_SINGLE');
          const f=rows[0];
          if(f.numero!==11||f.transporte!=='r2'||f.bytes!==44868597||
             f.estado!=='paid'||f.recibido!==0||f.stage!=='awaiting_pdf_analysis'||
             f.reserva!=='reserved'||!f.objectKey?.startsWith('r2-v1/'+f.webOrderId+'/'))
            throw Error('ORDER_011_MISMATCH');
          const url='/r2/buckets/saber-documentos-produccion-privado/objects?prefix='+
            encodeURIComponent('r2-v1/'+f.webOrderId+'/');
          let r2;
          try {
           const listed=await call(url,process.env.R2TOKEN);
           const objects=Array.isArray(listed)?listed:
            Array.isArray(listed?.objects)?listed.objects:[];
           const item=objects.find(x=>x.key===f.objectKey);
           r2={readable:true,objects:objects.length,match:!!item,
             bytesMatch:item?.size===f.bytes,etagMatch:typeof item?.etag==='string'&&
             item.etag.replaceAll('"','')===String(f.etag||'').replaceAll('"','')};
          }catch(e){r2={readable:false,error:String(e.message||e).slice(0,75)}}
          console.log('SABER_011_PREFLIGHT='+JSON.stringify({
           workNumber:11,approvedForDeletion:false,archives,
           archiveColumns:(arch?.[0]?.results||[]).map(x=>x.name),
           archived:f.archived,created:f.creado?.slice(0,10),
           r2,deletePerformed:false
          }));
          EOF

name: Saber - conectar V4 PC a Worker aislado de ensayo
on:
  push:
    branches:
      - interfaz/pc-compacta-lote-20261120
    paths:
      - .github/workflows/saber-pc-ensayo-v4.yml
      - tools/desplegar-interfaz-pc-ensayo.mjs
      - integraciones/interfaz-pc/**
      - tests/interfaz-pc-lote.test.mjs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: saber-pc-ensayo-v4-aislado
  cancel-in-progress: false
jobs:
  validar-y-desplegar-ensayo:
    if: github.ref == 'refs/heads/interfaz/pc-compacta-lote-20261120'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: saber-cloudflare-pruebas
      deployment: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar configuracion en lote y aislamiento movil
        run: |
          node --test tests/interfaz-pc-lote.test.mjs
          node --check tools/desplegar-interfaz-pc-ensayo.mjs
      - name: Actualizar solamente interfaz V4 de Worker privado y verificar
        env:
          SABER_CF_ACCOUNT_ID: ${{ secrets.SABER_CF_ACCOUNT_ID }}
          SABER_CF_DEPLOY_TOKEN: ${{ secrets.SABER_CF_DEPLOY_TOKEN }}
        run: node tools/desplegar-interfaz-pc-ensayo.mjs

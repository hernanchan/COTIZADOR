name: Saber - verificar y activar V5 PC solo en ensayo
on:
  push:
    branches:
      - interfaz/pc-compacta-lote-20261120
    paths:
      - .github/workflows/saber-pc-ensayo-v5.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: saber-pc-ensayo-privado
  cancel-in-progress: false
jobs:
  validar-ensayo-v5:
    if: github.ref == 'refs/heads/interfaz/pc-compacta-lote-20261120'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: saber-cloudflare-pruebas
      deployment: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pruebas de configuracion comun, medidas y aislamiento movil
        run: |
          node --test tests/interfaz-pc-lote.test.mjs
          node --check tools/desplegar-interfaz-pc-ensayo.mjs
          node --check integraciones/interfaz-pc/interfaz-pc.js
      - name: Compilar y publicar V5 exclusivamente en Worker privado con rollback
        env:
          SABER_CF_ACCOUNT_ID: ${{ secrets.SABER_CF_ACCOUNT_ID }}
          SABER_CF_DEPLOY_TOKEN: ${{ secrets.SABER_CF_DEPLOY_TOKEN }}
        run: node tools/desplegar-interfaz-pc-ensayo.mjs

name: Saber - activar V7 PC corregida solo en ensayo
on:
  push:
    branches:
      - interfaz/pc-compacta-lote-20261120
    paths:
      - .github/workflows/saber-pc-ensayo-v7.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: saber-pc-ensayo-privado
  cancel-in-progress: false
jobs:
  validar-ensayo-v7:
    if: github.ref == 'refs/heads/interfaz/pc-compacta-lote-20261120'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: saber-cloudflare-pruebas
      deployment: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar código y pruebas de regresión
        run: |
          node --test tests/interfaz-pc-lote.test.mjs
          node --check tools/desplegar-interfaz-pc-ensayo.mjs
          node --check integraciones/interfaz-pc/interfaz-pc.js
      - name: Instalar entorno de pruebas DOM
        run: npm install --no-save --ignore-scripts --no-audit --no-fund jsdom@26.1.0
      - name: Reproducir 6 PDF con tamaño pendiente y opción Ploteo seleccionada
        run: node tests/interfaz-pc-batch-dom.mjs
      - name: Compilar y desplegar solo Worker privado con rollback
        env:
          SABER_CF_ACCOUNT_ID: ${{ secrets.SABER_CF_ACCOUNT_ID }}
          SABER_CF_DEPLOY_TOKEN: ${{ secrets.SABER_CF_DEPLOY_TOKEN }}
        run: node tools/desplegar-interfaz-pc-ensayo.mjs

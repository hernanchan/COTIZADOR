name: Saber V11 - publicación controlada de interfaz PC
on:
  push:
    branches: [integracion/pc-v11-configuracion-directa-20261124]
    paths: [.github/workflows/saber-pc-v11-publicacion-controlada.yml]
permissions: {contents: read, pull-requests: read, issues: read, statuses: read, actions: read}
concurrency: {group: saber-docs-pc-production-release, cancel-in-progress: false}
jobs:
  publicar:
    if: github.ref == 'refs/heads/integracion/pc-v11-configuracion-directa-20261124'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: {name: saber-cloudflare-pruebas, deployment: false}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Exigir autorización manual y control verde para SHA exacto
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const sha=process.env.GITHUB_SHA,root='https://api.github.com/repos/hernanchan/COTIZADOR';
          assert(/^[a-f0-9]{40}$/.test(sha||''));
          async function get(path){
            const r=await fetch(root+path,{headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'},redirect:'error',signal:AbortSignal.timeout(20000)});
            assert(r.ok,'GitHub lectura '+r.status);return r.json();
          }
          const pr=await get('/pulls/28');
          assert(pr.state==='open'&&pr.head.sha===sha&&pr.head.ref==='integracion/pc-v11-configuracion-directa-20261124'&&pr.base.ref==='integracion/pc-v10-comercial-aislada-20261124','PR o SHA desactualizado');
          const comments=await get('/issues/28/comments?per_page=100');
          const expected='AUTORIZO CAMBIO SABER PR #28 SHA '+sha;
          assert(comments.some(c=>c.user?.login==='hernanchan'&&c.body?.trim()===expected),'FALTA AUTORIZACION MANUAL DEL TITULAR');
          const st=await get('/commits/'+sha+'/status');
          assert(st.statuses?.find(x=>x.context==='saber/contrato')?.state==='success','FALTA CONTROL SABER/CONTRATO VERDE');
          const tested=await get('/actions/runs/45401794496');
          assert(tested.conclusion==='success'&&tested.head_sha==='c7588fdf7b071f865fb0bdc5b8062f1e1412b7c3','Ensayo modular no confirmado');
          console.log('AUTORIZACION_SHA_Y_PRUEBAS_VERIFICADAS');
          JS
      - name: Verificar que los tres recursos de interfaz son los ensayados
        run: |
          set -euo pipefail
          for p in pc-v10-capa-reversible.mjs pc-v11-configuracion-directa.js.txt pc-v11-configuracion-directa.css.txt; do
            file="integraciones/autocotizador/recepcion/$p"
            # Descarga explícita de objetos de código ya públicos; no credenciales Cloudflare.
            curl -fsS --max-time 25 "https://raw.githubusercontent.com/hernanchan/COTIZADOR/c7588fdf7b071f865fb0bdc5b8062f1e1412b7c3/$file" | cmp - "$file"
          done
          node --test tests/pc-v10-capa-reversible.test.mjs
      - name: Crear versión aislada, verificar todos los bindings y publicar solo si son idénticos
        env:
          CF_ACCOUNT: ${{ secrets.SABER_CF_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.SABER_CF_DEPLOY_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          const account=process.env.CF_ACCOUNT,token=process.env.CF_TOKEN;
          assert(/^[a-f0-9]{32}$/i.test(account||'')&&token?.length>20);
          const root='https://api.cloudflare.com/client/v4/accounts/'+account;
          const w='saber-documentos-produccion',pay='saber-pagos-produccion';
          const old='07b17b59-0749-46ff-864c-c41a1b739f8d';
          const expectedHash='c8f04928d6e0ad8885a174e34ac1ccebf461a47d3775cb83bf2bccd1ffc802f6';
          const gate='DOCS_LIVE_PC_V10_GATE',on='GO_COMERCIAL_CONFIRMADO';
          const versions='/workers/workers/'+w+'/versions';
          const deployment='/workers/scripts/'+w+'/deployments';
          const settings='/workers/scripts/'+w+'/settings';
          const sha=process.env.GITHUB_SHA;
          const hash=b=>crypto.createHash('sha256').update(b).digest('hex');
          const canon=x=>Array.isArray(x)?x.map(canon):x&&typeof x==='object'?Object.fromEntries(Object.keys(x).sort().map(k=>[k,canon(x[k])])):x;
          const same=(a,b)=>JSON.stringify(canon(a))===JSON.stringify(canon(b));
          function bindingList(bs){return [...bs].sort((a,b)=>a.name.localeCompare(b.name));}
          function equalBindings(a,b){return same(bindingList(a),bindingList(b));}
          async function api(p,body){
            const r=await fetch(root+p,{method:body===undefined?'GET':'POST',redirect:'error',headers:{Authorization:'Bearer '+token,...(body===undefined?{}:{'Content-Type':'application/json'})},...(body===undefined?{}:{body:JSON.stringify(body)}),signal:AbortSignal.timeout(45000)});
            const j=await r.json().catch(()=>null);
            if(!r.ok||j?.success!==true)throw Error('CF_API_HTTP_'+r.status+'_CODE_'+(j?.errors?.[0]?.code||'unknown'));
            return j.result;
          }
          async function active(n){
            const d=await api('/workers/scripts/'+n+'/deployments');
            const v=(Array.isArray(d)?d:d.deployments)?.[0]?.versions;
            assert(v?.length===1&&v[0].percentage===100,'Version no unica');
            return v[0].version_id;
          }
          async function verifyActive(expected){
            for(let i=0;i<5;i++){
              if(await active(w)===expected)return;
              await new Promise(r=>setTimeout(r,2000));
            }
            throw Error('Version activa no confirmada');
          }
          async function deploy(id,message){
            assert(/^[a-f0-9-]{36}$/i.test(id));
            return api(deployment,{strategy:'percentage',versions:[{version_id:id,percentage:100}],annotations:{'workers/message':message}});
          }
          const before=await api(versions+'/'+old+'?include=modules');
          const current=await api(settings);
          const payId=await active(pay);
          assert.equal(await active(w),old,'La base activa cambió, detener sin escribir');
          assert.equal(before.id,old);
          assert(before.modules?.length===3&&before.bindings?.length===31);
          assert(!before.assets&&!before.migrations&&!before.migration_tag&&!before.containers?.length);
          assert(!before.exports||Object.keys(before.exports).every(k=>k==='default'));
          assert(before.bindings.some(b=>b.name===gate&&b.type==='plain_text'&&b.text===on));
          assert(before.bindings.every(b=>['plain_text','r2_bucket','secret_text','service'].includes(b.type)));
          assert(equalBindings(before.bindings,current.bindings),'Settings y version activa no coinciden');
          const m=before.modules.find(x=>x.content_type==='application/javascript+module'&&hash(Buffer.from(x.content_base64,'base64'))===expectedHash);
          assert(m&&/^[a-zA-Z0-9_.-]+$/.test(m.name));
          assert(m.content_type==='application/javascript+module'&&hash(Buffer.from(m.content_base64,'base64'))===expectedHash);
          const entry='saber-pc-v10-entry.mjs',layer='saber-pc-v10-layer.mjs';
          assert(before.main_module===entry&&![entry,layer].includes(m.name));
          const folder='integraciones/autocotizador/recepcion/';
          const css=fs.readFileSync(folder+'pc-v11-configuracion-directa.css.txt','utf8'),js=fs.readFileSync(folder+'pc-v11-configuracion-directa.js.txt','utf8');
          const code='import base from '+JSON.stringify('./'+m.name)+';\nexport * from '+JSON.stringify('./'+m.name)+';\nimport {crearCapaPcV10} from "./'+layer+'";\nexport default crearCapaPcV10(base,{css:'+JSON.stringify(css)+',js:'+JSON.stringify(js)+'});\n';
          const module=(name,bytes)=>({name,content_type:'application/javascript+module',content_base64:Buffer.from(bytes).toString('base64')});
          const existingLayer=before.modules.find(x=>x.name===layer);
          assert(existingLayer&&existingLayer.content_type==='application/javascript+module'&&hash(Buffer.from(existingLayer.content_base64,'base64'))===hash(fs.readFileSync(folder+'pc-v10-capa-reversible.mjs')),'Capa V10 distinta de la ensayada');
          const nextModules=[m,existingLayer,module(entry,code)];
          const configs=['compatibility_date','compatibility_flags','usage_model','limits','placement','cache_options','exports','package_dependencies'];
          const payload={main_module:entry,modules:nextModules,bindings:before.bindings.map(b=>({type:'inherit',name:b.name,version_id:old})),annotations:{'workers/message':'Saber PC V11 '+sha}};
          for(const k of configs)if(before[k]!==undefined)payload[k]=before[k];
          // El API de versiones permite heredar de un ID concreto. Crear versión NO distribuye tráfico.
          let newId,attempted=false;
          try{
            assert.equal(await active(w),old,'Base cambió antes de crear versión');
            const created=await api(versions,payload);
            newId=created.id;
            assert(/^[a-f0-9-]{36}$/i.test(newId||'')&&newId!==old);
            console.log('VERSION_CREADA_SIN_TRAFICO '+newId);
            const candidate=await api(versions+'/'+newId+'?include=modules');
            assert(candidate.main_module===entry);
            assert(candidate.modules?.length===3);
            for(const mod of nextModules){
              const actual=candidate.modules.find(x=>x.name===mod.name);
              assert(actual&&actual.content_type===mod.content_type&&hash(Buffer.from(actual.content_base64,'base64'))===hash(Buffer.from(mod.content_base64,'base64')),'Modulo distinto');
            }
            const desired=before.bindings;
            assert(equalBindings(candidate.bindings,desired),'La nueva version no conserva todos los bindings');
            for(const k of configs)assert(same(candidate[k],before[k]),'Configuracion distinta: '+k);
            assert.equal(await active(w),old);
            assert.equal(await active(pay),payId);
            console.log('31_BINDINGS_V10_CONSERVADOS; MODULO_ORIGINAL_EXACTO');
            attempted=true;
            await deploy(newId,'Saber V11: solo interfaz PC '+sha);
            await verifyActive(newId);
            const after=await api(settings);
            assert(equalBindings(after.bindings,desired),'Settings activos distintos');
            assert.equal(await active(pay),payId,'Pagos cambió concurrentemente');
            const origin='https://pedidos.libreriasaber.com.ar';
            async function check(path,status,pattern){
              const r=await fetch(origin+path,{method:'GET',redirect:'manual',headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(15000)});
              assert.equal(r.status,status,'HTTP '+path);
              if(pattern)assert(pattern.test(await r.text()),'HTML esperado no disponible');
              else await r.body?.cancel();
            }
            await check('/cotizar',200,/saberIngresoLive|seccion-archivos/);
            await check('/cotizar/archivos',503);
            await check('/pedido/continuar',200,/Retomá tu pedido|saberRenovarPedido|Continuar/);
            await check('/pedido/estado',200,/Librería Saber|Pedido/i);
            await check('/personal/api/live-r2-inspection-original',401);
            console.log('V11_DEPLOY_OK VERSION='+newId+' ROLLBACK='+old+' PAGOS_INTACTO');
          }catch(e){
            // Si la distribución pudo haber cambiado, restituir solo nuestra versión.
            // No pisar un despliegue concurrente ajeno.
            if(attempted&&newId){
              try{
                const now=await active(w);
                if(now===newId){await deploy(old,'Rollback V11 comprobacion fallida');await verifyActive(old);console.log('ROLLBACK_CONFIRMADO '+old);}
                else if(now===old)console.log('BASE_ORIGINAL_CONTINUA_ACTIVA');
                else console.log('ROLLBACK_NO_EJECUTADO_VERSION_CONCURRENTE_REVISAR');
              }catch{console.log('ROLLBACK_NO_CONFIRMADO_REVISAR_CLOUDFLARE');}
            }else console.log('SIN_ACTIVACION; VERSION_ORIGINAL_NO_MODIFICADA_POR_ESTE_ENSAYO');
            // No serializar errores con argumentos o valores de bindings.
            console.log('PUBLICACION_DETENIDA '+String(e?.message||'error').slice(0,160));
            process.exitCode=1;
          }
          JS

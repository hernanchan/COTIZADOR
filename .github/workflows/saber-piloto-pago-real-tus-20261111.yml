name: Saber - habilitar piloto pago REAL A4 TUS sin R2 ni publicar main
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths: [.github/workflows/saber-piloto-pago-real-tus-20261111.yml]
permissions: {contents: read, statuses: write}
concurrency: {group: saber-production-real-payment-tus-pilot, cancel-in-progress: false}
jobs:
  lanzar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: {name: saber-cloudflare-pruebas, deployment: false}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Comprobar sintaxis antes de cualquier cambio
        shell: bash
        run: |
          set -euo pipefail
          node --check integraciones/publicacion/piloto-pago-real-tus-20261111.mjs
          test -f integraciones/publicacion/d1-produccion-tus-recibos-v1.sql
          echo SABER_PILOT_SCRIPT_SYNTAX_OK
      - name: Habilitar para pedido real pequeño SOLO circuito TUS completo
        env:
          SABER_CF_ACCOUNT_ID: ${{ secrets.SABER_CF_ACCOUNT_ID }}
          SABER_CF_DEPLOY_TOKEN: ${{ secrets.SABER_CF_DEPLOY_TOKEN }}
          SABER_CF_D1_WRITE_TOKEN: ${{ secrets.SABER_CF_D1_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          node integraciones/publicacion/piloto-pago-real-tus-20261111.mjs
      - name: Registrar hito del piloto sin hacer ningún cargo
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          if [ "$RESULT" = success ];then state=success;else state=failure;fi
          jq -n --arg state "$state" --arg context 'saber/live-real-payment-tus-pilot' \
            --arg description "Small PDF real payment TUS pilot; R2 blocked: $RESULT" \
            --arg target_url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}' >/tmp/status.json
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" --input /tmp/status.json >/dev/null

name: Saber - ubicar pedido universal sandbox pagado listo para ZIP sin crear orden
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths: [.github/workflows/saber-piloto-zip-orden-pagada-existente-20261110.yml]
permissions:
  contents: read
  statuses: write
jobs:
  elegir:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: saber-cloudflare-pruebas
      deployment: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Leer D1 privada SOLO ensayos pagados y recibidos
        env:
          ACCOUNT: ${{ secrets.SABER_CF_ACCOUNT_ID }}
          TOKEN: ${{ secrets.SABER_CF_D1_WRITE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const account=process.env.ACCOUNT,token=process.env.TOKEN;
          assert.match(account||'',/^[a-f0-9]{32}$/i);assert.ok(token?.length>15);
          const root='https://api.cloudflare.com/client/v4/accounts/'+account+'/d1/database';
          async function call(path,options={}){
           const r=await fetch(root+path,{...options,headers:{
            Authorization:'Bearer '+token,'Content-Type':'application/json'
           },signal:AbortSignal.timeout(25000)});
           const x=await r.json();if(!x.success)console.log('D1_QUERY_DIAGNOSTIC='+JSON.stringify((x.errors||[]).map(e=>({code:e.code,message:String(e.message||'').slice(0,160)}))));assert.equal(x.success,true,'CLOUDFLARE_D1_'+r.status);
           return x.result;
          }
          const list=await call('');
          const matches=list.filter(x=>x.name==='saber-pagos-pruebas');
          assert.equal(matches.length,1);
          const db=matches[0].uuid;
          const schema=await call('/'+db+'/query',{method:'POST',body:JSON.stringify({
            sql:"SELECT name FROM sqlite_master WHERE type='table' AND name IN ('central_r2_universal_order_links','central_r2_universal_files','orders','payment_reviews')"
          })});
          assert.ok(Array.isArray(schema)&&schema[0]?.success===true);
          const names=new Set((schema[0].results||[]).map(x=>x.name));
          const needed=['central_r2_universal_order_links','central_r2_universal_files','orders','payment_reviews'];
          const missing=needed.filter(n=>!names.has(n));
          console.log('PILOT_SANDBOX_SCHEMA_PRESENT='+[...names].sort().join(','));
          if(missing.length){console.log('PILOT_BLOCKER_MISSING_TABLES='+missing.join(','));process.exit(0)}
          const sql=`SELECT l.web_order_id AS web_order_id, COUNT(*) AS files,
          SUM(CASE WHEN f.received=1 THEN 1 ELSE 0 END) AS received,
          MIN(o.status) AS status, MIN(p.state) AS payment_review,
          SUM(CASE WHEN f.transport='r2' THEN 1 ELSE 0 END) AS r2_count,
          SUM(CASE WHEN f.transport='tus' THEN 1 ELSE 0 END) AS tus_count
          FROM central_r2_universal_order_links l
          JOIN central_r2_universal_files f ON f.web_order_id=l.web_order_id
          JOIN orders o ON o.id=l.commercial_order_id
          JOIN payment_reviews p ON p.order_id=o.id
          WHERE l.web_order_id LIKE 'WEB-ENSAYO-%' AND o.status='paid' AND p.state='verified'
          GROUP BY l.web_order_id ORDER BY l.web_order_id DESC LIMIT 25`;
          const queries=await call('/'+db+'/query',{method:'POST',body:JSON.stringify({sql})});
          assert.ok(Array.isArray(queries)&&queries[0]?.success===true);
          const rows=queries[0].results||[];
          const candidates=rows.filter(x=>Number(x.files)>0&&Number(x.received)===Number(x.files));
          console.log('PILOT_SANDBOX_PAID_UNIVERSAL_COUNT='+rows.length);
          console.log('PILOT_SANDBOX_PAID_READY_ZIP_COUNT='+candidates.length);
          for(const row of candidates.slice(0,3))
           console.log('PILOT_ZIP_READY='+JSON.stringify({
             webOrderId:row.web_order_id,files:row.files,tus:row.tus_count,r2:row.r2_count
           }));
          if(!candidates.length)console.log('PILOT_BLOCKER_NO_EXISTING_PAID_UNIVERSAL_READY_ZIP');
          console.log('READONLY_NO_ORDERS_CREATED_NO_CHECKOUT_NO_PAYMENTS_NO_R2_BYTES');
          NODE
      - name: Registrar resultado
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        shell: bash
        run: |
          if [ "$RESULT" = success ];then state=success;else state=failure;fi
          jq -n --arg state "$state" --arg context 'saber/pilot-existing-paid-universal' \
           --arg description "Buscar piloto ZIP preexistente: $RESULT" \
           --arg target_url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
           '{state:$state,context:$context,description:$description,target_url:$target_url}' >/tmp/saber-pilot-status.json
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
           --input /tmp/saber-pilot-status.json >/dev/null

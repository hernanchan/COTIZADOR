name: Saber - activar compatibilidad R2 SOLO Worker privado con rollback
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths: [.github/workflows/saber-ploteos-privado-activar-20261109.yml]
permissions:
  contents: read
concurrency:
  group: saber-ploteos-private-promotion
  cancel-in-progress: false
jobs:
  activar-privado:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: saber-cloudflare-pruebas
      deployment: false
    steps:
      - name: Promocion segura de version ya probada, solo Worker privado
        shell: bash
        env:
          ACCOUNT: ${{ secrets.SABER_CF_ACCOUNT_ID }}
          TOKEN: ${{ secrets.SABER_CF_DEPLOY_TOKEN }}
          PASSWORD: ${{ secrets.SABER_V2_OPERATOR_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ACCOUNT" && test -n "$TOKEN" && test -n "$PASSWORD"
          candidate="cf043fba-56bc-4718-a5c0-163ab80c3c29"
          stage_sha="20be7b9a1c1c62a24aceb99b83bdaea39a32a991"
          worker="saber-documentos-pruebas"
          root="https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/workers/scripts/$worker"
          origin="https://saber-documentos-pruebas.libreriasaber.workers.dev"
          auth="Authorization: Bearer $TOKEN"
          tmp=$(mktemp -d)
          activated=0
          finished=0
          old=""
          restore(){
            if [ "$activated" = 1 ] && [ "$finished" != 1 ] && [ -n "$old" ]; then
              echo "VERIFICATION_FAILED_ATTEMPT_ROLLBACK"
              jq -n --arg id "$old" '{strategy:"percentage",versions:[{version_id:$id,percentage:100}],annotations:{"workers/message":"Saber ploteos: rollback privado automatico"}}' > "$tmp/rollback.json"
              if curl -fsS --max-time 60 -H "$auth" -H "Content-Type: application/json" --data-binary "@$tmp/rollback.json" "$root/deployments" > "$tmp/rollback-result.json" && jq -e '.success==true' "$tmp/rollback-result.json" >/dev/null; then
                echo "ROLLBACK_REQUEST_ACCEPTED"
              else
                echo "CRITICAL_ROLLBACK_NOT_CONFIRMED"
              fi
            fi
          }
          cleanup(){ code=$?; [ "$code" = 0 ] || restore; rm -rf "$tmp"; }
          trap cleanup EXIT
          curl -fsS --max-time 30 -H "$auth" "$root/settings" > "$tmp/settings.json"
          jq -e '.success==true and (.result.bindings|type=="array")' "$tmp/settings.json" >/dev/null
          for binding in SABER_CENTRAL DOCS_V2_PRIVATE_UI_SECRET DOCS_RELAY_KEY CENTRAL_BRIDGE_KEY; do
            jq -e --arg n "$binding" '.result.bindings|any(.name==$n)' "$tmp/settings.json" >/dev/null
          done
          curl -fsS --max-time 30 -H "$auth" "$root/deployments" > "$tmp/deployments.json"
          old=$(jq -er '.result.deployments[0].versions | if length==1 and .[0].percentage==100 then .[0].version_id else empty end' "$tmp/deployments.json")
          [[ "$old" =~ ^[0-9a-f-]{36}$ ]] && [ "$old" != "$candidate" ] || { echo "ACTIVE_VERSION_AMBIGUOUS_OR_ALREADY_CANDIDATE"; exit 1; }
          for id in "$old" "$candidate"; do
            curl -fsS --max-time 30 -H "$auth" "$root/versions/$id" > "$tmp/$id.json"
            jq -e --arg id "$id" '.success==true and .result.id==$id and (.result.resources.bindings|type=="array")' "$tmp/$id.json" >/dev/null
            jq -S '[.result.resources.bindings[]|if .type=="secret_text" then {name,type} else . end]|sort_by(.name)' "$tmp/$id.json" > "$tmp/$id.bindings"
            jq -S '.result.resources.script_runtime|{compatibility_date,compatibility_flags,usage_model,limits,placement}' "$tmp/$id.json" > "$tmp/$id.runtime"
          done
          jq -e --arg stage "$stage_sha" '.result.annotations["workers/commit_sha"]==$stage' "$tmp/$candidate.json" >/dev/null || { echo "CANDIDATE_NOT_FROM_APPROVED_STAGE"; exit 1; }
          cmp -s "$tmp/$old.bindings" "$tmp/$candidate.bindings" || { echo "BINDING_DRIFT_BLOCKED"; exit 1; }
          cmp -s "$tmp/$old.runtime" "$tmp/$candidate.runtime" || { echo "RUNTIME_DRIFT_BLOCKED"; exit 1; }
          code=$(curl -sS --max-time 25 -o "$tmp/anonymous-before" -w '%{http_code}' "$origin/prueba-v2/")
          [ "$code" = "401" ] || { echo "PRIVATE_ACCESS_BEFORE_NOT_401"; exit 1; }
          curl -fsS --max-time 30 "https://saber-pagos-pruebas.libreriasaber.workers.dev/health" > "$tmp/health-before.json"
          jq -e '.ok==true and .paymentsEnabled==false' "$tmp/health-before.json" >/dev/null || { echo "REAL_PAYMENT_GATE_NOT_OFF"; exit 1; }
          echo "PREFLIGHT_PRIVATE_AND_PAYMENTS_OFF"
          jq -n --arg id "$candidate" '{strategy:"percentage",versions:[{version_id:$id,percentage:100}],annotations:{"workers/message":"Saber ploteos CAD/Pleno 80/130 privado - no pagos reales"}}' > "$tmp/promotion.json"
          activated=1
          curl -fsS --max-time 60 -H "$auth" -H "Content-Type: application/json" --data-binary "@$tmp/promotion.json" "$root/deployments" > "$tmp/promoted.json"
          jq -e '.success==true' "$tmp/promoted.json" >/dev/null
          verified=0
          for i in {1..15}; do
            curl -fsS --max-time 25 -H "$auth" "$root/deployments" > "$tmp/active.json"
            id=$(jq -r '.result.deployments[0].versions[]?|select(.percentage==100)|.version_id' "$tmp/active.json" | head -n1)
            if [ "$id" = "$candidate" ]; then verified=1; break; fi
            sleep 2
          done
          [ "$verified" = 1 ] || { echo "DEPLOYED_VERSION_NOT_CONFIRMED"; exit 1; }
          code=$(curl -sS --max-time 25 -o "$tmp/anonymous-after" -w '%{http_code}' "$origin/prueba-v2/")
          [ "$code" = 401 ] || { echo "PRIVATE_ACCESS_AFTER_NOT_401"; exit 1; }
          live=0
          for i in {1..20}; do
            code=$(curl -sS --max-time 25 -u "operador:$PASSWORD" -o "$tmp/cotizador.js" -w '%{http_code}' "$origin/prueba-v2/carga-inteligente.js" || true)
            if [ "$code" = 200 ] && grep -Fq 'No pudimos identificar' "$tmp/cotizador.js" && grep -Fq 'Recubierto 130 g' "$tmp/cotizador.js"; then live=1; break; fi
            sleep 2
          done
          [ "$live" = 1 ] || { echo "CLIENT_NEW_VERSION_NOT_VISIBLE"; exit 1; }
          curl -fsS --max-time 30 "https://saber-pagos-pruebas.libreriasaber.workers.dev/health" > "$tmp/health-after.json"
          jq -e '.ok==true and .paymentsEnabled==false' "$tmp/health-after.json" >/dev/null || { echo "PAYMENT_HEALTH_CHANGED"; exit 1; }
          finished=1
          echo "PRIVATE_PLOTEO_VERSION_ACTIVE_VERIFIED NO_PUBLIC_WEB_NO_REAL_PAYMENTS"

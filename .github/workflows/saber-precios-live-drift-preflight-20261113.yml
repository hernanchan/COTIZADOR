name: Saber - comparar Worker LIVE vs ficha precios nueva (solo lectura)
on:
  push:
    branches: [admin/precios-live-protegido-20261113]
    paths: ['.github/workflows/saber-precios-live-drift-preflight-20261113.yml']
permissions: {contents: read}
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: {name: saber-cloudflare-pruebas, deployment: false}
    env:
      CF_ACCOUNT: ${{ secrets.SABER_CF_ACCOUNT_ID }}
      CF_DEPLOY: ${{ secrets.SABER_CF_DEPLOY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Compilar los dos Workers propuestos sin desplegar
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund esbuild@0.25.12 >/dev/null
          ./node_modules/.bin/esbuild integraciones/mercadopago/pruebas/worker.js --bundle --platform=browser --format=esm --target=es2022 --outfile=/tmp/new-central.mjs >/dev/null
          (cd integraciones/autocotizador/recepcion && npm install --no-audit --no-fund >/dev/null && npm run build:unificado >/dev/null)
          cp integraciones/autocotizador/recepcion/dist/saber-documentos-cotizador-fase4.mjs /tmp/new-docs.mjs
          node --check /tmp/new-central.mjs
          node --check /tmp/new-docs.mjs
      - name: Comparar código realmente activo, sin cambios, sin secretos ni archivos
        shell: bash
        run: |
          set -euo pipefail
          root="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts"
          for pair in 'saber-pagos-produccion:new-central' 'saber-documentos-produccion:new-docs';do
            worker="${pair%%:*}";label="${pair##*:}"
            curl -fsS --retry 2 --max-time 30 -H "Authorization: Bearer $CF_DEPLOY" "$root/$worker" > "/tmp/$label.raw"
            cp "/tmp/$label.mjs" "/tmp/$label.candidate"
            WORKER="$worker" LABEL="$label" node --input-type=module <<'JS'
          import fs from 'node:fs';import crypto from 'node:crypto';import assert from 'node:assert/strict';
          const label=process.env.LABEL,worker=process.env.WORKER;
          const raw=fs.readFileSync('/tmp/'+label+'.raw','utf8'),candidate=fs.readFileSync('/tmp/'+label+'.candidate','utf8');
          const crlf='\r\n';
          const boundary=raw.slice(0,raw.indexOf(crlf));
          assert.match(boundary,/^--[a-f0-9]{40,}$/i);
          const parts=raw.split(boundary);
          assert.ok(parts.length>=3,'MULTIPART_PARSER_EXPECTED');
          const actual=parts.slice(1).map(p=>{
            const i=p.indexOf(crlf+crlf);
            return i>0&&p.slice(0,i).includes('name="index.mjs"')?
              p.slice(i+4).replace(/\r\n$/,''):null
          }).find(Boolean);
          assert.ok(actual?.length>100000,'DEPLOYED_LIVE_CODE_MISSING');
          const sha=x=>crypto.createHash('sha256').update(x).digest('hex').slice(0,16);
          const max=Math.min(actual.length,candidate.length);
          let prefix=0;while(prefix<max&&actual[prefix]===candidate[prefix])prefix++;
          let suffix=0;while(suffix<max-prefix&&actual[actual.length-1-suffix]===candidate[candidate.length-1-suffix])suffix++;
          const features=worker==='saber-pagos-produccion'?
            ['SABER_MP_LIVE_CRON_ACREDITADOS','central_mp_live_auto_health','central_live_purge_files','central_live_order_archives','central_live_transfer_customer_notices','central_live_r2_universal','central_live_pricing_admin_head','/internal/central/live/pricing','/internal/central/live/staff-pricing','/internal/central/live/r2-staff-board']:
            ['SABER_POSTPAGO_SIN_SEGUNDA_SELECCION_V1','Volver a la tienda','/personal/central','/personal/precios','/personal/api/live-pricing','transferNewList','stageDialog','/pedido/continuar','/personal/api/live-reconcile','/personal/api/live-r2-inspection-original','SABER_TRANSFER_CONFIRMACION_CLIENTE_V1','/cotizar'];
          console.log('SABER_COMPARE',worker,'LIVE_BYTES',actual.length,'CANDIDATE_BYTES',candidate.length,
            'LIVE_SHA16',sha(actual),'CANDIDATE_SHA16',sha(candidate),'COMMON_PREFIX',prefix,'COMMON_SUFFIX',suffix);
          for(const marker of features)console.log('SABER_FEATURE',worker,JSON.stringify(marker),
            'LIVE',actual.includes(marker),'CANDIDATE',candidate.includes(marker));
          JS
          done
          echo SABER_LIVE_DRIFT_READ_ONLY_DONE

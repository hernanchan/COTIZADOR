name: Saber - prueba final D1 producción tarifario TUS R2 sin escribir
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths:
      - .github/workflows/saber-preflight-d1-final-live-20261111.yml
      - integraciones/publicacion/preflight-d1-final-live-20261111.mjs
permissions: {contents: read, statuses: write}
jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment: {name: saber-cloudflare-pruebas, deployment: false}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Leer tablas, pedidos, pagos y precios de D1 producción
        env:
          SABER_CF_ACCOUNT_ID: ${{ secrets.SABER_CF_ACCOUNT_ID }}
          SABER_CF_D1_WRITE_TOKEN: ${{ secrets.SABER_CF_D1_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          node --check integraciones/publicacion/preflight-d1-final-live-20261111.mjs
          node integraciones/publicacion/preflight-d1-final-live-20261111.mjs
      - name: Registrar verificación del esquema real
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          if [ "$RESULT" = success ];then state=success;else state=failure;fi
          jq -n --arg state "$state" --arg context "saber/production-d1-final-readonly" \
           --arg description "D1 TUS R2 MP live schema and prices: $RESULT" \
           --arg target_url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
           '{state:$state,context:$context,description:$description,target_url:$target_url}' >/tmp/status.json
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" --input /tmp/status.json >/dev/null

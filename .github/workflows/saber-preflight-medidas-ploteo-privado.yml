name: Saber - preflight seguro de cotizador privado
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: saber-cloudflare-pruebas
      deployment: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integracion/tus-pedido-privado-20261101
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compilar y comprobar regresiones sin desplegar
        working-directory: integraciones/autocotizador/recepcion
        run: |
          npm install --no-audit --no-fund
          npm run build:unificado
          node --test ../../../tests/fase1-ploteo-recibo-verificado.test.mjs ../../../tests/fase1-ploteo-central-manifiesto.test.mjs
      - name: Verificar dimensiones visibles en el código compilado
        working-directory: integraciones/autocotizador/recepcion
        run: |
          grep -Fq 'Medidas detectadas (preliminares)' dist/saber-documentos-cotizador-fase4.mjs
          grep -Fq 'Medidas verificadas' dist/saber-documentos-cotizador-fase4.mjs
          echo 'MEDIDAS_PRESENTES_EN_BUILD'
      - name: Verificar versión activa y bindings de Cloudflare sin modificarlos
        env:
          ACCOUNT: ${{ secrets.SABER_CF_ACCOUNT_ID }}
          TOKEN: ${{ secrets.SABER_CF_DEPLOY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ACCOUNT" && test -n "$TOKEN"
          ROOT="https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/workers/scripts/saber-documentos-pruebas"
          curl -fsS --max-time 25 -H "Authorization: Bearer $TOKEN" "$ROOT/deployments" > /tmp/deploy.json
          jq -e '.success == true and (.result.deployments | length > 0) and (.result.deployments[0].versions | length == 1) and (.result.deployments[0].versions[0].percentage == 100)' /tmp/deploy.json > /dev/null
          jq -r '.result.deployments[0].versions[0].version_id' /tmp/deploy.json | tee /tmp/rollback-version
          curl -fsS --max-time 25 -H "Authorization: Bearer $TOKEN" "$ROOT/settings" > /tmp/settings.json
          jq -e '.success == true and (.result.bindings | type == "array")' /tmp/settings.json > /dev/null
          for binding in SABER_CENTRAL DOCS_CENTRAL_ADMIN_KEY DOCS_SCRIPT_URL DOCS_RELAY_KEY CENTRAL_BRIDGE_KEY; do
            jq -e --arg name "$binding" '.result.bindings | any(.name == $name)' /tmp/settings.json > /dev/null
          done
          echo 'PREFLIGHT_OK_SIN_DESPLIEGUE'

name: Saber - preparar bucket privado R2 LIVE vacío con gate NO_GO
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths:
      - .github/workflows/saber-preparar-r2-live-cerrado-20261110.yml
      - integraciones/publicacion/preparar-r2-live-cerrado-20261110.mjs
permissions: {contents: read, statuses: write}
concurrency: {group: saber-r2-live-private-bucket, cancel-in-progress: false}
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    environment: {name: saber-cloudflare-pruebas, deployment: false}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Crear R2 Standard privado vacío, binding aislado y secreto propio
        env:
          SABER_CF_ACCOUNT_ID: ${{ secrets.SABER_CF_ACCOUNT_ID }}
          SABER_CF_DEPLOY_TOKEN: ${{ secrets.SABER_CF_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          node --check integraciones/publicacion/preparar-r2-live-cerrado-20261110.mjs
          node integraciones/publicacion/preparar-r2-live-cerrado-20261110.mjs
      - name: Registrar resultado
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          if [ "$RESULT" = success ];then state=success;else state=failure;fi
          jq -n --arg state "$state" --arg context 'saber/r2-live-private-ready' \
           --arg description "R2 LIVE bucket private empty, NO_GO: $RESULT" \
           --arg target_url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
           '{state:$state,context:$context,description:$description,target_url:$target_url}' >/tmp/status.json
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" --input /tmp/status.json >/dev/null

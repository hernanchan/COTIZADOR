name: Saber - restaurar previsión hoy en Central LIVE sin tocar pedidos
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths: [.github/workflows/saber-prevision-inicial-live-20261112.yml]
permissions: {contents: read}
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: {name: saber-cloudflare-pruebas, deployment: false}
    env:
      ACCOUNT: ${{ secrets.SABER_CF_ACCOUNT_ID }}
      D1_TOKEN: ${{ secrets.SABER_CF_D1_WRITE_TOKEN }}
    steps:
      - name: Restaurar preferencia HOY únicamente si aún no existe una previsión guardada
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const root='https://api.cloudflare.com/client/v4/accounts/'+process.env.ACCOUNT+'/d1/database';
          const headers={Authorization:'Bearer '+process.env.D1_TOKEN,'Content-Type':'application/json'};
          async function cf(url,args={}){const r=await fetch(url,{...args,headers:{...headers,...args.headers},signal:AbortSignal.timeout(22000)});const j=await r.json();assert.equal(r.ok&&j.success,true,'D1_RESPONSE_FAILED');return j.result;}
          const dbs=await cf(root),db=dbs.filter(d=>d.name==='saber-pagos-produccion');
          assert.equal(db.length,1);const url=root+'/'+db[0].uuid+'/query';
          const query=async sql=>(await cf(url,{method:'POST',body:JSON.stringify({sql})}))[0].results||[];
          const counts=await query("SELECT (SELECT COUNT(*) FROM orders) AS total,(SELECT COUNT(*) FROM payment_reviews) AS reviews");
          await query("CREATE TABLE IF NOT EXISTS central_delivery_plan (id INTEGER PRIMARY KEY CHECK(id=1),mode TEXT NOT NULL CHECK(mode IN ('por_confirmar','hoy','hoy_tarde','proximo_dia')),revision INTEGER NOT NULL,operator TEXT NOT NULL,updated_at TEXT NOT NULL DEFAULT(datetime('now')))");
          await query("CREATE TABLE IF NOT EXISTS central_delivery_plan_events (id INTEGER PRIMARY KEY AUTOINCREMENT,revision INTEGER NOT NULL UNIQUE,mode TEXT NOT NULL,operator TEXT NOT NULL,created_at TEXT NOT NULL DEFAULT(datetime('now')))");
          const previous=await query('SELECT mode,revision FROM central_delivery_plan WHERE id=1');
          if(!previous.length){
            await query("INSERT INTO central_delivery_plan (id,mode,revision,operator) VALUES (1,'hoy',1,'Configuracion Saber aprobada')");
            await query("INSERT OR IGNORE INTO central_delivery_plan_events(revision,mode,operator) VALUES(1,'hoy','Configuracion Saber aprobada')");
            console.log('SABER_PREVISION_HOY_INICIALIZADA_POR_DECISION_PREVIA');
          }else{
            assert.equal(previous.length,1);assert.ok(['hoy','hoy_tarde','proximo_dia','por_confirmar'].includes(previous[0].mode));
            console.log('SABER_PREVISION_EXISTENTE_PRESERVADA');
          }
          const last=await query('SELECT mode,revision FROM central_delivery_plan WHERE id=1');
          assert.equal(last.length,1);assert.ok(last[0].revision>=1);
          const after=await query("SELECT (SELECT COUNT(*) FROM orders) AS total,(SELECT COUNT(*) FROM payment_reviews) AS reviews");
          assert.deepEqual(after,counts);
          console.log('SABER_PREVISION_MODO_ACTUAL='+last[0].mode);
          console.log('SABER_PREVISION_NO_CARGA_PEDIDOS_NO_COBROS_NO_REESCRIBE_CLIENTES');
          NODE

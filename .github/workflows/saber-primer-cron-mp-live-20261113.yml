name: Saber - comprobar primer cron automatico y pedido ARS 100
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths: [.github/workflows/saber-primer-cron-mp-live-20261113.yml]
permissions: {contents: write}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    environment: {name: saber-cloudflare-pruebas, deployment: false}
    env:
      ACCOUNT: ${{ secrets.SABER_CF_ACCOUNT_ID }}
      TOKEN: ${{ secrets.SABER_CF_DEPLOY_TOKEN }}
      D1TOKEN: ${{ secrets.SABER_CF_D1_WRITE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar codigo final cron y pago real automáticamente sin escribir
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import {mkdir,writeFile} from 'node:fs/promises';
          import {setTimeout as sleep} from 'node:timers/promises';
          const a=process.env.ACCOUNT,t=process.env.TOKEN,d=process.env.D1TOKEN;
          const out={schema:'saber-primer-cron-mp-live-v1',at:new Date().toISOString(),
           readonly:true,attempts:0,cronActive:false,codeReady:false,health:null,orders100:[]};
          const cf=async(path,key=t,opts={})=>{
           const r=await fetch('https://api.cloudflare.com/client/v4/accounts/'+a+path,{
             ...opts,headers:{Authorization:'Bearer '+key,...opts.headers},signal:AbortSignal.timeout(20000)});
           const j=await r.json().catch(()=>null);
           if(!r.ok||j?.success!==true)throw Error('CLOUDFLARE_'+r.status);
           return j.result;
          };
          const worker=async()=>{
           const p='/workers/scripts/saber-pagos-produccion';
           const r=await fetch('https://api.cloudflare.com/client/v4/accounts/'+a+p,{
             headers:{Authorization:'Bearer '+t},signal:AbortSignal.timeout(20000)});
           if(!r.ok)throw Error('WORKER_'+r.status);
           const content=await r.text();
           out.codeReady=content.includes('SABER_MP_LIVE_CRON_AISLADO')&&content.includes('central_mp_live_auto_health');
           const ss=await cf(p+'/schedules');
           out.cronActive=(ss?.schedules||[]).some(x=>x.cron==='* * * * *');
          };
          let db;
          const query=async sql=>{
           const result=await cf('/d1/database/'+db.uuid+'/query',d,{method:'POST',
             headers:{'Content-Type':'application/json'},body:JSON.stringify({sql})});
           if(result?.[0]?.success!==true)throw Error('D1_QUERY');
           return result[0].results||[];
          };
          try{
           const databases=await cf('/d1/database',d);db=databases.find(x=>x.name==='saber-pagos-produccion');
           if(!db?.uuid)throw Error('D1_NOT_FOUND');
           for(let attempt=1;attempt<=12;attempt++){
            out.attempts=attempt;
            await worker();
            out.orders100=await query("SELECT status AS estado, COUNT(*) AS cantidad FROM orders WHERE amount_ars=100 AND datetime(created_at)>=datetime('now','-48 hours') GROUP BY status");
            const table=await query("SELECT name FROM sqlite_master WHERE type='table' AND name='central_mp_live_auto_health'");
            if(table.length)out.health=(await query("SELECT checked_at,checked,recovered,pending,review,errors,state FROM central_mp_live_auto_health WHERE id=1"))[0]||null;
            if(out.codeReady&&out.cronActive&&out.health)break;
            if(attempt<12)await sleep(15000);
           }
          }catch(e){out.error=String(e.message||e).slice(0,100)}
          await mkdir('docs',{recursive:true});
          await writeFile('docs/INCIDENCIA-MP-CRON-PRIMERA-EJECUCION.json',JSON.stringify(out,null,2)+'\n');
          console.log('SABER_MP_LIVE_CRON_PRIMERA='+JSON.stringify(out));
          EOF
      - name: Guardar estado de conciliación automática sin datos sensibles
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/INCIDENCIA-MP-CRON-PRIMERA-EJECUCION.json || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/INCIDENCIA-MP-CRON-PRIMERA-EJECUCION.json
          if ! git diff --cached --quiet;then
            git commit -m "ops: primer cron y orden MP LIVE sin accion humana"
            git push origin HEAD:integracion/tus-pedido-privado-20261101
          fi

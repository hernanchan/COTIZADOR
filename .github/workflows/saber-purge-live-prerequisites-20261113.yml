name: Saber - prerequisitos de borrado LIVE sin tocar originales
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths: [.github/workflows/saber-purge-live-prerequisites-20261113.yml]
permissions: {contents: write}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: {name: saber-cloudflare-pruebas, deployment: false}
    env:
      ACCOUNT: ${{ secrets.SABER_CF_ACCOUNT_ID }}
      TOKEN: ${{ secrets.SABER_CF_DEPLOY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verificar bindings privados de borrado sin valores secretos
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import {mkdir,writeFile} from 'node:fs/promises';
          const root='https://api.cloudflare.com/client/v4/accounts/'+process.env.ACCOUNT;
          const out={checkedAt:new Date().toISOString(),readOnly:true,gateActivationPerformed:false};
          try{
           const get=async name=>{
            const r=await fetch(root+'/workers/scripts/'+name+'/settings',{
             headers:{Authorization:'Bearer '+process.env.TOKEN},signal:AbortSignal.timeout(20000)});
            const j=await r.json();if(!r.ok||j?.success!==true)throw Error('SETTINGS_'+r.status);
            return j.result.bindings;
           };
           const [pay,docs]=await Promise.all([get('saber-pagos-produccion'),get('saber-documentos-produccion')]);
           const bind=(list,name,type)=>list.some(x=>x.name===name&&(!type||x.type===type));
           out.centralStorageBindingNames=pay.filter(x=>/R2|DOCUMENTOS|SUPABASE|TUS/i.test(x.name)).map(x=>({name:x.name,type:x.type}));
           out.documentsStorageBindingNames=docs.filter(x=>/R2|DOCUMENTOS|SUPABASE|TUS/i.test(x.name)).map(x=>({name:x.name,type:x.type}));
           out.centralDocumentsBridge=bind(pay,'SABER_DOCUMENTOS','service');
           out.centralR2PrivateBucket=bind(pay,'SABER_R2_GRANDES','r2_bucket');
           out.documentsTUSServiceKey=bind(docs,'DOCS_TUS_SUPABASE_SERVICE_KEY','secret_text');
           out.documentsHMACKey=bind(docs,'CENTRAL_BRIDGE_KEY','secret_text');
           out.centralHMACKey=bind(pay,'CENTRAL_BRIDGE_KEY','secret_text');
           out.centralPurgeGate=bind(pay,'CENTRAL_LIVE_PURGE_GATE');
           out.centralPurgeExecuteGate=bind(pay,'CENTRAL_LIVE_PURGE_EXECUTE_GATE');
           out.documentsPurgeGate=bind(docs,'DOCS_LIVE_PURGE_GATE');
           out.prerequisitesReady=['centralDocumentsBridge','centralR2PrivateBucket',
            'documentsTUSServiceKey','documentsHMACKey','centralHMACKey'].every(k=>out[k]);
          }catch(e){out.error=String(e.message||e).slice(0,70);out.prerequisitesReady=false}
          await mkdir('docs',{recursive:true});
          await writeFile('docs/REQUISITOS-BORRADO-LIVE.json',JSON.stringify(out,null,2)+'\n');
          console.log('SABER_PURGE_REQUIREMENTS='+JSON.stringify(out));
          if(!out.prerequisitesReady)process.exitCode=1;
          EOF
      - name: Registrar diagnóstico de permisos sin secretos
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/REQUISITOS-BORRADO-LIVE.json || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/REQUISITOS-BORRADO-LIVE.json
          git diff --cached --quiet && exit 0
          git commit -m "ops: requisitos de purga LIVE sin revelar bindings"
          for attempt in 1 2 3 4;do
            git fetch origin integracion/tus-pedido-privado-20261101
            git rebase origin/integracion/tus-pedido-privado-20261101
            git push origin HEAD:integracion/tus-pedido-privado-20261101 && exit 0
            sleep 2
          done
          exit 1

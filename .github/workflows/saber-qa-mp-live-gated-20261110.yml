name: Saber QA - pasarela LIVE aislada y firma HMAC, sin pago real
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths:
      - '.github/workflows/saber-qa-mp-live-gated-20261110.yml'
      - 'integraciones/mercadopago/pruebas/mercadopago-live-central.mjs'
      - 'integraciones/mercadopago/pruebas/mercadopago-live-central.test.mjs'
      - 'integraciones/mercadopago/pruebas/central-live-bridge.mjs'
      - 'integraciones/mercadopago/pruebas/central-live-bridge.test.mjs'
      - 'integraciones/mercadopago/pruebas/worker.js'
      - 'integraciones/autocotizador/recepcion/mp-live-comprador.mjs'
      - 'integraciones/autocotizador/recepcion/mp-live-comprador.test.mjs'
      - 'integraciones/autocotizador/recepcion/worker-fase4-cotizador-unificado.mjs'
      - 'integraciones/autocotizador/recepcion/pago-live-universal-documentos.mjs'
      - 'integraciones/autocotizador/recepcion/pago-live-universal-documentos.test.mjs'
permissions:
  contents: read
  statuses: write
jobs:
  contrato-live:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reglas LIVE y rechazo de accesos no autorizados
        run: |
          set -euo pipefail
          node --test integraciones/mercadopago/pruebas/mercadopago-live-central.test.mjs
          node --test integraciones/mercadopago/pruebas/central-live-bridge.test.mjs
          node --test integraciones/autocotizador/recepcion/mp-live-comprador.test.mjs
          node --check integraciones/autocotizador/recepcion/worker-fase4-cotizador-unificado.mjs
          node --test integraciones/autocotizador/recepcion/pago-live-universal-documentos.test.mjs
          node --check integraciones/mercadopago/pruebas/worker.js
          node --check integraciones/mercadopago/pruebas/mercadopago-live-central.mjs
      - name: Compilación del Worker con módulos LIVE cerrados
        run: |
          set -euo pipefail
          npm install --no-save --no-fund --no-audit esbuild@0.25.12
          ./node_modules/.bin/esbuild integraciones/mercadopago/pruebas/worker.js --bundle --platform=browser --format=esm --target=es2022 --outfile=/tmp/saber-pagos-compilado-qa.mjs
          node --check /tmp/saber-pagos-compilado-qa.mjs
          echo 'MP_LIVE_MODULE_BUNDLED_WITHOUT_NETWORK_CALLS'
      - name: Registrar verificación de MP LIVE sin cobrar
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        shell: bash
        run: |
          if [ "$RESULT" = success ];then state=success;else state=failure;fi
          jq -n --arg state "$state" --arg context 'saber/mp-live-gated-test' \
           --arg description "MP LIVE offline HMAC/DB: $RESULT" \
           --arg target_url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
           '{state:$state,context:$context,description:$description,target_url:$target_url}' >/tmp/live-status.json
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" --input /tmp/live-status.json >/dev/null

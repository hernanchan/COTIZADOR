name: Saber - comprobar plazo visible al cliente Chrome real SIN PEDIDO
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths: [docs/COMPROBAR-PLAZO-VISIBLE-20261111.trigger]
permissions: {contents: read}
jobs:
  plazo-real:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    environment: {name: saber-cloudflare-pruebas, deployment: false}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Simular seguimiento pagado y control de horas sin tocar D1
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/tus-franjas-entrega-operativa.test.mjs
      - name: "Chrome real: debe verse plazo desde el presupuesto"
        shell: bash
        env:
          SABER_OPERATOR_TEST_PASSWORD: ${{ secrets.SABER_V2_OPERATOR_PASSWORD }}
        run: |
          set -euo pipefail
          node --check integraciones/publicacion/qa-plazo-informativo-browser-20261111.mjs
          npm install --no-save --no-fund --no-audit playwright@1.56.1
          node integraciones/publicacion/qa-plazo-informativo-browser-20261111.mjs

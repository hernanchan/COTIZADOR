name: Saber QA - activar clasificacion multipagina 43 MiB SOLO Worker privado
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths: [.github/workflows/saber-qa-ploteo-multipagina-private-20261110.yml]
permissions:
  contents: read
  statuses: write
concurrency:
  group: saber-documentos-private-deploy
  cancel-in-progress: false
jobs:
  activar-privado:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    environment:
      name: saber-cloudflare-pruebas
      deployment: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tests aprobados y compilación real - ningún deploy aún
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund pdf-lib@1.17.1 esbuild@0.25.12
          node --test tests/ploteo-grande-visual-limitado.test.mjs tests/ploteo-deteccion-automatica-sin-opcion-cad.test.mjs tests/ploteo-letras-contorno-cad-general.test.mjs integraciones/autocotizador/recepcion/discriminar-plano-denso.test.mjs
          cd integraciones/autocotizador/recepcion
          npm install --no-audit --no-fund
          npm run build:unificado
          node --check dist/saber-documentos-cotizador-fase4.mjs
          grep -Fq 'VISUAL_PDFJS_LIMITADO' dist/saber-documentos-cotizador-fase4.mjs
          grep -Fq 'cad_contornos_vectoriales_sin_relleno' dist/saber-documentos-cotizador-fase4.mjs
          grep -Fq 'No pudimos identificar' dist/saber-documentos-cotizador-fase4.mjs
          grep -Fq 'Recubierto 130 g' dist/saber-documentos-cotizador-fase4.mjs
          echo 'MULTIPAGE_PLOTTER_BUILD_TEST_GREEN'
      - name: Stage, activar SOLO Documentos de pruebas con rollback automático verificado
        shell: bash
        env:
          ACCOUNT: ${{ secrets.SABER_CF_ACCOUNT_ID }}
          TOKEN: ${{ secrets.SABER_CF_DEPLOY_TOKEN }}
          PASSWORD: ${{ secrets.SABER_V2_OPERATOR_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ACCOUNT" && test -n "$TOKEN" && test -n "$PASSWORD"
          root="https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/workers/scripts/saber-documentos-pruebas"
          docs='https://saber-documentos-pruebas.libreriasaber.workers.dev'
          central='https://saber-pagos-pruebas.libreriasaber.workers.dev'
          auth="Authorization: Bearer $TOKEN"
          tmp=$(mktemp -d)
          chmod 700 "$tmp"
          touched=0
          baseline=''
          cleanup(){
            rc=$?
            trap - EXIT
            if [ "$rc" -ne 0 ] && [ "$touched" = 1 ] && [ -n "$baseline" ]; then
              echo 'PRIVATE_WORKER_PLOTTER_ROLLBACK_REQUESTED'
              jq -n --arg id "$baseline" '{strategy:"percentage",versions:[{version_id:$id,percentage:100}],annotations:{"workers/message":"Rollback private plotter 43 MiB"}}' > "$tmp/rollback.json"
              if curl -fsS --max-time 70 -H "$auth" -H 'Content-Type: application/json' \
                --data-binary "@$tmp/rollback.json" "$root/deployments" > "$tmp/rollback-result.json" &&
                jq -e '.success==true' "$tmp/rollback-result.json" >/dev/null; then
                curl -fsS --max-time 25 -H "$auth" "$root/deployments" > "$tmp/rollback-check.json" || true
                restored=$(jq -r '.result.deployments[0].versions | if length==1 and .[0].percentage==100 then .[0].version_id else empty end' "$tmp/rollback-check.json" 2>/dev/null)
                if [ "$restored" = "$baseline" ]; then echo 'PLOTTER_ROLLBACK_CONFIRMED'; else echo 'PLOTTER_ROLLBACK_UNCONFIRMED'; fi
              else
                echo 'PLOTTER_ROLLBACK_FAILED_NEEDS_MANUAL_CHECK'
              fi
            fi
            rm -rf "$tmp"
            exit "$rc"
          }
          trap cleanup EXIT
          curl -fsS --max-time 30 -H "$auth" "$root/settings" > "$tmp/settings.json"
          jq -e '.success==true and (.result.bindings|type=="array")' "$tmp/settings.json" >/dev/null
          curl -fsS --max-time 30 -H "$auth" "$root/deployments" > "$tmp/before.json"
          baseline=$(jq -er '.result.deployments[0].versions | if length==1 and .[0].percentage==100 then .[0].version_id else empty end' "$tmp/before.json")
          [[ "$baseline" =~ ^[a-f0-9-]{36}$ ]]
          echo "PRIVATE_PLOTTER_BASELINE=$baseline"
          test "$(curl -sS --max-time 25 -o /dev/null -w '%{http_code}' "$docs/prueba-v2/")" = 401
          curl -fsS --max-time 25 "$central/health" > "$tmp/health.json"
          jq -e '.ok==true and .databaseReady==true and .paymentsEnabled==false' "$tmp/health.json" >/dev/null
          jq -n --arg sha "$GITHUB_SHA" --slurpfile s "$tmp/settings.json" '{
            main_module:"index.mjs",
            annotations:{"workers/message":"Fallback visual 40-48 MiB SOLO Documentos privado","workers/commit_sha":$sha},
            bindings:[$s[0].result.bindings[]|{name,type:"inherit"}]
          }' > "$tmp/metadata.json"
          status=$(curl -sS --max-time 150 -o "$tmp/stage.json" -w '%{http_code}' -H "$auth" \
            -F "metadata=@$tmp/metadata.json;type=application/json" \
            -F "index.mjs=@integraciones/autocotizador/recepcion/dist/saber-documentos-cotizador-fase4.mjs;filename=index.mjs;type=application/javascript+module" \
            "$root/versions?bindings_inherit=strict") || status=000
          test "$status" = 200 && jq -e '.success==true and (.result.id|type=="string")' "$tmp/stage.json" >/dev/null ||
            { echo "PRIVATE_PLOTTER_STAGE_FAILED_HTTP_$status";jq -c '{errors:[.errors[]?|{code,message}]}' "$tmp/stage.json" || true;exit 1; }
          candidate=$(jq -r '.result.id' "$tmp/stage.json")
          for id in "$baseline" "$candidate"; do
            curl -fsS --max-time 35 -H "$auth" "$root/versions/$id" > "$tmp/$id.json"
            jq -e --arg id "$id" '.success==true and .result.id==$id and (.result.resources.bindings|type=="array")' "$tmp/$id.json" >/dev/null
            jq -S '[.result.resources.bindings[]|if .type=="secret_text" then {name,type} else . end]|sort_by(.name)' "$tmp/$id.json" > "$tmp/$id.bindings"
            jq -S '.result.resources.script_runtime|{compatibility_date,compatibility_flags,usage_model,limits,placement}' "$tmp/$id.json" > "$tmp/$id.runtime"
          done
          cmp -s "$tmp/$baseline.bindings" "$tmp/$candidate.bindings" || { echo 'PLOTTER_BINDINGS_CHANGED_NO_DEPLOY';exit 1; }
          cmp -s "$tmp/$baseline.runtime" "$tmp/$candidate.runtime" || { echo 'PLOTTER_RUNTIME_CHANGED_NO_DEPLOY';exit 1; }
          curl -fsS --max-time 30 -H "$auth" "$root/deployments" > "$tmp/check-before.json"
          current=$(jq -er '.result.deployments[0].versions | if length==1 and .[0].percentage==100 then .[0].version_id else empty end' "$tmp/check-before.json")
          test "$current" = "$baseline" || { echo 'PLOTTER_CONCURRENT_CHANGE_NO_DEPLOY';exit 1; }
          jq -n --arg id "$candidate" '{strategy:"percentage",versions:[{version_id:$id,percentage:100}],annotations:{"workers/message":"PDF 43 MiB ploteo clasificacion visual SOLO privado"}}' > "$tmp/deploy.json"
          touched=1
          curl -fsS --max-time 70 -H "$auth" -H 'Content-Type: application/json' \
            --data-binary "@$tmp/deploy.json" "$root/deployments" > "$tmp/deploy-result.json"
          jq -e '.success==true' "$tmp/deploy-result.json" >/dev/null
          curl -fsS --max-time 30 -H "$auth" "$root/deployments" > "$tmp/check-after.json"
          current=$(jq -er '.result.deployments[0].versions | if length==1 and .[0].percentage==100 then .[0].version_id else empty end' "$tmp/check-after.json")
          test "$current" = "$candidate" || { echo 'PLOTTER_NEW_VERSION_NOT_ACTIVE';exit 1; }
          test "$(curl -sS --max-time 25 -o /dev/null -w '%{http_code}' "$docs/prueba-v2/")" = 401
          test "$(curl -sS --max-time 30 -u "operador:$PASSWORD" -o "$tmp/new.js" -w '%{http_code}' "$docs/prueba-v2/carga-inteligente.js")" = 200
          grep -Fq 'VISUAL_PDFJS_LIMITADO' "$tmp/new.js"
          grep -Fq 'cad_contornos_vectoriales_sin_relleno' "$tmp/new.js"
          grep -Fq 'Recubierto 130 g' "$tmp/new.js"
          curl -fsS --max-time 25 "$central/health" > "$tmp/health-after.json"
          jq -e '.ok==true and .databaseReady==true and .paymentsEnabled==false' "$tmp/health-after.json" >/dev/null
          echo "PLOTTER_PRIVATE_VERSION_ACTIVE=$candidate"
          echo 'PRIVATE_PLOTTER_CLASSIFIER_VISIBLE_NO_PUBLIC_NO_MAIN_NO_PAYMENTS_NO_R2'
      - name: Publicar resultado verificable de Worker privado
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          if [ "$RESULT" = success ]; then state=success; else state=failure; fi
          jq -n --arg state "$state" --arg context 'saber/plotter-multipagina-private-active' \
             --arg description "Activación solo Worker privado con rollback: $RESULT" \
             --arg target_url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
             '{state:$state,context:$context,description:$description,target_url:$target_url}' >/tmp/saber-private-plot-status.json
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" --input /tmp/saber-private-plot-status.json >/dev/null

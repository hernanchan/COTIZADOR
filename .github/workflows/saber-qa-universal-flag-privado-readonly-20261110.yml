name: Saber - verificar bandera universal real en comprador privado SIN mutaciones
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths: [.github/workflows/saber-qa-universal-flag-privado-readonly-20261110.yml]
permissions:
  contents: read
  statuses: write
jobs:
  confirmar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: saber-cloudflare-pruebas
      deployment: false
    steps:
      - name: Leer flags de Worker sin registrar secretos y comprobar iframe universal
        shell: bash
        env:
          ACCOUNT: ${{ secrets.SABER_CF_ACCOUNT_ID }}
          TOKEN: ${{ secrets.SABER_CF_DEPLOY_TOKEN }}
          PASSWORD: ${{ secrets.SABER_V2_OPERATOR_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ACCOUNT" && test -n "$TOKEN" && test -n "$PASSWORD"
          tmp=$(mktemp -d); trap 'rm -rf "$tmp"' EXIT
          root="https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/workers/scripts/saber-documentos-pruebas"
          curl -fsS --max-time 25 -H "Authorization: Bearer $TOKEN" "$root/settings" > "$tmp/settings.json"
          jq -e '.success==true and (.result.bindings|type=="array")' "$tmp/settings.json" >/dev/null
          for flag in DOCS_R2_UNIVERSAL_DRAFT_ENABLED DOCS_R2_UNIVERSAL_ORDER_ENABLED \
              DOCS_R2_UNIVERSAL_CHECKOUT_ENABLED DOCS_R2_UNIVERSAL_POSTPAY_ENABLED \
              DOCS_R2_UNIVERSAL_TUS_ENABLED DOCS_R2_BIG_ENABLED DOCS_R2_QUOTA_ENABLED \
              DOCS_R2_STAGING_ENABLED DOCS_CLIENT_SANDBOX_CHECKOUT_ENABLED \
              DOCS_CENTRAL_SYNC_ENABLED DOCS_PRICE_ADMIN_D1_ENABLED; do
            if jq -e --arg k "$flag" '.result.bindings | any(.name==$k and .type=="plain_text" and .text=="PRIVATE_TEST_ONLY")' "$tmp/settings.json" >/dev/null;then
              echo "PRIVATE_UNIVERSAL_FLAG_${flag}=OK"
            else
              echo "PRIVATE_UNIVERSAL_FLAG_${flag}=NOT_ENABLED"
            fi
          done
          code=$(curl -sS --max-time 25 -u "operador:$PASSWORD" \
            -o "$tmp/buyer.html" -w '%{http_code}' \
            'https://saber-documentos-pruebas.libreriasaber.workers.dev/prueba-v2/pedido-cliente')
          echo "PRIVATE_UNIVERSAL_BUYER_HTTP=$code"
          test "$code" = 200
          if grep -Fq '/prueba-v2/carga-inteligente?universal=1' "$tmp/buyer.html";then
            echo 'PRIVATE_BUYER_UNIVERSAL_IFRAME_ACTIVE'
          else
            echo 'PRIVATE_BUYER_UNIVERSAL_IFRAME_NOT_ACTIVE'
            exit 1
          fi
          echo 'READ_ONLY_NO_R2_NO_MP_NO_D1_WRITE_NO_PUBLIC'
      - name: Registrar verificación de circuito universal
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          if [ "$RESULT" = success ];then state=success;else state=failure;fi
          jq -n --arg state "$state" --arg context 'saber/universal-iframe-private' \
            --arg description "Disponibilidad privada del universal: $RESULT" \
            --arg target_url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}' > /tmp/universal-iframe-status.json
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" --input /tmp/universal-iframe-status.json >/dev/null

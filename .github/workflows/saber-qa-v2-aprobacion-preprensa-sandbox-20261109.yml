name: Saber QA V2 - aprobar SOLO PDF sintetico sandbox tras cotejo y acceso autorizado
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths: [.github/workflows/saber-qa-v2-aprobacion-preprensa-sandbox-20261109.yml]
permissions:
  contents: read
concurrency:
  group: saber-qa-r2-v2-72e9f66a-aprobar
  cancel-in-progress: false
jobs:
  qa-approved:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    environment:
      name: saber-cloudflare-pruebas
      deployment: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cotejo técnico real y aprobación D1 únicamente del PDF sintético pagado en sandbox
        shell: bash
        env:
          SABER_V2_OPERATOR_PASSWORD: ${{ secrets.SABER_V2_OPERATOR_PASSWORD }}
          SABER_CENTRAL_DEMO_ADMIN_KEY: ${{ secrets.SABER_CENTRAL_DEMO_ADMIN_KEY }}
          DEMO_ADMIN_KEY: ${{ secrets.DEMO_ADMIN_KEY }}
          SABER_CENTRAL_ADMIN_KEY: ${{ secrets.SABER_CENTRAL_ADMIN_KEY }}
          SABER_DOCS_CENTRAL_ADMIN_KEY: ${{ secrets.SABER_DOCS_CENTRAL_ADMIN_KEY }}
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund pdf-lib@1.17.1
          node --check integraciones/autocotizador/recepcion/e2e-v2-aprobacion-qa-r2-sandbox.mjs
          node integraciones/autocotizador/recepcion/e2e-v2-aprobacion-qa-r2-sandbox.mjs
          echo 'QA_SANDBOX_APPROVED_ONLY_NOT_REAL_CUSTOMER_NOT_LIVE'

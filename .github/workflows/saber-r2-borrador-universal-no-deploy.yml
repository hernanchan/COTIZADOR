name: Saber R2 - asociacion universal privada sin deploy
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths:
      - integraciones/autocotizador/recepcion/ficha-prearchivo-universal.mjs
      - integraciones/autocotizador/recepcion/r2-borrador-universal-documentos.mjs
      - integraciones/mercadopago/pruebas/r2-lote-universal-central.mjs
      - tests/r2-borrador-universal-central.test.mjs
      - .github/workflows/saber-r2-borrador-universal-no-deploy.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/r2-borrador-universal-central.test.mjs tests/r2-plan-universal-sin-subida.test.mjs tests/r2-prepago-sin-archivo-central.test.mjs
      - run: echo 'NO_PAYMENTS_NO_UPLOADS_NO_DEPLOY_NO_MAIN'

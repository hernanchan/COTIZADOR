name: Saber R2 - autorización por orden única con cobros generales cerrados
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths: [.github/workflows/saber-r2-canary-qa-20261112.yml]
permissions: {contents: read}
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Contratos pago, staging, cuotas y aislamiento
        shell: bash
        run: |
          set -euo pipefail
          node --check integraciones/mercadopago/pruebas/r2-live-canary-order.mjs
          node --test \
            integraciones/mercadopago/pruebas/r2-live-canary-order.test.mjs \
            integraciones/mercadopago/pruebas/mercadopago-live-central.test.mjs \
            integraciones/mercadopago/pruebas/transferencias-live-central.test.mjs \
            integraciones/mercadopago/pruebas/r2-universal-live-gate-central.test.mjs \
            integraciones/mercadopago/pruebas/r2-universal-live-reserve-central.test.mjs \
            integraciones/mercadopago/pruebas/r2-live-inspection-finalize.test.mjs \
            integraciones/autocotizador/recepcion/r2-live-multipart-documentos.test.mjs
          echo SABER_R2_CANARY_QA_NO_GO_NO_REAL_PAYMENT_PASS

name: Saber R2 - cierre Entregado, permisos y cron SOLO lectura
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths: [.github/workflows/saber-r2-cierre-entrega-preflight-privado-20261109.yml]
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment:
      name: saber-cloudflare-pruebas
      deployment: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prueba local de borrado seguro y condiciones de entrega
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/r2-borrado-entregado-central.test.mjs
          echo 'DELETE_TESTS_R2_NEW_ONLY_IDEMPOTENT_SAFETY_GREEN'
      - name: Comprobar Worker, bucket y cron en Central privada SIN cambios de estado
        shell: bash
        env:
          ACCOUNT: ${{ secrets.SABER_CF_ACCOUNT_ID }}
          TOKEN: ${{ secrets.SABER_CF_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$ACCOUNT" && test -n "$TOKEN"
          base="https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/workers/scripts/saber-pagos-pruebas"
          auth="Authorization: Bearer $TOKEN"
          temp=$(mktemp -d)
          trap 'rm -rf "$temp"' EXIT
          curl -fsS --max-time 25 -H "$auth" "$base/settings" > "$temp/settings"
          jq -e '.success==true and (.result.bindings|type=="array")' "$temp/settings" >/dev/null
          jq -e '.result.bindings|any(.name=="DB" and .type=="d1")' "$temp/settings" >/dev/null
          jq -e '.result.bindings|any(.name=="SABER_R2_GRANDES" and .type=="r2_bucket" and .bucket_name=="saber-documentos-grandes-ensayo-20261106")' "$temp/settings" >/dev/null
          for n in CENTRAL_R2_PURGE_QUEUE_ENABLED CENTRAL_R2_PURGE_EXECUTE_ENABLED;do
            jq -e --arg name "$n" '.result.bindings|any(.name==$name and .type=="plain_text" and .text=="PRIVATE_TEST_ONLY")' "$temp/settings" >/dev/null
          done
          jq -e '.result.bindings|any(.name=="CENTRAL_R2_PURGE_SCOPE" and .type=="plain_text" and .text=="NEW_ORDERS_ONLY")' "$temp/settings" >/dev/null
          echo 'PRIVATE_R2_PURGE_GATES_NEW_ORDERS_ONLY_BUCKET_DB_PRESENT'
          health=$(curl -fsS --max-time 25 'https://saber-pagos-pruebas.libreriasaber.workers.dev/health')
          echo "$health" | jq -e '.ok==true and .databaseReady==true and .paymentsEnabled==false' >/dev/null
          echo 'PAYMENTS_REAL_OFF_DATABASE_READY'
          code=$(curl -sS --max-time 25 -H "$auth" -o "$temp/cron" -w '%{http_code}' "$base/schedules")
          if [ "$code" = 200 ];then
            jq -e '.success==true' "$temp/cron" >/dev/null
            count=$(jq -r '.result.schedules|length' "$temp/cron")
            echo "PRIVATE_CENTRAL_CRON_SCHEDULES=$count"
            test "$count" -gt 0 || { echo 'R2_CLEANUP_RETRY_CRON_NOT_CONFIGURED';exit 1; }
            echo 'R2_CRON_RETRY_AVAILABLE'
          elif [ "$code" = 403 ];then
            echo 'R2_CRON_STATUS_CANNOT_CONFIRM_TOKEN_FORBIDDEN'
          else
            echo "R2_CRON_STATUS_HTTP_$code"
            exit 1
          fi
          echo 'NO_D1_QUERIES_NO_R2_DELETE_NO_PAYMENT_OR_STATE_CHANGES'

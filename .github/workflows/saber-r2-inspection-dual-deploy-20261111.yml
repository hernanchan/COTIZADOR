name: Saber - publicar inspector R2 staff y Central sin abrir cobro grande
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths: [.github/workflows/saber-r2-inspection-dual-deploy-20261111.yml]
permissions: {contents: read}
concurrency: {group: saber-r2-inspection-staff-production, cancel-in-progress: false}
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    environment: {name: saber-cloudflare-pruebas, deployment: false}
    env:
      ACCOUNT: ${{ secrets.SABER_CF_ACCOUNT_ID }}
      DEPLOY: ${{ secrets.SABER_CF_DEPLOY_TOKEN }}
      D1_TOKEN: ${{ secrets.SABER_CF_D1_WRITE_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.SABER_CF_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.SABER_CF_DEPLOY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Testear seguridad y compilar Workers
        run: |
          set -euo pipefail
          node --test integraciones/autocotizador/recepcion/r2-inspeccion-personal-live.test.mjs integraciones/mercadopago/pruebas/r2-live-inspection-finalize.test.mjs
          npm install --no-save --no-audit --no-fund esbuild@0.25.12 wrangler@4.55.0
          (cd integraciones/autocotizador/recepcion && npm install --no-fund --no-audit && npm run build:unificado)
          ./node_modules/.bin/esbuild integraciones/mercadopago/pruebas/worker.js --bundle --platform=browser --format=esm --target=es2022 --outfile=/tmp/saber-r2-live-central-built.mjs
          node --check /tmp/saber-r2-live-central-built.mjs
          node --check integraciones/autocotizador/recepcion/dist/saber-documentos-cotizador-fase4.mjs
          grep -Fq '/personal/api/live-r2-inspection-original' integraciones/autocotizador/recepcion/dist/saber-documentos-cotizador-fase4.mjs
          grep -Fq '/internal/central/live/r2-inspection-source' /tmp/saber-r2-live-central-built.mjs
          echo SABER_R2_INSPECTION_BUILD_AND_TEST_PASS
      - name: Desplegar de forma reversible con R2 cobro NO_GO
        run: |
          set -euo pipefail
          bash integraciones/publicacion/desplegar-inspector-r2-live-20261111.sh
# Release controlado 2026-11-11: UX carga visible PDF/JPG/PNG y mensaje comercial

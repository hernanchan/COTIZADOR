name: Saber R2 - desplegar corrección LIVE central sin abrir gates
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths: [.github/workflows/saber-r2-live-central-fix-deploy-20261111.yml]
permissions: {contents: read}
concurrency: {group: saber-prod-central-r2-fix-20261111, cancel-in-progress: false}
jobs:
  central-r2-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    environment: {name: saber-cloudflare-pruebas, deployment: false}
    env:
      ACCOUNT: ${{ secrets.SABER_CF_ACCOUNT_ID }}
      DEPLOY: ${{ secrets.SABER_CF_DEPLOY_TOKEN }}
      D1_TOKEN: ${{ secrets.SABER_CF_D1_WRITE_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.SABER_CF_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.SABER_CF_DEPLOY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Confirmar corrección y generar bundle sin tocar Cloudflare
        run: |
          set -euo pipefail
          node --check integraciones/mercadopago/pruebas/r2-universal-live-stage-central.mjs
          grep -Fq "central_live_bank_accreditations a" integraciones/mercadopago/pruebas/r2-universal-live-stage-central.mjs
          npm install --no-save --no-audit --no-fund esbuild@0.25.12 wrangler@4.55.0
          node --test integraciones/mercadopago/pruebas/r2-universal-live-gate-central.test.mjs             integraciones/mercadopago/pruebas/r2-universal-live-reserve-central.test.mjs             integraciones/mercadopago/pruebas/mercadopago-live-central.test.mjs
          ./node_modules/.bin/esbuild integraciones/mercadopago/pruebas/worker.js             --bundle --platform=browser --format=esm --target=es2022             --outfile=/tmp/saber-central-live-r2-fixed.mjs
          node --check /tmp/saber-central-live-r2-fixed.mjs
          echo SABER_R2_LIVE_FIX_BUILD_OK
      - name: Leer versión activa, UUID D1 y compuertas antes de desplegar
        run: |
          set -euo pipefail
          root="https://api.cloudflare.com/client/v4/accounts/$ACCOUNT"
          curl -fsS -H "Authorization: Bearer $DEPLOY" "$root/workers/scripts/saber-pagos-produccion/settings" > /tmp/saber-r2-before-settings.json
          jq -e '.success==true and (.result.bindings|any(.name=="SABER_ENTORNO" and .text=="produccion")) and (.result.bindings|any(.name=="MP_LIVE_GATE" and .text=="GO_COMERCIAL_CONFIRMADO")) and (.result.bindings|any(.name=="CENTRAL_LIVE_R2_GATE" and .text=="NO_GO")) and (.result.bindings|any(.name=="CENTRAL_LIVE_R2_STAGING_GATE" and .text=="NO_GO")) and (.result.bindings|any(.name=="CENTRAL_LIVE_R2_QUOTA_GATE" and .text=="NO_GO"))' /tmp/saber-r2-before-settings.json >/dev/null
          jq -r '.result.bindings[].name' /tmp/saber-r2-before-settings.json | sort > /tmp/saber-r2-binding-names
          curl -fsS -H "Authorization: Bearer $DEPLOY" "$root/workers/scripts/saber-pagos-produccion/deployments" > /tmp/saber-r2-before-deployments.json
          jq -re '.result.deployments[0].versions|if length==1 and .[0].percentage==100 then .[0].version_id else empty end' /tmp/saber-r2-before-deployments.json > /tmp/saber-r2-rollback-version
          curl -fsS -H "Authorization: Bearer $D1_TOKEN" "$root/d1/database" > /tmp/saber-r2-dbs.json
          id=$(jq -r '[.result[]|select(.name=="saber-pagos-produccion")]|if length==1 then .[0].uuid else empty end' /tmp/saber-r2-dbs.json)
          test -n "$id"
          sed "s/__D1_PRODUCCION_UUID__/$id/g" integraciones/mercadopago/produccion/wrangler.toml.template > integraciones/mercadopago/produccion/wrangler.toml
          sed -i 's/SABER_ENTORNO = "preparacion"/SABER_ENTORNO = "produccion"/' integraciones/mercadopago/produccion/wrangler.toml
          sed -i 's/MP_LIVE_GATE = "NO_GO"/MP_LIVE_GATE = "GO_COMERCIAL_CONFIRMADO"/' integraciones/mercadopago/produccion/wrangler.toml
          grep -Fq 'keep_vars = true' integraciones/mercadopago/produccion/wrangler.toml
          echo SABER_R2_LIVE_CURRENT_VERSION_BACKED_UP_AND_PAYMENT_GATES_UNCHANGED
      - name: Desplegar solo código Central; deshacer si se pierden compuertas
        run: |
          set -euo pipefail
          root="https://api.cloudflare.com/client/v4/accounts/$ACCOUNT"
          old="$(cat /tmp/saber-r2-rollback-version)"
          deployed=0
          rollback(){
            code=$?
            if [ "$deployed" = 1 ];then
              echo SABER_R2_LIVE_POST_DEPLOY_CHECK_FAILED_ROLLING_BACK
              curl -fsS -X POST -H "Authorization: Bearer $DEPLOY" -H 'Content-Type: application/json'                 -d "$(jq -nc --arg old "$old" '{strategy:"percentage",versions:[{version_id:$old,percentage:100}],annotations:{"workers/message":"Rollback automático R2: compuertas o bindings no conservaron configuración"}}')"                 "$root/workers/scripts/saber-pagos-produccion/deployments" >/tmp/saber-r2-rollback.json || true
            fi
            exit "$code"
          }
          trap rollback ERR
          CI=true npx wrangler deploy --config integraciones/mercadopago/produccion/wrangler.toml             >/tmp/saber-r2-live-deploy.log 2>&1 || { tail -n 25 /tmp/saber-r2-live-deploy.log;exit 1; }
          deployed=1
          curl -fsS -H "Authorization: Bearer $DEPLOY" "$root/workers/scripts/saber-pagos-produccion/settings" >/tmp/saber-r2-after-settings.json
          jq -r '.result.bindings[].name' /tmp/saber-r2-after-settings.json |sort >/tmp/saber-r2-after-names
          diff /tmp/saber-r2-binding-names /tmp/saber-r2-after-names
          jq -e '.success==true and (.result.bindings|any(.name=="SABER_ENTORNO" and .text=="produccion")) and (.result.bindings|any(.name=="MP_LIVE_GATE" and .text=="GO_COMERCIAL_CONFIRMADO")) and (.result.bindings|any(.name=="CENTRAL_LIVE_R2_GATE" and .text=="NO_GO")) and (.result.bindings|any(.name=="CENTRAL_LIVE_R2_STAGING_GATE" and .text=="NO_GO")) and (.result.bindings|any(.name=="CENTRAL_LIVE_R2_QUOTA_GATE" and .text=="NO_GO"))' /tmp/saber-r2-after-settings.json >/dev/null
          curl -fsS -H "Authorization: Bearer $DEPLOY" "$root/workers/scripts/saber-pagos-produccion/deployments" > /tmp/saber-r2-after-deployments.json
          jq -e '.result.deployments[0].versions|length==1 and .[0].percentage==100' /tmp/saber-r2-after-deployments.json >/dev/null
          echo SABER_R2_LIVE_BANK_FIX_DEPLOYED_R2_PAYMENT_GATE_REMAINS_NO_GO

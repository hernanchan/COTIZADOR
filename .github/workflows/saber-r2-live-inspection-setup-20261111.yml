name: Saber - habilitar inspeccion R2 LIVE sin abrir cobros
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths: [.github/workflows/saber-r2-live-inspection-setup-20261111.yml]
permissions: {contents: read}
concurrency: {group: saber-central-live-r2-inspection-setup, cancel-in-progress: false}
jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment: {name: saber-cloudflare-pruebas, deployment: false}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verificar derivacion aislada y sintaxis de inspeccion
        run: |
          set -euo pipefail
          node --check integraciones/publicacion/activar-inspeccion-r2-live-segura-20261111.mjs
          node --check integraciones/autocotizador/recepcion/clave-inspeccion-r2-live.mjs
          node --check integraciones/autocotizador/recepcion/r2-live-inspeccion-cli.mjs
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {derivarClaveInspeccionR2Live} from './integraciones/autocotizador/recepcion/clave-inspeccion-r2-live.mjs';
          const a=derivarClaveInspeccionR2Live('operador-ficticio-de-alta-entropia-0123456789');
          assert.match(a,/^[0-9a-f]{64}$/);
          assert.equal(a,derivarClaveInspeccionR2Live('operador-ficticio-de-alta-entropia-0123456789'));
          assert.notEqual(a,derivarClaveInspeccionR2Live('operador-ficticio-distinto-0123456789'));
          console.log('R2_INSPECTION_LOCAL_KEY_DERIVATION_OK');
          NODE
      - name: Guardar clave de inspección sin mostrarla y cerrar todos los cobros R2
        env:
          SABER_CF_ACCOUNT_ID: ${{ secrets.SABER_CF_ACCOUNT_ID }}
          SABER_CF_DEPLOY_TOKEN: ${{ secrets.SABER_CF_DEPLOY_TOKEN }}
          DEMO_ADMIN_KEY: ${{ secrets.DEMO_ADMIN_KEY }}
        run: |
          set -euo pipefail
          node integraciones/publicacion/activar-inspeccion-r2-live-segura-20261111.mjs

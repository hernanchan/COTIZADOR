name: Saber R2 - orden comercial universal sin pago ni deploy
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths:
      - integraciones/mercadopago/pruebas/r2-universal-order-central.mjs
      - integraciones/autocotizador/recepcion/r2-orden-universal-documentos.mjs
      - integraciones/mercadopago/pruebas/worker.js
      - integraciones/autocotizador/recepcion/worker-fase4-cotizador-unificado.mjs
      - integraciones/mercadopago/pruebas/r2-lote-universal-central.mjs
      - tests/r2-orden-universal-sin-cobro.test.mjs
      - tests/r2-universal-checkout-postpago.test.mjs
      - tests/r2-universal-tus-mixto-postpago.test.mjs
      - tests/r2-universal-interfaz-compra-unica.test.mjs
      - tests/r2-universal-paquete-operador.test.mjs
      - tests/zip-universal-stream.test.mjs
      - tests/r2-universal-borrado-mixto.test.mjs
      - tests/r2-universal-purge-mixto.test.mjs
      - tests/r2-universal-cola-borrado-d1.test.mjs
      - tests/r2-universal-preprensa-central.test.mjs
      - integraciones/autocotizador/recepcion/r2-universal-purge-documentos.mjs
      - integraciones/mercadopago/pruebas/r2-universal-purge-central.mjs
      - integraciones/mercadopago/pruebas/r2-universal-preprensa-central.mjs
      - integraciones/autocotizador/recepcion/zip-universal-stream.mjs
      - integraciones/autocotizador/recepcion/paquete-universal-cliente.mjs
      - integraciones/autocotizador/recepcion/r2-universal-paquete-personal.mjs
      - integraciones/mercadopago/pruebas/r2-universal-package-central.mjs
      - integraciones/autocotizador/recepcion/pantalla-paquete-universal-personal.mjs
      - integraciones/autocotizador/recepcion/flujo-universal-pdf-cliente.mjs
      - integraciones/autocotizador/recepcion/tus-universal-directo-cliente.mjs
      - integraciones/autocotizador/recepcion/carga-unica-cliente.mjs
      - integraciones/autocotizador/recepcion/pantalla-cotizador-v2-prueba-privada.mjs
      - integraciones/mercadopago/pruebas/r2-universal-tus-central.mjs
      - integraciones/autocotizador/recepcion/tus-universal-worker.mjs
      - integraciones/autocotizador/recepcion/tus-universal-puente-central.mjs
      - integraciones/mercadopago/pruebas/r2-universal-checkout-central.mjs
      - integraciones/autocotizador/recepcion/r2-universal-confirmar-pago-central.mjs
      - integraciones/autocotizador/recepcion/r2-universal-checkout-documentos.mjs
      - .github/workflows/saber-r2-orden-universal-no-deploy.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependencias PDF para verificación real del módulo TUS
        run: npm install --no-save --no-audit --no-fund pdf-lib@1.17.1
      - name: Pedido único, idempotencia y compatibilidad sin pagos
        run: |
          set -euo pipefail
          node --test tests/r2-orden-universal-sin-cobro.test.mjs tests/r2-universal-checkout-postpago.test.mjs tests/r2-universal-tus-mixto-postpago.test.mjs tests/r2-universal-interfaz-compra-unica.test.mjs tests/r2-universal-paquete-operador.test.mjs tests/zip-universal-stream.test.mjs tests/r2-universal-borrado-mixto.test.mjs tests/r2-universal-purge-mixto.test.mjs tests/r2-universal-cola-borrado-d1.test.mjs tests/r2-universal-preprensa-central.test.mjs tests/r2-borrador-universal-central.test.mjs tests/r2-prepago-sin-archivo-central.test.mjs tests/r2-plan-universal-sin-subida.test.mjs
          node --check integraciones/mercadopago/pruebas/worker.js
          node --check integraciones/autocotizador/recepcion/worker-fase4-cotizador-unificado.mjs
          echo 'NO_R2_UPLOAD_NO_MP_NO_PRODUCTION_NO_DEPLOY_NO_MAIN'

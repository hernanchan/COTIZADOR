name: Saber R2 - plan multiformato sin pagos ni subidas
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths:
      - integraciones/autocotizador/recepcion/plan-recepcion-universal-r2.mjs
      - tests/r2-plan-universal-sin-subida.test.mjs
      - .github/workflows/saber-r2-plan-universal-no-deploy.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r2-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Clasificación de PDF y presupuesto universal sin subir originales
        run: |
          set -euo pipefail
          node --test tests/r2-plan-universal-sin-subida.test.mjs
          echo 'NO_R2_UPLOAD_NO_MP_NO_ORDER_NO_D1_NO_DEPLOY_NO_MAIN'

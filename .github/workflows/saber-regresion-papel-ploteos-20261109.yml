name: Saber - regresion papeles CAD pleno 80 130
on:
  push:
    branches:
      - integracion/tus-pedido-privado-20261101
    paths:
      - '.github/workflows/saber-regresion-papel-ploteos-20261109.yml'
      - 'integraciones/autocotizador/pruebas/cotizar-ploteos-rapido.mjs'
      - 'integraciones/autocotizador/pruebas/ploteo-papel-cad-recubierto.test.mjs'
      - 'integraciones/autocotizador/recepcion/carga-unica-cliente.mjs'
      - 'integraciones/autocotizador/recepcion/clasificar-ploteo-grande-visual-limitado.mjs'
      - 'tests/ploteo-grande-visual-limitado.test.mjs'
      - 'integraciones/autocotizador/recepcion/ploteos-rapido-cliente.mjs'
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test tarifas y PDF original 43,54 MiB sin leer ni subir el PDF
        run: |
          node --test integraciones/autocotizador/pruebas/ploteo-papel-cad-recubierto.test.mjs tests/ploteo-grande-visual-limitado.test.mjs tests/ploteo-deteccion-automatica-sin-opcion-cad.test.mjs tests/ploteo-grande-mosaico-raster-local.test.mjs
      - name: Compilar interfaces privadas sin desplegar
        working-directory: integraciones/autocotizador/recepcion
        run: |
          npm install --no-audit --no-fund
          npm run build:intake-client
          npm run build:plot-client
      - name: Revisar opcion de papeles en interfaz compilada
        working-directory: integraciones/autocotizador/recepcion
        run: |
          grep -Fq 'Recubierto 130 g' carga-unica-cliente.txt
          grep -Fq 'Recubierto 130 g' ploteos-rapido-cliente.txt
          echo 'PAPEL_80_130_PRESENTE'

      - name: Registrar resultado de clasificador sin despliegue
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          if [ "$RESULT" = success ]; then state=success; else state=failure; fi
          jq -n --arg state "$state" --arg context "saber/plotter-multipagina-43mib" \
            --arg description "Regresión y compilación privada PDF multipágina: $RESULT" \
            --arg target_url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}' >/tmp/saber-plot-status.json
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" --input /tmp/saber-plot-status.json >/dev/null

name: Saber - catalogo y carrito V3 en Chrome Preview sin cobros
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths: [docs/COMPROBAR-CATALOGO-V3-PREVIEW-20261111.trigger]
permissions: {contents: read}
jobs:
  catalogo:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Probar catalogo, botones, fotos y movil sin comprar
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright';
          import assert from 'node:assert/strict';
          const preview='https://8f7acc45.libreriasaber.pages.dev/';
          const browser=await chromium.launch({channel:'chrome',headless:true,args:['--no-sandbox']});
          try{
            const page=await browser.newPage({viewport:{width:1366,height:900}});
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e.message).slice(0,160)));
            const r=await page.goto(preview,{waitUntil:'domcontentloaded',timeout:45000});
            assert.equal(r?.status(),200,'PREVIEW_HOME_HTTP_NOT_200');
            await page.waitForFunction(()=>document.querySelectorAll('#gridEscolar .product').length>0 ||
              (document.getElementById('gridEscolar')?.textContent||'').includes('No pudimos cargar'),
              {timeout:30000});
            const cards=await page.locator('#gridEscolar .product').count();
            console.log('SABER_RELEASE_ESCOLAR_PRODUCT_CARDS='+cards);
            assert.ok(cards>0,'GOOGLE_SHEETS_CATALOG_NOT_RENDERED');
            const button=page.locator('#gridEscolar .product .add').first();
            assert.equal(await button.isVisible(),true,'PRODUCT_ADD_BUTTON_MISSING');
            await button.click();
            console.log('SABER_RELEASE_PRODUCT_ADD_CLICK_OK');
            const imgs=page.locator('#gridEscolar .product img');
            const imageCount=await imgs.count();
            let imagesLoaded=0;
            for(let i=0;i<imageCount;i++){
              const img=imgs.nth(i);
              await img.scrollIntoViewIfNeeded();
              await page.waitForTimeout(1400);
              if(await img.evaluate(e=>e.complete&&e.naturalWidth>0))imagesLoaded++;
            }
            console.log('SABER_RELEASE_IMAGE_COUNT='+imageCount);
            console.log('SABER_RELEASE_IMAGES_LOADED='+imagesLoaded);
            if(imageCount>0)assert.ok(imagesLoaded>0,'PRODUCT_IMAGES_ARE_BROKEN');
            await page.setViewportSize({width:390,height:844});
            await page.waitForTimeout(650);
            const layout=await page.evaluate(()=>({scroll:document.documentElement.scrollWidth,client:document.documentElement.clientWidth}));
            console.log('SABER_RELEASE_MOBILE_LAYOUT='+JSON.stringify(layout));
            assert.ok(layout.scroll<=layout.client+3,'MOBILE_HORIZONTAL_OVERFLOW');
            assert.ok(!errors.some(e=>/ReferenceError|SyntaxError/.test(e)),'PREVIEW_JS_FATAL='+errors.join('|'));
            console.log('SABER_RELEASE_BROWSER_CATALOG_CART_MOBILE_OK_NO_PAYMENT');
          }finally{await browser.close()}
          NODE

name: Saber - restaurar Central sandbox por version con recursos completos
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths: [.github/workflows/saber-restaurar-central-sandbox-version-20261112.yml]
permissions: {contents: read}
concurrency: {group: saber-central-sandbox-version-restore, cancel-in-progress: false}
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    environment: {name: saber-cloudflare-pruebas, deployment: false}
    env:
      ACCOUNT: ${{ secrets.SABER_CF_ACCOUNT_ID }}
      TOKEN: ${{ secrets.SABER_CF_DEPLOY_TOKEN }}
      DEMO_ADMIN_KEY: ${{ secrets.DEMO_ADMIN_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Compilar Central y validar ruta de Nuevos sin modificar entornos
        run: |
          set -euo pipefail
          test -n "$ACCOUNT" && test -n "$TOKEN" && test -n "$DEMO_ADMIN_KEY"
          node --check integraciones/mercadopago/pruebas/worker.js
          grep -Fq 'if(!card.production_state)card.production_state="pendiente";' integraciones/mercadopago/pruebas/worker.js
          npm install --no-save --no-audit --no-fund esbuild@0.25.12
          ./node_modules/.bin/esbuild integraciones/mercadopago/pruebas/worker.js --bundle --platform=browser --format=esm --target=es2022 --outfile=/tmp/saber-central-restaurada.mjs
          node --check /tmp/saber-central-restaurada.mjs
          echo SABER_SANDBOX_VERSION_BUNDLE_READY
      - name: Stage nueva version con bindings preservados y reponer R2 y servicio
        run: |
          set -euo pipefail
          root="https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/workers/scripts/saber-pagos-pruebas"
          site="https://saber-pagos-pruebas.libreriasaber.workers.dev"
          tmp=$(mktemp -d)
          echo "$tmp" > /tmp/saber-sandbox-restoration-tmp
          curl -fsS --max-time 30 -H "Authorization: Bearer $TOKEN" "$root/settings" > "$tmp/before.json"
          jq -e '.success==true and (.result.bindings|\n            any(.name=="DB" and .type=="d1" and ((.id//.database_id)=="60124ac5-1941-44ba-96e5-ea3165b65ec9")) and\n            any(.name=="DEMO_ADMIN_KEY" and .type=="secret_text") and\n            any(.name=="MP_TEST_ACCESS_TOKEN" and .type=="secret_text") and\n            (any(.name=="SABER_DOCUMENTOS")|not) and\n            (any(.name=="SABER_R2_GRANDES")|not))' "$tmp/before.json" >/dev/null
          curl -fsS --max-time 30 -H "Authorization: Bearer $TOKEN" "$root/deployments" > "$tmp/deploy-before.json"
          jq -er '.result.deployments[0].versions|if length==1 and .[0].percentage==100 then .[0].version_id else empty end' "$tmp/deploy-before.json" > "$tmp/old-id"
          curl -fsS --max-time 20 "$site/health" | jq -e '.ok==true and .databaseReady==true and .paymentsEnabled==false' >/dev/null
          jq '{
           main_module:"index.mjs",
           annotations:{"workers/message":"Restaurar R2+servicio y clasificacion 026 solo sandbox"},
           bindings:([.result.bindings[]|{name,type:"inherit"}] +
            [{name:"SABER_DOCUMENTOS",type:"service",service:"saber-documentos-pruebas",environment:"production"},
             {name:"SABER_R2_GRANDES",type:"r2_bucket",bucket_name:"saber-documentos-grandes-ensayo-20261106"}])
          }' "$tmp/before.json" > "$tmp/metadata.json"
          http=$(curl -sS --max-time 120 -o "$tmp/stage.json" -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            -F "metadata=@$tmp/metadata.json;type=application/json" \
            -F "index.mjs=@/tmp/saber-central-restaurada.mjs;filename=index.mjs;type=application/javascript+module" \
            "$root/versions?bindings_inherit=strict")
          if [ "$http" != 200 ] || ! jq -e '.success==true and (.result.id|type=="string")' "$tmp/stage.json" >/dev/null;then
            echo "SABER_SANDBOX_VERSION_STAGE_REJECTED_HTTP_$http"
            jq -c '{success,errors:[.errors[]?|{code,message}]}' "$tmp/stage.json" || true
            exit 1
          fi
          candidate=$(jq -r '.result.id' "$tmp/stage.json")
          echo "$candidate" > "$tmp/candidate-id"
          curl -fsS --max-time 30 -H "Authorization: Bearer $TOKEN" "$root/versions/$candidate" > "$tmp/candidate.json"
          jq -e '.success==true and (.result.resources.bindings|
            any(.name=="SABER_DOCUMENTOS" and .type=="service" and .service=="saber-documentos-pruebas") and
            any(.name=="SABER_R2_GRANDES" and .type=="r2_bucket" and .bucket_name=="saber-documentos-grandes-ensayo-20261106"))' "$tmp/candidate.json" >/dev/null
          jq -r '.result.bindings[].name' "$tmp/before.json" > "$tmp/names-before.txt"
          printf '%s\n' SABER_DOCUMENTOS SABER_R2_GRANDES >> "$tmp/names-before.txt"
          sort -u "$tmp/names-before.txt" > "$tmp/names-expected.txt"
          jq -r '.result.resources.bindings[].name' "$tmp/candidate.json" |sort -u > "$tmp/names-stage.txt"
          diff "$tmp/names-expected.txt" "$tmp/names-stage.txt"
          curl -fsS --max-time 30 -H "Authorization: Bearer $TOKEN" "$root/deployments" > "$tmp/deploy-check.json"
          test "$(jq -er '.result.deployments[0].versions|if length==1 and .[0].percentage==100 then .[0].version_id else empty end' "$tmp/deploy-check.json")" = "$(cat "$tmp/old-id")"
          echo SABER_SANDBOX_RESTORED_VERSION_STAGED_WITH_38_BINDINGS
      - name: Promover version verificada y comprobar orden 026 y seguridad
        run: |
          set -euo pipefail
          tmp=$(cat /tmp/saber-sandbox-restoration-tmp)
          root="https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/workers/scripts/saber-pagos-pruebas"
          site="https://saber-pagos-pruebas.libreriasaber.workers.dev"
          old=$(cat "$tmp/old-id")
          candidate=$(cat "$tmp/candidate-id")
          rollback(){
            result=$?
            trap - ERR
            echo SABER_SANDBOX_DEPLOY_VALIDATION_FAILED_ROLLBACK
            jq -nc --arg old "$old" '{strategy:"percentage",versions:[{version_id:$old,percentage:100}],annotations:{"workers/message":"Rollback por fallo de verificacion Central sandbox"}}' |
              curl -fsS --max-time 40 -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data-binary @- "$root/deployments" >/dev/null ||
              echo SABER_SANDBOX_DEPLOY_ROLLBACK_UNCONFIRMED
            exit "$result"
          }
          trap rollback ERR
          jq -nc --arg id "$candidate" '{strategy:"percentage",versions:[{version_id:$id,percentage:100}],annotations:{"workers/message":"Restaurar R2+servicio Central sandbox y pedido 026 en Nuevos"}}' |
            curl -fsS --max-time 40 -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data-binary @- "$root/deployments" > "$tmp/promote.json"
          jq -e '.success==true' "$tmp/promote.json" >/dev/null
          curl -fsS --max-time 30 -H "Authorization: Bearer $TOKEN" "$root/settings" > "$tmp/after.json"
          jq -e '.success==true and (.result.bindings|
            any(.name=="SABER_DOCUMENTOS" and .type=="service" and .service=="saber-documentos-pruebas") and
            any(.name=="SABER_R2_GRANDES" and .type=="r2_bucket" and .bucket_name=="saber-documentos-grandes-ensayo-20261106"))' "$tmp/after.json" >/dev/null
          jq -r '.result.bindings[].name' "$tmp/after.json" |sort -u > "$tmp/names-after.txt"
          diff "$tmp/names-expected.txt" "$tmp/names-after.txt"
          curl -fsS --max-time 30 "$site/health" | jq -e '.ok==true and .databaseReady==true and .paymentsEnabled==false' >/dev/null
          test "$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "$site/admin/api/orders")" = 401
          curl -fsS --max-time 30 -H "Authorization: Bearer $DEMO_ADMIN_KEY" "$site/admin/api/orders" > "$tmp/orders.json"
          jq -e --arg id "e552cf32-356d-40e3-9736-6fbb8fef5dca" '
            [ .orders[] | select(.id==$id) ] as $m |
            ($m|length)==1 and ($m[0].status=="paid") and
            ($m[0].work_number==26) and ($m[0].file_count==2) and
            ($m[0].production_state=="pendiente") and
            ($m[0].universal_pdf_pending==false) and
            ($m[0].universal_pdf_approved==true) and
            ($m[0].universal_pdf_pending_count==0)' "$tmp/orders.json" >/dev/null
          echo SABER_SANDBOX_026_IN_NUEVOS_ONE_ROW_PAID_TWO_FILES_PREPRESS_APPROVED
          echo SABER_SANDBOX_R2_SERVICE_D1_SECRETS_PRESERVED_NO_REAL_CHARGES
          trap - ERR

name: Saber - runtime LIVE real con cobros cerrados
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths:
      - .github/workflows/saber-runtime-live-cerrado-20261111.yml
      - integraciones/publicacion/preparar-entorno-live-cerrado-20261111.mjs
permissions: {contents: read, statuses: write}
concurrency: {group: saber-runtime-live-cerrado, cancel-in-progress: false}
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    environment: {name: saber-cloudflare-pruebas, deployment: false}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Activar entorno producción en 3 Workers sin activar puertas comerciales
        shell: bash
        env:
          SABER_CF_ACCOUNT_ID: ${{ secrets.SABER_CF_ACCOUNT_ID }}
          SABER_CF_DEPLOY_TOKEN: ${{ secrets.SABER_CF_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          node --check integraciones/publicacion/preparar-entorno-live-cerrado-20261111.mjs
          node integraciones/publicacion/preparar-entorno-live-cerrado-20261111.mjs
      - name: Registrar estado cerrado
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          if [ "$RESULT" = success ];then state=success;else state=failure;fi
          jq -n --arg state "$state" --arg context 'saber/live-runtime-production-gated' \
           --arg description "LIVE runtime production with MP NO_GO: $RESULT" \
           --arg target_url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
           '{state:$state,context:$context,description:$description,target_url:$target_url}' >/tmp/status.json
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" --input /tmp/status.json >/dev/null

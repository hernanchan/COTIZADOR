name: Saber - preparar gates NO_GO explícitos y sin publicar
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths:
      - .github/workflows/saber-stage-gates-live-no-go-20261111.yml
      - integraciones/publicacion/stage-gates-live-no-go-20261111.mjs
permissions: {contents: read, statuses: write}
concurrency: {group: saber-no-go-explicit-worker-config, cancel-in-progress: false}
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    environment: {name: saber-cloudflare-pruebas, deployment: false}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validar y registrar gates cerrados sin habilitar pedidos comerciales
        env:
          SABER_CF_ACCOUNT_ID: ${{ secrets.SABER_CF_ACCOUNT_ID }}
          SABER_CF_DEPLOY_TOKEN: ${{ secrets.SABER_CF_DEPLOY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node --check integraciones/publicacion/stage-gates-live-no-go-20261111.mjs
          node integraciones/publicacion/stage-gates-live-no-go-20261111.mjs
      - name: Estado GO LIVE prep seguro
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          if [ "$RESULT" = success ];then state=success;else state=failure;fi
          jq -n --arg state "$state" --arg context 'saber/live-explicit-commercial-no-go' \
           --arg description "All commercial gates staged NO_GO: $RESULT" \
           --arg target_url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
           '{state:$state,context:$context,description:$description,target_url:$target_url}' >/tmp/status.json
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" --input /tmp/status.json >/dev/null

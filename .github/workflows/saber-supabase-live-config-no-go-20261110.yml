name: Saber - configurar Supabase LIVE en Worker aislado NO_GO
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths:
      - .github/workflows/saber-supabase-live-config-no-go-20261110.yml
      - integraciones/publicacion/preparar-supabase-live-cerrado-20261110.mjs
permissions: {contents: read, statuses: write}
concurrency: {group: saber-supabase-live-config-once, cancel-in-progress: false}
jobs:
  configurar:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment: {name: saber-cloudflare-pruebas, deployment: false}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Guardar solo URL publica de Supabase y secretos generados del Worker
        env:
          SABER_CF_ACCOUNT_ID: ${{ secrets.SABER_CF_ACCOUNT_ID }}
          SABER_CF_DEPLOY_TOKEN: ${{ secrets.SABER_CF_DEPLOY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node --check integraciones/publicacion/preparar-supabase-live-cerrado-20261110.mjs
          node integraciones/publicacion/preparar-supabase-live-cerrado-20261110.mjs
      - name: Publicar evidencia de NO_GO, no secretos
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        shell: bash
        run: |
          if [ "$RESULT" = success ];then state=success;else state=failure;fi
          jq -n --arg state "$state" --arg context 'saber/supabase-live-config-no-go' \
           --arg description "Supabase prod private config on Worker NO_GO: $RESULT" \
           --arg target_url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
           '{state:$state,context:$context,description:$description,target_url:$target_url}' >/tmp/status.json
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" --input /tmp/status.json >/dev/null

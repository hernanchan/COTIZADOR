name: Saber LIVE - desplegar panel transferencia y puente HMAC sin habilitar cobro
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths: [.github/workflows/saber-transfer-personal-dual-deploy-20261112.yml]
permissions: {contents: read}
concurrency: {group: saber-live-staff-dual-deploy, cancel-in-progress: false}
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    environment: {name: saber-cloudflare-pruebas, deployment: false}
    env:
      ACCOUNT: ${{ secrets.SABER_CF_ACCOUNT_ID }}
      DEPLOY: ${{ secrets.SABER_CF_DEPLOY_TOKEN }}
      D1_TOKEN: ${{ secrets.SABER_CF_D1_WRITE_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.SABER_CF_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.SABER_CF_DEPLOY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Probar seguridad, MP y ambos transportes
        shell: bash
        run: |
          set -euo pipefail
          node --check integraciones/mercadopago/pruebas/central-live-bridge.mjs
          node --check integraciones/mercadopago/pruebas/worker.js
          node --check integraciones/autocotizador/recepcion/transferencias-personal-live.mjs
          node --test \
            integraciones/autocotizador/recepcion/transferencias-personal-live.test.mjs \
            integraciones/mercadopago/pruebas/transferencias-live-central.test.mjs \
            integraciones/autocotizador/recepcion/transferencia-live-comprador.test.mjs \
            integraciones/mercadopago/pruebas/mercadopago-live-central.test.mjs
          npm install --no-save --no-audit --no-fund wrangler@4.55.0
          (cd integraciones/autocotizador/recepcion && npm install --no-fund --no-audit && npm run build:unificado)
          node --check integraciones/autocotizador/recepcion/dist/saber-documentos-cotizador-fase4.mjs
          grep -q 'personal/transferencias' integraciones/autocotizador/recepcion/dist/saber-documentos-cotizador-fase4.mjs
          echo SABER_TRANSFER_STAFF_BUILD_READY
      - name: Desplegar dos Workers con rollback y comprobar web
        shell: bash
        run: |
          set -euo pipefail
          bash integraciones/publicacion/desplegar-transferencias-personal-live-20261112.sh
# Esperar propagación de Docs a URL pública antes de verificar las rutas privadas.

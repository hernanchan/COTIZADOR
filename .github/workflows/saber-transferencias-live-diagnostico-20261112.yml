name: Saber - diagnosticar transferencias LIVE sin datos bancarios
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths: [.github/workflows/saber-transferencias-live-diagnostico-20261112.yml]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: {name: saber-cloudflare-pruebas, deployment: false}
    env:
      CF_ACCOUNT: ${{ secrets.SABER_CF_ACCOUNT_ID }}
      CF_DEPLOY: ${{ secrets.SABER_CF_DEPLOY_TOKEN }}
      CF_DB: ${{ secrets.SABER_CF_D1_WRITE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Consultar bindings bancarios de ambos Workers sin imprimir alias ni datos de cuenta
        shell: bash
        run: |
          set -euo pipefail
          node --check integraciones/publicacion/diagnostico-transferencias-live-20261112.mjs
          node integraciones/publicacion/diagnostico-transferencias-live-20261112.mjs

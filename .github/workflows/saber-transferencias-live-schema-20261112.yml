name: Saber LIVE - instalar tablas bancarias D1 sin habilitar transferencias
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths: [.github/workflows/saber-transferencias-live-schema-20261112.yml]
permissions: {contents: read}
concurrency: {group: saber-transfer-schema-live, cancel-in-progress: false}
jobs:
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment: {name: saber-cloudflare-pruebas, deployment: false}
    env:
      CF_ACCOUNT: ${{ secrets.SABER_CF_ACCOUNT_ID }}
      CF_DEPLOY: ${{ secrets.SABER_CF_DEPLOY_TOKEN }}
      CF_DB: ${{ secrets.SABER_CF_D1_WRITE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Crear sólo tablas bancarias idempotentes y comprobar MP/R2 intactos
        shell: bash
        run: |
          set -euo pipefail
          node --check integraciones/publicacion/instalar-transferencias-d1-20261112.mjs
          node integraciones/publicacion/instalar-transferencias-d1-20261112.mjs

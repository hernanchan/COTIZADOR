name: Saber V3 - guardar fotos de catálogo públicas dentro de la web
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths: [.github/workflows/saber-v3-fotos-locales-20261112.yml]
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: saber-v3-fotos-publicas-sync, cancel-in-progress: false}
jobs:
  fotos:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Copiar únicamente imágenes que Google Sheets ya publica
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "integracion/tus-pedido-privado-20261101"
          node --check integraciones/publicacion/sync-v3-product-photos-20261112.mjs
          node integraciones/publicacion/sync-v3-product-photos-20261112.mjs
      - name: Registrar fotos y manifiesto solamente en rama de integración
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "integracion/tus-pedido-privado-20261101"
          git config user.name "Saber Web QA"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vidriera/fotos-productos.json vidriera/assets/productos/
          if git diff --cached --quiet;then
            echo "SABER_PHOTOS_ALREADY_UP_TO_DATE"
          else
            git commit -m "assets(v3): alojar 4 fotos públicas de productos para evitar fallos de Drive"
            git push origin "HEAD:$GITHUB_REF_NAME"
            echo "SABER_PHOTOS_SYNCED_ONLY_IN_INTEGRATION_BRANCH"
          fi
          echo "NO_MAIN_NO_PAGES_DEPLOY_NO_PAYMENTS_NO_PRIVATE_DRIVE"

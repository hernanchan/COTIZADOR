name: Saber V3 - seguridad puerta comercial OFF sin desplegar
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths:
      - vidriera/cotizar.html
      - vidriera/portal-comercial.json
      - tests/v3-cotizar-preview-nuevo.test.mjs
      - .github/workflows/saber-v3-gate-produccion-no-deploy.yml
      - integraciones/publicacion/mercadopago-live-preflight.mjs
      - tests/mp-live-verificador-no-deploy.test.mjs
      - integraciones/autocotizador/recepcion/seleccionar-transporte-pdf.mjs
      - integraciones/autocotizador/recepcion/carga-unica-cliente.mjs
      - tests/r2-tamano-independiente-servicio.test.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contrato-comercial:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probar bloqueo producción, destino propio y preview aislada
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/v3-cotizar-preview-nuevo.test.mjs tests/mp-live-verificador-no-deploy.test.mjs tests/r2-tamano-independiente-servicio.test.mjs
          node -e "const a=require('./vidriera/portal-comercial.json');if(a.enabled!==false||a.release!=='NO_GO'||a.buyerUrl!==null)process.exit(1);console.log('COMMERCIAL_GATE_DEFAULT_OFF')"
          echo 'MP_LIVE_VALIDATOR_OFFLINE_ONLY_NOT_WIRED_TO_CHECKOUT'
          echo 'NO_GO_UNTIL_EXPLICIT_AUTHORIZATION'
          echo 'NO_WORKER_DEPLOY_NO_MAIN_NO_MP_LIVE_NO_ORDERS_NO_R2'

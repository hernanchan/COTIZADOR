name: Saber - validar cotizador inteligente privado real
on:
  push:
    branches: [polaroids/express-pdf-unico-20261023]
    paths: [.github/workflows/saber-validar-cotizador-inteligente-privado.yml]
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment:
      name: saber-cloudflare-pruebas
      deployment: false
    steps:
      - name: Validar rechazo anónimo y pantalla privada sin enviar datos
        shell: bash
        env:
          PASSWORD: ${{ secrets.SABER_V2_OPERATOR_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$PASSWORD"
          root=https://saber-documentos-pruebas.libreriasaber.workers.dev/prueba-v2
          code=$(curl -sS --max-time 20 -o /tmp/anonymous -w '%{http_code}' "$root/carga-inteligente")
          if [ "$code" != 401 ]; then echo "ANONYMOUS_NOT_REJECTED_HTTP_$code"; exit 1; fi
          echo "ANONYMOUS_REJECTED_401"
          code=$(curl -sS --max-time 20 -u "operador:$PASSWORD" -o /tmp/page -w '%{http_code}' "$root/carga-inteligente")
          if [ "$code" != 200 ]; then echo "PRIVATE_PAGE_FAILED_HTTP_$code"; exit 1; fi
          grep -Fq 'id="archivos"' /tmp/page
          grep -Fq 'multiple' /tmp/page
          grep -Fq 'zonaArchivos' /tmp/page
          grep -Fq '/prueba-v2/carga-inteligente.js' /tmp/page
          echo "SMART_QUOTER_MULTIPLE_PDF_PRIVATE_HTTP_200"
          code=$(curl -sS --max-time 20 -u "operador:$PASSWORD" -o /tmp/client -w '%{http_code}' "$root/carga-inteligente.js")
          if [ "$code" != 200 ]; then echo "PRIVATE_JS_FAILED_HTTP_$code"; exit 1; fi
          grep -Fq 'clasificarPaginasPloteo' /tmp/client || grep -Fq 'sin-clasificar' /tmp/client
          echo "CAD_POSTER_ANALYZER_CLIENT_PRESENT"
          code=$(curl -sS --max-time 20 -u "operador:$PASSWORD" -o /tmp/portal -w '%{http_code}' "$root/")
          if [ "$code" != 200 ]; then echo "INTEGRATED_PORTAL_FAILED_HTTP_$code"; exit 1; fi
          grep -Fq 'id="smart"' /tmp/portal
          grep -Fq 'SABER_SMART_DOCUMENTS_TO_PRIVATE' /tmp/portal
          grep -Fq 'send-all-pdf' /tmp/portal
          echo "INTEGRATED_SINGLE_SCREEN_PRIVATE_HTTP_200"
          rm -f /tmp/portal
          rm -f /tmp/anonymous /tmp/page /tmp/client
          echo "READ_ONLY_NO_PAYMENTS_NO_PUBLIC_WEBSITE"
      - name: Estado real de acceso inteligente
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          STATUS: ${{ job.status }}
        run: |
          if [ "$STATUS" = success ]; then state=success; description="Clasificador privado autenticado y accesible"; else state=failure; description="Revisar acceso privado clasificador"; fi
          jq -n --arg state "$state" --arg context 'saber-v2/smart-quote-live' --arg description "$description" --arg target_url "https://github.com/$GH_REPO/actions/runs/$GITHUB_RUN_ID" '{state:$state,context:$context,description:$description,target_url:$target_url}' >/tmp/status.json
          gh api -X POST "repos/$GH_REPO/statuses/$GH_SHA" --input /tmp/status.json

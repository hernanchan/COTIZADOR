name: Saber - verificar conciliacion automatica y pedido real de 100
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths: [.github/workflows/saber-verificar-auto-mp-live-20261113.yml]
permissions: {contents: write}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: {name: saber-cloudflare-pruebas, deployment: false}
    env:
      ACCOUNT: ${{ secrets.SABER_CF_ACCOUNT_ID }}
      TOKEN: ${{ secrets.SABER_CF_DEPLOY_TOKEN }}
      D1TOKEN: ${{ secrets.SABER_CF_D1_WRITE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verificar cron, aislamiento y pedido de ARS 100 SOLO GET y SELECT
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import {mkdir,writeFile} from 'node:fs/promises';
          const report={schema:'saber-mp-live-auto-check-v1',date:new Date().toISOString(),readonly:true};
          const a=process.env.ACCOUNT,t=process.env.TOKEN,d=process.env.D1TOKEN;
          const base='https://api.cloudflare.com/client/v4/accounts/'+a;
          const cf=async(path,key=t,opts={})=>{
           const r=await fetch(base+path,{...opts,headers:{Authorization:'Bearer '+key,...opts.headers},signal:AbortSignal.timeout(20000)});
           const j=await r.json().catch(()=>null);
           if(!r.ok||j?.success!==true)throw Error('CLOUDFLARE_'+r.status);
           return j.result;
          };
          try{
           const schedules=await cf('/workers/scripts/saber-pagos-produccion/schedules');
           report.cronActive=(schedules.schedules||[]).some(x=>x.cron==='* * * * *');
           report.crons=(schedules.schedules||[]).length;
           const codeRes=await fetch(base+'/workers/scripts/saber-pagos-produccion',{headers:{Authorization:'Bearer '+t},signal:AbortSignal.timeout(20000)});
           if(!codeRes.ok)throw Error('WORKER_'+codeRes.status);
           const code=await codeRes.text();
           report.autoCodeDeployed=code.includes('SABER_MP_LIVE_CRON_ACREDITADOS')&&code.includes('central_mp_live_auto_health');
           report.sandboxIsolated=code.includes('SABER_MP_LIVE_CRON_AISLADO');
           report.staffFallbackReady=code.includes('SABER_MP_LIVE_STAFF_AUTO_ACREDITADOS');
          }catch(e){report.cronError=String(e.message||e).slice(0,80)}
          try{
           const dbs=await cf('/d1/database',d);
           const db=dbs.find(x=>x.name==='saber-pagos-produccion');
           if(!db?.uuid)throw Error('DB_NOT_FOUND');
           const sql="SELECT status AS estado, COUNT(*) AS cantidad FROM orders WHERE amount_ars=100 AND datetime(created_at)>=datetime('now','-48 hours') GROUP BY status";
           const q=await cf('/d1/database/'+db.uuid+'/query',d,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sql})});
           report.orders100=q?.[0]?.results||[];
           const meta=await cf('/d1/database/'+db.uuid+'/query',d,{method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({sql:"SELECT name FROM sqlite_master WHERE type='table' AND name='central_mp_live_auto_health'"})});
           if(meta?.[0]?.results?.length){
            const health=await cf('/d1/database/'+db.uuid+'/query',d,{method:'POST',headers:{'Content-Type':'application/json'},
              body:JSON.stringify({sql:"SELECT checked_at,checked,recovered,pending,review,errors,state FROM central_mp_live_auto_health WHERE id=1"})});
            report.health=health?.[0]?.results?.[0]||null;
           }else report.health=null;
          }catch(e){report.d1Error=String(e.message||e).slice(0,80)}
          await mkdir('docs',{recursive:true});
          await writeFile('docs/INCIDENCIA-MP-LIVE-AUTOMATICO-ESTADO.json',JSON.stringify(report,null,2)+'\n');
          console.log('SABER_MP_LIVE_AUTOMATICO='+JSON.stringify(report));
          EOF
      - name: Guardar informe anonimo del cobro
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/INCIDENCIA-MP-LIVE-AUTOMATICO-ESTADO.json || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/INCIDENCIA-MP-LIVE-AUTOMATICO-ESTADO.json
          if ! git diff --cached --quiet;then
            git commit -m "ops: comprobar cron MP LIVE, estado D1 y pedido 100"
            git push origin HEAD:integracion/tus-pedido-privado-20261101
          fi

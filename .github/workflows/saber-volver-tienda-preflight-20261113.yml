name: Saber - preflight boton volver a tienda LIVE solo lectura
on:
  push:
    branches: [fix/volver-tienda-cotizador-live-20261113]
    paths: ['.github/workflows/saber-volver-tienda-preflight-20261113.yml']
permissions: {contents: read}
jobs:
  read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: {name: saber-cloudflare-pruebas, deployment: false}
    env:
      ACCOUNT: ${{ secrets.SABER_CF_ACCOUNT_ID }}
      TOKEN: ${{ secrets.SABER_CF_DEPLOY_TOKEN }}
    steps:
      - name: Leer Worker de documentos en producción sin modificarlo
        shell: bash
        run: |
          set -euo pipefail
          : "${ACCOUNT:?}" "${TOKEN:?}"
          curl --fail --silent --show-error --max-time 40 \
            -H "Authorization: Bearer $TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/workers/scripts/saber-documentos-produccion" \
            -o /tmp/saber-live-current.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const text=fs.readFileSync('/tmp/saber-live-current.mjs','utf8');
          const labels=[
            '<header><strong>Librería Saber</strong></header>',
            '<header><strong>Librería Saber · Impresiones y ploteos</strong></header>'
          ];
          console.log('SABER_WORKER_SIZE_BYTES',text.length);
          for(const label of labels) console.log('SABER_EXACT_HEADER_COUNT',text.split(label).length-1);
          for(const needle of ['<header','Librería Saber','Impresiones y ploteos','<strong','api/pedido/live/sesion','GO_COMERCIAL_CONFIRMADO','<html','content-type']){
            const count=text.split(needle).length-1;
            console.log('SABER_SAFE_MARKER',JSON.stringify(needle),count);
          }
          const h=text.indexOf('<header');
          console.log('SABER_SAFE_HEADER_SHAPE',h<0?'NO_LITERAL_HEADER':text.slice(h,Math.min(h+200,text.length)).replace(/[\\r\\n]/g,' '));
          for(const needle of ['Librería Saber','Impresiones y ploteos','Librer\\u00eda Saber']){
            let index=-1;
            for(let j=0;j<5;j++){
              index=text.indexOf(needle,index+1);
              if(index<0)break;
              console.log('SABER_UI_NEAR_LABEL',JSON.stringify(needle),j,text.slice(Math.max(0,index-100),Math.min(index+170,text.length)).replaceAll('\\n',' ').replaceAll('\\r',' '));
            }
          }
          const marker='Impresiones y ploteos';
          let last=-1,position=-1;
          while((position=text.indexOf(marker,position+1))>=0)last=position;
          if(last>=0)console.log('SABER_UI_LIVE_HEADER_CONTEXT',JSON.stringify(text.slice(Math.max(0,last-320),Math.min(text.length,last+650))));
          for(const needle of [String.raw`<header><strong>Librer\xEDa Saber</strong></header>`,
            String.raw`<header><strong>Librer\xEDa Saber \xB7 Impresiones y ploteos</strong></header>`]){
            const count=text.split(needle).length-1;
            console.log('SABER_UI_ENCODED_HEADER_MATCH',count);
            assert.equal(count,1,'Encabezado activo distinto: cancelar despliegue');
          }
          console.log('SABER_UI_RETURN_PREFLIGHT_OK_NO_DEPLOY_NO_PAYMENT');
          NODE

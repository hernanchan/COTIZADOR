name: Ensayo integral aislado pago-entrega-borrado TUS (sin MP ni datos reales)
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths:
      - tests/tus-borrado-integral-aislado-sin-mp.test.mjs
      - docs/ENSAYAR-INTEGRAL-AISLADO-TUS.trigger
permissions:
  contents: read
jobs:
  ensayo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Simulación en memoria de D1, pago y Storage, usando funciones reales
        run: |
          set -euo pipefail
          node --test tests/tus-borrado-integral-aislado-sin-mp.test.mjs tests/tus-borrado-pipeline-extremo-a-extremo.test.mjs tests/tus-cola-borrado-entregado.test.mjs
      - name: Garantía de no utilizar servicios externos
        run: echo 'TEST_ONLY_NO_DB_WRITE_NO_MP_NO_STORAGE_DELETE_NO_PRODUCTION'

name: Borrar físicamente SOLO PDF sintético 024, con restauración del Worker de pruebas
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths: [docs/EJECUTAR-BORRADO-FISICO-CANARIA-024.trigger]
permissions:
  contents: read
concurrency:
  group: saber-disposable-tus-024-exclusive
  cancel-in-progress: false
jobs:
  prueba-real:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: saber-cloudflare-pruebas
      deployment: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probar que no se acepta ningún otro pedido y compilar Worker original
        shell: bash
        run: |
          set -euo pipefail
          node --check integraciones/autocotizador/recepcion/ensayo-borrado-fisico-canaria-024.mjs
          node --test tests/tus-canaria-borrado-fisico-024.test.mjs
          cd integraciones/autocotizador/recepcion
          npm install --no-audit --no-fund
          npm run build:unificado
          node --check dist/saber-documentos-cotizador-fase4.mjs
      - name: Desplegar temporalmente, borrar exclusivamente canaria y restaurar versión original
        shell: bash
        env:
          ACCOUNT: ${{ secrets.SABER_CF_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.SABER_CF_DEPLOY_TOKEN }}
          OPERATOR: ${{ secrets.SABER_V2_OPERATOR_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ACCOUNT" && test -n "$CF_TOKEN" && test -n "$OPERATOR"
          root="https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/workers/scripts"
          auth="Authorization: Bearer $CF_TOKEN"
          host='https://saber-documentos-pruebas.libreriasaber.workers.dev'
          canary='WEB-ENSAYO-DA97408CCD06FFED80433A8E2A3B3FB4'
          object="v2/$canary/3c98ffd9-ab0a-47ae-ad92-125dd7c9a2a5.pdf"
          dir=$(mktemp -d)
          nonce=$(openssl rand -hex 24)
          deployed=0
          previous=''
          restore() {
            status=$?
            trap - EXIT INT TERM
            set +e
            if [ "$deployed" = 1 ] && [ -n "$previous" ]; then
              jq -n --arg v "$previous" '{strategy:"percentage",versions:[{percentage:100,version_id:$v}],annotations:{"workers/message":"Restauración inmediata: ensayo canario concluido, PURGA OFF"}}' > "$dir/restore.json"
              curl --fail --silent --show-error --max-time 70 -H "$auth" -H 'Content-Type: application/json' --data-binary "@$dir/restore.json" "$root/saber-documentos-pruebas/deployments" > "$dir/restore-result.json"
              if ! jq -e '.success == true' "$dir/restore-result.json" >/dev/null 2>&1; then
                echo "ERROR_GRAVE_RESTAURACION_DOCUMENTOS"
                status=1
              else
                active=''
                for i in 1 2 3 4 5 6 7 8; do
                  curl --silent --show-error --max-time 20 -H "$auth" "$root/saber-documentos-pruebas/deployments" > "$dir/final.json"
                  active=$(jq -r '.result.deployments[0].versions[]?|select(.percentage==100)|.version_id' "$dir/final.json" | head -n1)
                  if [ "$active" = "$previous" ]; then break; fi
                  sleep 2
                done
                if [ "$active" != "$previous" ]; then
                  echo "ERROR_GRAVE_RESTAURACION_NO_CONFIRMADA"
                  status=1
                else
                  echo "VERSION_DOCUMENTOS_ORIGINAL_RESTAURADA_Y_VERIFICADA"
                fi
              fi
            fi
            rm -rf "$dir"
            exit "$status"
          }
          trap restore EXIT INT TERM
          curl --fail --silent --show-error --max-time 25 -H "$auth" "$root/saber-pagos-pruebas/settings" > "$dir/central.json"
          curl --fail --silent --show-error --max-time 25 -H "$auth" "$root/saber-documentos-pruebas/settings" > "$dir/docs.json"
          curl --fail --silent --show-error --max-time 25 -H "$auth" "$root/saber-documentos-pruebas/deployments" > "$dir/before.json"
          jq -e '.success==true' "$dir/central.json" >/dev/null
          jq -e '.success==true' "$dir/docs.json" >/dev/null
          jq -e '.success==true' "$dir/before.json" >/dev/null
          previous=$(jq -r '.result.deployments[0].versions[]?|select(.percentage==100)|.version_id' "$dir/before.json" | head -n1)
          test -n "$previous"
          jq -e '.result.bindings|any(.name=="CENTRAL_TUS_PURGE_QUEUE_ENABLED" and .type=="plain_text" and .text=="OFF")' "$dir/central.json" >/dev/null
          jq -e '.result.bindings|any(.name=="CENTRAL_TUS_PURGE_EXECUTE_ENABLED" and .type=="plain_text" and .text=="OFF")' "$dir/central.json" >/dev/null
          jq -e '.result.bindings|any(.name=="CENTRAL_TUS_PURGE_CANARY_ORDER" and .text=="WEB-ENSAYO-DA97408CCD06FFED80433A8E2A3B3FB4")' "$dir/central.json" >/dev/null
          jq -e '.result.bindings|any(.name=="DOCS_TUS_PURGE_ENABLED" and .type=="plain_text" and .text=="OFF")' "$dir/docs.json" >/dev/null
          jq -e '.result.bindings|any(.name=="DOCS_TUS_PURGE_CANARY_ORDER" and .text=="WEB-ENSAYO-DA97408CCD06FFED80433A8E2A3B3FB4")' "$dir/docs.json" >/dev/null
          jq -e '.result.bindings|any(.name=="DOCS_TUS_SUPABASE_SERVICE_KEY" and .type=="secret_text")' "$dir/docs.json" >/dev/null
          jq -e '.result.bindings|any(.name=="DOCS_V2_PRIVATE_UI_SECRET" and .type=="secret_text")' "$dir/docs.json" >/dev/null
          jq -n --slurpfile s "$dir/docs.json" --arg nonce "$nonce" \
            '{main_module:"index.mjs",annotations:{"workers/message":"Canario PDF único 024: versión temporal y reversión automática"},
             bindings:([$s[0].result.bindings[]|
               select(.name!="DOCS_CANARY_DISPOSAL_ENABLED" and .name!="DOCS_CANARY_DISPOSAL_NONCE")|
               {name,type:"inherit"}]+
               [{name:"DOCS_CANARY_DISPOSAL_ENABLED",type:"plain_text",text:"PRIVATE_TEST_ONLY"},
                {name:"DOCS_CANARY_DISPOSAL_NONCE",type:"plain_text",text:$nonce}])}' > "$dir/metadata.json"
          cat > "$dir/index.mjs" <<'JS'
          import original from './original.mjs';
          import {borrarCanariaSinteticaUnica} from './canaria.mjs';
          export default {
            async fetch(request,env,ctx) {
              if(new URL(request.url).pathname==='/internal/ensayo-unico-borrar-canaria-024')
                return borrarCanariaSinteticaUnica(request,env);
              return original.fetch(request,env,ctx);
            }
          };
          JS
          node --check "$dir/index.mjs"
          curl --silent --show-error --max-time 120 -H "$auth" \
             -F "metadata=@$dir/metadata.json;type=application/json" \
             -F "index.mjs=@$dir/index.mjs;filename=index.mjs;type=application/javascript+module" \
             -F "original.mjs=@integraciones/autocotizador/recepcion/dist/saber-documentos-cotizador-fase4.mjs;filename=original.mjs;type=application/javascript+module" \
             -F "canaria.mjs=@integraciones/autocotizador/recepcion/ensayo-borrado-fisico-canaria-024.mjs;filename=canaria.mjs;type=application/javascript+module" \
             "$root/saber-documentos-pruebas/versions?bindings_inherit=strict" > "$dir/version.json"
          if ! jq -e '.success == true and (.result.id|type=="string")' "$dir/version.json" >/dev/null; then
            jq -c '{success,errors:[.errors[]?|{code,message}]}' "$dir/version.json"
            exit 1
          fi
          target=$(jq -r '.result.id' "$dir/version.json")
          jq -n --arg v "$target" '{strategy:"percentage",versions:[{percentage:100,version_id:$v}],annotations:{"workers/message":"Ensayo físico único canario 024, revertir inmediatamente"}}' > "$dir/deploy.json"
          deployed=1
          curl --fail --silent --show-error --max-time 75 -H "$auth" -H 'Content-Type: application/json' --data-binary "@$dir/deploy.json" "$root/saber-documentos-pruebas/deployments" > "$dir/deployed.json"
          jq -e '.success==true' "$dir/deployed.json" >/dev/null
          active=''
          for i in 1 2 3 4 5 6 7 8; do
            curl --fail --silent --show-error --max-time 25 -H "$auth" "$root/saber-documentos-pruebas/deployments" > "$dir/active.json"
            active=$(jq -r '.result.deployments[0].versions[]?|select(.percentage==100)|.version_id' "$dir/active.json" | head -n1)
            if [ "$active" = "$target" ]; then break; fi
            sleep 2
          done
          test "$active" = "$target"
          # El endpoint existe sólo en la versión TEMPORAL. Nunca hay una
          # versión estable ni una ruta pública de borrado de canarios.
          http=$(curl --silent --show-error --max-time 45 -u "operador:$OPERATOR" \
            -X POST -H "Origin: $host" \
            -H "x-saber-disposable-nonce: $nonce" \
            -H "Content-Type: application/json" \
            --data "{\"webOrderId\":\"$canary\",\"operation\":\"delete-synthetic-canary-only\"}" \
            -o "$dir/result.json" -w '%{http_code}' "$host/internal/ensayo-unico-borrar-canaria-024")
          if [ "$http" != "200" ]; then
            echo "BORRADO_CANARIO_HTTP=$http"
            jq -c '{ok,error}' "$dir/result.json" || true
            exit 1
          fi
          jq -e --arg id "$canary" --arg object "$object" \
           '.ok==true and .webOrderId==$id and .removedObject==$object and
            .deletedCount==1 and .verifiedAbsent==true and .sha256Verified==true and
            .testOnly==true and .paymentVerified==false and .deliveryVerified==false' "$dir/result.json" >/dev/null
          echo 'CANARIA_024_ELIMINADA_FISICAMENTE_EN_SUPABASE_VERIFICADO_HEAD404'
          echo 'LA_ORDEN_PERMANECE_NO_PAGADA_Y_NO_ENTREGADA'
          echo 'LOS_3_FLAGS_DE_PURGA_GENERAL_CONTINUARON_OFF'
          # trap EXIT restaura INCONDICIONALMENTE versión anterior.

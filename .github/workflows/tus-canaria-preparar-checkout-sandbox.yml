name: Orden canaria 024 retirada - no iniciar otro pago Sandbox
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths: [docs/PREPARAR-ENLACE-PAGO-CANARIO-024.trigger]
permissions:
  contents: read
jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Evitar pagos de un PDF sintético que ya fue eliminado
        run: |
          echo 'CANARIA_024_RETIRED_NO_CHECKOUT_NO_DELETE'
          echo 'No crear nuevas preferencias: el PDF fue eliminado en el ensayo aislado.'

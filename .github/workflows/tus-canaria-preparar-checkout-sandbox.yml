name: Preparar enlace Checkout Pro SOLO orden canaria 024 (Sandbox)
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths: [docs/PREPARAR-ENLACE-PAGO-CANARIO-024.trigger]
permissions:
  contents: read
concurrency:
  group: saber-checkout-canary-024
  cancel-in-progress: false
jobs:
  checkout:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: saber-cloudflare-pruebas
      deployment: false
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Crear referencia de pago exclusiva de la orden 024 en vendedor test_user
        shell: bash
        env:
          SABER_V2_OPERATOR_PASSWORD: ${{ secrets.SABER_V2_OPERATOR_PASSWORD }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const password=process.env.SABER_V2_OPERATOR_PASSWORD;
          if(typeof password!=='string'||password.length<16)throw Error('OPERADOR_PRIVADO_NO_CONFIGURADO');
          const host='https://saber-documentos-pruebas.libreriasaber.workers.dev';
          const order='WEB-ENSAYO-DA97408CCD06FFED80433A8E2A3B3FB4';
          const r=await fetch(host+'/prueba-v2/api/ensayo-tus-canaria-checkout',{
           method:'POST',redirect:'manual',signal:AbortSignal.timeout(90000),
           headers:{Authorization:'Basic '+Buffer.from('operador:'+password).toString('base64'),
             Origin:host,'Content-Type':'application/json'},
           body:JSON.stringify({action:'start',webOrderId:order})
          });
          let body;try{body=await r.json()}catch{throw Error('CHECKOUT_CANARIO_RESPUESTA_INVALIDA')}
          if(r.status!==200||body?.ok!==true)
           throw Error('CHECKOUT_CANARIO_HTTP_'+r.status+' '+String(body?.error||'No preparado').slice(0,100));
          if(body.webOrderId!==order||
             body.commercialOrderId!=='f5bddab7-6078-4f00-9fba-61f2210b0b20'||
             body.amountArs!==100||body.mode!=='sandbox-only')
           throw Error('CHECKOUT_IDENTIDAD_O_MONTO_INCORRECTOS');
          const url=new URL(body.checkoutUrl);
          if(url.protocol!=='https:'||
             !/(^|\\.)mercadopago\\.com(\\.ar)?$/.test(url.hostname)||
             url.hash||url.password||url.username)
           throw Error('CHECKOUT_URL_NO_AUTORIZADA');
          console.log('CANARY_024_SANDBOX_CHECKOUT_READY');
          console.log('CANARY_024_TOTAL_ARS='+body.amountArs);
          console.log('CANARY_024_MP_CHECKOUT_URL='+url.href);
          NODE
      - name: Garantía no borrar PDF al preparar pago
        run: echo 'ONLY_MP_TEST_PREFERENCE_NO_DELETE_NO_PRODUCTION_PAYMENT'

name: Verificar integración TUS privada (SIN despliegue)
on:
  push:
    branches:
      - integracion/tus-pedido-privado-20261101
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  pruebas-privadas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout de rama experimental
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependencias mínimas para pruebas y compilación
        run: npm install --no-save --no-audit --no-fund pdf-lib@1.17.1 esbuild@0.25.12
      - name: Contrato TUS y pipeline PDF real, sin D1 ni cuentas
        run: node --test tests/tus-pedido-privado.test.mjs tests/tus-recuperar-en-d1.test.mjs tests/tus-pagos-prepublicacion-bloqueados.test.mjs tests/tus-pagos-concurrencia-d1.test.mjs tests/tus-pagos-preferencia-validada.test.mjs tests/tus-pagos-revocaciones.test.mjs tests/tus-pagos-webhook-central-verified.test.mjs tests/tus-pagos-estado-cliente-seguro.test.mjs tests/tus-pagos-preferencia-nueva-sandbox.test.mjs tests/tus-transferencias-pendientes.test.mjs tests/tus-transferencias-flujo-d1.test.mjs tests/tus-transferencias-acreditacion.test.mjs tests/tus-documentos-payment-preflight.test.mjs tests/tus-documentos-sandbox-preparacion.test.mjs tests/tus-pago-cliente-sandbox.test.mjs tests/tus-pago-estado-automatico-ui.test.mjs tests/tus-cotizacion-privada-recuperacion.test.mjs tests/tus-boton-envio-borrador-anterior.test.mjs tests/tus-pagos-autoconciliacion-cliente.test.mjs tests/tus-documentos-payment-diagnostic.test.mjs tests/tus-central-pagos-verificados.test.mjs tests/tus-central-pedidos-pagados-ficha.test.mjs tests/tus-central-seguimiento-operativo.test.mjs tests/tus-borrado-entregado-seguro.test.mjs tests/tus-borrado-plan-central-firmado.test.mjs tests/tus-cola-borrado-entregado.test.mjs tests/tus-borrado-pipeline-extremo-a-extremo.test.mjs tests/tus-cotizador-cliente-publico-solo-precio.test.mjs tests/tus-portal-comprador.test.mjs tests/tus-telefono-contacto-pedido.test.mjs tests/tus-admin-tarifario-d1.test.mjs tests/tus-tarifario-aprobado-puente.test.mjs tests/tus-bloqueo-version-precios.test.mjs tests/tus-central-tablero-click-real.test.mjs tests/tus-zip-orden-privada.test.mjs tests/tus-zip-descarga-automatica.test.mjs tests/tus-paquete-manifiesto.test.mjs tests/tus-central-staff-download.test.mjs tests/polaroids-interfaz-independiente.test.mjs tests/tus-ux-modo-configuracion.test.mjs tests/tus-paginas-seleccionadas.test.mjs tests/tus-ui-cierre-operativo.test.mjs tests/tus-ui-presupuesto-smoke.test.mjs tests/tus-central-d1-lookup.test.mjs tests/tus-anillado-conjunto.test.mjs tests/tus-anillado-conjunto-ui-zip.test.mjs tests/tus-plazos-preparacion-privada.test.mjs tests/tus-seguimiento-privado-eta.test.mjs tests/tus-calendario-eta-privado.test.mjs tests/tus-ingreso-movil-privado.test.mjs tests/tus-carga-recursos-privados.test.mjs tests/tus-eta-recursos-cola.test.mjs tests/tus-mediciones-productivas-privadas.test.mjs tests/tus-franjas-entrega-operativa.test.mjs tests/tus-medidas-cad-visual.test.mjs
      - name: Alerta preprensa PDF grande A1 sin impresión automática
        run: |
          node --check integraciones/autocotizador/recepcion/riesgo-preprensa-ploteo.mjs
          node --check integraciones/autocotizador/recepcion/ficha-produccion-central.mjs
          node --test tests/preprensa-ploteo-pesado.test.mjs tests/autocotizador-ficha-central.test.mjs
      - name: Contrato R2 multipart grande, sin cuenta ni despliegue
        run: |
          node --check integraciones/autocotizador/recepcion/r2-pdf-grandes-privado.mjs
          node --check integraciones/autocotizador/recepcion/r2-pdf-grandes-cliente.mjs
          node --check integraciones/autocotizador/recepcion/r2-pdf-grandes-api-privada.mjs
          node --check integraciones/autocotizador/recepcion/r2-recepcion-solo-pagada.mjs
          node --check integraciones/autocotizador/recepcion/r2-pdf-integridad-stream.mjs
          node --check integraciones/autocotizador/recepcion/r2-pdf-grandes-descarga-personal.mjs
          node --check integraciones/autocotizador/recepcion/r2-grandes-enviar-central.mjs
          node --check integraciones/mercadopago/pruebas/r2-grandes-central-pendientes.mjs
          node --check integraciones/autocotizador/recepcion/r2-grandes-lookup-central.mjs
          node --check integraciones/autocotizador/recepcion/r2-pdf-descarga-d1-personal.mjs
          node --check integraciones/autocotizador/recepcion/r2-lectura-parcial-segura.mjs
          node --check integraciones/mercadopago/pruebas/r2-grandes-cuotas-central.mjs
          node --check integraciones/autocotizador/recepcion/r2-grandes-reserva-central.mjs
          node --test tests/r2-grandes-cuotas-central.test.mjs
          node --test tests/r2-recepcion-solo-pagada.test.mjs
          node --test tests/r2-pago-central-bridge-prepago.test.mjs
          node --check integraciones/autocotizador/recepcion/r2-prepago-documentos.mjs
          node --check integraciones/mercadopago/pruebas/r2-prepago-intencion-central.mjs
          node --test tests/r2-prepago-sin-archivo-central.test.mjs
          node --test tests/r2-prepago-checkout-sandbox.test.mjs
          node --test tests/r2-flujo-sin-archivo-cero-costo.test.mjs
          node --test tests/r2-hash-local-fragmentos.test.mjs
          node --test tests/r2-prepago-flujo-cliente.test.mjs
          node --test tests/r2-recuperacion-comprador-orden.test.mjs tests/r2-prepago-pantalla-comprador.test.mjs tests/r2-cliente-no-duplicar-central.test.mjs tests/r2-reserva-lookup-central.test.mjs tests/r2-recuperacion-sin-reenvio.test.mjs tests/r2-recuperacion-integridad-rangos.test.mjs
          node --check integraciones/mercadopago/pruebas/r2-reserva-consulta-central.mjs
          node --check integraciones/autocotizador/recepcion/r2-reserva-consulta-documentos.mjs
          node --check integraciones/autocotizador/recepcion/r2-prepago-flujo-cliente.mjs
          node --check integraciones/autocotizador/recepcion/sha256-pdf-local-fragmentos.mjs
          node --check integraciones/mercadopago/pruebas/r2-prepago-checkout-sandbox-central.mjs
          node --check integraciones/autocotizador/recepcion/r2-prepago-checkout-documentos.mjs
          node --check integraciones/autocotizador/recepcion/r2-confirmar-pago-central.mjs
          node --check integraciones/mercadopago/pruebas/r2-pago-verificado-central.mjs
          node --test tests/r2-lectura-parcial-segura.test.mjs
          node --test tests/r2-grandes-d1-descarga-personal.test.mjs
          node --test tests/r2-grandes-central-pendientes.test.mjs
          node --test tests/r2-pdf-grandes-privado.test.mjs tests/r2-pdf-grandes-cliente.test.mjs tests/r2-pdf-grandes-api-privada.test.mjs tests/r2-pdf-integridad-stream.test.mjs tests/r2-pdf-grandes-descarga-personal.test.mjs
      - name: Sintaxis de módulos integrados
        run: |
          node --check integraciones/mercadopago/pruebas/worker.js
          node --check integraciones/autocotizador/recepcion/tus-pago-sandbox-cliente.mjs
          node --check integraciones/autocotizador/recepcion/tus-pedido-contrato.mjs
          node --check integraciones/autocotizador/recepcion/tus-pedido-puente.mjs
          node --check integraciones/autocotizador/recepcion/tus-pedido-worker.mjs
          node --check integraciones/autocotizador/recepcion/tus-directo-cliente.mjs
          node --check integraciones/autocotizador/recepcion/pantalla-cotizador-v2-prueba-privada.mjs
          node --check integraciones/autocotizador/recepcion/worker-fase4-cotizador-unificado.mjs
      - name: Compilar Worker completo con generación real de activos del portal
        working-directory: integraciones/autocotizador/recepcion
        run: |
          npm install --no-audit --no-fund
          npm run build:unificado
          node --check dist/saber-documentos-cotizador-fase4.mjs
          grep -Fq '/api/ensayo-tus-iniciar' dist/saber-documentos-cotizador-fase4.mjs
          grep -Fq '/api/ensayo-tus-registrar' dist/saber-documentos-cotizador-fase4.mjs
      - name: Comprobar compuertas privadas con Worker real compilado, sin deploy
        working-directory: integraciones/autocotizador/recepcion
        run: |
          node --input-type=module <<'NODE'
          import worker from './dist/saber-documentos-cotizador-fase4.mjs';
          const url='https://saber-documentos-pruebas.libreriasaber.workers.dev/api/ensayo-tus-iniciar';
          const response=await worker.fetch(new Request(url,{method:'POST',
            headers:{Origin:new URL(url).origin,'Content-Type':'application/json'},
            body:JSON.stringify({orderId:'WEB-ENSAYO-PRUEBA12345',metas:[]})
          }),{}, {});
          if(response.status!==403)throw new Error('TUS debería permanecer deshabilitado sin configuración.');
          const body=await response.json();
          if(body.paymentAuthorized!==false)throw new Error('Pagos deben quedar bloqueados.');
          console.info('COMPILADO_PRIVADO_CERRADO_'+response.status);
          const r2url='https://saber-documentos-pruebas.libreriasaber.workers.dev/prueba-v2/api/ensayo-r2/iniciar';
          const noR2=await worker.fetch(new Request(r2url,{method:'POST',
            headers:{Origin:new URL(r2url).origin,'Content-Type':'application/json'},
            body:JSON.stringify({orderId:'WEB-ENSAYO-'+'A'.repeat(32),meta:{}})
          }),{}, {});
          if(noR2.status!==503||(await noR2.json()).paymentAuthorized!==false)
            throw Error('R2 sin bucket debe permanecer apagado (503, no pagos).');
          let multipartStarted=false;
          const credentialR2='Basic '+Buffer.from('operador:'+'a'.repeat(32)).toString('base64');
          const r2DisabledQuotaEnv={
            DOCS_V2_PRIVATE_UI_ENABLED:'PRIVATE_TEST_ONLY',
            DOCS_V2_PRIVATE_UI_SECRET:'a'.repeat(32),
            DOCS_CENTRAL_ADMIN_KEY:'b'.repeat(32),
            CENTRAL_BRIDGE_KEY:'c'.repeat(32),
            DOCS_R2_BIG_ENABLED:'PRIVATE_TEST_ONLY',
            DOCS_R2_RECEIPT_KEY:'d'.repeat(40),
            DOCS_R2_QUOTA_ENABLED:'OFF',
            SABER_R2_GRANDES:{
              createMultipartUpload:async()=>{multipartStarted=true;throw Error('Costly R2 start');},
              resumeMultipartUpload:()=>({})
            }
          };
          const blockedR2=await worker.fetch(new Request(r2url,{method:'POST',
            headers:{Origin:new URL(r2url).origin,Authorization:credentialR2,
              'Content-Type':'application/json'},
            body:JSON.stringify({orderId:'WEB-ENSAYO-'+'A'.repeat(32),meta:{}})
          }),r2DisabledQuotaEnv,{});
          if(blockedR2.status!==503||multipartStarted||
             (await blockedR2.json()).paymentAuthorized!==false)
            throw Error('R2 con bucket y SIN cuota D1 NO debe iniciar multipart.');
          console.info('R2_CUPO_OFF_503_SIN_MULTIPART_SIN_PAGO');
          const quoteUrl='https://saber-documentos-pruebas.libreriasaber.workers.dev/api/ensayo-materiales-rapido';
          const disabled=await worker.fetch(new Request(quoteUrl),{}, {});
          if(disabled.status!==200)throw new Error('El catálogo piloto actual debe seguir funcionando con el flag apagado.');
          const blocked=await worker.fetch(new Request(quoteUrl),{DOCS_PRICE_ADMIN_D1_ENABLED:'PRIVATE_TEST_ONLY'}, {});
          if(blocked.status!==503)throw new Error('Sin sesión ni D1 no debe cotizar con tarifas antiguas cuando el flag está activo.');
          const safe=await blocked.json();
          if(safe.paymentAuthorized!==false)throw new Error('Nunca habilitar cobros por error de precios.');
          console.info('PRECIOS_D1_PRIVADOS_CERRADOS_503_SIN_FALLBACK');
          const probeUrl='https://saber-documentos-pruebas.libreriasaber.workers.dev/prueba-v2/admin-tarifario-ensayo';
          const noAuth=await worker.fetch(new Request(probeUrl),{}, {});
          if(noAuth.status!==401)throw Error('La sonda D1 debe pedir autenticación Basic.');
          const fs=await import('node:fs');
          const baseline=JSON.parse(fs.readFileSync('../../../precios-web.json','utf8'));
          const fakeEnv={
            DOCS_V2_PRIVATE_UI_ENABLED:'PRIVATE_TEST_ONLY',
            DOCS_V2_PRIVATE_UI_SECRET:'a'.repeat(32),
            DOCS_CENTRAL_ADMIN_KEY:'b'.repeat(32),DOCS_RELAY_KEY:'c'.repeat(32),
            CENTRAL_BRIDGE_KEY:'d'.repeat(32),
            SABER_CENTRAL:{fetch:async signed=>{
              if(signed.headers.get('x-saber-signature')?.length!==64)throw Error('Falta HMAC entre Workers');
              const payload=await signed.json();
              if(payload.schema!=='saber-price-snapshot-v1'||payload.purpose!=='quote-private-test')
                throw Error('Solicitud D1 sin contrato');
              return new Response(JSON.stringify({ok:true,schema:'saber-price-snapshot-v1',
                approvedRevision:3,approvedAt:'2026-11-03T10:00:00Z',
                prices:baseline,promotions:{codes:[]},commercialRelease:false,
                paymentAuthorized:false,source:'private-d1-approved-only'}),
                {headers:{'Content-Type':'application/json'}});
            }}
          };
          const credential='Basic '+Buffer.from('operador:'+'a'.repeat(32)).toString('base64');
          const accepted=await worker.fetch(new Request(probeUrl,{headers:{Authorization:credential}}),fakeEnv,{});
          if(accepted.status!==200)throw Error('La sonda autenticada no pudo leer el catálogo D1 aprobado.');
          const probe=await accepted.json();
          if(probe.priceVersion!=='d1-approved-revision-3'||
             probe.a4_bn_1_a_10_sf_ars!==100||
             probe.poster_recubierto_60cm_metro_ars!==18700||
             probe.docsPriceAdminD1Enabled!==false||
             probe.paymentAuthorized!==false)
            throw Error('Resumen D1 privado o barreras comerciales inválidas');
          console.info('SONDA_D1_HTTP401_SIN_AUTORIZAR_Y_HTTP200_BASIC_OK');

          const enabledEnv={...fakeEnv,DOCS_PRICE_ADMIN_D1_ENABLED:'PRIVATE_TEST_ONLY'};
          const priceUrl='https://saber-documentos-pruebas.libreriasaber.workers.dev/prueba-v2/precios-web.json';
          const unauthorized=await worker.fetch(new Request(priceUrl),enabledEnv,{});
          if(unauthorized.status!==401)throw Error('El catálogo D1 no debe ser público.');
          const approved=await worker.fetch(new Request(priceUrl,{headers:{Authorization:credential}}),enabledEnv,{});
          if(approved.status!==200)throw Error('El navegador autenticado no pudo obtener precios D1 aprobados.');
          const prices=await approved.json();
          if(prices.priceVersion!=='d1-approved-revision-3'||prices.bnA4.scales[0].simple!==100||
             prices.plotter.supports.find(x=>x.id==='rec60')?.posterPerMeter!==18700)
            throw Error('Las tarifas aprobadas no se reflejan en el mismo JSON del cliente.');
          const quote=await worker.fetch(new Request('https://saber-documentos-pruebas.libreriasaber.workers.dev/api/ensayo-materiales-rapido',{headers:{Authorization:credential}}),enabledEnv,{});
          if(quote.status!==200)throw Error('La ruta de materiales no pudo cotizar con D1 aprobado.');
          const blockedNoD1=await worker.fetch(new Request(priceUrl,{headers:{Authorization:credential}}),
            {...enabledEnv,SABER_CENTRAL:{fetch:async()=>new Response('D1 fuera de servicio',{status:503})}},{});
          if(blockedNoD1.status!==503)throw Error('D1 caído debe impedir devolver valores de catálogo anterior.');
          console.info('CATALOGO_D1_ON_PROTEGIDO_401_AUTENTICADO_200_FALLA_503_SIN_FALLBACK');
          NODE
      - name: Contrato estático de portada Saber Directo
        run: node --test tests/saber-directo-catalogo-publico.test.mjs tests/saber-directo-publica-solo-lectura.test.mjs tests/saber-directo-portada.test.mjs
      - name: Proteger rutas de vista previa Saber Directo
        run: node --test tests/saber-directo-preview.test.mjs
      - name: Confirmación SIN despliegues
        run: echo 'PRUEBA_TUS_PRIVADA_OK - SIN DESPLIEGUE - SIN PAGOS - WEB COMERCIAL INTACTA'
      - name: Registrar resultado verificable del CI en el commit
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RESULT: ${{ job.status }}
        run: |
          set -euo pipefail
          case "$CI_RESULT" in
            success) state=success;;
            *) state=failure;;
          esac
          jq -n --arg state "$state" \
            --arg context 'saber/integracion-privada-ci' \
            --arg description "Pruebas completas y build privado: $CI_RESULT" \
            --arg target_url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}' > /tmp/saber-private-ci-status.json
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --input /tmp/saber-private-ci-status.json >/dev/null
          echo "CI_RESULT=$CI_RESULT COMMIT=$GITHUB_SHA"

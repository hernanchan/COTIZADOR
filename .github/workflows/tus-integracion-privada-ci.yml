name: Verificar integración TUS privada (SIN despliegue)
on:
  push:
    branches:
      - integracion/tus-pedido-privado-20261101
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas-privadas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout de rama experimental
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependencias mínimas para pruebas y compilación
        run: npm install --no-save --no-audit --no-fund pdf-lib@1.17.1 esbuild@0.25.12
      - name: Contrato TUS y pipeline PDF real, sin D1 ni cuentas
        run: node --test tests/tus-pedido-privado.test.mjs
      - name: Sintaxis de módulos integrados
        run: |
          node --check integraciones/autocotizador/recepcion/tus-pedido-contrato.mjs
          node --check integraciones/autocotizador/recepcion/tus-pedido-puente.mjs
          node --check integraciones/autocotizador/recepcion/tus-pedido-worker.mjs
          node --check integraciones/autocotizador/recepcion/tus-directo-cliente.mjs
          node --check integraciones/autocotizador/recepcion/pantalla-cotizador-v2-prueba-privada.mjs
          node --check integraciones/autocotizador/recepcion/worker-fase4-cotizador-unificado.mjs
      - name: Compilar Worker completo, exclusivamente artefacto local descartable
        run: |
          npx esbuild integraciones/autocotizador/recepcion/worker-fase4-cotizador-unificado.mjs \
            --bundle --platform=browser --format=esm --target=es2022 \
            --loader:.txt=text --loader:.html=text \
            --outfile=/tmp/saber-tus-pruebas.mjs
          node --check /tmp/saber-tus-pruebas.mjs
      - name: Confirmación SIN despliegues
        run: echo 'PRUEBA_TUS_PRIVADA_OK - SIN DESPLIEGUE - SIN PAGOS - WEB COMERCIAL INTACTA'

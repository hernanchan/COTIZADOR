name: Comprobar cierre de Checkout del canario eliminado 024 (sin pagos)
on:
  push:
    branches: [integracion/tus-pedido-privado-20261101]
    paths: [docs/COMPROBAR-CIERRE-CANARIA-024.trigger]
permissions:
  contents: read
jobs:
  auth:
    runs-on: ubuntu-latest
    environment:
      name: saber-cloudflare-pruebas
      deployment: false
    steps:
      - name: Rechazar iniciar otro pago de la orden sin PDF
        shell: bash
        env:
          SABER_V2_OPERATOR_PASSWORD: ${{ secrets.SABER_V2_OPERATOR_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SABER_V2_OPERATOR_PASSWORD"
          host='https://saber-documentos-pruebas.libreriasaber.workers.dev'
          code=$(curl --silent --show-error --max-time 30 -u "operador:$SABER_V2_OPERATOR_PASSWORD" \
            -X POST -H "Origin: $host" -H "Content-Type: application/json" \
            --data '{"action":"start","webOrderId":"WEB-ENSAYO-DA97408CCD06FFED80433A8E2A3B3FB4"}' \
            -o response.json -w '%{http_code}' \
            "$host/prueba-v2/api/ensayo-tus-canaria-checkout")
          if [ "$code" != 410 ]; then
            echo "CANARIA_NO_RETIRADA_HTTP_$code"
            exit 1
          fi
          jq -e '.ok==false and (.error|contains("cerrada"))' response.json >/dev/null
          rm -f response.json
          echo 'CHECKOUT_CANARIA_024_RETIRADO_HTTP410_SIN_PAGOS'

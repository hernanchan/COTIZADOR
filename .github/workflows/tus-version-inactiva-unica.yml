name: Preparar TUS privado INACTIVO (NO desplegar tráfico)
on:
  push:
    branches:
      - integracion/tus-pedido-privado-20261101
    paths:
      - 'docs/RELEASE-TUS-INACTIVA-20261101.trigger'

permissions:
  contents: read

concurrency:
  group: saber-tus-version-privada-unica
  cancel-in-progress: false

jobs:
  preparar-inactiva:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: saber-cloudflare-pruebas
      deployment: false
    steps:
      - name: Checkout SOLO rama TUS experimental
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pruebas y compilación integral, sin cambios de configuración
        working-directory: integraciones/autocotizador/recepcion
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --test ../../../tests/tus-pedido-privado.test.mjs ../../../tests/tus-ui-presupuesto-smoke.test.mjs
          npm run build:unificado
          node --check dist/saber-documentos-cotizador-fase4.mjs
          grep -Fq '/api/ensayo-tus-iniciar' dist/saber-documentos-cotizador-fase4.mjs
          echo 'TUS_CI_OK - SIN PAGOS SIN COMERCIO'
      - name: Crear version privada exclusivamente sin activarla
        shell: bash
        env:
          ACCOUNT: ${{ secrets.SABER_CF_ACCOUNT_ID }}
          TOKEN: ${{ secrets.SABER_CF_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$ACCOUNT" && test -n "$TOKEN"
          worker=saber-documentos-pruebas
          root="https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/workers/scripts/$worker"
          trap 'rm -f /tmp/saber-tus-settings.json /tmp/saber-tus-metadata.json /tmp/saber-tus-upload.json' EXIT
          curl -fsS --max-time 25 -H "Authorization: Bearer $TOKEN" "$root/settings" > /tmp/saber-tus-settings.json
          jq -e '.success == true and (.result.bindings | type == "array")' /tmp/saber-tus-settings.json >/dev/null
          for binding in SABER_CENTRAL DOCS_CENTRAL_ADMIN_KEY DOCS_SCRIPT_URL DOCS_RELAY_KEY CENTRAL_BRIDGE_KEY; do
            jq -e --arg name "$binding" '.result.bindings | any(.name==$name)' /tmp/saber-tus-settings.json >/dev/null
          done
          jq -n --slurpfile settings /tmp/saber-tus-settings.json \
            '{main_module:"index.mjs",annotations:{"workers/message":"Saber TUS experimental privada SIN activar SIN pagos"},bindings:[$settings[0].result.bindings[]|{name,type:"inherit"}]}' > /tmp/saber-tus-metadata.json
          curl --silent --show-error --max-time 75 \
            -H "Authorization: Bearer $TOKEN" \
            -F "metadata=@/tmp/saber-tus-metadata.json;type=application/json" \
            -F "index.mjs=@integraciones/autocotizador/recepcion/dist/saber-documentos-cotizador-fase4.mjs;filename=index.mjs;type=application/javascript+module" \
            "$root/versions?bindings_inherit=strict" > /tmp/saber-tus-upload.json
          if ! jq -e '.success==true and (.result.id|type=="string")' /tmp/saber-tus-upload.json >/dev/null; then
            jq -c '{success,errors:[.errors[]?|{code,message}]}' /tmp/saber-tus-upload.json
            exit 1
          fi
          jq -r '.result.id | "TUS_VERSION_PRIVADA_PREPARADA_SIN_ACTIVAR=" + .' /tmp/saber-tus-upload.json
          echo 'SIN_DESPLIEGUE SIN_PAGOS SIN_CAMBIOS_WEB_COMERCIAL'

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Cotizador de prueba A4/A3 · Librería Saber</title>
<style>
:root{--blue:#0a3158;--orange:#f7931e;--green:#178454;--bg:#fff;--card:#f6f7f8;--line:#dfe3e8;--muted:#727b86;font-family:Arial,sans-serif;color:#1d252d}*{box-sizing:border-box}body{margin:0;background:#fff}.page{width:min(760px,100%);margin:auto;padding:22px 18px 42px}.test{background:#fff3d8;border:1px solid #f3c36d;color:#744b00;padding:12px 14px;border-radius:12px;margin-bottom:16px;font-size:12px;font-weight:800}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:18px}.head h1{margin:0;color:var(--blue);font-size:28px}.head p{margin:6px 0 0;color:var(--muted);font-size:13px;line-height:1.45}.source{font-size:11px;color:var(--muted);white-space:nowrap}.card{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:16px;margin-top:13px}.label{display:block;font-size:13px;font-weight:800;margin-bottom:8px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;font-weight:800;cursor:pointer}.choice.active{background:var(--blue);color:#fff;border-color:var(--blue)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}input,select{width:100%;border:1px solid var(--line);border-radius:11px;background:#fff;padding:11px;font:inherit}.field{display:grid;gap:7px;font-size:13px;font-weight:700}.check{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:700}.check input{width:18px;height:18px}.calc{width:100%;border:0;border-radius:13px;background:var(--blue);color:#fff;padding:14px;font-size:15px;font-weight:900;cursor:pointer;margin-top:14px}.result{display:none;border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:15px}.result.show{display:block}.total-label{color:var(--muted);font-size:12px;font-weight:800;text-transform:uppercase}.total{font-size:52px;line-height:1;color:var(--blue);font-weight:900;margin-top:5px}.deposit{font-weight:900;margin-top:10px}.detail{margin-top:16px;border-top:1px solid var(--line);padding-top:14px;display:grid;gap:7px;font-size:13px}.detail-row{display:flex;justify-content:space-between;gap:16px}.promo{display:none;margin-top:12px;background:#edf8f2;color:#13623e;border:1px solid #b9e0ca;padding:11px;border-radius:11px;font-size:12px;font-weight:800}.promo.show{display:block}.transfer{background:#eef4f8;border-radius:12px;padding:13px;margin-top:13px;font-size:12px;line-height:1.55}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.actions button,.actions a{border:0;border-radius:12px;padding:13px 15px;font-weight:900;text-decoration:none;cursor:pointer}.primary{background:var(--green);color:#fff}.secondary{background:#edf1f4;color:var(--blue)}details{margin-top:13px}summary{cursor:pointer;font-weight:800;font-size:13px}.coupon{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:9px}.coupon button{border:0;border-radius:10px;background:var(--orange);color:#fff;font-weight:900;padding:0 14px}.coupon-status{font-size:11px;color:var(--muted);margin-top:7px;line-height:1.4}.error{background:#fff1f1;border:1px solid #f3b3b3;color:#8d2020;padding:14px;border-radius:12px}.loading{color:var(--muted);font-size:13px}@media(max-width:620px){.page{padding:14px 12px 30px}.grid{grid-template-columns:1fr}.head{display:block}.source{margin-top:8px}.total{font-size:44px}}
</style>
</head>
<body>
<main class="page">
<div class="test">ENTORNO DE PRUEBA · Esta versión no reemplaza al cotizador oficial.</div>
<div class="head"><div><h1>Impresiones A4 / A3</h1><p>Mismos precios comerciales exportados desde el Presupuestador de Mostrador.</p></div><div class="source" id="source">Cargando precios…</div></div>
<div id="app"><div class="loading">Cargando configuración…</div></div>
</main>
<script>
(async function(){
const app=document.getElementById('app'),source=document.getElementById('source');
const integrated=new URLSearchParams(location.search).get('integrado')==='1'&&window.parent!==window;
const promosCsvUrl='https://docs.google.com/spreadsheets/d/e/2PACX-1vSVe0GKHSmYbfjpIkrvgA1lDqxz57j-VEDkY5BqYtVzKj_5ePB9NoyRhkTvf0S5dN-Ur6wrQANcg3WT/pub?gid=495325142&single=true&output=csv';
let cfg,extraPromos=[],manualCoupon=null,lastResult=null;
try{const r=await fetch('precios-web.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error();cfg=await r.json();source.textContent='Fuente: '+cfg.source;render()}catch(e){app.innerHTML='<div class="error">No se pudo cargar precios-web.json.</div>';source.textContent='Error de configuración';return}
function money(n){return '$'+Math.round(Number(n)||0).toLocaleString('es-AR')}
function norm(v){return String(v||'').trim().toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function parseCsv(text){const rows=[];let row=[],field='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i],next=text[i+1];if(c==='"'&&quoted&&next==='"'){field+='"';i++}else if(c==='"')quoted=!quoted;else if(c===','&&!quoted){row.push(field);field=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&next==='\n')i++;row.push(field);if(row.some(v=>v!==''))rows.push(row);row=[];field=''}else field+=c}row.push(field);if(row.some(v=>v!==''))rows.push(row);return rows}
function numeric(v){let t=String(v||'').replace(/[^0-9,.-]/g,''),c=t.lastIndexOf(','),d=t.lastIndexOf('.');if(c>=0&&d>=0)t=c>d?t.replace(/\./g,'').replace(',','.'):t.replace(/,/g,'');else if(c>=0)t=/,\d{3}$/.test(t)?t.replace(/,/g,''):t.replace(',','.');else if(d>=0&&/\.\d{3}$/.test(t))t=t.replace(/\./g,'');return Number(t)||0}
function parseDate(v,end){const t=String(v||'').trim();let p;if(/^\d{4}-\d{2}-\d{2}$/.test(t)){p=t.split('-');return new Date(+p[0],+p[1]-1,+p[2],end?23:0,end?59:0,end?59:0)}if(/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(t)){p=t.split('/');return new Date(+p[2],+p[1]-1,+p[0],end?23:0,end?59:0,end?59:0)}return null}
async function loadPromos(){try{const r=await fetch(promosCsvUrl+'&v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error();const rows=parseCsv(await r.text());const hi=rows.findIndex(r=>norm(r[0])==='ACTIVA'&&norm(r[1])==='CODIGO');if(hi<0)throw new Error();extraPromos=rows.slice(hi+1).map(r=>({active:norm(r[0])==='SI',code:norm(r[1]),label:String(r[2]||'').trim(),type:norm(r[3]),value:numeric(r[4]),product:norm(r[5]),from:parseDate(r[6],false),to:parseDate(r[7],true),maxDiscount:numeric(r[8])})).filter(p=>p.active&&p.code);return true}catch(e){extraPromos=[];return false}}
function tierIndex(scales,q){let i=scales.findIndex(s=>q>=Number(s.from||1)&&(s.to==null||q<=Number(s.to)));return i<0?scales.length-1:i}
function bindingPrice(size,pages){const rows=cfg.bindings[size];const row=rows.find(r=>pages<=r.to)||rows[rows.length-1];return Number(row.price)||0}
function scheduledPromo(){const d=new Date().getDay();if(d===2)return {code:'MARTESDECOPIAS',label:'Martes: 10% en impresiones',kind:'percent',value:10};if(d===4)return {code:'ANILLADO0',label:'Jueves: anillado sin cargo',kind:'binding'};if(d===0||d===6)return {code:d===6?'SABADO20':'DOMINGO20',label:'Fin de semana: 20% online',kind:'percent',value:20};return null}
function findCoupon(code){const n=norm(code),now=new Date();return extraPromos.find(p=>p.code===n&&p.from&&p.to&&now>=p.from&&now<=p.to&&(p.type==='PORCENTAJE'||p.type==='MONTO')&&p.value>0&&(p.product==='TODO'||p.product==='IMPRESIONES'))||null}
function familyRank(f){return f==='Obra'?0:f==='Ilustración'?1:f==='Fotográfico'?2:f==='Adhesivo'?3:4}
function sortMaterials(a,b){const fa=familyRank(a.family),fb=familyRank(b.family);if(fa!==fb)return fa-fb;const ga=Number((String(a.name).match(/(\d{2,3})\s*(?:G|GR|GRS)/i)||[])[1]||9999),gb=Number((String(b.name).match(/(\d{2,3})\s*(?:G|GR|GRS)/i)||[])[1]||9999);return ga-gb||a.name.localeCompare(b.name,'es')}
function materialOptions(materials){const sorted=[...materials].sort(sortMaterials),groups={};sorted.forEach(m=>(groups[m.family]||(groups[m.family]=[])).push(m));return Object.keys(groups).sort((a,b)=>familyRank(a)-familyRank(b)).map(f=>'<optgroup label="'+f+'">'+groups[f].map(m=>'<option value="'+m.id+'">'+m.name+'</option>').join('')+'</optgroup>').join('')}
function render(){app.innerHTML=`
<div class="card"><span class="label">Tamaño</span><div class="choices" id="sizeChoices"><button class="choice active" data-size="a4">A4</button><button class="choice" data-size="a3">A3</button></div></div>
<div class="card"><span class="label">Impresión</span><div class="choices" id="modeChoices"><button class="choice active" data-mode="bn">Blanco y negro</button><button class="choice" data-mode="color">Color</button></div></div>
<div class="card" id="materialWrap" style="display:none"><label class="field">Material<select id="material"></select></label></div>
<div class="card"><span class="label">Caras</span><div class="choices" id="faceChoices"><button class="choice active" data-face="simple">Simple faz</button><button class="choice" data-face="double">Doble faz</button></div></div>
<div class="card"><div class="grid"><label class="field">Páginas del documento<input id="pages" type="number" min="1" value="1"></label><label class="field">Copias iguales<input id="copies" type="number" min="1" value="1"></label></div><label class="check" style="margin-top:13px"><input id="binding" type="checkbox">Agregar anillado</label><button class="calc" id="calc">Calcular precio</button></div>
<div class="result" id="result"><div class="total-label">Precio estimado</div><div class="total" id="total">$0</div><div class="deposit">Seña para confirmar (50%): <span id="deposit">$0</span></div><div class="promo" id="promo"></div><div class="detail" id="detail"></div><div class="transfer"><strong>Datos para transferir la seña</strong><br>Alias: <strong>libreriasaber.mp</strong><br>Titular: Hernan Maximiliano Meichtry<br>CUIL: 20-22792046-8</div><details><summary>¿Tenés un código de descuento?</summary><div class="coupon"><input id="coupon" placeholder="Ingresá el código"><button id="applyCoupon">Aplicar</button></div><div class="coupon-status" id="couponStatus">Se validará contra las promociones vigentes.</div></details><div class="actions"><a class="primary" id="finalAction" href="#">${integrated?'Agregar al pedido general':'Confirmar por WhatsApp'}</a><button class="secondary" id="recalc">Cambiar datos</button></div></div>`;
let size='a4',mode='bn',face='simple';const mat=document.getElementById('material'),wrap=document.getElementById('materialWrap');
function updateMaterials(){if(mode!=='color'){wrap.style.display='none';return}wrap.style.display='block';const section=size==='a4'?cfg.colorA4:cfg.colorA3;const current=mat.value;mat.innerHTML=materialOptions(section.materials);if([...mat.options].some(o=>o.value===current))mat.value=current}
function activate(group,attr,val){document.querySelectorAll('#'+group+' .choice').forEach(b=>b.classList.toggle('active',b.dataset[attr]===val))}
document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{size=b.dataset.size;activate('sizeChoices','size',size);updateMaterials()});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;activate('modeChoices','mode',mode);updateMaterials()});document.querySelectorAll('[data-face]').forEach(b=>b.onclick=()=>{face=b.dataset.face;activate('faceChoices','face',face)});updateMaterials();
document.getElementById('calc').onclick=()=>calculate(size,mode,face);document.getElementById('recalc').onclick=()=>document.getElementById('result').classList.remove('show');document.getElementById('applyCoupon').onclick=async()=>{const status=document.getElementById('couponStatus'),code=document.getElementById('coupon').value.trim();if(!code){status.textContent='Ingresá el código.';return}status.textContent='Comprobando promoción…';if(!extraPromos.length){const ok=await loadPromos();if(!ok){status.textContent='No pudimos consultar las promociones.';return}}manualCoupon=findCoupon(code);status.textContent=manualCoupon?(manualCoupon.code+' aplicado · '+manualCoupon.label):'El código no existe, está desactivado, fuera de fecha o no corresponde a impresiones.';if(lastResult)calculate(size,mode,face)};
}
function calculate(size,mode,face){const pages=Math.max(1,Number(document.getElementById('pages').value)||1),copies=Math.max(1,Number(document.getElementById('copies').value)||1),qty=pages*copies,binding=document.getElementById('binding').checked;let unit=0,materialName='Obra común';if(mode==='bn'){const sec=size==='a4'?cfg.bnA4:cfg.bnA3,idx=tierIndex(sec.scales,qty);unit=Number(sec.scales[idx][face])||0}else{const sec=size==='a4'?cfg.colorA4:cfg.colorA3,idx=tierIndex(sec.scales,qty),id=document.getElementById('material').value,m=sec.materials.find(x=>x.id===id)||sec.materials[0];materialName=m.name;unit=Number(m.prices[idx][face])||0}let bindingCharge=binding?bindingPrice(size,pages):0;const original=Math.round(qty*unit+bindingCharge);let total=original,promoSaving=0,promoLabel='';const scheduled=scheduledPromo();if(scheduled){if(scheduled.kind==='percent'){promoSaving=Math.round(total*scheduled.value/100);total-=promoSaving;promoLabel=scheduled.label}else if(scheduled.kind==='binding'&&bindingCharge>0){promoSaving=bindingCharge;total-=bindingCharge;promoLabel=scheduled.label}}let couponSaving=0;if(manualCoupon){const base=original;let candidate=manualCoupon.type==='PORCENTAJE'?Math.round(base*manualCoupon.value/100):manualCoupon.value;if(manualCoupon.maxDiscount>0)candidate=Math.min(candidate,manualCoupon.maxDiscount);const cap=Math.round(original*.25);couponSaving=Math.max(0,Math.min(candidate,cap-promoSaving,total));total-=couponSaving}total=Math.max(0,Math.round(total));const deposit=Math.round(total*.5),faceLabel=face==='simple'?'Simple faz':'Doble faz',modeLabel=mode==='bn'?'B/N':'Color';lastResult={size,mode,face,pages,copies,qty,unit,materialName,binding,bindingCharge,original,total,deposit,promoSaving,promoLabel,couponSaving,coupon:manualCoupon};document.getElementById('total').textContent=money(total);document.getElementById('deposit').textContent=money(deposit);const promo=document.getElementById('promo');const promoParts=[];if(promoSaving)promoParts.push(promoLabel+' · -'+money(promoSaving));if(couponSaving)promoParts.push('Cupón '+manualCoupon.code+' · -'+money(couponSaving));promo.textContent=promoParts.join(' | ');promo.classList.toggle('show',promoParts.length>0);document.getElementById('detail').innerHTML=`<div class="detail-row"><span>Trabajo</span><strong>${size.toUpperCase()} · ${modeLabel}</strong></div><div class="detail-row"><span>Material</span><strong>${materialName}</strong></div><div class="detail-row"><span>Impresión</span><strong>${faceLabel}</strong></div><div class="detail-row"><span>Cantidad tarifada</span><strong>${qty}</strong></div><div class="detail-row"><span>Precio unitario</span><strong>${money(unit)}</strong></div>${binding?`<div class="detail-row"><span>Anillado</span><strong>${money(bindingCharge)}</strong></div>`:''}`;document.getElementById('result').classList.add('show');const action=document.getElementById('finalAction');const detailText=`${pages} páginas × ${copies} copia${copies===1?'':'s'} · ${size.toUpperCase()} · ${modeLabel} · ${materialName} · ${faceLabel}${binding?' · Con anillado':''}${promoLabel?' · '+promoLabel:''}${couponSaving?' · Cupón '+manualCoupon.code:''}`;if(integrated){action.href='#';action.onclick=e=>{e.preventDefault();window.parent.postMessage({type:'SABER_ADD_PRINT',payload:{id:'PRINT-'+Date.now(),type:'print',name:'Impresión de documento',price:total,qty:1,detail:detailText,deposit:deposit}},'*')}}else{const msg=['Hola, quiero confirmar este pedido.','','*IMPRESIÓN DE DOCUMENTO*',detailText,'','*TOTAL: '+money(total)+'*','*SEÑA 50%: '+money(deposit)+'*','','*DATOS PARA TRANSFERIR LA SEÑA*','Alias: libreriasaber.mp','Titular: Hernan Maximiliano Meichtry','CUIL: 20-22792046-8','','Para confirmar envío en este chat:','1. Los archivos definitivos.','2. El comprobante de la seña.','','La orden entra en producción después de recibir y revisar ambos.'].join('\n');action.onclick=null;action.href='https://api.whatsapp.com/send?phone=5493513110130&text='+encodeURIComponent(msg);action.target='_blank';action.rel='noopener'} }
})();
</script>
</body>
</html>

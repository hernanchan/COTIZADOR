<script>
(async function(){

function track(name,params){if(typeof gtag==='function')gtag('event',name,params||{})}
function money(n){return '$'+Math.round(Number(n)||0).toLocaleString('es-AR')}

function parseCsv(text){const rows=[];let row=[],field='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i],next=text[i+1];if(c==='"'&&quoted&&next==='"'){field+='"';i++}else if(c==='"')quoted=!quoted;else if(c===','&&!quoted){row.push(field);field=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&next==='\n')i++;row.push(field);if(row.some(v=>v!==''))rows.push(row);row=[];field=''}else field+=c}row.push(field);if(row.some(v=>v!==''))rows.push(row);return rows}
function numeric(v){let t=String(v||'').replace(/[^0-9,.-]/g,''),c=t.lastIndexOf(','),d=t.lastIndexOf('.');if(c>=0&&d>=0)t=c>d?t.replace(/\./g,'').replace(',','.'):t.replace(/,/g,'');else if(c>=0)t=/,\d{3}$/.test(t)?t.replace(/,/g,''):t.replace(',','.');else if(d>=0&&/\.\d{3}$/.test(t))t=t.replace(/\./g,'');return Number(t)||0}
function parseDate(v,end){const t=String(v||'').trim();let p;if(/^\d{4}-\d{2}-\d{2}$/.test(t)){p=t.split('-');return new Date(+p[0],+p[1]-1,+p[2],end?23:0,end?59:0,end?59:0)}if(/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(t)){p=t.split('/');return new Date(+p[2],+p[1]-1,+p[0],end?23:0,end?59:0,end?59:0)}return null}
async function loadPromos(){try{const r=await fetch(promosCsvUrl+'&v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error();const rows=parseCsv(await r.text()),hi=rows.findIndex(r=>norm(r[0])==='ACTIVA'&&norm(r[1])==='CODIGO');if(hi<0)throw new Error();extraPromos=rows.slice(hi+1).map(r=>({active:norm(r[0])==='SI',code:norm(r[1]),label:String(r[2]||'').trim(),type:norm(r[3]),value:numeric(r[4]),product:norm(r[5]),from:parseDate(r[6],false),to:parseDate(r[7],true),maxDiscount:numeric(r[8])})).filter(p=>p.active&&p.code);return true}catch(e){extraPromos=[];return false}}
function findCoupon(code){const n=norm(code),now=new Date();return extraPromos.find(p=>p.code===n&&p.from&&p.to&&now>=p.from&&now<=p.to&&(p.type==='PORCENTAJE'||p.type==='MONTO')&&p.value>0)||null}

function scheduledPromo(){const d=new Date().getDay();if(d===1)return{code:'LUNESDEPLANOS',label:'Lunes: 10% en ploteos CAD sobre papel obra desde 2 metros'};if(d===2)return{code:'MARTESDECOPIAS',label:'Martes: 10% en impresiones'};if(d===3)return{code:'FOTOSPREMIUM',label:'Miércoles: fotos Premium al precio normal'};if(d===4)return{code:'ANILLADO0',label:'Jueves: anillado sin cargo'};if(d===5)return{code:'STICKER10',label:'Viernes: 10% en planchas A3 de stickers'};if(d===6)return{code:'SABADO20',label:'Fin de semana: 20% online'};if(d===0)return{code:'DOMINGO20',label:'Fin de semana: 20% online'};return null}
function familyRank(f){return f==='Obra'?0:f==='Ilustración'?1:f==='Fotográfico'?2:f==='Adhesivo'?3:4}
function gram(n){const m=String(n).match(/(\d{2,3})\s*(?:G|GR|GRS)?\b/i);return m?Number(m[1]):9999}
function sortMaterials(a,b){return familyRank(a.family)-familyRank(b.family)||gram(a.name)-gram(b.name)||a.name.localeCompare(b.name,'es')}
function cleanName(n){return String(n||'').replace('Ilustraci{on','Ilustración')}

['impresiones','Imprimir documentos','A4/A3 · B/N y color · todos los materiales'],['fotos','Imprimir fotos','10×15, 13×18, A4, A3, Polaroid y carnet'],['stickers','Stickers','Planchas A4/A3 con precorte'],['ploteos','Ploteos','Planos CAD y pósteres'],['corte','Ploteo de corte','Vinilo · piezas grandes, chicas o corte solo'],['grafica','Gráfica comercial','Tarjetas, recetarios y folletos']].map(r=>'<button class="service" data-service="'+r[0]+'"><b>'+r[1]+'</b><span>'+r[2]+'</span></button>').join('')+'</div><div class="card"><button class="service" style="width:100%;min-height:auto" id="help"><b>No estoy seguro</b><span>Te ayudamos por WhatsApp.</span></button></div>';
document.querySelectorAll('[data-service]').forEach(b=>b.onclick=()=>{service=b.dataset.service;track('iniciar_cotizacion',{servicio:service});renderForm()});document.getElementById('help').onclick=()=>window.open('https://wa.me/5493513110130?text='+encodeURIComponent('Hola, necesito ayuda para cotizar un trabajo.'),'_blank','noopener')}
function renderForm(){heading.textContent='Contanos el trabajo';subheading.textContent='Completá los datos y calculamos el precio.';if(service==='impresiones')return renderPrint();if(service==='fotos')return renderPhotos();if(service==='stickers')return renderStickers();if(service==='ploteos')return renderPlot();if(service==='corte')return renderCut();if(service==='grafica')return renderGraphic()}
function renderPrint(){app.innerHTML=backButton()+`<div class="card"><span class="label">Tamaño</span><div class="choices" id="sizeChoices"><button class="choice active" data-size="a4">A4</button><button class="choice" data-size="a3">A3</button></div></div><div class="card"><span class="label">Impresión</span><div class="choices" id="modeChoices"><button class="choice active" data-mode="bn">Blanco y negro</button><button class="choice" data-mode="color">Color</button></div></div><div class="card" id="materialWrap" style="display:none"><label class="field">Material<select id="material"></select></label></div><div class="card"><span class="label">Caras</span><div class="choices" id="faceChoices"><button class="choice active" data-face="simple">Simple faz</button><button class="choice" data-face="double">Doble faz</button></div></div><div class="card"><div class="grid"><label class="field">Páginas del documento<input id="pages" type="number" min="1" value="1"></label><label class="field">Copias iguales<input id="copies" type="number" min="1" value="1"></label></div><label class="check" style="margin-top:13px"><input id="binding" type="checkbox">Agregar anillado</label><button class="btn btn-primary" style="width:100%;margin-top:14px" id="calc">Calcular precio</button></div>`;bindBack();state.size='a4';state.mode='bn';state.face='simple';const mat=document.getElementById('material'),wrap=document.getElementById('materialWrap');function active(group,attr,val){document.querySelectorAll('#'+group+' .choice').forEach(b=>b.classList.toggle('active',b.dataset[attr]===val))}function updateMat(){if(state.mode!=='color'){wrap.style.display='none';return}wrap.style.display='block';const sec=state.size==='a4'?cfg.colorA4:cfg.colorA3,current=mat.value;mat.innerHTML=materialOptions(sec.materials);if([...mat.options].some(o=>o.value===current))mat.value=current}document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{state.size=b.dataset.size;active('sizeChoices','size',state.size);updateMat()});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;active('modeChoices','mode',state.mode);updateMat()});document.querySelectorAll('[data-face]').forEach(b=>b.onclick=()=>{state.face=b.dataset.face;active('faceChoices','face',state.face)});updateMat();document.getElementById('calc').onclick=calcPrint}
function calcPrint(){const pages=Math.max(1,Number(document.getElementById('pages').value)||1),copies=Math.max(1,Number(document.getElementById('copies').value)||1),qty=pages*copies,binding=document.getElementById('binding').checked;let unit=0,material='Obra común';if(state.mode==='bn'){const sec=state.size==='a4'?cfg.bnA4:cfg.bnA3,idx=tierIndex(sec.scales,qty);unit=Number(sec.scales[idx][state.face])||0}else{const sec=state.size==='a4'?cfg.colorA4:cfg.colorA3,idx=tierIndex(sec.scales,qty),id=document.getElementById('material').value,m=sec.materials.find(x=>x.id===id)||sec.materials[0];material=cleanName(m.name);unit=Number(m.prices[idx][state.face])||0}let total=qty*unit,bindingCharge=0;if(binding){const rows=cfg.bindings[state.size],row=rows.find(r=>pages<=r.to)||rows[rows.length-1];bindingCharge=Number(row.price)||0;total+=bindingCharge}let modeText=state.size.toUpperCase()+' · '+(state.mode==='bn'?'B/N':('Color · '+material))+' · '+(state.face==='simple'?'Simple faz':'Doble faz');finishItem({service:'impresiones',work:'Impresión de documento',qty:pages+' páginas × '+copies+' copia'+(copies===1?'':'s'),mode:modeText,binding,bindingCharge,baseTotal:total,meta:{pages,copies,qty,unit,size:state.size,mode:state.mode,face:state.face}})}
function renderPhotos(){const products=cfg.photos.products;const normal=products.filter(p=>p.paper==='Papel fotográfico'),luster=products.filter(p=>p.paper==='Luster');app.innerHTML=backButton()+`<div class="card"><div class="grid"><label class="field">Tipo de papel<select id="photoPaper"><option value="Papel fotográfico">Fotográfico normal</option><option value="Luster">Premium Luster</option></select></label><label class="field">Tamaño<select id="photoSize"></select></label><label class="field">Cantidad<input id="photoQty" type="number" min="1" value="1"></label></div><div class="plot-hint" id="photoHint">Los descuentos por cantidad se aplican automáticamente.</div><button class="btn btn-primary" style="width:100%;margin-top:14px" id="calc">Calcular precio</button></div>`;bindBack();const paper=document.getElementById('photoPaper'),size=document.getElementById('photoSize');function fill(){const list=paper.value==='Luster'?luster:normal,current=size.value;size.innerHTML=list.map(p=>'<option value="'+p.id+'">'+p.size+'</option>').join('');if([...size.options].some(o=>o.value===current))size.value=current}paper.onchange=fill;fill();document.getElementById('calc').onclick=()=>{const q=Math.max(1,Number(document.getElementById('photoQty').value)||1),p=products.find(x=>x.id===size.value),idx=tierIndex(cfg.photos.scales,q),unit=Number(p.prices[idx])||0,total=q*unit,carnet=norm(p.size)==='CARNET';finishItem({service:'fotos',work:'Impresión de fotos',qty:carnet?q+' plancha'+(q===1?'':'s')+' de 6 fotos':q+' foto'+(q===1?'':'s')+' · '+p.size,mode:carnet?'Foto carnet 4×4 · recorte y preparación incluidos':p.paper,binding:false,bindingCharge:0,baseTotal:total,meta:{q,product:p,unit}})}}

function renderPlot(){app.innerHTML=backButton()+`<div class="card"><div class="grid"><label class="field">Trabajo<select id="plotKind"><option value="cad">Plano / dibujo de líneas</option><option value="poster">Póster / imagen plena</option></select></label><label class="field">Papel<select id="plotPaper"><option value="obra">Papel obra</option></select></label><label class="field">Ancho cm<input id="plotW" type="number" min="1" value="60"></label><label class="field">Alto cm<input id="plotH" type="number" min="1" value="90"></label><label class="field">Cantidad<input id="plotQty" type="number" min="1" value="1"></label></div><div class="plot-hint">El sistema elige automáticamente el rollo y la orientación más conveniente.</div><button class="btn btn-primary" style="width:100%;margin-top:14px" id="calc">Calcular precio</button></div>`;bindBack();const kind=document.getElementById('plotKind'),paper=document.getElementById('plotPaper');function papers(){paper.innerHTML=kind.value==='cad'?'<option value="obra">Papel obra</option>':'<option value="obra">Papel obra</option><option value="rec">Papel recubierto 130 g</option>'}kind.onchange=papers;papers();document.getElementById('calc').onclick=()=>{const k=kind.value,p=paper.value,w=Math.max(1,Number(document.getElementById('plotW').value)||1),h=Math.max(1,Number(document.getElementById('plotH').value)||1),q=Math.max(1,Number(document.getElementById('plotQty').value)||1),supports=cfg.plotter.supports.filter(s=>p==='obra'?String(s.id).startsWith('rollo'):String(s.id).startsWith('rec')),field=k==='cad'?'cadPerMeter':'posterPerMeter';function orient(width,height){let best=null;supports.forEach(s=>{if(width>Number(s.widthCm))return;const meters=height/100*q,price=Number(s[field])||0,cost=meters*price;if(price>0&&(!best||cost<best.cost))best={s,meters,cost}});return best}const a=orient(w,h),b=orient(h,w),best=!a?b:!b?a:(b.cost<a.cost?b:a);if(!best){alert('Las medidas no entran en los rollos disponibles.');return}let total=roundTo(best.cost,cfg.plotter.roundTo||100);finishItem({service:'ploteos',work:'Ploteo',qty:q+' unidad'+(q===1?'':'es')+' · '+w+'×'+h+' cm',mode:(k==='cad'?'Plano / líneas':'Póster / imagen plena')+' · '+(p==='obra'?'Papel obra':'Papel recubierto')+' · '+best.s.widthCm+' cm',binding:false,bindingCharge:0,baseTotal:total,meta:{kind:k,paper:p,meters:best.meters}})}}
function renderCut(){app.innerHTML=backButton()+`<div class="card"><div class="grid"><label class="field">Tipo de trabajo<select id="cutVariant">${cfg.cutPlotter.variants.map(v=>'<option value="'+v.id+'">'+v.name+'</option>').join('')}</select></label><label class="field">Metros<input id="cutMeters" type="number" min="0.1" step="0.1" value="1"></label></div><div class="plot-hint">Se aplica automáticamente el mínimo vigente del servicio.</div><button class="btn btn-primary" style="width:100%;margin-top:14px" id="calc">Calcular precio</button></div>`;bindBack();document.getElementById('calc').onclick=()=>{const meters=Math.max(.1,Number(document.getElementById('cutMeters').value)||1),v=cfg.cutPlotter.variants.find(x=>x.id===document.getElementById('cutVariant').value),raw=Math.max(Number(cfg.cutPlotter.minimumPrice)||0,meters*Number(v.pricePerMeter||0)),total=roundTo(raw,cfg.cutPlotter.roundTo||100);finishItem({service:'corte',work:'Ploteo de corte',qty:meters.toLocaleString('es-AR')+' m',mode:v.name,binding:false,bindingCharge:0,baseTotal:total,meta:{meters,variant:v}})}}
function renderGraphic(){const products={tarjetas:[[15000,'100 unidades · simple faz'],[28000,'100 unidades · doble faz'],[41000,'1.000 unidades · barniz UV'],[54000,'1.000 unidades · OPP mate doble faz']],recetarios:[[5000,'15×21 B/N · 100 unidades'],[15000,'15×21 B/N · 400 unidades'],[3000,'10×15 B/N · 100 unidades'],[10000,'10×15 B/N · 400 unidades'],[18000,'10×15 color · 400 unidades']],folletos:[[4800,'B/N 10×15 · 100 unidades'],[13000,'B/N 10×15 · 500 unidades'],[37000,'Color 10×15 frente · 1.000 unidades'],[110000,'Color 10×15 frente · 5.000 unidades'],[87000,'Color 10×15 doble faz · 2.000 unidades']]};app.innerHTML=backButton()+`<div class="card"><div class="grid"><label class="field">Producto<select id="graphicCat"><option value="tarjetas">Tarjetas personales</option><option value="recetarios">Recetarios</option><option value="folletos">Folletos</option></select></label><label class="field">Variante<select id="graphicProduct"></select></label><label class="field">Cantidad de lotes<input id="graphicLots" type="number" min="1" value="1"></label></div><div class="plot-hint">El precio no incluye diseño. El archivo queda sujeto a revisión técnica.</div><button class="btn btn-primary" style="width:100%;margin-top:14px" id="calc">Calcular precio</button></div>`;bindBack();const cat=document.getElementById('graphicCat'),sel=document.getElementById('graphicProduct');function fill(){sel.innerHTML=products[cat.value].map((r,i)=>'<option value="'+i+'">'+r[1]+' · '+money(r[0])+'</option>').join('')}cat.onchange=fill;fill();document.getElementById('calc').onclick=()=>{const lots=Math.max(1,Number(document.getElementById('graphicLots').value)||1),row=products[cat.value][Number(sel.value)||0],names={tarjetas:'Tarjetas personales',recetarios:'Recetarios',folletos:'Folletos'};finishItem({service:'grafica',work:'Gráfica comercial',qty:lots+' lote'+(lots===1?'':'s'),mode:names[cat.value]+' · '+row[1],binding:false,bindingCharge:0,baseTotal:row[0]*lots,meta:{}})}}
function applyDaily(item){const p=scheduledPromo();let total=item.baseTotal,saving=0,label='';if(!p)return{total,saving,label};if(p.code==='LUNESDEPLANOS'&&item.service==='ploteos'&&item.meta.kind==='cad'&&item.meta.paper==='obra'&&item.meta.meters>=2){saving=Math.round(total*.1);label='LUNESDEPLANOS · 10% en planos desde 2 metros'}else if(p.code==='MARTESDECOPIAS'&&item.service==='impresiones'){saving=Math.round(total*.1);label='MARTESDECOPIAS · 10% en impresiones'}else if(p.code==='FOTOSPREMIUM'&&item.service==='fotos'&&item.meta.product&&item.meta.product.paper==='Luster'&&norm(item.meta.product.size)!=='A3'){const normal=cfg.photos.products.find(x=>x.paper==='Papel fotográfico'&&norm(x.size)===norm(item.meta.product.size));if(normal){const idx=tierIndex(cfg.photos.scales,item.meta.q),promoTotal=item.meta.q*Number(normal.prices[idx]||0);saving=Math.max(0,total-promoTotal);total=promoTotal;label='FOTOSPREMIUM · Premium al precio normal';return{total,saving,label}}}else if(p.code==='ANILLADO0'&&item.service==='impresiones'&&item.bindingCharge>0){saving=item.bindingCharge;label='ANILLADO0 · Anillado gratis'}else if(p.code==='STICKER10'&&item.service==='stickers'&&item.meta.product&&norm(item.meta.product.size)==='A3'){const promoTotal=item.meta.q*Number(item.meta.product.prices[0].unit||0)*.9;saving=Math.max(0,total-promoTotal);total=Math.min(total,promoTotal);label='STICKER10 · 10% en Stickers A3';return{total,saving,label}}else if(p.code==='SABADO20'||p.code==='DOMINGO20'){saving=Math.round(total*.2);label=p.code+' · 20% en el carrito'}return{total:Math.max(0,total-saving),saving,label}}
function finishItem(data){const daily=applyDaily(data);currentItem={service:data.service,work:data.work,qty:data.qty,mode:data.mode,binding:data.binding,bindingCharge:data.bindingCharge||0,promoLabel:daily.label,promoSaving:daily.saving,originalTotal:Math.round(data.baseTotal),total:Math.round(daily.total),meta:data.meta||{}};track('presupuesto_calculado',{servicio:data.service,value:currentItem.total,currency:'ARS'});renderResult()}
function couponBase(item,product){if(product==='TODO')return item.originalTotal||item.total;if(product==='IMPRESIONES'&&item.service==='impresiones')return item.originalTotal||item.total;if(product==='FOTOS'&&item.service==='fotos')return item.originalTotal||item.total;if(product==='STICKERS'&&item.service==='stickers')return item.originalTotal||item.total;if(product==='PLOTEOS'&&(item.service==='ploteos'||item.service==='corte'))return item.originalTotal||item.total;if(product==='GRAFICA COMERCIAL'&&item.service==='grafica')return item.originalTotal||item.total;if(product==='ANILLADOS'&&item.binding)return item.bindingCharge||0;return 0}
function totals(){const items=cart.slice();if(currentItem)items.push(currentItem);const original=items.reduce((s,i)=>s+(i.originalTotal||i.total),0),daily=items.reduce((s,i)=>s+(i.promoSaving||0),0),after=items.reduce((s,i)=>s+i.total,0),eligible=manualCoupon?items.reduce((s,i)=>s+couponBase(i,manualCoupon.product),0):0;let candidate=0;if(manualCoupon){candidate=manualCoupon.type==='PORCENTAJE'?Math.round(eligible*manualCoupon.value/100):manualCoupon.value;candidate=Math.min(eligible,candidate);if(manualCoupon.maxDiscount>0)candidate=Math.min(candidate,manualCoupon.maxDiscount)}const max=Math.round(original*.25),coupon=Math.max(0,Math.min(candidate,max-daily)),grand=Math.max(0,after-coupon);return{items,original,daily,eligible,candidate,coupon,grand,deposit:Math.round(grand*.5)}}
function renderResult(){heading.textContent='Tu presupuesto';subheading.textContent='Revisá el resumen antes de confirmar.';const t=totals();app.innerHTML=`<div class="result-layout"><div><div class="total-label">Precio estimado</div><div class="total">${money(t.grand)}</div><div class="deposit">Seña para confirmar (50%): ${money(t.deposit)}</div><div class="promo ${t.daily>0?'show':''}">${t.daily>0?'Promoción automática aplicada. Ahorro: '+money(t.daily):''}</div><div class="transfer"><strong>Datos para transferir la seña</strong><br>Alias: <strong>libreriasaber.mp</strong><br>Titular: Hernan Maximiliano Meichtry<br>CUIL: 20-22792046-8</div><details><summary>¿Tenés un código de descuento?</summary><div class="coupon"><input id="coupon" placeholder="Ingresá el código" value="${manualCoupon?manualCoupon.code:''}"><button id="applyCoupon">Aplicar</button></div><div class="coupon-status" id="couponStatus">${manualCoupon?(manualCoupon.code+' aplicado · '+manualCoupon.label):'Se validará contra las promociones vigentes.'}</div></details><div class="notice"><strong>Importante:</strong> presupuesto sujeto a revisión de archivos, cantidades y características. La orden entra en producción después de recibir y revisar los archivos definitivos y el comprobante de la seña.</div><div class="actions"><a class="btn btn-green" id="finalAction" href="#">${integrated?'Agregar al pedido general':'Confirmar pedido por WhatsApp'}</a><button class="btn btn-light" id="addAnother">Agregar otro trabajo</button><button class="btn btn-light" id="changeData">Cambiar datos</button></div></div><div class="card" style="margin-top:0"><b>Trabajos incluidos</b><div class="summary" id="summary"></div></div></div>`;
const sum=document.getElementById('summary');t.items.forEach((i,index)=>{const r=document.createElement('div');r.className='summary-row';r.innerHTML='<div class="summary-main"><b>'+i.work+'</b><span>'+i.qty+' · '+i.mode+(i.binding?' · Con anillado':'')+(i.promoLabel?' · '+i.promoLabel:'')+'</span></div><div class="summary-end">'+money(i.total)+(index<cart.length?'<button class="remove" data-remove="'+index+'">Quitar</button>':'')+'</div>';sum.appendChild(r)});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{cart.splice(Number(b.dataset.remove),1);renderResult()});document.getElementById('addAnother').onclick=()=>{if(currentItem){cart.push(currentItem);currentItem=null}renderServices()};document.getElementById('changeData').onclick=renderForm;document.getElementById('applyCoupon').onclick=applyCoupon;document.getElementById('finalAction').onclick=finalize;if(!integrated){const a=document.getElementById('finalAction');a.target='_blank';a.rel='noopener';a.href=whatsAppHref(t)}}
async function applyCoupon(){const status=document.getElementById('couponStatus'),code=document.getElementById('coupon').value.trim();if(!code){manualCoupon=null;renderResult();return}status.textContent='Comprobando promoción…';if(!extraPromos.length){const ok=await loadPromos();if(!ok){status.textContent='No pudimos consultar las promociones.';return}}const found=findCoupon(code);if(!found){manualCoupon=null;status.textContent='El código no existe, está desactivado o está fuera de fecha.';renderResult();return}manualCoupon=found;track('cupon_aplicado',{codigo:found.code,producto:found.product});renderResult()}
function whatsAppHref(t){const lines=t.items.map(i=>'• '+i.work+'\n  '+i.qty+' · '+i.mode+(i.binding?' · Con anillado':'')+'\n  '+money(i.total)),discount=manualCoupon&&t.coupon>0?'\n• Cupón '+manualCoupon.code+': -'+money(t.coupon):'';const msg='Hola, quiero confirmar este pedido.\n\n*PEDIDO*\n'+lines.join('\n\n')+discount+'\n\n*TOTAL: '+money(t.grand)+'*\n*SEÑA 50%: '+money(t.deposit)+'*\n\n*DATOS PARA TRANSFERIR LA SEÑA*\n*Alias:* libreriasaber.mp\n*Titular:* Hernan Maximiliano Meichtry\n*CUIL:* 20-22792046-8\n\n*PARA CONFIRMAR, ENVÍO EN ESTE CHAT:*\n1. Los archivos definitivos.\n2. El comprobante de la seña.\n\nLa orden entra en producción después de recibir y revisar ambos.\n\n_Sujeto a revisión. Si hay diferencias, me contactarán antes de producir._';return 'https://api.whatsapp.com/send?phone=5493513110130&text='+encodeURIComponent(msg)}
function finalize(ev){const t=totals();if(!t.items.length){ev.preventDefault();return}if(!integrated){track('confirmar_whatsapp',{value:t.grand,currency:'ARS',cantidad_items:t.items.length});return}ev.preventDefault();const detail=t.items.map(i=>i.work+' — '+i.qty+' · '+i.mode+(i.binding?' · Con anillado':'')+(i.promoLabel?' · '+i.promoLabel:'')).join(' | '),title=t.items.length===1?t.items[0].work:'Pedido de impresión y gráfica';window.parent.postMessage({type:'SABER_ADD_PRINT',payload:{id:'PRINT-'+Date.now(),type:'print',name:title,price:t.grand,qty:1,detail,deposit:t.deposit}},'*');track('agregar_pedido_general',{value:t.grand,currency:'ARS',cantidad_items:t.items.length})}
(async function(){const token=new URLSearchParams(location.search).get('cupon');if(!token)return;const loaded=await loadPromos();manualCoupon=loaded?findCoupon(token):null})();
})();

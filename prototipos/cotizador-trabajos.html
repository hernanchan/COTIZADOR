dth:37px;height:42px;background:#eff5f8;border-radius:7px;display:grid;place-items:center;color:var(--blue);font-size:11px;font-weight:900}.filemeta{min-width:0;flex:1}.filemeta strong{display:block;overflow-wrap:anywhere;font-size:13px}.filemeta small{color:var(--muted)}.file .remove{color:#9b4741;background:transparent;border:0;font-size:20px;padding:5px}.previewbox{border:1px solid var(--line);border-radius:12px;background:#f7f9fa;padding:15px;display:flex;gap:16px;align-items:center;margin:12px 0}.sheet{width:132px;aspect-ratio:0.72;background:white;border:1px solid #b6c6ce;box-shadow:0 4px 12px #123f5b1a;padding:9px;display:grid;gap:5px;grid-template-columns:repeat(var(--cols,1),1fr);grid-template-rows:repeat(var(--rows,1),1fr);flex:none}.sheet span{border:1px solid #b7cad4;background:linear-gradient(135deg,#f9fbfc 70%,#edf4f6);display:grid;place-items:center;color:#6b8290;font-size:10px}.sheet span{position:relative;border:1px solid #b7cad4;background:#fff;display:block;overflow:hidden}.sheet span:before,.sheet span:after{content:"";position:absolute;left:12%;right:12%;height:2px;top:28%;background:#a9bbc4;box-shadow:0 6px 0 #c1cdd2,0 12px 0 #c1cdd2}.sheet span:after{top:67%;right:35%;background:#ee9637;box-shadow:none}.previewbox.plan-preview .sheet{width:132px;aspect-ratio:1.414;position:relative;background:#fff;padding:0}.previewbox.plan-preview .sheet:before{content:"";position:absolute;inset:7px;border:1px solid #a8bbc5;background:repeating-linear-gradient(0deg,transparent 0 11px,#dce6eb 12px),repeating-linear-gradient(90deg,transparent 0 15px,#dce6eb 16px)}.previewbox.plan-preview .sheet:after{content:"";position:absolute;width:26%;height:26%;left:37%;top:37%;border:1.5px solid #176b98;border-radius:50%;box-shadow:0 0 0 9px #edf7fc}.previewbox.plan-preview .sheet span{display:none}.previewbox.plan-preview .sheet.portrait{aspect-ratio:.707;width:94px}.previewbox.plan-preview .sheet.original{aspect-ratio:.85}.previewbox .preview-copy{min-width:0;flex:1}.previewbox .preview-copy strong{font-size:13px}.info{border-left:3px solid var(--blue);background:#edf6fa;padding:10px 12px;border-radius:0 8px 8px 0;color:#38596d;font-size:12px;margin:12px 0}.warning{border-left:3px solid var(--orange);background:#fff7eb;padding:11px 12px;border-radius:0 8px 8px 0;color:#754e1b;font-size:12px;margin:12px 0}.job{border:1px solid var(--line);border-radius:13px;padding:16px;margin:12px 0}.jobhead{display:flex;align-items:start;gap:10px}.jobtitle{font-size:16px;font-weight:850;color:var(--navy)}.jobdetails{font-size:12px;color:var(--muted);margin-top:4px}.jobfiles{margin-top:10px;display:grid;gap:6px}.jobfile{display:flex;align-items:center;gap:7px;font-size:12px;padding:7px 9px;background:#f7f9fa;border-radius:7px}.jobfile select{margin-left:auto;max-width:125px;border:1px solid var(--line);border-radius:6px;padding:5px;font-size:11px}.totals{display:grid;gap:8px;padding-top:12px;border-top:1px solid var(--line);margin-top:12px}.total{font-size:21px;font-weight:900;color:var(--navy)}.pricehint{font-size:11px;color:#8a6c3e;background:#fff8ee;padding:8px;border-radius:8px}.field{display:grid;gap:5px;margin:10px 0}.field label{font-size:12px;font-weight:800;color:#36566a}.field input,.field select{border:1px solid #c5d4dc;border-radius:8px;padding:11px;min-height:43px;width:100%;background:#fff}.navbottom{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:19px;padding-top:16px;border-top:1px solid #e6edf0}.aside h3{font-size:14px;margin:0 0 10px;color:var(--navy)}.aside .rule{height:1px;background:#e6edf0;margin:13px 0}.empty{border:1px dashed #ccd9df;border-radius:11px;padding:22px;text-align:center;color:#708594}.empty strong{display:block;color:#38596c;margin-bottom:5px}.inline{display:flex;gap:8px;align-items:center}.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden}.qty button{width:40px;height:42px;background:#f7f9fa;border:0;color:var(--navy);font-size:19px}.qty input{width:75px;height:42px;border:0;text-align:center;font-weight:800}.hidden{display:none!important}.footnote{font-size:11px;color:#7c8f9b;text-align:center;margin:20px auto;max-width:760px}.toast{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#123f5b;color:white;padding:11px 16px;border-radius:8px;box-shadow:var(--shadow);z-index:5}.accordion{border:1px solid var(--line);border-radius:10px;margin:9px 0}.accordion summary{padding:11px 13px;font-weight:750;cursor:pointer}.accordion p{padding:0 13px 13px}.fileinput{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:820px){.wrap{padding:0 12px;margin:15px auto 35px}.layout{grid-template-columns:1fr}.aside{position:static;order:-1}.main{padding:19px}.hero{padding:26px 21px}.hero h1{font-size:27px}.steps{gap:7px}.stepmini{padding:9px;align-items:start;flex-direction:column}.stepmini strong{font-size:11px}.progress{gap:5px}.prog{font-size:0;gap:4px}.prog b{font-size:11px}.line{min-width:4px}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:1fr}.previewbox{align-items:start}.sheet{width:95px}.navbottom .primary{flex:1}.aside{padding:15px}}

<body>
<header class="top"><div class="topin"><div class="brand"><div class="mark">SBR</div><div>Librería Saber<span>Impresión y gráfica · Córdoba</span></div></div><span class="sim">PROTOTIPO INTERACTIVO · SIMULACIÓN</span></div></header>
<div class="wrap"><nav class="progress" id="progress" aria-label="Progreso"></nav><div id="app"></div><p class="footnote">Esta propuesta usa archivos y valores ficticios. No envía archivos, no consulta el catálogo comercial, no crea pedidos y no permite pagos.</p></div><div id="toast" class="toast hidden" role="status"></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), app=$('#app');
const services=[['docs','▤','Documentos e imágenes','PDF, JPG y PNG'],['plans','⌁','Planos y pósters','Tamaño original o ampliación'],['photos','▧','Fotografías','Productos habilitados (simulado)'],['stickers','✦','Stickers','Opciones de corte (simulado)'],['graphic','◈','Otros servicios gráficos','Catálogo comercial (simulado)']];
const S={screen:'home',jobs:[],current:null,seq:0,configStep:0,fromSummary:false};
const money=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(n);
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){const e=$('#toast');e.textContent=t;e.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.classList.add('hidden'),2400)}
function progress(){const steps=[['Pedido',1],['Configuración',2],['Archivos y trabajos',3],['Datos',4]];$('#progress').innerHTML=steps.map(([n,i],ix)=>`<div class="prog ${S.screen==='home'?'':ix+1<(S.screen==='services'?1:S.screen==='config'?2:S.screen==='upload'||S.screen==='summary'?3:4)?'done':ix+1===(S.screen==='home'?0:S.screen==='services'?1:S.screen==='config'?2:S.screen==='upload'||S.screen==='summary'?3:4)?'active':''}"><b>${ix+1}</b>${n}</div>${ix<3?'<div class="line"></div>':''}`).join('')}
const job=()=>S.jobs.find(x=>x.id===S.current);
function newJob(service='docs',config=null){const j={id:'w'+(++S.seq),name:'Trabajo '+S.seq,service,config:structuredClone(config||defaults(service)),files:[]};S.jobs.push(j);S.current=j.id;return j}
function defaults(service){return {size:service==='plans'?'original':'a4',nup:'1',color:service==='photos'||service==='stickers'?'color':'bn',faces:'simple',paper:'catalogo',finish:'none',binding:'individual',copies:1,orientation:'auto',consent:false}}
function currentName(){return job()?.name||'Trabajo'}
function setScreen(screen){S.screen=screen;render()}
function goConfig(j,fromSummary=false){S.current=j.id;S.configStep=0;S.fromSummary=fromSummary;setScreen('config')}
function choiceGroup(label,key,choices,visual=false){const j=job(),v=j.config[key];return `<section class="section"><div class="sectionhead"><div><div class="counter">PASO ${S.configStep+1} DE ${configSections().length}</div><h2>${label}</h2></div></div><div class="options">${choices.map(c=>`<button class="choice ${v===c[0]?'selected':''} ${visual?'visual':''}" data-key="${key}" data-value="${c[0]}" ${visual?`data-n="${c[0]}"`:''}>${visual?`<span class="papericon"><span></span><span></span><span></span><span></span></span>`:''}${c[1]}${c[2]?`<small>${c[2]}</small>`:''}</button>`).join('')}</div></section>`}
function configSections(){const j=job();if(j.service==='docs')return [
 ['Tamaño de impresión','size',[['a4','A4','Legal usa la misma tarifa'],['legal','Legal','Misma tarifa que A4'],['a3','A3'],['original','Mantener tamaño original']],false],
 ['Páginas por carilla','nup',[['1','1 página'],['2','2 páginas'],['4','4 páginas']],true],
 ['Tipo de impresión','color',[['bn','Blanco y negro'],['color','Color']],false],
 ['Caras','faces',[['simple','Una cara'],['double','Ambas caras']],false],
 ['Papel','paper',[['catalogo','Materiales compatibles','Se mostrarían desde el catálogo comercial']],false],
 ['Terminación','finish',[['none','Sin terminación'],['binding','Anillado']],false]
 ];
 if(j.service==='plans')return [['Tamaño de salida','size',[['original','Mantener tamaño original'],['a4','A4'],['a3','A3'],['poster','Tamaño admitido']],false],['Clasificación','kind',[['auto','Detección automática','CAD o póster según el archivo']],false],['Papel','paper',[['catalogo','Materiales compatibles','Selección de rollo automática']],false],['Copias','copies',[],false]];
 if(j.service==='photos')return [['Producto','product',[['catalogo','Producto fotográfico','Opciones del catálogo comercial']],false],['Cantidad','copies',[],false]];
 if(j.service==='stickers')return [['Tamaño','size',[['a4','A4'],['a3','A3']],false],['Corte','finish',[['none','Según producto vigente'],['binding','Precorte']],false],['Cantidad','copies',[],false]];
 return [['Servicio gráfico','product',[['catalogo','Variante habilitada','Se cargaría desde el catálogo comercial']],false],['Cantidad','copies',[],false]]}
function render(){progress();if(S.screen==='home')return home();if(S.screen==='services')return serviceScreen();if(S.screen==='config')return configScreen();if(S.screen==='upload')return uploadScreen();if(S.screen==='summary')return summaryScreen();if(S.screen==='data')return dataScreen()}
function home(){app.innerHTML=`<section class="hero"><span class="sim">PROPUESTA DE EXPERIENCIA</span><h1>Imprimir, ordenar y confirmar sin complicaciones.</h1><p>Configurá cada trabajo una sola vez. Si tenés archivos con opciones distintas, los agrupás en el mismo pedido.</p><button class="btn primary" id="start">Comenzar pedido →</button></section><div class="steps"><div class="stepmini"><i>1</i><strong>Configurá tu impresión</strong></div><div class="stepmini"><i>2</i><strong>Cargá tus archivos</strong></div><div class="stepmini"><i>3</i><strong>Confirmá, pagá y retirás</strong></div></div><div class="info"><strong>Vista de prueba.</strong> Las alternativas y los importes son ficticios; no reemplazan el catálogo ni el presupuesto comercial de Saber.</div>`;$('#start').onclick=()=>setScreen('services')}
function serviceScreen(){app.innerHTML=`<div class="layout"><main class="main"><div class="eyebrow">Nuevo trabajo</div><h1>¿Qué querés imprimir?</h1><p>Elegí un servicio. Después podés sumar otros trabajos al mismo pedido.</p><div class="tiles">${services.map(([id,icon,name,desc])=>`<button class="tile" data-service="${id}"><span class="icon">${icon}</span><strong>${name}</strong><small>${desc}</small></button>`).join('')}</div><div class="navbottom"><button class="btn secondary" id="back">Volver</button></div></main><aside class="aside"><h3>Así funciona</h3><p>Un trabajo reúne archivos que comparten la misma configuración. Podés duplicar sus opciones para empezar otro sin volver a elegir todo.</p><div class="rule"></div><p class="small">Los archivos no se configuran hasta que elijas el servicio.</p></aside></div>`;$$('[data-service]').forEach(b=>b.onclick=()=>goConfig(newJob(b.dataset.service)));$('#back').onclick=()=>S.jobs.length?setScreen('summary'):setScreen('home')}
function $$(s){return [...document.querySelectorAll(s)]}
function previewIllustration(j){const c=j.config;if(j.service==='plans'){const orientation=c.orientation==='portrait'?'portrait':c.orientation==='landscape'?'landscape':c.size==='original'?'original':'landscape';const size=c.size==='original'?'Proporción original':c.size.toUpperCase()==='POSTER'?'Tamaño admitido':c.size.toUpperCase();return `<div class="previewbox plan-preview"><div class="sheet ${orientation}" role="img" aria-label="Esquema de plano con su tamaño y orientación"></div><div class="preview-copy"><strong>Esquema del ploteo</strong><p class="small">${escape(size)} · orientación ${orientation==='original'?'según archivo':orientation==='portrait'?'vertical':'horizontal'}</p><p class="small">No es una vista del contenido ni una detección real.</p></div></div>`}const cols=c.nup==='2'?2:c.nup==='4'?2:c.nup==='9'?3:1,rows=c.nup==='4'?2:c.nup==='9'?3:1;return `<div class="previewbox"><div class="sheet" style="--cols:${cols};--rows:${rows}" role="img" aria-label="Esquema de ${escape(c.nup)} páginas por carilla">${Array.from({length:Number(c.nup)||1},()=>'<span></span>').join('')}</div><div class="preview-copy"><strong>Distribución en la hoja</strong><p class="small">${escape(c.nup)} ${c.nup==='1'?'página':'páginas'} por carilla · ${c.faces==='double'?'doble faz':'una cara'}</p><p class="small">Esquema ilustrativo; no muestra tu archivo.</p></div></div>`}
function configScreen(){const j=job(),sections=configSections(),sec=sections[S.configStep];if(!j)return setScreen('services');let extra='';if(sec[1]==='copies')extra=`<div class="inline"><div class="qty"><button id="minus">−</button><input id="copies" type="number" min="1" max="500" value="${j.config.copies}"><button id="plus">+</button></div><span class="small">Podés escribir la cantidad.</span></div>`;
let bind=j.config.finish==='binding'&&j.files.length>1?`<section class="section"><div class="sectionhead"><h2>¿Cómo querés el anillado?</h2></div><div class="options"><button class="choice ${j.config.binding==='individual'?'selected':''}" data-key="binding" data-value="individual">Individual<small>Un anillado por archivo</small></button><button class="choice ${j.config.binding==='group'?'selected':''}" data-key="binding" data-value="group">Agrupado<small>Juntar archivos compatibles</small></button></div></section>`:'';
const isLast=S.configStep===sections.length-1;const advanced=sec[1]==='nup'?'<details class="accordion"><summary>Opciones avanzadas</summary><div style="padding:0 12px 12px"><button class="choice '+(j.config.nup==='9'?'selected':'')+'" data-key="nup" data-value="9">9 páginas por carilla</button></div></details>':'';app.innerHTML=`<div class="layout"><main class="main"><div class="eyebrow">${escape(j.name)} · ${services.find(x=>x[0]===j.service)?.[2]}</div><h1>${sec[0]}</h1><p>Elegí una opción para continuar. Las decisiones anteriores se conservan si volvés.</p>${sec[2].length?choiceGroup(sec[0],sec[1],sec[2],sec[3]):`<section class="section"><h2>${sec[0]}</h2>${extra}</section>`}${advanced}${bind}${j.service==='plans'&&j.files.some(f=>/\.(jpe?g|png)$/i.test(f.name))?'<div class="warning"><label><input id="consent" type="checkbox" '+(j.config.consent?'checked':'')+'> Entiendo que la resolución puede limitar el resultado y quiero continuar. (Simulación: no se analiza resolución.)</label></div>':''}<details class="accordion"><summary>Detalles técnicos</summary><p>La interfaz real mostraría solo los materiales y terminaciones habilitados para las opciones y el archivo seleccionado.</p></details><div class="navbottom"><button class="btn secondary" id="prev">← Atrás</button><span class="counter">${S.configStep+1} / ${sections.length}</span><button class="btn primary right" id="next">${isLast?'Continuar a cargar archivos':'Siguiente →'}</button></div></main><aside class="aside"><h3>Resumen de configuración</h3><p>${summaryConfig(j)}</p>${previewIllustration(j)}<div class="pricehint">Precio de ejemplo: ${money(simPrice(j))}<br>No es una cotización comercial.</div></aside></div>`;
$$('[data-key]').forEach(b=>b.onclick=()=>{j.config[b.dataset.key]=b.dataset.value;render()});$('#prev').onclick=()=>S.configStep? (S.configStep--,render()):setScreen('services');$('#next').onclick=()=>{if(!sections[S.configStep][2].length){const n=Number($('#copies').value);j.config.copies=Math.max(1,Math.min(500,Number.isFinite(n)?n:1))}if(j.config.finish==='binding'&&j.files.length<=1)j.config.binding='individual';if($('#consent'))j.config.consent=$('#consent').checked;if($('#consent')&&!j.config.consent){toast('Marcá tu consentimiento para continuar.');return}if(isLast)setScreen('upload');else{S.configStep++;render()}};$('#minus')?.addEventListener('click',()=>{j.config.copies=Math.max(1,Number($('#copies').value)-1);render()});$('#plus')?.addEventListener('click',()=>{j.config.copies=Math.min(500,Number($('#copies').value)+1);render()})}
function summaryConfig(j){const c=j.config;const s=[c.size==='original'?'Tamaño original':c.size.toUpperCase(),c.color==='bn'?'Blanco y negro':'Color',c.nup+' pág./carilla',c.faces==='double'?'Doble faz':'Una cara',c.finish==='binding'?'Anillado':null,c.copies+' copias'].filter(Boolean);return s.map(x=>`<span class="badge">${escape(x)}</span>`).join('')}
function simPrice(j){const base={docs:180,plans:950,photos:520,stickers:700,graphic:1200}[j.service];return base*Number(j.config.copies||1)*Math.max(1,j.files.length||1)}
function uploadScreen(){const j=job();app.innerHTML=`<div class="layout"><main class="main"><div class="eyebrow">${escape(j.name)} · archivos</div><h1>Cargá tus archivos</h1><p>Podés seleccionar varios o arrastrarlos acá. En este prototipo quedan en tu dispositivo.</p><div class="upload" id="drop"><div class="uploadicon">⇧</div><strong>Arrastrá tus archivos</strong><p>PDF, JPG o PNG · varios archivos a la vez</p><label for="files" class="btn secondary">Seleccionar archivos</label><input class="fileinput" id="files" type="file" multiple accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png"></div><div class="row" style="margin-top:10px"><button class="quiet" id="sample">+ Agregar archivos ficticios de ejemplo</button><span class="small">Nada se envía desde este prototipo.</span></div><div class="files" id="filelist">${j.files.length?j.files.map(fileRow).join(''):'<div class="empty"><strong>Aún no hay archivos</strong>Agregá tus archivos para revisar el trabajo.</div>'}</div><div class="warning">Si el tamaño detectado no coincide con lo que elegiste, la experiencia real mostraría alternativas para que confirmes. No cambiaría tu decisión en silencio.</div><div class="navbottom"><button class="btn secondary" id="back">← Volver a configurar</button><button class="btn primary right" id="add">Agregar trabajo al pedido</button></div></main><aside class="aside"><h3>Este trabajo</h3>${summaryConfig(j)}<div class="rule"></div><strong>${j.files.length} archivo${j.files.length===1?'':'s'}</strong><div class="pricehint" style="margin-top:10px">Subtotal simulado<br><strong>${money(simPrice(j))}</strong></div><p class="small">Los nombres de archivos pueden personalizarse después; no hace falta repetir las opciones del trabajo.</p></aside></div>`;
const input=$('#files'),drop=$('#drop');input.onchange=e=>addFiles([...e.target.files]);drop.ondragover=e=>{e.preventDefault();drop.classList.add('drag')};drop.ondragleave=()=>drop.classList.remove('drag');drop.ondrop=e=>{e.preventDefault();drop.classList.remove('drag');addFiles([...e.dataTransfer.files])};$('#sample').onclick=()=>addFiles([{name:'apuntes-ejemplo.pdf',fake:true},{name:'guia-ejemplo.pdf',fake:true}]);$('#back').onclick=()=>{S.configStep=configSections().length-1;setScreen('config')};$('#add').onclick=()=>{if(!j.files.length){toast('Agregá al menos un archivo o archivos ficticios.');return}setScreen('summary')}
}
function fileRow(f){return `<div class="file"><div class="fileicon">${/\.pdf$/i.test(f.name)?'PDF':'IMG'}</div><div class="filemeta"><strong>${escape(f.name)}</strong><small>${f.fake?'Archivo ficticio':(f.size?`${(f.size/1024).toFixed(0)} KB · `:'')}${f.pages} páginas estimadas · análisis simulado</small></div><button class="remove" data-remove="${f.id}" aria-label="Quitar ${escape(f.name)}">×</button></div>`}
function summaryScreen(){const total=S.jobs.reduce((n,j)=>n+simPrice(j),0);app.innerHTML=`<div class="layout"><main class="main"><div class="eyebrow">Pedido · ${S.jobs.length} trabajo${S.jobs.length===1?'':'s'}</div><h1>Revisá tu pedido</h1><p>Cada trabajo se puede editar por separado. Podés agregar otros servicios sin perder lo que ya cargaste.</p><div>${S.jobs.map((j,ix)=>`<article class="job"><div class="jobhead"><div style="flex:1"><div class="counter">TRABAJO ${ix+1}</div><div class="jobtitle">${escape(j.name)}</div><div class="jobdetails">${services.find(x=>x[0]===j.service)?.[2]} · ${summaryConfig(j)}</div></div><button class="btn secondary" data-edit="${j.id}">Editar</button><button class="btn secondary danger" data-delete="${j.id}" aria-label="Eliminar ${escape(j.name)}">Quitar</button></div><div class="jobfiles">${j.files.map(f=>`<div class="jobfile">▤ ${escape(f.name)} · ${f.pages} pág.<select aria-label="Mover ${escape(f.name)}" data-move="${f.id}"><option value="">Mover archivo…</option>${S.jobs.filter(x=>x.id!==j.id&&x.service===j.service&&JSON.stringify(x.config)===JSON.stringify(j.config)).map(x=>`<option value="${x.id}">${escape(x.name)}</option>`).join('')}</select><button class="quiet" data-add-files="${j.id}">+ Archivos</button></div>`).join('')}</div><div class="row"><span class="badge green">${j.files.length} archivo${j.files.length===1?'':'s'}</span><span class="badge orange">Subtotal simulado · ${money(simPrice(j))}</span></div></article>`).join('')}</div><div class="row"><button class="btn secondary" id="new">+ Agregar otro trabajo</button>${S.jobs.length?'<button class="btn secondary" id="duplicate">Duplicar configuración anterior</button>':''}</div><div class="warning"><strong>Resolución</strong> · Las alertas aparecerían acá, debajo del presupuesto. En esta simulación no se analiza resolución real.</div><div class="navbottom"><button class="btn secondary" id="back">← Seguir editando</button><button class="btn primary right" id="next">Siguiente: datos de contacto</button></div></main><aside class="aside"><h3>Resumen del pedido</h3><p>${S.jobs.length} trabajo${S.jobs.length===1?'':'s'} · ${S.jobs.reduce((a,j)=>a+j.files.length,0)} archivo${S.jobs.reduce((a,j)=>a+j.files.length,0)===1?'':'s'}</p><div class="totals"><span>Total simulado</span><div class="total">${money(total)}</div><div class="pricehint">Promoción ficticia: 10% en este ejemplo.<br>Plazo de ejemplo: 2 días hábiles, no comercial.</div></div><button class="btn primary" style="width:100%;margin-top:13px" id="next2">Continuar →</button></aside></div>`;
$$('[data-edit]').forEach(b=>b.onclick=()=>goConfig(jobById(b.dataset.edit),true));$$('[data-delete]').forEach(b=>b.onclick=()=>{S.jobs=S.jobs.filter(j=>j.id!==b.dataset.delete);if(!S.jobs.length)setScreen('services');else render()});$$('[data-add-files]').forEach(b=>b.onclick=()=>{S.current=b.dataset.addFiles;setScreen('upload')});$$('[data-move]').forEach(sel=>sel.onchange=()=>{if(!sel.value)return;const source=S.jobs.find(j=>j.files.some(f=>f.id===sel.dataset.move)),target=jobById(sel.value),i=source.files.findIndex(f=>f.id===sel.dataset.move);target.files.push(source.files.splice(i,1)[0]);render()});$('#new').onclick=()=>setScreen('services');$('#duplicate')?.addEventListener('click',()=>{const source=S.jobs.at(-1);goConfig(newJob(source.service,source.config))});$('#back').onclick=()=>S.jobs.length?goConfig(S.jobs[0],true):setScreen('services');$('#next').onclick=$('#next2').onclick=()=>setScreen('data')}
function jobById(id){return S.jobs.find(j=>j.id===id)}
function dataScreen(){const total=S.jobs.reduce((n,j)=>n+simPrice(j),0);app.innerHTML=`<div class="layout"><main class="main"><div class="eyebrow">Último paso · simulación</div><h1>¿A quién avisamos?</h1><p>En el circuito real, tus datos se pedirían en una pantalla independiente.</p><div class="grid"><div class="field"><label for="name">Nombre</label><input id="name" placeholder="Tu nombre"></div><div class="field"><label for="phone">WhatsApp</label><input id="phone" inputmode="tel" placeholder="351…"></div><div class="field"><label for="email">Correo electrónico</label><input id="email" type="email" placeholder="nombre@correo.com"></div><div class="field"><label for="delivery">Entrega</label><select id="delivery"><option>Retiro en local (simulado)</option><option>Opciones disponibles en cotizador real</option></select></div></div><div class="info">Pagos y datos comerciales están desactivados en esta propuesta. Ninguna información se guarda o se envía.</div><div class="navbottom"><button class="btn secondary" id="back">← Volver al pedido</button><button class="btn primary right" id="finish">Ver confirmación de prueba</button></div></main><aside class="aside"><h3>Tu presupuesto de prueba</h3><p>${S.jobs.length} trabajo${S.jobs.length===1?'':'s'}</p><div class="total">${money(total)}</div><p class="small">Importe ficticio; no representa tarifas vigentes.</p></aside></div>`;$('#back').onclick=()=>setScreen('summary');$('#finish').onclick=()=>{toast('Simulación finalizada: no se generó ningún pedido.');$('#finish').textContent='Prueba completada';$('#finish').disabled=true}}
function addFiles(files){const j=job(),accepted=files.filter(f=>/\.(pdf|jpe?g|png)$/i.test(f.name));if(accepted.length<files.length)toast('Solo PDF, JPG y PNG en esta simulación.');for(const f of accepted){if(j.files.some(x=>x.name===f.name)){toast('Ese nombre ya está en el trabajo.');continue}j.files.push({id:'f'+(++S.seq),name:f.name,pages:f.fake?2:Math.max(1,Math.ceil(Math.random()*9)),fake:!!f.fake,size:f.size||0})}uploadScreen()}
app.addEventListener('click',e=>{const b=e.target.closest('[data-remove]');if(b){const j=job();j.files=j.files.filter(f=>f.id!==b.dataset.remove);render()}});
render();
})();
</script></body></html>

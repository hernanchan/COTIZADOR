<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recepción protegida de Polaroids · Librería Saber</title>
<style>body{font:13px system-ui,Arial,sans-serif;color:#234666;background:#f7f9fc;margin:0;padding:12px}p{margin:0}</style>
</head>
<body>
<p>Recepción segura de fotografías. Esta ventana está vinculada al editor de Librería Saber.</p>
<script>
'use strict';
// El origen autorizado viene de una propiedad del proyecto, NO del mensaje.
const PARENT_ORIGIN=<?!= JSON.stringify(parentOrigin) ?>;
function reply(data){
 if(window.parent!==window)window.parent.postMessage(data,PARENT_ORIGIN);
}
window.addEventListener('message',event=>{
 if(event.source!==window.parent||event.origin!==PARENT_ORIGIN)return;
 const msg=event.data;
 if(!msg||msg.type!=='SABER_RECEIVER_REQUEST'||
    typeof msg.id!=='string'||!/^[a-zA-Z0-9_-]{8,80}$/.test(msg.id))return;
 const ok=value=>reply({type:'SABER_RECEIVER_RESULT',id:msg.id,ok:true,value});
 const fail=err=>reply({type:'SABER_RECEIVER_RESULT',id:msg.id,ok:false,
   error:err&&err.message?String(err.message).slice(0,300):'Error de recepción'});
 const call=google.script.run.withSuccessHandler(ok).withFailureHandler(fail);
 if(msg.op==='start')call.startPublicOrder(msg.payload);
 else if(msg.op==='photo')call.uploadPublicPhoto(msg.payload);
 else if(msg.op==='finish'){
   const payload=msg.payload||{};
   call.finishPublicOrder(payload.reference,payload.uploadKey);
 }else fail(new Error('Operación no admitida.'));
});
window.addEventListener('load',()=>reply({type:'SABER_RECEIVER_READY'}));
</script>
</body>
</html>

<script>
(async function(){
const app=document.getElementById('app'),source=document.getElementById('source'),heading=document.getElementById('heading'),subheading=document.getElementById('subheading');
const integrated=new URLSearchParams(location.search).get('integrado')==='1'&&window.parent!==window;
const promosCsvUrl='https://docs.google.com/spreadsheets/d/e/2PACX-1vSVe0GKHSmYbfjpIkrvgA1lDqxz57j-VEDkY5BqYtVzKj_5ePB9NoyRhkTvf0S5dN-Ur6wrQANcg3WT/pub?gid=495325142&single=true&output=csv';
let cfg,service='impresiones',cart=[],currentItem=null,manualCoupon=null,extraPromos=[];
const state={size:'a4',mode:'bn',face:'simple',graphic:'tarjetas'};
try{const r=await fetch('../precios-web.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error();cfg=await r.json();source.textContent='Precios: '+new Date(cfg.generatedAt).toLocaleDateString('es-AR');renderServices()}catch(e){app.innerHTML='<div class="error">No se pudo cargar la configuración de precios. Por favor intentá nuevamente.</div>';source.textContent='Error de configuración';return}
function track(name,params){if(typeof gtag==='function')gtag('event',name,params||{})}
function money(n){return '$'+Math.round(Number(n)||0).toLocaleString('es-AR')}
function norm(v){return String(v||'').trim().toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function roundTo(n,step){step=Number(step)||1;return Math.round(Number(n||0)/step)*step}
function tierIndex(scales,q){let i=scales.findIndex(s=>q>=Number(s.from||1)&&(s.to==null||q<=Number(s.to)));return i<0?scales.length-1:i}
function parseCsv(text){const rows=[];let row=[],field='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i],next=text[i+1];if(c==='"'&&quoted&&next==='"'){field+='"';i++}else if(c==='"')quoted=!quoted;else if(c===','&&!quoted){row.push(field);field=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&next==='\n')i++;row.push(field);if(row.some(v=>v!==''))rows.push(row);row=[];field=''}else field+=c}row.push(field);if(row.some(v=>v!==''))rows.push(row);return rows}
function numeric(v){let t=String(v||'').replace(/[^0-9,.-]/g,''),c=t.lastIndexOf(','),d=t.lastIndexOf('.');if(c>=0&&d>=0)t=c>d?t.replace(/\./g,'').replace(',','.'):t.replace(/,/g,'');else if(c>=0)t=/,\d{3}$/.test(t)?t.replace(/,/g,''):t.replace(',','.');else if(d>=0&&/\.\d{3}$/.test(t))t=t.replace(/\./g,'');return Number(t)||0}
function parseDate(v,end){const t=String(v||'').trim();let p;if(/^\d{4}-\d{2}-\d{2}$/.test(t)){p=t.split('-');return new Date(+p[0],+p[1]-1,+p[2],end?23:0,end?59:0,end?59:0)}if(/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(t)){p=t.split('/');return new Date(+p[2],+p[1]-1,+p[0],end?23:0,end?59:0,end?59:0)}return null}
async function loadPromos(){try{const r=await fetch(promosCsvUrl+'&v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error();const rows=parseCsv(await r.text()),hi=rows.findIndex(r=>norm(r[0])==='ACTIVA'&&norm(r[1])==='CODIGO');if(hi<0)throw new Error();extraPromos=rows.slice(hi+1).map(r=>({active:norm(r[0])==='SI',code:norm(r[1]),label:String(r[2]||'').trim(),type:norm(r[3]),value:numeric(r[4]),product:norm(r[5]),from:parseDate(r[6],false),to:parseDate(r[7],true),maxDiscount:numeric(r[8])})).filter(p=>p.active&&p.code);return true}catch(e){extraPromos=[];return false}}
function findCoupon(code){const n=norm(code),now=new Date();return extraPromos.find(p=>p.code===n&&p.from&&p.to&&now>=p.from&&now<=p.to&&(p.type==='PORCENTAJE'||p.type==='MONTO')&&p.value>0)||null}
function serviceName(v){return v==='impresiones'?'Impresión de documento':v==='fotos'?'Impresión de fotos':v==='stickers'?'Stickers con precorte':v==='ploteos'?'Ploteo':v==='corte'?'Ploteo de corte':v==='grafica'?'Gráfica comercial':'Consulta'}
function scheduledPromo(){const d=new Date().getDay();if(d===1)return{code:'LUNESDEPLANOS',label:'Lunes: 10% en ploteos CAD sobre papel obra desde 2 metros'};if(d===2)return{code:'MARTESDECOPIAS',label:'Martes: 10% en impresiones'};if(d===3)return{code:'FOTOSPREMIUM',label:'Miércoles: fotos Premium al precio normal'};if(d===4)return{code:'ANILLADO0',label:'Jueves: anillado sin cargo'};if(d===5)return{code:'STICKER10',label:'Viernes: 10% en planchas A3 de stickers'};if(d===6)return{code:'SABADO20',label:'Fin de semana: 20% online'};if(d===0)return{code:'DOMINGO20',label:'Fin de semana: 20% online'};return null}
function familyRank(f){return f==='Obra'?0:f==='Ilustración'?1:f==='Fotográfico'?2:f==='Adhesivo'?3:4}
function gram(n){const m=String(n).match(/(\d{2,3})\s*(?:G|GR|GRS)?\b/i);return m?Number(m[1]):9999}
function sortMaterials(a,b){return familyRank(a.family)-familyRank(b.family)||gram(a.name)-gram(b.name)||a.name.localeCompare(b.name,'es')}
function cleanName(n){return String(n||'').replace('Ilustraci{on','Ilustración')}
function materialOptions(materials){const sorted=[...materials].sort(sortMaterials),groups={};sorted.forEach(m=>(groups[m.family]||(groups[m.family]=[])).push(m));return Object.keys(groups).sort((a,b)=>familyRank(a)-familyRank(b)).map(f=>'<optgroup label="'+f+'">'+groups[f].map(m=>'<option value="'+m.id+'">'+cleanName(m.name)+'</option>').join('')+'</optgroup>').join('')}
function backButton(){return '<div class="backline"><button id="backServices">← Cambiar servicio</button></div>'}
function bindBack(){const b=document.getElementById('backServices');if(b)b.onclick=renderServices}
function dailyBenefitHtml(){const p=scheduledPromo();return p?'<div class="daily-benefit"><div class="daily-benefit-mark">●</div><div><b>Beneficio de hoy</b><span>'+p.label+'. Se aplica automáticamente cuando cotices un trabajo alcanzado por la promoción.</span></div></div>':''}
function renderServices(){heading.textContent='¿Qué necesitás cotizar?';subheading.textContent='Elegí una opción. Solo te preguntaremos lo necesario.';app.innerHTML=dailyBenefitHtml()+'<div class="service-grid">'+[
['impresiones','Imprimir documentos','A4/A3 · B/N y color · todos los materiales'],['fotos','Imprimir fotos','10×15, 13×18, A4, A3, Polaroid y carnet'],['stickers','Stickers','Planchas A4/A3 con precorte'],['ploteos','Ploteos','Planos CAD y pósteres'],['corte','Ploteo de corte','Vinilo · piezas grandes, chicas o corte solo'],['grafica','Gráfica comercial','Tarjetas, recetarios y folletos']].map(r=>'<button class="service" data-service="'+r[0]+'"><b>'+r[1]+'</b><span>'+r[2]+'</span></button>').join('')+'</div><div class="card"><button class="service" style="width:100%;min-height:auto" id="help"><b>No estoy seguro</b><span>Te ayudamos por WhatsApp.</span></button></div>';
document.querySelectorAll('[data-service]').forEach(b=>b.onclick=()=>{service=b.dataset.service;track('iniciar_cotizacion',{servicio:service});renderForm()});document.getElementById('help').onclick=()=>window.open('https://wa.me/5493513110130?text='+encodeURIComponent('Hola, necesito ayuda para cotizar un trabajo.'),'_blank','noopener')}
function renderForm(){heading.textContent='Contanos el trabajo';subheading.textContent='Completá los datos y calculamos el precio.';if(service==='impresiones')return renderPrint();if(service==='fotos')return renderPhotos();if(service==='stickers')return renderStickers();if(service==='ploteos')return renderPlot();if(service==='corte')return renderCut();if(service==='grafica')return renderGraphic()}

/* Fase 1 de la migración: archivos analizados en este navegador.
 * No hay recepción, generación de PDF ni pago en esta pantalla aislada.
 */
let printUploads=[],printReading=false,printSerial=0,pdfScriptLoad;
async function loadPdfJs(){
 if(window.pdfjsLib)return window.pdfjsLib;
 if(!pdfScriptLoad)pdfScriptLoad=new Promise((resolve,reject)=>{
  const el=document.createElement('script');
  el.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
  el.onload=()=>window.pdfjsLib?resolve(window.pdfjsLib):reject(Error('Lector de PDF no disponible.'));
  el.onerror=()=>reject(Error('No se pudo cargar el lector PDF. Revisá la conexión.'));
  document.head.appendChild(el);
 });
 try{
  const api=await pdfScriptLoad;
  api.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  return api;
 }catch(e){pdfScriptLoad=null;throw e}
}
function renderPrint(){
 heading.textContent='Impresiones de documentos — prueba';
 subheading.textContent='Cargá los PDF; contamos las páginas sin enviarlos. Esta pantalla no acepta pedidos ni pagos.';
 printUploads=[];printReading=false;
 state.size='a4';state.face='simple';state.mode='bn';
 app.innerHTML=backButton()+[
 '<div class="notice"><strong>ENSAYO PRIVADO:</strong> los archivos se analizan en tu navegador. Todavía no se envían a Drive ni al Centro de Pedidos. No realices pagos.</div>',
 '<div class="card"><span class="label">1. Elegí tamaño y caras</span>',
 '<div class="choices" id="sizeChoices"><button type="button" class="choice active" data-size="a4">A4</button><button type="button" class="choice" data-size="a3">A3</button></div>',
 '<div class="choices" id="faceChoices" style="margin-top:9px"><button type="button" class="choice active" data-face="simple">Simple faz</button><button type="button" class="choice" data-face="double">Doble faz</button></div>',
 '<label class="field" style="margin-top:14px">Papel para documentos a color<select id="material"></select></label>',
 '<div class="plot-hint">Para documentos B/N usamos las tarifas de papel obra del cotizador actual. Cada PDF será completamente B/N o color.</div></div>',
 '<div class="card"><span class="label">2. Subí los PDF en blanco y negro</span>',
 '<input id="pdfBn" type="file" accept=".pdf,application/pdf" multiple aria-label="Agregar PDF blanco y negro">',
 '<div class="plot-hint">Podés elegir varios archivos a la vez. No hace falta contar sus páginas.</div></div>',
 '<div class="card"><span class="label">3. Subí los PDF a color</span>',
 '<input id="pdfColor" type="file" accept=".pdf,application/pdf" multiple aria-label="Agregar PDF color">',

 '<div class="card"><span class="label">Archivos leídos</span>',
 '<div id="pdfStatus" role="status" aria-live="polite" class="plot-hint">Esperando documentos PDF…</div>',
 '<div id="pdfRows"></div></div>',
 '<div class="card"><span class="label">4. Copias y armado</span>',
 '<div class="grid"><label class="field">Cantidad de juegos iguales<input type="number" min="1" max="500" step="1" value="1" id="copies"></label>',
 '<label class="field">Anillado<select id="bindingMode"><option value="ninguno">Sin anillar</option><option value="juntos">Todos juntos</option><option value="separados">Cada PDF por separado</option><option value="mixto">Personalizado / mixto</option></select></label></div>',
 '<div class="plot-hint">En «personalizado» indicá el grupo de cada archivo: 0 = sin anillar, 1 = primer anillado, 2 = segundo, etc. Podés modificar el orden de armado.</div>',
 '<div class="error" id="printError" style="display:none;margin-top:12px" role="alert"></div>',
 '<button class="btn btn-primary" id="calc" type="button" style="width:100%;margin-top:14px" disabled>Calcular presupuesto de prueba</button></div>'
 ].join('');
 bindBack();
 const mat=document.getElementById('material');
 function selectMaterial(){
  const sec=state.size==='a4'?cfg.colorA4:cfg.colorA3,previous=mat.value;
  mat.innerHTML=materialOptions(sec.materials);
  if([...mat.options].some(x=>x.value===previous))mat.value=previous;
 }
 function active(group,key,value){
  document.querySelectorAll('#'+group+' .choice').forEach(b=>b.classList.toggle('active',b.dataset[key]===value));
 }
 document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{state.size=b.dataset.size;active('sizeChoices','size',state.size);selectMaterial()});
 document.querySelectorAll('[data-face]').forEach(b=>b.onclick=()=>{state.face=b.dataset.face;active('faceChoices','face',state.face)});
 selectMaterial();
 document.getElementById('pdfBn').addEventListener('change',e=>readPrintFiles(e.target,'bn'));
 document.getElementById('pdfColor').addEventListener('change',e=>readPrintFiles(e.target,'color'));

function renderPrintFileRows(){
 const wrap=document.getElementById('pdfRows'),status=document.getElementById('pdfStatus');
 if(!wrap||!status)return;
 wrap.replaceChildren();
 const numberBn=printUploads.filter(a=>a.modo==='bn').reduce((n,a)=>n+a.paginas,0);
 const numberColor=printUploads.filter(a=>a.modo==='color').reduce((n,a)=>n+a.paginas,0);
 status.textContent=printReading?'Leyendo documentos…':printUploads.length?
  (printUploads.length+' PDF · '+numberBn+' páginas B/N · '+numberColor+' páginas color'):
  'Esperando documentos PDF…';
 const mixed=document.getElementById('bindingMode')?.value==='mixto';
 for(const file of printUploads){
  const row=document.createElement('div');row.className='print-file-row';
  const name=document.createElement('div');name.className='print-file-name';
  const title=document.createElement('strong');title.textContent=file.nombre;
  const description=document.createElement('span');
  description.textContent=file.paginas+' pág. · '+(file.modo==='bn'?'B/N':'Color')+' · Original: '+file.medidas;
  name.append(title,description);row.appendChild(name);
  const controls=document.createElement('div');controls.className='print-file-controls';
  const order=document.createElement('label');order.textContent='Orden';
  const orderInput=document.createElement('input');orderInput.type='number';orderInput.min='1';orderInput.max='150';orderInput.step='1';orderInput.value=file.orden;
  orderInput.setAttribute('aria-label','Orden de '+file.nombre);
  orderInput.onchange=()=>{file.orden=Number(orderInput.value)};
  order.appendChild(orderInput);controls.appendChild(order);
  if(mixed){
   const group=document.createElement('label');group.textContent='Grupo';
   const input=document.createElement('input');input.type='number';input.min='0';input.max='150';input.step='1';input.value=file.grupo;
   input.setAttribute('aria-label','Grupo de anillado de '+file.nombre);
   input.onchange=()=>{file.grupo=Number(input.value)};
   group.appendChild(input);controls.appendChild(group);
  }
  const remove=document.createElement('button');remove.className='btn btn-light';
  remove.type='button';remove.textContent='Quitar';remove.disabled=printReading;
  remove.onclick=()=>{printUploads=printUploads.filter(a=>a.id!==file.id);renderPrintFileRows()};
  controls.appendChild(remove);row.appendChild(controls);wrap.appendChild(row);
 }
 const calc=document.getElementById('calc');if(calc)calc.disabled=printReading||!printUploads.length;

async function readPrintFiles(input,modo){
 const files=Array.from(input.files||[]);input.value='';
 if(printReading||!files.length)return;
 const error=document.getElementById('printError');error.style.display='none';
 if(printUploads.length+files.length>150){error.textContent='Máximo de 150 PDF por pedido de ensayo.';error.style.display='block';return}
 printReading=true;document.getElementById('pdfBn').disabled=true;document.getElementById('pdfColor').disabled=true;
 renderPrintFileRows();
 const rejected=[];
 try{
  const api=await loadPdfJs();
  for(let n=0;n<files.length;n++){
   const file=files[n];document.getElementById('pdfStatus').textContent='Leyendo '+(n+1)+' de '+files.length+': '+file.name;
   try{
    if(!/\.pdf$/i.test(file.name))throw Error('El archivo no es PDF.');
    if(file.size>80*1024*1024)throw Error('Supera 80 MB. Requiere tratamiento especial.');
    if(!file.size)throw Error('Archivo vacío.');
    const buffer=await file.arrayBuffer();
    const task=api.getDocument({data:new Uint8Array(buffer)});
    let pdf;
    try{
     pdf=await task.promise;
     if(!Number.isSafeInteger(pdf.numPages)||pdf.numPages<1)throw Error('PDF sin páginas.');
     const first=await pdf.getPage(1),v=first.getViewport({scale:1});
     let dimension=(v.width*2.54/72).toFixed(1)+' × '+(v.height*2.54/72).toFixed(1)+' cm';
     first.cleanup();

    }finally{if(pdf)await pdf.destroy();else await task.destroy()}

  }

function renderPlot(){app.innerHTML=backButton()+`<div class="card"><div class="grid"><label class="field">Trabajo<select id="plotKind"><option value="cad">Plano / dibujo de líneas</option><option value="poster">Póster / imagen plena</option></select></label><label class="field">Papel<select id="plotPaper"><option value="obra">Papel obra</option></select></label><label class="field">Ancho cm<input id="plotW" type="number" min="1" value="60"></label><label class="field">Alto cm<input id="plotH" type="number" min="1" value="90"></label><label class="field">Cantidad<input id="plotQty" type="number" min="1" value="1"></label></div><div class="plot-hint">El sistema elige automáticamente el rollo y la orientación más conveniente.</div><button class="btn btn-primary" style="width:100%;margin-top:14px" id="calc">Calcular precio</button></div>`;bindBack();const kind=document.getElementById('plotKind'),paper=document.getElementById('plotPaper');function papers(){paper.innerHTML=kind.value==='cad'?'<option value="obra">Papel obra</option>':'<option value="obra">Papel obra</option><option value="rec">Papel recubierto 130 g</option>'}kind.onchange=papers;papers();document.getElementById('calc').onclick=()=>{const k=kind.value,p=paper.value,w=Math.max(1,Number(document.getElementById('plotW').value)||1),h=Math.max(1,Number(document.getElementById('plotH').value)||1),q=Math.max(1,Number(document.getElementById('plotQty').value)||1),supports=cfg.plotter.supports.filter(s=>p==='obra'?String(s.id).startsWith('rollo'):String(s.id).startsWith('rec')),field=k==='cad'?'cadPerMeter':'posterPerMeter';function orient(width,height){let best=null;supports.forEach(s=>{if(width>Number(s.widthCm))return;const meters=height/100*q,price=Number(s[field])||0,cost=meters*price;if(price>0&&(!best||cost<best.cost))best={s,meters,cost}});return best}const a=orient(w,h),b=orient(h,w),best=!a?b:!b?a:(b.cost<a.cost?b:a);if(!best){alert('Las medidas no entran en los rollos disponibles.');return}let total=ro function applyDaily(item){if(item.meta?.polaroidPack)return{total:item.baseTotal,saving:0,label:''};const p=scheduledPromo();let total=item.baseTotal,saving=0,label='';if(!p)return{total,saving,label};if(p.code==='LUNESDEPLANOS'&&item.service==='ploteos'&&item.meta.kind==='cad'&&item.meta.paper==='obra'&&item.meta.meters>=2){saving=Math.round(total*.1);label='LUNESDEPLANOS · 10% en planos desde 2 metros'}else if(p.code==='MARTESDECOPIAS'&&item.service==='impresiones'){saving=Math.round(total*.1);label='MARTESDECOPIAS · 10% en impresiones'}else if(p.code==='FOTOSPREMIUM'&&item.service==='fotos'&&item.meta.product&&item.meta.product.paper==='Luster'&&norm(item.meta.product.size)!=='A3'){const normal=cfg.photos.products.find(x=>x.paper==='Papel fotográfico'&&norm(x.size)===norm(item.meta.product.size));if(normal){const idx=tierIndex(cfg.photos.scales,item.meta.q),promoTotal=item.meta.q*Number(normal.prices[idx]||0);saving=Math.max(0,total-promoTotal);total=promoTotal;label='FOTOSPREMIUM · Premium al precio normal';return{total,saving,label}}}else if(p.code==='ANILLADO0'&&item.service==='impresiones'&&item.bindingCharge>0){saving=item.bindingCharge;label='ANILLADO0 · Anillado gratis'}else if(p.code==='STICKER10'&&item.service==='stickers'&&item.meta.product&&norm(item.meta.product.size)==='A3'){const promoTotal=item.meta.q*Number(item.meta.product.prices[0].unit||0)*.9;saving=Math.max(0,total-promoTotal);total=Math.min(total,promoTotal);label='STICKER10 · 10% en Stickers A3';return{total,saving,label}}else if(p.code==='SABADO20'||p.code==='DOMINGO20'){saving=Math.round(total*.2);label=p.code+' · 20% en el carrito'}return{total:Math.max(0,total-saving),saving,label}}

function couponBase(item,product){if(item.meta?.polaroidPack)return 0;if(product==='TODO')return item.originalTotal||item.total;if(product==='IMPRESIONES'&&item.service==='impresiones')return item.originalTotal||item.total;if(product==='FOTOS'&&item.service==='fotos')return item.originalTotal||item.total;if(product==='STICKERS'&&item.service==='stickers')return item.originalTotal||item.total;if(product==='PLOTEOS'&&(item.service==='ploteos'||item.service==='corte'))return item.originalTotal||item.total;if(product==='GRAFICA COMERCIAL'&&item.service==='grafica')return item.originalTotal||item.total;if(product==='ANILLADOS'&&item.binding)return item.bindingCharge||0;return 0}
